# Shares ------------------------------------------------------
shares_health:
  tags:
    - health
  args:
    - -N
    - shares
    - health
    - --url=@preset:shares_admin.url
shares_info:
  tags:
    - health
  args:
    - shares
    - info
shares_health_bad:
  tags:
    - no_doc
  args:
    - shares
    - health
    - --url=https://wrong.example.com
shares_detect:
  tags:
    - shares
  args:
    - config
    - detect
    - "@:"
    - url=@preset:shares_admin.url
    - plugin=shares
shares_wizard:
  tags:
    - shares
  pre: generated_secret(:dummy)
  args:
    - config
    - wizard
    - "@:"
    - url=@preset:shares_admin.url
    - plugin=shares
    - override=yes
    - --username=test
    - --password=$(secret :dummy)
shares_admin_node_list:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - node
    - list
shares_admin_group_list:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - group
    - all
    - list
shares_admin_group_id:
  tags:
    - no_doc
    - save_output
  args:
    - --preset=shares_admin
    - shares
    - admin
    - group
    - all
    - list
    - --fields=id
shares_admin_group_users:
  tags:
    - no_doc
  args:
    - --preset=shares_admin
    - shares
    - admin
    - group
    - all
    - users
    - $((t.saved_output :shares_admin_group_id).split("\n").first)
    - list
shares_admin_group_ldap:
  tags:
    - no_doc
  args:
    - --preset=shares_admin
    - shares
    - admin
    - group
    - ldap
    - add
    - "@list:,foo,bar"
    - --bulk=yes
    - --bfail=no
shares_admin_user_all_list:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - user
    - all
    - list
shares_admin_user_local_list:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - user
    - local
    - list
shares_admin_user_app_auth_show:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - user
    - all
    - app_authorizations
    - "%username:@preset:shares_admin.username"
    - show
shares_admin_user_app_auth_modify:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - user
    - all
    - app_authorizations
    - "%username:@preset:shares_admin.username"
    - modify
    - "@:"
    - app_login=true
shares_admin_user_share_perm_list:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - user
    - all
    - share_permissions
    - "%username:@preset:shares_admin.username"
    - list
shares_admin_user_share_perm_show:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - user
    - all
    - share_permissions
    - "%username:@preset:shares_admin.username"
    - show
    - "%name:@preset:shares.share"
shares_admin_user_saml_import:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - user
    - saml
    - import
    - '@json:{"id":"the_id","name_id":"the_name"}'
shares_admin_user_ldap_add:
  $comment: There is no LDAP configured on test system
  tags:
    - flaky
  args:
    - --preset=shares_admin
    - shares
    - admin
    - user
    - ldap
    - add
    - the_name
shares_admin_share_list:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - share
    - list
    - --fields=DEF,-status,status_message
shares_admin_share_user_perm_list:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - share
    - user_permissions
    - "%name:@preset:shares.share"
    - list
shares_admin_share_user_perm_modify:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - share
    - user_permissions
    - "%name:@preset:shares.share"
    - modify
    - "%username:@preset:shares_user.username"
    - '@json:{"browse_permission":true}'
shares_admin_xfer_settings:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - transfer_settings
    - show
    - --format=json
shares_admin_xfer_set_chg:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - transfer_settings
    - modify
    - "@:"
    - min_connect_version=3.6.1
shares_browse_root:
  args:
    - shares
    - files
    - browse
    - /
shares_upload:
  args:
    - shares
    - files
    - upload
    - --to-folder=@preset:shares.share_folder
    - $(PATH_TST_ASC_LCL)
shares_download:
  depends_on:
    - shares_upload
  args:
    - shares
    - files
    - download
    - --to-folder=$(TMP)
    - "@extend:@preset:shares.share_folder@/$(FILENAME_ASCII)"
shares_delete:
  depends_on:
    - shares_download
  args:
    - shares
    - files
    - delete
    - "@extend:@preset:shares.share_folder@/$(FILENAME_ASCII)"
shares_upload_httpgw:
  depends_on:
    - shares_delete
  args:
    - shares
    - files
    - upload
    - --to-folder=@preset:shares.share_folder
    - $(PATH_TST_ASC_LCL)
    - --transfer.agent=httpgw
    - --transfer.url=@preset:tst_httpgw.url
    - --preset=no_wss
shares_upload_httpgw_v1_sync:
  args:
    - shares
    - files
    - upload
    - faux:///test-file?1m
    - --to-folder=@preset:shares.share_folder
    - --transfer.agent=httpgw
    - --transfer.url=@preset:tst_httpgw.url
    - --transfer.synchronous=true
    - --transfer.api_version=v1
    - --transfer.upload_chunk_size=100000
    - --preset=no_wss
shares_upload_httpgw_folder:
  args:
    - shares
    - files
    - upload
    - $(PATH_TST_LCL_FOLDER)
    - --to-folder=@preset:shares.share_folder
    - --transfer.agent=httpgw
    - --transfer.url=@preset:tst_httpgw.url
    - --transfer.synchronous=true
    - --transfer.api_version=v1
    - --transfer.upload_chunk_size=100000
    - --preset=no_wss
shares_download_httpgw:
  depends_on:
    - shares_upload_httpgw
  args:
    - shares
    - files
    - download
    - --to-folder=$(TMP)
    - "@extend:@preset:shares.share_folder@/$(FILENAME_ASCII)"
    - "@extend:@preset:shares.share_folder@/$(FILENAME_ASCII)"
    - --transfer.agent=httpgw
    - --transfer.url=@preset:tst_httpgw.url
    - --preset=no_wss
shares_delete_httpgw:
  depends_on:
    - shares_download_httpgw
  args:
    - shares
    - files
    - delete
    - "@extend:@preset:shares.share_folder@/$(FILENAME_ASCII)"
shares_mkdir_prep:
  tags:
    - cleanup
    - no_doc
  args:
    - shares
    - files
    - delete
    - "@extend:@preset:shares.share_folder@/new_folder"
shares_mkdir:
  depends_on:
    - shares_mkdir_prep
  args:
    - shares
    - files
    - mkdir
    - "@extend:@preset:shares.share_folder@/new_folder"
shares_delete_folder:
  depends_on:
    - shares_mkdir
  args:
    - shares
    - files
    - delete
    - "@extend:@preset:shares.share_folder@/new_folder"
shares_sync_prepare:
  tags:
    - cleanup
    - no_doc
  args:
    - shares
    - files
    - mkdir
    - "@extend:@preset:shares.share_folder@/synctst"
shares_sync_push_reset:
  depends_on:
    - shares_sync_prepare
  args:
    - shares
    - files
    - sync
    - push
    - $(PATH_SHARES_SYNC)
    - --to-folder=@extend:@preset:shares.share_folder@/synctst
    - "@:"
    - reset=true
shares_sync_push:
  depends_on:
    - shares_sync_push_reset
  args:
    - shares
    - files
    - sync
    - push
    - $(PATH_SHARES_SYNC)
    - --to-folder=@extend:@preset:shares.share_folder@/synctst
# New Shares commands ------------------------------------------
# health_check: native JSON endpoint
shares_health_check:
  args:
    - -N
    - shares
    - health
    - --url=@preset:shares_admin.url
# share (user-level): list accessible shares
shares_share_list:
  args:
    - --preset=shares_user
    - shares
    - share
    - list
# share > event > create (faux transfer notification)
shares_share_event_create:
  $comment: Requires Shares 1.11.5+ (bug fix for FauxTransfersController files param)
  tags:
    - no_doc
    - flaky
  args:
    - --preset=shares_user
    - shares
    - share
    - event
    - create
    - "%name:@preset:shares.share"
    - '@json:{"faux_transfer":{"path":"/","bytes_written":1024,"files_complete":1,"files":[{"path":"/test.txt"}]}}'
# admin > directory > list
shares_admin_dir_list:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - directory
    - list
# admin > directory > show (uses first directory id from list)
shares_admin_dir_id:
  tags:
    - no_doc
    - save_output
  args:
    - --preset=shares_admin
    - shares
    - admin
    - directory
    - list
    - --fields=id
    - --format=csv
shares_admin_dir_show:
  depends_on:
    - shares_admin_dir_id
  tags:
    - no_doc
  args:
    - --preset=shares_admin
    - shares
    - admin
    - directory
    - show
    - $((t.saved_output :shares_admin_dir_id).split("\n").first)
# admin > directory > users (search in directory)
shares_admin_dir_users:
  depends_on:
    - shares_admin_dir_id
  tags:
    - no_doc
  args:
    - --preset=shares_admin
    - shares
    - admin
    - directory
    - users
    - $((t.saved_output :shares_admin_dir_id).split("\n").first)
# admin > directory > groups (search in directory)
shares_admin_dir_groups:
  depends_on:
    - shares_admin_dir_id
  tags:
    - no_doc
  args:
    - --preset=shares_admin
    - shares
    - admin
    - directory
    - groups
    - $((t.saved_output :shares_admin_dir_id).split("\n").first)
# admin > user search (cross-directory)
shares_admin_user_search_list:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - user
    - search
    - list
# admin > user search > show by URN
shares_admin_user_search_urn:
  tags:
    - no_doc
    - save_output
  args:
    - --preset=shares_admin
    - shares
    - admin
    - user
    - all
    - list
    - --fields=urn
    - --format=csv
shares_admin_user_search_show:
  depends_on:
    - shares_admin_user_search_urn
  tags:
    - no_doc
  args:
    - --preset=shares_admin
    - shares
    - admin
    - user
    - search
    - show
    - $((t.saved_output :shares_admin_user_search_urn).split("\n").first)
# admin > group search (cross-directory)
shares_admin_group_search_list:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - group
    - search
    - list
shares_admin_group_search_urn:
  tags:
    - no_doc
    - save_output
  args:
    - --preset=shares_admin
    - shares
    - admin
    - group
    - search
    - list
    - --fields=id
    - --format=csv
# admin > group search > members
shares_admin_group_search_members:
  $comment: Server returns ErrorId=12 (internal error) for this endpoint on current deployment.
  depends_on:
    - shares_admin_group_search_urn
  tags:
    - no_doc
    - flaky
  args:
    - --preset=shares_admin
    - shares
    - admin
    - group
    - search
    - members
    - $((t.saved_output :shares_admin_group_search_urn).split("\n").first)
# admin > user all > transfer_settings > delete (reset to global)
shares_admin_user_xfer_settings_delete:
  tags:
    - no_doc
  args:
    - --preset=shares_admin
    - shares
    - admin
    - user
    - all
    - transfer_settings
    - "%username:@preset:shares_admin.username"
    - delete
# admin > group all > transfer_settings > delete (reset to global)
shares_admin_group_xfer_settings_delete:
  tags:
    - no_doc
    - flaky
  args:
    - --preset=shares_admin
    - shares
    - admin
    - group
    - all
    - transfer_settings
    - "%name:@preset:shares.group"
    - delete
# admin > group local > users (list/show/modify/delete)
shares_admin_local_group_id:
  tags:
    - no_doc
    - save_output
  args:
    - --preset=shares_admin
    - shares
    - admin
    - group
    - local
    - list
    - --fields=id
    - --format=csv
shares_admin_local_group_users_list:
  depends_on:
    - shares_admin_local_group_id
  tags:
    - no_doc
  args:
    - --preset=shares_admin
    - shares
    - admin
    - group
    - local
    - users
    - $((t.saved_output :shares_admin_local_group_id).split("\n").first)
    - list
# admin > authenticate
shares_admin_authenticate:
  args:
    - --preset=shares_admin
    - shares
    - admin
    - authenticate
    - "@:"
    - username=@preset:shares_admin.username
    - password=@preset:shares_admin.password
