# Component `HttpgwAgentOptions` of `TransferAgentOptions` (see `Schema::Registry#add_variants`): parameters of the agent `httpgw`
type: object
description: Parameters for the HTTP Gateway transfer agent.
required:
  - url
properties:
  url:
    type: string
    description: URL of the HTTP Gateway.
  upload_chunk_size:
    type: integer
    description: Size in bytes of each upload chunk.
    default: 64000
  api_version:
    type: string
    description: Force use of a specific API version.
    enum:
      - v1
      - v2
    default: v2
  synchronous:
    type: boolean
    description: Wait for acknowledgment after each message.
    default: false
