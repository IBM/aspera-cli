# Ats ------------------------------------------------------
ats_aws_trust_policy:
  args:
    - ats
    - aws_trust_policy
    - --region=us-east-1
ats_api_key_instances:
  args:
    - ats
    - api_key
    - instances
ats_api_key_list:
  args:
    - ats
    - api_key
    - list
ats_api_key_create:
  args:
    - ats
    - api_key
    - create
ats_ak_delete_prep:
  tags:
    - cleanup
    - no_doc
  args:
    - ats
    - access_key
    - delete
    - ak2ibmcloud
ats_ak_create_ibm:
  depends_on:
    - ats_ak_delete_prep
  args:
    - ats
    - access_key
    - create
    - --cloud=softlayer
    - --region=@preset:icos.region
    - '@json:@extend:{"id":"ak2ibmcloud","secret":"@preset:misc.secret_here@","name":"my test key","storage":{"type":"ibm-s3","bucket":"@preset:icos.bucket@","credentials":{"access_key_id":"@preset:icos.access_key@","secret_access_key":"@preset:icos.secret_key@"},"path":"/"}}'
ats_ak_show_ibm:
  depends_on:
    - ats_ak_create_ibm
  args:
    - ats
    - access_key
    - show
    - ak2ibmcloud
  harness:
    poll:
      interval: 5
      max: 60
      until: "@"
      show: last
      errors: retry
ats_ak_entitlement_ibm:
  depends_on:
    - ats_ak_show_ibm
  args:
    - ats
    - access_key
    - entitlement
    - ak2ibmcloud
ats_ak_create_aws:
  $comment: Fails for unknown reason on ATS side
  tags:
    - flaky
  args:
    - ats
    - access_key
    - create
    - --cloud=aws
    - --region=@preset:aws.region
    - '@json:@extend:{"id":"ak_aws","name":"my test key AWS","storage":{"type":"aws_s3","bucket":"@preset:aws.bucket@","credentials":{"access_key_id":"@preset:aws.access_key@","secret_access_key":"@preset:aws.secret_key@"},"path":"/"}}'
ats_ak_list:
  $comment: Fails for unknown reason on ATS side
  tags:
    - flaky
  args:
    - ats
    - access_key
    - list
    - --fields=name,id
ats_ak_browse_ibm:
  args:
    - ats
    - access_key
    - node
    - ak2ibmcloud
    - browse
    - /
    - --secret=@preset:misc.secret_here
ats_ak_cluster_ibm:
  args:
    - ats
    - access_key
    - cluster
    - ak2ibmcloud
    - --secret=@preset:misc.secret_here
ats_ak_delete_ibm:
  $comment: Fails for unknown reason on ATS side
  tags:
    - flaky
  args:
    - ats
    - access_key
    - delete
    - ak2ibmcloud
ats_ak_delete_aws:
  $comment: Fails for unknown reason on ATS side
  tags:
    - flaky
    - no_doc
  args:
    - ats
    - access_key
    - delete
    - ak_aws
