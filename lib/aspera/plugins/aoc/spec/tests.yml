# AoC ------------------------------------------------------
aoc_detect:
  tags:
    - aoc
  args:
    - config
    - detect
    - "@:"
    - url=@preset:awa.org
    - plugin=aoc
aoc_wizard:
  args:
    - config
    - tokens
    - flush
aoc_config_tokens_list:
  args:
    - config
    - tokens
    - list
aoc_wizard_generic_client:
  tags:
    - aoc
  args:
    - config
    - wizard
    - "@:"
    - url=@preset:awa.org
    - plugin=aoc
    - override=yes
    - --username=@preset:awa.user_email
    - --private-key=@file:@preset:file.private_key
    - --use-generic-client=yes
aoc_wizard_org_client:
  priority: 1
  description: Wizard with an organization specific client, the page of API clients is opened and client id and secret are asked
  tags:
    - aoc
    - interactive
    - tmp_conf
  args:
    - config
    - wizard
    - "@:"
    - url=@preset:awa.org
    - plugin=aoc
    - override=yes
    - --username=@preset:awa.user_email
    - --private-key=@file:@preset:file.private_key
    - --use-generic-client=no
    - --interactive=yes
aoc_config_tokens_flush:
  tags:
    - no_doc
  args:
    - config
    - tokens
    - flush
aoc_config_tokens_show:
  description: Try to show non existing token
  tags:
    - must_fail
    - no_doc
  expect: Unknown identifier
  args:
    - config
    - tokens
    - show
    - foobar
aoc_wizard_preset:
  depends_on:
    - aoc_config_tokens_flush
  tags:
    - aoc
  args:
    - config
    - wizard
    - "@:"
    - url=@preset:awa.org
    - plugin=aoc
    - preset=my_aoc_preset
    - override=yes
    - --username=@preset:awa.user_email
    - --private-key=@file:@preset:file.private_key
aoc_gateway_set_faspex_url:
  description: Configure gateway URL via AOC plugin
  tags:
    - background
    - fx_gateway
  args:
    - aoc
    - gateway
    - "@:"
    - url=https://localhost:12347/aspera/faspex
  post: |
    # The gateway writes its PID file before its web server listens
    wait_listening(12347, tls: true)
aoc_user_suite:
  instantiate: awa_user_suite
  vars:
    awa_type: aoc
  args:
    - aoc
aoc_ats_suite:
  instantiate: ats_suite_tmpl
  args:
    - aoc
    - admin
    - ats
aoc_servers:
  args:
    - -N
    - aoc
    - servers
    - --url=@preset:aoc_user.url
aoc_user_profile:
  template: awa_user_suite
  args:
    - user
    - profile
    - show
aoc_webauth_profile:
  priority: 1
  tags:
    - interactive
  pre: "select_browser(login_preset: 'aoc_user_web')"
  args:
    - --preset=aoc_web
    - aoc
    - user
    - profile
    - show
aoc_webauth_profile_refresh:
  priority: 1
  tags:
    - interactive
    - no_doc
  pre: "select_browser(login_preset: 'aoc_user_web')"
  args:
    - --preset=aoc_web
    - aoc
    - user
    - profile
    - show
    - --http-options.token_refresh_threshold=10000000000
aoc_files_browse_root:
  template: awa_user_suite
  args:
    - files
    - browse
    - /
aoc_files_browse_remote:
  template: awa_user_suite
  args:
    - files
    - browse
    - "@preset:awa.remote_folder"
aoc_some_folder_cleanup:
  tags:
    - cleanup
    - no_doc
  template: awa_user_suite
  args:
    - files
    - delete
    - /some_folder
aoc_testdst_cleanup:
  tags:
    - cleanup
    - no_doc
  template: awa_user_suite
  args:
    - files
    - delete
    - /test-dst
aoc_testsrc_create:
  depends_on:
    - aoc_testdst_check
  template: awa_user_suite
  args:
    - files
    - mkdir
    - /test-src
aoc_some_folder_create:
  depends_on:
    - aoc_some_folder_cleanup
  tags:
    - no_doc
  template: awa_user_suite
  args:
    - files
    - mkdir
    - /some_folder
aoc_testdst_check:
  $comment: no-cache ensure we read the folder content on storage, not redis; deletions are asynchronous
  depends_on:
    - aoc_some_folder_create
    - awa_testsrc_cleanup
    - aoc_testdst_cleanup
  tags:
    - no_doc
  template: awa_user_suite
  args:
    - files
    - browse
    - /
    - --node-api.cache=false
  harness:
    poll:
      interval: 5
      max: 60
      until: "contains([].name,'some_folder') && !contains([].name,'test-src') && !contains([].name,'test-dst')"
      show: last
aoc_somefolder_mount:
  depends_on:
    - aoc_testdst_check
  template: awa_user_suite
  args:
    - files
    - modify
    - /some_folder
    - "@:"
    - mount_point=false
aoc_rename_testdst:
  depends_on:
    - aoc_somefolder_mount
  template: awa_user_suite
  args:
    - files
    - rename
    - /some_folder
    - test-dst
aoc_testsrc_upload:
  depends_on:
    - aoc_testsrc_create
  template: awa_user_suite
  args:
    - files
    - upload
    - --to-folder=/test-src
    - $(PATH_TST_ASC_LCL)
aoc_testsrc_upload_utf:
  depends_on:
    - aoc_testsrc_upload
  template: awa_user_suite
  args:
    - files
    - upload
    - --to-folder=/test-src
    - $(PATH_TST_ASC_LCL)
    - $(PATH_TST_UTF_LCL)
aoc_files_transfer:
  depends_on:
    - aoc_testsrc_upload_utf
    - aoc_rename_testdst
  template: awa_user_suite
  args:
    - files
    - transfer
    - push
    - /test-src
    - --to-folder=/test-dst
    - $(FILENAME_ASCII)
aoc_files_upload_utf:
  depends_on:
    - aoc_testsrc_upload_utf
    - aoc_rename_testdst
  tags:
    - no_doc
  template: awa_user_suite
  args:
    - files
    - upload
    - --to-folder=/test-dst
    - $(PATH_TST_UTF_LCL)
aoc_files_node_info:
  depends_on:
    - aoc_rename_testdst
  tags:
    - save_output
    - no_doc
  template: awa_user_suite
  args:
    - files
    - node_info
    - /test-dst
    - --format=json
    - --out.level=data
    - --out.secrets=yes
aoc_files_upload_other_ws:
  tags:
    - no_doc
  depends_on:
    - aoc_files_node_info
  template: awa_user_suite
  args:
    - files
    - upload
    - --workspace=@preset:awa.other_workspace
    - --to-folder=@preset:awa.other_folder
    - $(FILENAME_ASCII)
    - --transfer.agent=node
    - --transfer=@json:$(t.saved_output :aoc_files_node_info)
aoc_files_bearer:
  template: awa_user_suite
  args:
    - files
    - bearer
    - /
aoc_files_download_multi:
  depends_on:
    - aoc_files_transfer
  template: awa_user_suite
  args:
    - files
    - download
    - --to-folder=$(TMP)
    - test-dst/$(FILENAME_ASCII)
    - test-dst/$(FILENAME_UNICODE)
aoc_files_download_ascii:
  tags:
    - no_doc
  template: awa_user_suite
  args:
    - files
    - download
    - --to-folder=$(TMP)
    - test-dst/$(FILENAME_ASCII)
aoc_files_download_connect:
  tags:
    - gui
  depends_on:
    - aoc_testdst_cleanup
  pre: |
    PATH_DOWN_TST_ASC.delete rescue nil
    run('killall', 'asperaconnect', exception: false)
    sleep 1
  template: awa_user_suite
  args:
    - files
    - download
    - --transfer.agent=connect
    - test-dst/$(FILENAME_ASCII)
aoc_files_download_desktop:
  tags:
    - gui
  depends_on:
    - aoc_testdst_cleanup
  pre: PATH_DOWN_TST_ASC.delete rescue nil
  template: awa_user_suite
  args:
    - files
    - download
    - --transfer.agent=desktop
    - test-dst/$(FILENAME_ASCII)
aoc_files_cat:
  depends_on:
    - aoc_files_transfer
  template: awa_user_suite
  args:
    - files
    - cat
    - test-dst/$(FILENAME_ASCII)
aoc_files_v3_info:
  template: awa_user_suite
  args:
    - files
    - v3
    - info
aoc_sync_pull_conf_params:
  pre: |
    (PATH_TMP_SYNCS / 'aoc_sync_pull_conf_params').rmtree
    (PATH_TMP_SYNCS / 'aoc_sync_pull_conf_params').mkdir
  template: awa_user_suite
  args:
    - files
    - sync
    - pull
    - /test-dst
    - --to-folder=$(PATH_TMP_SYNCS / 'aoc_sync_pull_conf_params')
    - '@json:@extend:{"reset":true,"transport":{"target_rate":@preset:sync.bps@}}'
aoc_sync_pull_conf_params_status:
  template: awa_user_suite
  args:
    - files
    - sync
    - admin
    - status
    - $(PATH_TMP_SYNCS / 'aoc_sync_pull_conf_params')
aoc_sync_conf_pull_params_alt:
  pre: |
    (PATH_TMP_SYNCS / 'aoc_sync_conf_pull_params_alt').rmtree
    (PATH_TMP_SYNCS / 'aoc_sync_conf_pull_params_alt').mkdir
  template: awa_user_suite
  args:
    - files
    - sync
    - pull
    - /test-dst
    - --to-folder=$(PATH_TMP_SYNCS / 'aoc_sync_conf_pull_params_alt')
    - '@json:@extend:{"reset":true,"transport":{"target_rate":@preset:sync.bps@}}'
aoc_sync_conf_pull_params_alt_status:
  template: awa_user_suite
  args:
    - files
    - sync
    - admin
    - status
    - $(PATH_TMP_SYNCS / 'aoc_sync_conf_pull_params_alt')
aoc_file_browse_id:
  depends_on:
    - aoc_files_transfer
  tags:
    - save_output
    - no_doc
  template: awa_user_suite
  args:
    - files
    - br
    - test-dst/$(FILENAME_ASCII)
    - --fields=id
    - --format=csv
    - --out.level=data
aoc_file_show_by_id:
  depends_on:
    - aoc_files_transfer
  template: awa_user_suite
  args:
    - files
    - show
    - "%id:$(t.saved_output :aoc_file_browse_id)"
aoc_file_show_root:
  depends_on:
    - aoc_files_transfer
  template: awa_user_suite
  args:
    - files
    - show
    - /
aoc_file_show_by_path:
  depends_on:
    - aoc_files_transfer
  template: awa_user_suite
  args:
    - files
    - show
    - test-dst/$(FILENAME_ASCII)
aoc_testfolder_cleanup:
  tags:
    - cleanup
    - no_doc
  template: awa_user_suite
  args:
    - files
    - delete
    - "@preset:awa.test_folder"
aoc_files_mkdir:
  tags:
    - no_doc
  depends_on:
    - aoc_files_transfer
    - aoc_testfolder_cleanup
  template: awa_user_suite
  args:
    - files
    - mkdir
    - "@preset:awa.test_folder"
aoc_file_upload_video:
  tags:
    - no_doc
  depends_on:
    - aoc_files_mkdir
  template: awa_user_suite
  args:
    - files
    - upload
    - --to-folder=@preset:awa.test_folder
    - --src-type=pair
    - "@preset:file.mpg"
    - video_file.mpg
aoc_file_wait_video_preview:
  tags:
    - no_doc
    - save_output
  depends_on:
    - aoc_file_upload_video
  template: awa_user_suite
  args:
    - files
    - thumbnail
    - "@extend:@preset:awa.test_folder@/video_file.mpg"
    - --node-api.cache=no
  harness:
    poll:
      interval: 5
      max: 60
      until: "@"
      show: last
      errors: retry
aoc_files_upload_pair:
  tags:
    - no_doc
  depends_on:
    - aoc_files_mkdir
  template: awa_user_suite
  args:
    - files
    - upload
    - --to-folder=@preset:awa.test_folder
    - --src-type=pair
    - "@preset:file.jpg"
    - image_file.jpg
aoc_files_permission_list:
  depends_on:
    - aoc_files_mkdir
  template: awa_user_suite
  args:
    - files
    - permission
    - "@preset:awa.test_folder"
    - list
aoc_files_thumbnail_video:
  depends_on:
    - aoc_file_wait_video_preview
  template: awa_user_suite
  args:
    - files
    - thumbnail
    - "@extend:@preset:awa.test_folder@/video_file.mpg"
aoc_files_thumbnail_text_double:
  tags:
    - rmagick
  depends_on:
    - aoc_file_wait_video_preview
  template: awa_user_suite
  args:
    - files
    - thumbnail
    - "@extend:@preset:awa.test_folder@/video_file.mpg"
    - --query.text=true
    - --query.double=true
aoc_files_thumbnail_text_single:
  tags:
    - no_doc
    - rmagick
  depends_on:
    - aoc_file_wait_video_preview
  template: awa_user_suite
  args:
    - files
    - thumbnail
    - "@extend:@preset:awa.test_folder@/video_file.mpg"
    - --query.text=true
    - --query.double=false
aoc_files_thumbnail_video_no_term:
  env:
    TERM_PROGRAM: null
    LC_TERMINAL: null
  tags:
    - rmagick
  depends_on:
    - aoc_file_wait_video_preview
  template: awa_user_suite
  args:
    - files
    - thumbnail
    - "@extend:@preset:awa.test_folder@/video_file.mpg"
#	 aoc files modify @preset:awa.test_folder
aoc_files_pub_browse_no_pass:
  args:
    - -N
    - aoc
    - files
    - browse
    - /
    - --url=@preset:aoc.public_link_folder_no_pass
aoc_files_pub_browse_pass:
  args:
    - -N
    - aoc
    - files
    - browse
    - /
    - --url=@preset:aoc.public_link_folder_with_pass
    - --password=@preset:aoc.public_link_folder_password
aoc_files_pub_upload:
  args:
    - -N
    - aoc
    - files
    - upload
    - --to-folder=/
    - $(PATH_TST_ASC_LCL)
    - --url=@preset:aoc.public_link_folder_no_pass
aoc_lnk_priv:
  template: awa_user_suite
  args:
    - files
    - browse
    - /
    - --url=@preset:$(awa_type).private_link_shared_folder
aoc_short_link_priv_create:
  template: awa_user_suite
  args:
    - files
    - short_link
    - /test-dst
    - private
    - create
aoc_short_link_pub_create:
  $comment: "access_levels: unit unitary levels to test unitary set."
  tags:
    - save_output
  template: awa_user_suite
  args:
    - files
    - short_link
    - /test-dst
    - public
    - create
    - "@:"
    - access_levels.0=mkdir
    - access_levels.1=write
    - --fields=id
aoc_short_link_pub_modify:
  depends_on:
    - aoc_short_link_pub_create
  template: awa_user_suite
  args:
    - files
    - short_link
    - /test-dst
    - public
    - modify
    - $(t.saved_output :aoc_short_link_pub_create)
    - "@:"
    - access_levels=edit
aoc_short_link_priv_list:
  depends_on:
    - aoc_short_link_priv_create
    - aoc_short_link_pub_create
  template: awa_user_suite
  args:
    - files
    - short_link
    - /test-dst
    - private
    - list
aoc_shared_inbox_short_link_create:
  tags:
    - save_output
  template: awa_user_suite
  args:
    - packages
    - shared_inboxes
    - short_link
    - public
    - "%name:@preset:awa.shared_inbox_name"
    - create
    - --fields=id
aoc_shared_inbox_short_link_list:
  depends_on:
    - aoc_shared_inbox_short_link_create
  template: awa_user_suite
  args:
    - packages
    - shared_inboxes
    - short_link
    - public
    - "%name:@preset:awa.shared_inbox_name"
    - list
aoc_shared_inbox_short_link_show:
  depends_on:
    - aoc_shared_inbox_short_link_create
  template: awa_user_suite
  args:
    - packages
    - shared_inboxes
    - short_link
    - public
    - "%name:@preset:awa.shared_inbox_name"
    - show
    - $(t.saved_output :aoc_shared_inbox_short_link_create)
aoc_shared_inbox_short_link_modify:
  depends_on:
    - aoc_shared_inbox_short_link_create
  template: awa_user_suite
  args:
    - packages
    - shared_inboxes
    - short_link
    - public
    - "%name:@preset:awa.shared_inbox_name"
    - modify
    - $(t.saved_output :aoc_shared_inbox_short_link_create)
    - "@:"
    - password=@preset:aoc.public_link_folder_password
aoc_shared_inbox_short_link_delete:
  depends_on:
    - aoc_shared_inbox_short_link_list
    - aoc_shared_inbox_short_link_show
    - aoc_shared_inbox_short_link_modify
  template: awa_user_suite
  args:
    - packages
    - shared_inboxes
    - short_link
    - public
    - "%name:@preset:awa.shared_inbox_name"
    - delete
    - $(t.saved_output :aoc_shared_inbox_short_link_create)
aoc_pack_send_to_user:
  $comment: Send package to normal user (self-send so aoc_pack_recv_id can find it with the same account).
  template: awa_user_suite
  args:
    - packages
    - send
    - "@:"
    - name=$(name) $(TIMESTAMP_TEST_RUN)
    - recipients.0=@preset:$(awa_type)_user.username
    - note=some notes
    - END
    - $(PATH_TST_ASC_LCL)
aoc_pack_send_to_external:
  template: awa_user_suite
  args:
    - packages
    - send
    - '@json:@extend:{"name":"$(name) $(TIMESTAMP_TEST_RUN)","recipients":["@preset:misc.email_external@"]}'
    - --new-user-option.package_contact=true
    - $(PATH_TST_ASC_LCL)
aoc_pack_list:
  template: awa_user_suite
  args:
    - packages
    - list
aoc_pack_show_name:
  $comment: Percent selector on package name (package sent by aoc_pack_send_to_user)
  depends_on:
    - aoc_pack_send_to_user
  template: awa_user_suite
  args:
    - packages
    - show
    - "%name:$(t.resolve :aoc_pack_send_to_user) $(TIMESTAMP_TEST_RUN)"
aoc_pack_recv_id:
  depends_on:
    - aoc_pack_send_to_user
  tags:
    - save_output
    - no_doc
  template: awa_user_suite
  args:
    - packages
    - list
    - --format=csv
    - --fields=id
    - --out.level=data
    - --query=@json:{"max":1,"archived":false,"has_content":true,"received":true,"completed":true}
  harness:
    poll:
      interval: 5
      max: 60
      until: "@"
      show: last
aoc_pack_recv:
  depends_on:
    - aoc_pack_recv_id
  template: awa_user_suite
  args:
    - packages
    - receive
    - $(t.saved_output :aoc_pack_recv_id)
    - --to-folder=$(TMP)
aoc_pack_recv_root:
  depends_on:
    - aoc_pack_recv_id
  template: awa_user_suite
  args:
    - packages
    - receive
    - $(t.saved_output :aoc_pack_recv_id)
    - --to-folder=$(TMP)
    - /
aoc_pack_browse:
  depends_on:
    - aoc_pack_recv_id
  template: awa_user_suite
  args:
    - packages
    - browse
    - $(t.saved_output :aoc_pack_recv_id)
    - /
aoc_pack_recv_all:
  template: awa_user_suite
  args:
    - packages
    - receive
    - ALL
    - --once-only=yes
    - --to-folder=$(TMP)
    - --query.max=5
    - --lock-port=50101
    - --package-folder.fld.0=name
    - --package-folder.fld.1=id
    - --package-folder.opt=true
aoc_pack_recv_public:
  $comment: "TODO: generate new token based package receive"
  tags:
    - flaky
  template: awa_user_suite
  args:
    - organization
    - -N
    - --url=@preset:$(awa_type).public_link_recv_from_aoc_user
aoc_pack_recv_public_link:
  description: Receive the package of a public link, its identifier is given by the link (argument ignored)
  tags:
    - flaky
  template: awa_user_suite
  args:
    - packages
    - receive
    - ALL
    - --url=@preset:$(awa_type).public_link_recv_from_aoc_user
    - --to-folder=$(TMP)
aoc_pack_send_pub_sh:
  args:
    - -N
    - aoc
    - packages
    - send
    - "@:"
    - name=$(name) $(TIMESTAMP_TEST_RUN)
    - END
    - $(PATH_TST_ASC_LCL)
    - --url=@preset:aoc.public_link_send_shared_inbox
aoc_pack_send_pub_usr:
  args:
    - -N
    - aoc
    - packages
    - send
    - "@:"
    - name=$(name) $(TIMESTAMP_TEST_RUN)
    - END
    - $(PATH_TST_ASC_LCL)
    - --url=@preset:aoc.public_link_send_aoc_user
    - --password=@preset:aoc.public_link_send_use_pass
aoc_pack_recv_init:
  template: awa_user_suite
  args:
    - packages
    - receive
    - INIT
    - --once-only=yes
    - --query.dropbox_name=@preset:awa.shared_inbox_name
aoc_pack_send_shbx:
  depends_on:
    - aoc_pack_recv_init
  template: awa_user_suite
  args:
    - packages
    - send
    - --workspace=@preset:awa.workspace_shared_inbox
    - '@json:@extend:{"name":"$(name) $(TIMESTAMP_TEST_RUN)","recipients":["@preset:awa.shared_inbox_name@"]}'
    - $(PATH_TST_ASC_LCL)
aoc_pack_send_sh_meta_long:
  depends_on:
    - aoc_pack_recv_init
  template: awa_user_suite
  args:
    - packages
    - send
    - --workspace=@preset:awa.workspace_shared_inbox
    - --validate-metadata=yes
    - '@json:@extend:{"name":"$(name) $(TIMESTAMP_TEST_RUN)","recipients":["@preset:awa.shared_inbox_meta@"],"metadata":[{"input_type":"single-text","name":"Project Id","values":["123"]},{"input_type":"single-dropdown","name":"Type","values":["Opt2"]},{"input_type":"multiple-checkbox","name":"CheckThose","values":["Check1","Check2"]},{"input_type":"date","name":"Optional Date","values":["2021-01-13T15:02:00.000Z"]}]}'
    - $(PATH_TST_ASC_LCL)
aoc_pack_send_sh_meta_short:
  depends_on:
    - aoc_pack_recv_init
  template: awa_user_suite
  args:
    - packages
    - send
    - --workspace=@preset:awa.workspace_shared_inbox
    - --validate-metadata=yes
    - '@json:@extend:{"name":"$(name) $(TIMESTAMP_TEST_RUN)","recipients":["@preset:awa.shared_inbox_meta@"],"metadata":{"Project Id":"456","Type":"Opt2","CheckThose":["Check1","Check2"],"Optional Date":"2021-01-13T15:02:00.000Z"}}'
    - $(PATH_TST_ASC_LCL)
aoc_pack_send_sh_meta_missing:
  description: Fails because missing metadata "Project Id"
  tags:
    - must_fail
    - no_doc
  expect: "missing mandatory field: Project Id"
  depends_on:
    - aoc_pack_recv_init
  template: awa_user_suite
  args:
    - packages
    - send
    - --workspace=@preset:awa.workspace_shared_inbox
    - --validate-metadata=yes
    - '@json:@extend:{"name":"$(name) $(TIMESTAMP_TEST_RUN)","recipients":["@preset:awa.shared_inbox_meta@"],"metadata":{"Type":"Opt2","CheckThose":["Check1","Check2"],"Optional Date":"2021-01-13T15:02:00.000Z"}}'
    - $(PATH_TST_ASC_LCL)
aoc_pack_recv_shbx:
  depends_on:
    - aoc_pack_send_shbx
    - aoc_pack_send_sh_meta_long
    - aoc_pack_send_sh_meta_short
  template: awa_user_suite
  args:
    - packages
    - receive
    - ALL
    - --once-only=yes
    - --to-folder=$(TMP)
    - --query.max=5
    - --lock-port=50101
    - --query=@json:@extend:{"dropbox_name":"@preset:awa.shared_inbox_name@","archived":false,"received":true,"has_content":true,"exclude_dropbox_packages":false,"include_draft":false}
    - --ts=@json:{"resume_policy":"sparse_csum","target_rate_kbps":50000}
aoc_pack_list_shbx:
  depends_on:
    - aoc_pack_send_shbx
    - aoc_pack_send_sh_meta_long
    - aoc_pack_send_sh_meta_short
  template: awa_user_suite
  args:
    - packages
    - list
    - --query=@json:@extend:{"dropbox_name":"@preset:awa.shared_inbox_name@","sort":"-received_at","archived":false,"received":true,"has_content":true,"exclude_dropbox_packages":false}
