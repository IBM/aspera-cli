          description: ID of the organization.
          type: string
        user_id:
          description: ID of the user, when known.
          type:
            - string
            - 'null'
        email:
          description: Email of the person.
          type: string
        first_name:
          description: First name of the person.
          type:
            - string
            - 'null'
        last_name:
          description: Last name of the person.
          type:
            - string
            - 'null'
        name:
          description: First and last names, else the email.
          type: string
        ibm_uid:
          description: IBMid of the person (with a token with admin scope only).
          type:
            - string
            - 'null'
    initiation_policy_params:
      description: Initiation rule to add to a network policy.
      type: object
      properties:
        target_node_id:
          description: ID of a node of the organization, that the nodes of the policy initiate the transfers with.
          type: string
      required:
        - target_node_id
    initiation_policy_response:
      description: Initiation rule of a network policy.
      type: object
      properties:
        id:
          description: ID of the rule.
          type: string
        target_node_id:
          description: ID of the node that the nodes of the policy initiate the transfers with.
          type: string
        target_node_name:
          description: Name of the node.
          type: string
    access_control_policy_params:
      description: Access control rule to add to a network policy.
      type: object
      properties:
        target_node_id:
          description: ID of a node of the organization.
          type: string
        policy_setting:
          description: >-
            `allow` for a policy `allow_following`, `disallow` for a policy `disallow_following` (a rule that does not
            match the type of the policy is ignored).
          type: string
          enum:
            - allow
            - disallow
      required:
        - target_node_id
        - policy_setting
    access_control_policy_response:
      description: Access control rule of a network policy.
      type: object
      properties:
        id:
          description: ID of the rule.
          type: string
        target_node_id:
          description: ID of the node.
          type: string
        target_node_name:
          description: Name of the node.
          type: string
        policy_setting:
          description: Whether the nodes of the policy can (`allow`) or cannot (`disallow`) transfer with the node.
          type: string
          enum:
            - allow
            - disallow
    invitations_params:
      description: Invitation to send, according to `type` (see the operation).
      type: object
      properties:
        type:
          description: Kind of invitation; absent (or another value) for the invitation of a user to the organization.
          type: string
          enum:
            - dropbox
            - send_to_me
            - file_shared
            - send_file
            - send_folder
        user_id:
          description: Invitation to the organization, required. ID of the user to invite again.
          type: string
        addressee_type:
          description: Other types, required. Kind of recipient.
          type: string
          enum:
            - email
            - user
            - group
        addressee_id:
          description: ID of the user or group (according to `addressee_type`).
          type: string
        addressee_email:
          description: Email address (`addressee_type` `email`).
          type: string
          format: email
        body:
          description: Personal message.
          type: string
        dropbox_id:
          description: Type `dropbox`, required. ID of the shared inbox.
          type: string
        url_token_id:
          description: ID of the URL token of a public link (required for `send_to_me`).
          type: string
        short_link_id:
          description: ID of a short link (types `dropbox` and `file_shared`).
          type: string
        workspace_id:
          description: Types `send_to_me` and `file_shared`, required. ID of the workspace.
          type: string
        subject:
          description: Type `send_to_me`. Subject of the email.
          type: string
        node_id:
          description: Type `file_shared`, required. ID of the node of the file.
          type: string
        file_id:
          description: Type `file_shared`, required. ID of the file or folder.
          type: string
        file_name:
          description: Type `file_shared`, required. Name of the file or folder.
          type: string
        file_type:
          description: Type `file_shared`, required. `file` or `folder`.
          type: string
    package_download_counts_response:
      description: Downloads of a package by a user.
      type: object
      properties:
        id:
          description: ID of the row.
          type: string
        package_id:
          description: ID of the package.
          type: string
        user_id:
          description: ID of the user.
          type: string
        full:
          description: Number of complete downloads.
          type: integer
        partial:
          description: Number of partial downloads.
          type: integer
        failed:
          description: Number of failed downloads.
          type: integer
        active:
          description: Number of downloads in progress.
          type: integer
        user:
          description: With `embed[]=user`, the user.
          allOf:
            - $ref: '#/components/schemas/users_response'
    shared_folder_memberships_response:
      description: Shared folder of a workspace that a user or a group can access.
      type: object
      properties:
        id:
          description: ID of the entry.
          type: string
        permission_id:
          description: ID of the permission on the node (kept permission, see `shared_folder_membership_through_group_list`).
          type: string
        node_id:
          description: ID of the node.
          type: string
        node_name:
          description: Name of the node.
          type: string
        file_id:
          description: ID of the folder on the node.
          type: string
        share_as:
          description: Name of the shared folder.
          type: string
        workspace_id:
          description: ID of the workspace.
          type: string
        organization_id:
          description: ID of the organization.
          type: string
        member_type:
          description: Kind of member of the kept permission.
          type: string
          enum:
            - User
            - Group
        member_id:
          description: ID of the user or group of the kept permission.
          type: string
        shared_by_id:
          description: ID of the user who shared the folder.
          type:
            - string
            - 'null'
        access_levels:
          description: Access levels of the kept permission, `null` when not yet read from the node.
          type:
            - array
            - 'null'
          items:
            type: string
        agg_access_levels:
          description: Union of the access levels of all the permissions of the member on the folder.
          type: array
          items:
            type: string
        shared_folder_membership_through_group_list:
          description: All the permissions that give access to the folder (directly or through groups).
          type: array
          items:
            type: object
            properties:
              permission_id:
                description: ID of the permission on the node (a number, unlike the other IDs).
                type: integer
              member_type:
                description: Kind of member.
                type: string
                enum:
                  - User
                  - Group
              member_id:
                description: ID of the user or group (a number).
                type: integer
              file_id:
                description: ID of the folder on the node.
                type: string
              share_as:
                description: Name of the shared folder.
                type: string
              workspace_id:
                description: ID of the workspace (a number).
                type: integer
              organization_id:
                description: ID of the organization (a number).
                type: integer
              node_id:
                description: ID of the node (a number).
                type: integer
        is_workspace_member:
          description: Whether the member is a member of the workspace of the folder.
          type: boolean
        created_at:
          description: Date and time of creation.
          type: string
          format: date-time
        updated_at:
          description: Date and time of the last change.
          type: string
          format: date-time
  requestBodies:
    clients_params:
      content:
