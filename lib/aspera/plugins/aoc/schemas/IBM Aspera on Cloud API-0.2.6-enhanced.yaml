  /dropboxes/{id}/dropbox_join_requests:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the shared inbox.
        schema:
          type: string
    get:
      operationId: get_dropbox_join_requests
      summary: Get a Listing of the Join Requests of a Shared Inbox
      description: >-
        Get a listing of the join requests of a shared inbox: people who used its self registration link and wait for
        approval to submit packages (`approval_required_for_self_registration`). A join request is created by the self
        registration pages of the web app, not by the API. Requires a token for an organization administrator, a manager
        of the workspace of the shared inbox, or a manager of the shared inbox when
        `can_dropbox_managers_approve_self_registration`.
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: sort
          in: query
          description: >-
            Comma-separated list of fields (at most 5), prefixed with `-` for descending order. Fields: `name`, `email`,
            `first_name`, `last_name`, `created_at`, `updated_at`. An unknown field is refused (`unknown_sort_field`).
          schema:
            type: string
        - name: q
          in: query
          description: >-
            Search (case-insensitive substring) in `email`, `first_name`, `last_name` and `name`. A token
            `<field>:<value>`, with `<field>` one of the filter parameters, keeps requests whose field starts with
            `<value>`.
          schema:
            type: string
        - name: email
          in: query
          description: Filter by email (exact).
          schema:
            type: string
        - name: first_name
          in: query
          description: Filter by first name (exact).
          schema:
            type: string
        - name: last_name
          in: query
          description: Filter by last name (exact).
          schema:
            type: string
        - name: name
          in: query
          description: Filter by name (exact).
          schema:
            type: string
        - name: created_at
          in: query
          description: Filter by created at (exact date and time).
          schema:
            type: string
            format: date-time
        - name: updated_at
          in: query
          description: Filter by updated at (exact date and time).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of join requests matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/dropbox_join_requests_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found (no such shared inbox in the organization)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Dropboxes
