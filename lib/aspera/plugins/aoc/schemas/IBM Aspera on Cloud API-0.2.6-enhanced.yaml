    saml_configurations_response:
      description: >-
        SAML configuration: login of users with a SAML identity provider. A workspace manager gets only `id`, `name` and
        `enabled`.
      type: object
      properties:
        id:
          description: ID of the SAML configuration.
          type: string
          examples:
            - '584'
        name:
          description: Name of the configuration, of its group and of its auth provider.
          type: string
        enabled:
          description: Whether users can log in with this configuration.
          type: boolean
        login_text:
          description: Text of the login button.
          type: string
          examples:
            - Sign in with SAML
        instructions:
          description: Instructions shown on the login page.
          type:
            - string
            - 'null'
        sso_target_url:
          description: URL of the single sign-on service of the identity provider.
          type: string
        certificate:
          description: Signing certificate of the identity provider (PEM), or `null` if only `fingerprint` is set.
          type:
            - string
            - 'null'
        fingerprint:
          description: Fingerprint of the signing certificate of the identity provider.
          type:
            - string
            - 'null'
        attribute_mapping:
          $ref: '#/components/schemas/saml_attribute_mapping'
        allowable_clock_drift:
          description: Clock difference allowed with the identity provider, in seconds, when the SAML response is checked.
          type: integer
        restrict_login_to_known_groups:
          description: >-
            Whether only the users who are members of a SAML group of AoC (a group with `saml_group` and
            `saml_group_dn` that matches the groups of the user, `member_of`) can log in.
          type: boolean
        included_domains:
          description: Email domains of the users who can log in with this configuration (empty for all).
          type: array
          items:
            type: string
        excluded_domains:
          description: Email domains of the users who cannot log in with this configuration.
          type: array
          items:
            type: string
        group_id:
          description: ID of the system group of the users who logged in with this configuration (`saml_users`).
          type: string
        created_at:
          description: Date and time of creation.
          type: string
          format: date-time
        updated_at:
          description: Date and time of the last change.
          type: string
          format: date-time
    saml_configurations_params:
      description: >-
        SAML configuration to create or modify. For create, `name`, `sso_target_url`, `attribute_mapping`, and
        `fingerprint` or `certificate` are required. If both `fingerprint` and `certificate` are given, the fingerprint
        must match the certificate.
      type: object
      properties:
        name:
          description: Name of the configuration, of its group and of its auth provider.
          type: string
          examples:
            - Corporate SSO
        enabled:
          description: Whether users can log in with this configuration.
          type: boolean
          default: false
        login_text:
          description: Text of the login button.
          type: string
          default: Sign in with SAML
        instructions:
          description: Instructions shown on the login page.
          type: string
        sso_target_url:
          description: URL of the single sign-on service of the identity provider.
          type: string
          examples:
            - https://idp.example.com/saml/sso
        certificate:
          description: Signing certificate of the identity provider (PEM, with or without header and footer).
          type: string
        fingerprint:
          description: Fingerprint of the signing certificate of the identity provider (SHA-1).
          type: string
        attribute_mapping:
          $ref: '#/components/schemas/saml_attribute_mapping'
        allowable_clock_drift:
          description: Clock difference allowed with the identity provider, in seconds, when the SAML response is checked.
          type: integer
          default: 0
        restrict_login_to_known_groups:
          description: >-
            Whether only the users who are members of a SAML group of AoC (a group with `saml_group` and
            `saml_group_dn` that matches the groups of the user, `member_of`) can log in.
          type: boolean
          default: false
        included_domains:
          description: Email domains of the users who can log in with this configuration (empty for all).
          type: array
          items:
            type: string
        excluded_domains:
          description: Email domains of the users who cannot log in with this configuration (empty if `included_domains` is set).
          type: array
          items:
            type: string
    saml_attribute_mapping:
      description: Names of the attributes of the SAML response that give the information of the user. All are required.
