        user of the path, and `user_id` must still be in the body, with any value. For the other types, the user of the
        path is not used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invitations_params'
      responses:
        '204':
          description: No Content (sent)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: >-
            Forbidden (not allowed for this type, or URL token, workspace or shared inbox not found or not allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found (user or group, of `user_id` or `addressee_id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: >-
            Unprocessable Entity: parameter error (missing body, field required by the type missing, other field:
            `unpermitted_parameters`, except for the invitation to the organization, which ignores the other fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error (also for an `addressee_type` other than `email`, `user` or `group`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Users
