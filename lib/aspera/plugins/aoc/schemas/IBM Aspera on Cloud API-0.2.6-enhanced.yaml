        - request_id
      example:
        code: not_found
        message: The resource you were looking for does not exist
        request_id: 58825f7f-42bb-4f4e-90bc-a6deb9b999db
    ForbiddenError:
      type: object
      description: |
        Standard error response for 403 Forbidden.
      properties:
        code:
          type: string
          description: Error code identifying the type of error
          enum:
            - forbidden
          example: forbidden
        message:
          type: string
          description: Human-readable error message
          example: "You are not authorized to perform the requested action"
        request_id:
          type: string
          format: uuid
          description: Unique identifier for the request, useful for debugging and support
          example: 4387db5b-d84b-43f8-b5c1-0d9d878714d6
      required:
        - code
        - message
        - request_id
      example:
        code: forbidden
        message: "You are not authorized to perform the requested action"
        request_id: 4387db5b-d84b-43f8-b5c1-0d9d878714d6
    InternalServerError:
      type: object
      description: |
        Standard error response for 500 Internal Server Error.
      properties:
        code:
          type: string
          description: Error code identifying the type of error
          enum:
            - internal_server_error
          example: internal_server_error
        message:
          type: string
          description: Human-readable error message
          example: "We're sorry, but something went wrong. We've been notified about this issue and we'll take a look at it shortly."
        request_id:
          type: string
          format: uuid
          description: Unique identifier for the request, useful for debugging and support
          example: 17a835e7-17d0-40f9-8ac3-ff23a45d461e
      required:
        - code
        - message
