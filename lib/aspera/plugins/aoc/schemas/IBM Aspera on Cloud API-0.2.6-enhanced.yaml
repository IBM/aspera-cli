    dropboxes_params:
      type: object
      properties:
        content_retention_duration:
          description: >
            Configure a time-based expiration policy for packages in this shared inbox by setting this parameter to a
            non-null value. Once the transfer completes, a timer begins. After the duration configured for this
            parameter, package contents are deleted (the package record is maintained and includes details about the
            sender, recipients, contents, and transfer). If null, this shared inbox inherits the
            content_retention_duration settings of its workspace. Valid values: null - 10 years. Units: seconds. POST:
            Admin or Manager permission required. PUT: Admin or Manager permission required.
          type: integer
          examples:
            - 2592000
        custom_notification_list_enabled:
          description: >
            For a package sent to a shared inbox, this parameter determines whether notifications are sent to all
            package addressees or to a user-defined list of addressees for the shared inbox (see
            dropbox_notification_recipients). Defaults to false. Valid values: true to send notifications to a
            user-defined list or false to send notifications to all package addressees. POST: Admin or Manager
            permission required. PUT: Admin or Manager permission required. RESPONSE: Admin scope.
          type: boolean
          examples:
            - false
        delete_package_content_after_download_duration:
          description: >
            Configure a download-based expiration policy for packages in this shared inbox by setting this parameter to
            a non-null value. Once all package recipients have downloaded the entire package, a timer begins. After the
            duration configured by this parameter has passed, package contents are deleted (the package record is
            maintained and includes details about the sender, recipients, contents, and transfer). If null, this shared
            inbox inherits the delete_package_content_after_download_duration settings of its workspace. Valid values:
            null - 10 years. Units: seconds. POST: Admin or Manager permission required. PUT: Admin or Manager
            permission required.
          type: integer
          examples:
            - 604800
        description:
          description: >
            A description for the shared inbox. POST: Admin or Manager permission required. PUT: Admin or Manager
            permission required. RESPONSE: Admin scope.
          type: string
          examples:
            - Finance shared inbox
        draft_expiration_duration:
          description: >
            Configure a time-based expiration policy for draft packages in this shared inbox by setting this parameter
            to a non-null value. When a package is saved as a draft, a timer begins. After the duration configured for
            this parameter, draft package contents are deleted. If this parameter is null, it defaults to the workspace
            setting. To set a time-based expiration policy for non-draft packages, see content_retention_duration.
            Units: seconds. POST: Admin or Manager permission required. PUT: Admin or Manager permission required.
          type: integer
          examples:
            - 604800
        dropbox_notification_recipients:
          description: >
            With custom_notification_list_enabled = true, this parameter defines a list of addressees who should receive
            notifications regarding packages addressed to this shared inbox. POST: Admin or Manager permission required.
            PUT: Admin or Manager permission required.
          type: array
          items:
            properties:
              id:
                description: >
                  For type = user | group, id denotes the integer ID of that user or group (e.g., "123"). For type =
                  email, id denotes the email address of the intended addressee (e.g., "email@foo.co").
                type: string
              type:
                type: string
                enum:
                  - user
                  - group
                  - email
            type: object
          examples:
            - - id: email@foo.co
                type: email
        email_notification_settings:
          description: >
            Email notifications specification. See below. POST: Admin or Manager permission required. PUT: Admin or
            Manager permission required.
          type: object
          allOf:
            - $ref: '#/components/schemas/email_notification_settings'
        enable_external_email_templates:
          description: >
            If inherit_email_templates is set to false, you can enable or disable the ability to configure email
            templates specifically for users outside this shared inbox. When this parameter is set to false, external
            recipients receive the same email notification messages that users in the shared inbox receive. POST: Admin
            or Manager permission required. PUT: Admin or Manager permission required.
          type: boolean
          examples:
            - false
        image_data:
          description: >
            The image data for the shared inbox logo encoded as a string. POST: Admin or Manager permission required.
            PUT: Admin or Manager permission required.
          type: string
          examples:
            - iVBORw0KGgo ... /wB\/DRk84ZdwGQAAAABJRU5ErkJggg==
        image_type:
          description: >
            The image type of the shared inbox logo. For example, image/png or image/jpg. POST: Admin or Manager
            permission required. PUT: Admin or Manager permission required.
          type: string
          examples:
            - image/png
        inherit_email_notification_settings:
          description: >
            Inherit the email notification settings configured at the workspace level. POST Admin or Manager permission
            required. PUT Admin or Manager permission required.
          type: boolean
          examples:
            - true
        inherit_email_templates:
          description: >
            Inherit the email templates configured at the workspace level. If false, you can configure email template
            settings for this shared inbox. POST: Admin or Manager permission required. PUT: Admin or Manager permission
            required.
          type: boolean
          examples:
            - true
        inherit_workspace_expiration_settings:
          description: >
            Inherit the content_retention_duration settings configured at the workspace level. POST: Admin or Manager
            permission required. PUT: Admin or Manager permission required.
          type: boolean
          examples:
            - true
        instructions:
          description: >
            User-defined instructions for potential shared inbox submissions. POST: Admin or Manager permission
            required. PUT: Admin or Manager permission required.
          type: string
          examples:
            - Video submissions only.
        metadata_schema:
          $ref: '#/components/schemas/metadata'
        name:
          description: >
            Shared inbox name. A query parameter for the GET method. POST: Admin or Manager permission required. PUT:
            Admin or Manager permission required.
          type: string
          examples:
            - My Shared Inbox
        package_name_and_message_validation_schema:
          description: >
            Defines illegal characters and/or max length for the name and message fields for package submissions to this
            shared inbox. Defaults to an empty array ([]). POST: Admin or Manager permission required. PUT: Admin or
            Manager permission required.
          type: array
          items:
            properties:
              field_name:
                type: string
                enum:
                  - package_name
                  - package_message
              illegal_characters:
                description: Defines all disallowed characters.
                type: string
                examples:
                  - '!@#'
              max_length:
                description: Defines the max length for the provided string.
                type: string
                examples:
                  - '50'
            type: object
          examples:
            - - field_name: package_name
                illegal_characters: '!@#'
                max_length: '100'
              - field_name: package_message
                illegal_characters: '!@#'
                max_length: '50'
        personalized_urls_enabled:
          description: >
            Enable members of this shared inbox to configure personalized URLs to send when inviting people to submit
            packages. POST: Admin or Manager permission required. PUT: Admin or Manager permission required.
          type: boolean
          examples:
            - false
        workspace_id:
          description: >
            ID of the workspace to which this shared inbox belongs. POST: Admin or Manager permission required. PUT:
            Admin or Manager permission required.
          type: string
          examples:
            - '123'
        self_registration_enabled:
          description: Whether people can ask to submit packages with the self registration link of the shared inbox.
          type: boolean
          default: false
        approval_required_for_self_registration:
          description: >-
            Whether a self registration must be approved (join requests, `/dropboxes/{id}/dropbox_join_requests`), else
            the person can submit at once.
          type: boolean
          default: true
        can_dropbox_managers_approve_self_registration:
          description: Whether the managers of the shared inbox can approve the join requests (else the administrators and the managers of the workspace).
          type: boolean
          default: false
        included_domains:
          description: Email domains of the people who can register (empty for all).
          type: array
          items:
            type: string
        excluded_domains:
          description: Email domains of the people who cannot register.
          type: array
          items:
            type: string
        default_notify_users:
          description: Whether all the approvers get an email for a join request, else those of `notify_users`.
          type: boolean
          default: true
        notify_users:
          description: >-
            IDs of the approvers who get an email for a join request, when `default_notify_users` is `false`. IDs as
            numbers, as the web app sends them: an ID as a string never matches an approver (no email).
          type: array
          items:
            type: integer
      required:
        - name
        - description
        - instructions
        - workspace_id
