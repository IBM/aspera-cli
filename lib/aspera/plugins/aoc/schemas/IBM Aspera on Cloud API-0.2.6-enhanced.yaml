            Whether or not the users of this workspace can upload to their respective home folders. Set this parameter
            to false to prevent users from uploading to or creating new folders in their home folders. Restricting these
            functions is one way to control storage usage in the workspace. To exempt certain workspace members from
            this restriction, set storage_allowed to true for those members in /workspace_memberships. POST Admin
            permission required. PUT Admin permission required. RESPONSE User scope. RESPONSE Admin scope (could be ws
            manager). RESPONSE Admin scope (org admin).
          type: boolean
          examples:
            - true
        url_shortening_enabled:
