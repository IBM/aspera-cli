  /groups:
    get:
      operationId: get_groups
      summary: Get a Listing of Groups
      description: >
        Get a listing of groups. With a token with admin scope, an organization administrator gets all groups of the
        organization. Otherwise, the user gets the groups that they manage, the system groups of their workspaces (of the
        workspaces they manage, for a workspace manager with admin scope), and the groups that are members of these
        workspaces, directly or through a group.

        System groups are created by AoC for workspaces, shared inboxes and apps (`system_group_type`): they are
        included unless `system_group=false`.
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: sort
          in: query
          description: >-
            Comma-separated list of fields (at most 5), prefixed with `-` for descending order. Fields: `name`,
            `created_at`, `updated_at`, `saml_group`, `system_group`. An unknown field is refused
            (`unknown_sort_field`).
          schema:
            type: string
          example: name
        - name: q
          in: query
          description: >-
            Search (case-insensitive substring) in the group name. A token `<field>:<value>`, with `<field>` one of the
            filter parameters, keeps groups whose field starts with `<value>` (for a date, a comparison, e.g.
            `created_at:>2024-01-01`).
          schema:
            type: string
        - name: name
          in: query
          description: Filter by group name (exact match).
          schema:
            type: string
        - name: system_group
          in: query
          description: Filter by the `system_group` attribute (e.g. `false` for groups created by users).
          schema:
            type: boolean
        - name: saml_group
          in: query
          description: Filter by the `saml_group` attribute.
          schema:
            type: boolean
        - name: created_at
          in: query
          description: Filter by creation date (exact match).
          schema:
            type: string
            format: date-time
        - name: updated_at
          in: query
          description: Filter by last update date (exact match).
          schema:
            type: string
            format: date-time
        - name: member_of_workspace_id
          in: query
          description: List only the groups that are direct members of this workspace.
          schema:
            type: string
        - name: manager
          in: query
          description: >-
            With `true`, and without admin rights on the organization, list only the groups that the user owns or
            manages.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of groups matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/groups_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Groups
    post:
      operationId: create_group
      summary: Create a Group
      description: >-
        Create a group. Requires a token with admin scope, for an organization administrator or a workspace manager. A
        workspace manager becomes owner of the group. Members are added with `/group_memberships`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/groups_params'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/groups_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '409':
          description: Conflict (`saml_group_dn` already used by another group)
        '422':
          description: Unprocessable Entity (e.g. `name` missing, `saml_group_dn` missing for a SAML group)
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Groups
