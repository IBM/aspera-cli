          type: string
    post:
      operationId: approve_dropbox_join_request
      summary: Approve a Join Request of a Shared Inbox
      description: >-
        Approve a join request (no body): the user with this email (or IBMid) is found, or created, and can submit
        packages to the shared inbox. Emails are sent to the user and to the approvers. The join requests of the same
