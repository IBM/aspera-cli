        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without user scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: >-
            Unprocessable Entity: errors of fields (folder that the user cannot read), or parameter error (other field:
            `unpermitted_parameters`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FieldValidationError'
                  - $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - File Upload Notifications
    delete:
      operationId: delete_file_upload_notification
      summary: Delete a File Upload Notification
      description: >-
        Delete a file upload notification of the user, with the notifications of the user on its subfolders. Requires a
        token with user scope: only the notifications of the user.
      responses:
        '204':
          description: No Content (deleted)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without user scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - File Upload Notifications
  /file_upload_notifications/get_toggle_state:
    get:
      operationId: get_file_upload_notification_toggle_state
      summary: Get the Notification State Inherited by a Folder
      description: >-
        Get the state that a folder inherits: `enabled` of the notification of the user on the closest parent folder
        (not the folder itself), else `false` (also when the file is not found). Requires a token with user scope: only
        the notifications of the user.
      parameters:
