  /dropbox_memberships:
    get:
      operationId: get_dropbox_memberships
      summary: Get a Listing of All Dropbox Members
      description: |
        Get a listing of information about the current members of a given dropbox.
      parameters:
        - name: can_invite_submitters
          in: query
          schema:
            type: boolean
          description: Filter for members who can invite submitters.
        - name: can_receive_packages
          in: query
          schema:
            type: boolean
          description: Filter for members who can receive packages.
        - name: can_submit_packages
          in: query
          schema:
            type: boolean
          description: Filter for members who can submit packages.
        - name: created_at
          in: query
          schema:
            type: string
            format: date-time
          description: Filter by creation date (exact match).
        - name: creator_id
          in: query
          schema:
            type: string
          description: Filter by creator user ID.
        - name: deactivated
          in: query
          description: |
            Filters memberships with member_type = "user" by their "deactivated" attribute.
          schema:
            type: boolean
        - name: dropbox_id
          in: query
          schema:
            type: string
          description: Filter by shared inbox ID.
        - name: embed%5B%5D
          in: query
          description: >
            embed%5B%5D=member (user or group object from member_id), embed%5B%5D=dropbox (dropbox object from
            dropbox_id)
          schema:
            type: string
        - name: inherited
          in: query
          description: >
            Specifies whether or not to include inherited memberships in the response. Typically used when an admin is
            looking at the memberships for a particular member_id or when a user is looking at their own memberships.
          schema:
            type: boolean
        - name: manager
          in: query
          schema:
            type: boolean
          description: Filter for manager-level members.
        - name: member.email
          in: query
          schema:
            type: string
          description: Filter by member email address.
        - name: member.last_login_at
          in: query
          schema:
            type: string
            format: date-time
          description: Filter by member last login date.
        - name: member.last_name
          in: query
          schema:
            type: string
          description: Filter by member last name.
        - name: member.system_group
          in: query
          schema:
            type: boolean
          description: Filter for system group members.
        - name: member_id
          in: query
          schema:
            type: string
          description: Filter by member ID.
        - name: member_type
          in: query
          description: Either "user" or "group"
          schema:
            type: string
        - name: q
          in: query
          description: >-
            Filter (case-insensitive substring) by member (user or group) fields `email`, `first_name`, `last_name`, and
            `name`.
          schema:
            type: string
        - name: updated_at
          in: query
          schema:
            type: string
            format: date-time
          description: Filter by last update date (exact match).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/dropbox_memberships_response'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Dropbox Memberships
    post:
      operationId: add_dropbox_membership
      summary: Add a Dropbox Member
      description: Add a user or group as a member of this dropbox.
      requestBody:
        required: true
        content:
