            public_invites_allowed), the link generated will have the shortened form; for example:  (compared to the
            standard URL; for example: ). When this parameter is set to true, you can also set personalized_urls_enabled
            to true. POST Admin permission required. PUT Manager permission and collaboration settings editable by
            managers required or PUT Admin permission required. RESPONSE Admin scope (org admin).
          type: boolean
          examples:
            - true
      required:
        - name
        - node_id
