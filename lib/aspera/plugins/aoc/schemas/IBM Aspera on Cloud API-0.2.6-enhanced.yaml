    network_policy_response:
      description: Network policy, assigned to nodes (`network_policy_id` of a node).
      type: object
      properties:
        id:
          description: ID of the network policy.
          type: string
          examples:
            - '35'
        name:
          description: Name of the network policy.
          type: string
          examples:
            - Receive server initiates
        organization_id:
          description: ID of the organization.
          type: string
        initiation_policy_type:
          description: >-
            Which nodes the nodes of the policy initiate the transfers with: `none`, `all`, or `listed` (the nodes of the
            initiation rules).
          type: string
          enum:
            - none
            - all
            - listed
          default: none
        access_control_type:
          description: >-
            Which nodes the nodes of the policy can transfer with: `none` (all), `allow_following` (only the nodes of the
            rules `allow`: none without rules), `disallow_following` (all but the nodes of the rules `disallow`).
          type: string
          enum:
            - none
            - allow_following
            - disallow_following
          default: none
        initiation_policies:
          description: Initiation rules (`GET /network_policies/{id}` only).
          type: array
          items:
            $ref: '#/components/schemas/initiation_policy_response'
        access_control_policies:
          description: Access control rules (`GET /network_policies/{id}` only).
          type: array
          items:
            $ref: '#/components/schemas/access_control_policy_response'
        created_at:
          description: Date and time of creation.
          type: string
          format: date-time
        updated_at:
          description: Date and time of the last change.
          type: string
          format: date-time
    network_policy_params:
      description: Network policy to create or modify (`name` is always required).
      type: object
      required:
        - name
      properties:
        name:
          description: Name of the network policy, unique in the organization.
          type: string
          examples:
            - Receive server initiates
        initiation_policy_type:
          description: >-
            Which nodes the nodes of the policy initiate the transfers with: `none`, `all`, or `listed` (the nodes of the
            initiation rules).
          type: string
          enum:
            - none
            - all
            - listed
