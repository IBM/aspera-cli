          description: Act as organization administrator (sent by the web UI for an administrator)
          schema:
            type: boolean
        - name: embed
          in: query
          description: Embed related resources (e.g. `updated_by_user`)
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order (e.g. `-created_at`)
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
        - name: per_page
          in: query
          description: Number of items per page
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/short_links_response'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Short Links
    post:
      operationId: add_short_link
      summary: Create a Short Link
      description: Create a short link to a shared folder or a shared inbox.
      parameters:
        - name: admin
          in: query
          description: Act as organization administrator (sent by the web UI for an administrator)
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/short_link_create_params'
      responses:
        '201':
          description: Created
          content:
