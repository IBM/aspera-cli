  /app_collaborators:
    get:
      operationId: get_app_collaborators
      summary: Get a Listing of App Collaborators
      description: >
        Get a listing of app collaborators: the users and groups of the collaboration allow list of the Files or
        Packages app of a workspace (external recipients allowed when the allow list is enabled). Requires a token with
        admin scope, for an organization administrator (all collaborators of the organization) or a workspace manager
        (those of the workspaces they manage).

        No sort field (any `sort` is refused, `unknown_sort_field`). Parameter `q` is not supported (500).
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: aspera_app_id
          in: query
          description: Filter by ID of the app.
          schema:
            type: string
        - name: aspera_app_type
          in: query
          description: Filter by type of app.
          schema:
            type: string
            enum:
              - files
              - packages
        - name: collaborator_id
          in: query
          description: Filter by ID of the user or group (according to `collaborator_type`).
          schema:
            type: string
        - name: collaborator_type
          in: query
          description: Filter by kind of collaborator.
          schema:
            type: string
            enum:
              - user
              - group
        - name: workspace_id
          in: query
          description: Filter by ID of the workspace of the app.
          schema:
            type: string
        - name: embed[]
          in: query
          description: embed[]=workspace (workspace object from workspace_id). Repeat the parameter for several values.
          schema:
            type: string
            enum:
              - workspace
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of collaborators matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/app_collaborators_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: >-
            Forbidden (token without admin scope, user neither organization administrator nor workspace manager)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - App Collaborators
    post:
      operationId: create_app_collaborator
      summary: Add a Collaborator to an App
      description: >-
        Add a user or a group to the collaboration allow list of the Files or Packages app of a workspace. Requires a
        token with admin scope, for an organization administrator or a manager of the workspace of the app. The body
        must not be wrapped in a key `aspera_app_collaborator`: the app is read from the fields `aspera_app_type` and
        `aspera_app_id` at the top level.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/app_collaborators_params'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the object, `https://api.ibmaspera.com/api/v1/app_collaborators/{id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app_collaborators_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: >-
            Forbidden (token without admin scope, user neither organization administrator nor workspace manager)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found (`aspera_app_type` not `files` or `packages`, or no such app in the organization)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Conflict (the user or group is already a collaborator of the app)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '422':
          description: >-
            Unprocessable Entity: errors of fields (`collaborator_type` not `user` or `group`, collaborator not found,
            app of no workspace, workspace not managed by the user), or parameter error (missing body, other field:
            `unpermitted_parameters`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FieldValidationError'
                  - $ref: '#/components/schemas/ValidationError'
        '500':
          description: >-
            Internal Server Error (also for a `collaborator_type` in upper case, or that is not the name of a model,
            e.g. `foo`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - App Collaborators
