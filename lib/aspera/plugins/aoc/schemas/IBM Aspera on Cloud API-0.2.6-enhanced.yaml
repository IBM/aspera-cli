          schema:
            type: string
        - name: file_id
          in: query
          description: ID of the folder (required).
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/file_upload_notification_toggle_state_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without user scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found (`node_id` missing or not a node of the organization)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - File Upload Notifications
  /invitations:
    post:
      operationId: create_invitation
      summary: Send an Invitation
      description: >
        Send an invitation by email (and message in the web app), according to `type`:

        - no `type` (or another value): send again the invitation of a user to the organization (`user_id`), with a new
        link to set the password, or to register with IBMid. Requires a token with admin scope, for an organization
        administrator or a workspace manager.

        - `dropbox`: invite a user, a group or an email address to submit packages to a shared inbox (`dropbox_id`,
        optional `url_token_id` or `short_link_id` of a link). Allowed to an organization administrator, a manager of
        the workspace, or a member of the shared inbox.

        - `send_to_me`: invite to send a package to the user, with a public link (`url_token_id`, `workspace_id`).

        - `file_shared`, `send_file`, `send_folder`: tell that a file or folder is shared (`node_id`, `file_id`,
        `file_name`, `file_type`, `workspace_id`, optional link).

        The emails are sent in the background, according to the email settings of the organization, workspace or shared
        inbox, and to the preferences of the users: the response is 204 even when no email is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invitations_params'
      responses:
        '204':
          description: No Content (sent)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: >-
            Forbidden (not allowed for this type, or URL token, workspace or shared inbox not found or not allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found (user or group, of `user_id` or `addressee_id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: >-
            Unprocessable Entity: parameter error (missing body, field required by the type missing, other field:
            `unpermitted_parameters`, except for the invitation to the organization, which ignores the other fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error (also for an `addressee_type` other than `email`, `user` or `group`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Users
  /integrations:
    get:
      operationId: get_integrations
      summary: Get the Integrations Available
      description: >-
        Get the integrations available for the organization, with their options: watermarking, when the subscription
        includes it, with the providers and regions allowed for `cloud_provider` and `cloud_region` of a watermark
        profile (also for `provider` and `region` of a Trend Micro profile). Requires a token with admin scope, for an
        organization administrator.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/integrations_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user not organization administrator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Watermark Profiles
  /integrations/kms_profiles:
    get:
      operationId: get_kms_profiles
      summary: Get a Listing of KMS Profiles
      description: >-
        Get a listing of the KMS profiles of the organization. A KMS profile gives access to a root key in a Key
        Management Service (bring your own key), to encrypt the content of nodes at rest: a node refers to it with
        `kms_profile_id`, which cannot change once set. Requires a token with admin scope, for an organization
        administrator.

        Parameter `q` is not supported (500).
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: sort
          in: query
          description: >-
            Comma-separated list of fields (at most 5), prefixed with `-` for descending order. Fields: `name`,
            `provider`, `created_at`, `updated_at`. Or `associated_nodes` alone (number of nodes that use the
            profile, ascending only, also with `-`; `too_many_sort_fields` with other fields). An unknown field is
            refused (`unknown_sort_field`).
          schema:
            type: string
          example: name
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of profiles (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/kms_profiles_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user not organization administrator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - KMS Profiles
    post:
      operationId: create_kms_profile
      summary: Create a KMS Profile
      description: >-
        Create a KMS profile. AoC records the profile, then gives it to its KMS service, which checks the access to the
        root key and keeps the API key (not in the response). When the KMS service refuses the profile (400), the
        profile stays recorded, and deleting it can then fail. Requires a token with admin scope, for an organization
        administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kms_profiles_create_params'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kms_profiles_response'
        '400':
          description: >-
            Bad Request: refused by the KMS service (e.g. wrong API key, instance or root key: the profile is recorded),
            or invalid profile (name missing or already used: not recorded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user not organization administrator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: Unprocessable Entity (e.g. missing body, other field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error (also when `config` is missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - KMS Profiles
