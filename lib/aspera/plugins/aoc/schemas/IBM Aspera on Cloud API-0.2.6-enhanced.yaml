  /connect_suppressed_permissions:
    get:
      operationId: get_connect_suppressed_permissions
      summary: Get a Listing of Users and Groups Without IBM Aspera Connect
      description: >
        Get a listing of the users and groups that do not use IBM Aspera Connect (HTTP Gateway instead) when the
        organization setting `connect_suppressed_scope` is `user:selected`. A user is concerned when they have a record,
        or one of their groups (field `connect_suppressed` of a user).

        With a token with admin scope, for an organization administrator: all records of the organization. With a token
        with user scope: only the record of the user (not those of their groups).
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: sort
          in: query
          description: >-
            Comma-separated list of fields (at most 5), prefixed with `-` for descending order. Fields: `name` (of the
            user or group), `member_type`, `member_id`, `created_at`, `updated_at`, `last_login_at`, `deactivated`,
            `member.email`, `member.first_name`, `member.last_name`, `member.system_group`. An unknown field is refused
            (`unknown_sort_field`).
          schema:
            type: string
        - name: q
          in: query
          description: >-
            Search (case-insensitive substring) in the email, first name, last name and name of the user, and the name
            of the group. A token `<field>:<value>`, with `<field>` one of the filter parameters (except `name`), keeps
            records whose field starts with `<value>`.
          schema:
            type: string
        - name: member_type
          in: query
          description: Filter by kind of member.
          schema:
            type: string
            enum:
              - user
              - group
        - name: member_id
          in: query
          description: Filter by ID of the user or group (according to `member_type`).
          schema:
            type: string
        - name: deactivated
          in: query
          description: Filter by the `deactivated` attribute of the user (excludes groups).
          schema:
            type: boolean
        - name: member.email
          in: query
          description: Filter by email of the user.
          schema:
            type: string
        - name: member.first_name
          in: query
          description: Filter by first name of the user.
          schema:
            type: string
        - name: member.last_name
          in: query
          description: Filter by last name of the user.
          schema:
            type: string
        - name: member.system_group
          in: query
          description: Filter by the `system_group` attribute of the group.
          schema:
            type: boolean
        - name: created_at
          in: query
          description: Filter by created at (exact date and time).
          schema:
            type: string
            format: date-time
        - name: updated_at
          in: query
          description: Filter by updated at (exact date and time).
          schema:
            type: string
            format: date-time
        - name: last_login_at
          in: query
          description: Filter by last login at (exact date and time).
          schema:
            type: string
            format: date-time
        - name: member.last_login_at
          in: query
          description: Filter by member last login at (exact date and time).
          schema:
            type: string
            format: date-time
        - name: embed[]
          in: query
          description: >-
            embed[]=member (user or group object from member_id), embed[]=organization. Repeat the parameter for several
            values.
          schema:
            type: string
            enum:
              - member
              - organization
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of records matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/connect_suppressed_permissions_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token with user scope asking for another member)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error (also for filter or token `name`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Connect Suppressed Permissions
    post:
      operationId: create_connect_suppressed_permission
      summary: Stop IBM Aspera Connect for a User or a Group
      description: >-
        Add a record for a user or a group: with the organization setting `connect_suppressed_scope` `user:selected`,
        they use the HTTP Gateway instead of IBM Aspera Connect. Requires a token with admin scope, for an organization
        administrator. A user or group has at most one record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connect_suppressed_permissions_params'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Path of the record, `/api/v1/connect_suppressed_permissions/{id}` (not a full URL).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect_suppressed_permissions_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user not organization administrator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '409':
          description: Conflict (the user or group already has a record)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '422':
          description: >-
            Unprocessable Entity: errors of fields (`member_type` not `user` or `group`, member of another
            organization), or parameter error (missing body, other field: `unpermitted_parameters`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FieldValidationError'
                  - $ref: '#/components/schemas/ValidationError'
        '500':
          description: >-
            Internal Server Error (also when the member does not exist, or `member_type` or `member_id` is missing, or
            `member_type` is in upper case or not the name of a model, e.g. `foo`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Connect Suppressed Permissions
  /connect_suppressed_permissions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the record.
        schema:
          type: string
    get:
      operationId: get_connect_suppressed_permission
      summary: Get a Record of a User or Group Without IBM Aspera Connect
      description: Get a record. With a token with user scope, only the record of the user.
