        - name: aspera_app_type
          in: query
          description: Type of Aspera application (e.g., 'packages', 'files')
          schema:
            type: string
            enum:
              - packages
              - files
        - name: aspera_app_id
          in: query
          description: ID of the Aspera application
          schema:
            type: integer
        - name: context
          in: query
          description: >-
            Context for filtering contacts (e.g., 'send_package', 'share_folder', 'personal_distribution_list',
            'workspace_distribution_list')
          schema:
            type: string
            enum:
              - send_package
              - share_folder
              - personal_distribution_list
              - workspace_distribution_list
        - name: source_type
          in: query
          description: Filter contacts by source type
          schema:
            type: string
            enum:
              - user
              - group
              - DistributionList
        - name: include_personal_contacts
          in: query
          description: Include user's personal contacts in the results
          schema:
            type: boolean
            default: false
        - name: include_only_user_personal_contacts
          in: query
          description: Include only personal contacts that are users (excludes groups and distribution lists)
          schema:
            type: boolean
            default: false
        - name: member
          in: query
          description: Filter by membership status
          schema:
            type: boolean
        - name: sort
          in: query
          description: Sort order for results (e.g., 'score' for relevance-based sorting)
          schema:
            type: string
        - name: embed[]
          in: query
