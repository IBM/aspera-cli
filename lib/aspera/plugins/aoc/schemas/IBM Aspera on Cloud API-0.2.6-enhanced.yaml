    clients_params:
      type: object
      properties:
        admin_node_token_retrieval_enabled:
          description: >-
            If you use the JWT grant type (jwt_grant_enabled=true), whether or not to allow users of this client who are
            AoC administrators to retrieve admin-scoped node access tokens. Such a token provides the user with admin
            privileges on the node itself. Admin permissions required. Defaults to false.
          type: boolean
          examples:
            - false
        explicit_authorization_required:
          description: >-
            Use with browser-based authorization. When users log in using the client app via a browser, prompt them to
            explicitly allow access to AoC features. Admin permissions required. Defaults to true.
          type: boolean
          examples:
            - true
        jwt_grant_enabled:
          description: >-
            Allow the client to authenticate using the JSON web token method. The JWT grant allows the users of the
            client to log in without having to use a web browser. Admin permissions required.
          type: boolean
          examples:
            - false
        name:
          description: 'The name of the client app to register. Admin permissions required. POST: required. PUT: not required.'
          type: string
          examples:
            - AoC_Client
        origins:
          description: >-
            The allowable list of origins for the client. An origin is the URI or protocol-host-port of the client app
            initial login page, from which the user must arrive to the authentication flow. Array of JSON origins
            (strings) Admin permissions required. Separate multiple origins with commas. Maximum characters: 65535.
          type: array
          items:
            type: string
          examples:
            - - https://ClientOrigin.com
        public_key:
          description: >-
            RSA public key in PEM format. The corresponding private key can be used to generate a JWT assertion for any
            user in the organization. Admin permissions required. Maximum characters: 65535.
          type: string
          examples:
            - |-
              -----BEGIN PUBLIC KEY-----
              MIIBI ... 7QIDAQAB
              -----END PUBLIC KEY-----
        redirect_uris:
          description: >-
            The allowable list of redirect URIs for the client. A redirect URI (protocol-host-port) is an absolute URI
            invoked after the authentication flow to return the user to the client app. Array of JSON redirect URIs
            (strings) Admin permissions required. Separate multiple redirect URIs with commas. Maximum characters:
            65535.
          type: array
          items:
            type: string
          examples:
            - - https://ClientRedirect.com
        whitelist_enabled:
          description: >-
            Enable creation of a specific list of users and groups eligible to receive an access token. To create the
            whitelist, see /client_authorizations. Admin permissions required. Pertains to JWT grants. Default is false.
          type: boolean
          examples:
            - true
      required:
        - name
    clients_response:
      type: object
      properties:
        admin_node_token_retrieval_enabled:
          description: >-
            If you use the JWT grant type (jwt_grant_enabled=true), whether or not to allow users of this client who are
            AoC administrators to retrieve admin-scoped node access tokens. Such a token provides the user with admin
            privileges on the node itself. Default is false.
          type: boolean
          examples:
            - true
        allow_implicit_grant:
          description: >-
            Whether or not to allow the client app to obtain an access token directly from the authorization endpoint,
            without contacting the token endpoint or authenticating the client.
          type: boolean
          examples:
            - false
        created_at:
          description: Timestamp of original creation of the client. Datetime.
          type: string
          format: date-time
          examples:
            - 2018-02-06T00:03:24.000Z
        creator_id:
          description: ID of the user who created the client.
          type: string
          examples:
            - '0'
        explicit_authorization_required:
          description: >-
            Use with browser-based authorization. When users log in using the client app via a browser, prompt them to
            explicitly allow access to AoC features. Default is true.
          type: boolean
          examples:
            - false
        id:
          description: ID of the client app.
          type: string
          examples:
            - '0'
        jwt_grant_enabled:
          description: >-
            Allow the client to authenticate using the JSON web token method. The JWT grant allows the users of the
            client to log in without having to use a web browser. Default is false.
          type: boolean
          examples:
            - false
        name:
          description: 'Name assigned to the client. Maximum length: 255 characters.'
          type: string
          examples:
            - AoC_Client
        organization_id:
          description: ID of the AoC organization to which the client belongs.
          type: string
          examples:
            - '4'
        origins:
          description: >-
            The allowable list of origins for the client. An origin is the URI or protocol-host-port of the client app
            initial login page, from which the user must arrive to the authentication flow. Separate multiple origins
            with commas. Maximum characters: 65535. Array of json origins (strings).
          type: array
          items:
            type: string
          examples:
            - - https://origins.com
        public_key:
          description: 'The public portion of the RSA key pair. Maximum characters: 65535.'
          type: string
          examples:
            - |-
              -----BEGIN PUBLIC KEY-----
              MIIBI ... 7QIDAQAB
              -----END PUBLIC KEY-----
        redirect_uris:
          description: >-
            The allowable list of redirect URIs for this client. A redirect URI, or protocol-host-port, is an absolute
            URI invoked after the authentication flow to return the user to the client app. Separate multiple redirect
            URIs with commas. Maximum characters: 65535.
          type: array
          items:
            type: string
          examples:
            - - https://redirect.com
        secret:
          description: The secret associated with this client.
          type: string
          examples:
            - Fw62_Lh7qOK9Z62z-TAwqJncr8Lmej97TbFCnhzd9ShdQ25NxKuLjeOJXSkKrOHuRezeKiXXcuCUoh_hJ1wwzHARdElfsDhw
        updated_at:
          description: Timestamp of last modification to the client. datetime
          type: string
          format: date-time
          examples:
            - 2018-02-06T00:03:24.000Z
        whitelist_enabled:
          description: >-
            Enable creation of a specific list of users and groups eligible to receive an access token. Pertains to JWT
            grants. Default is false. See /client_authorizations.
          type: boolean
          examples:
            - false
