  /distribution_lists:
    get:
      operationId: get_distribution_lists
      summary: Get a Listing of Distribution Lists
      description: >-
        Get a listing of distribution lists: named lists of email addresses and groups, owned by a user (personal list)
        or by a workspace, used as recipients of packages and in contacts. With a token with admin scope: all lists of
        the organization for an organization administrator; for a workspace manager, the lists of the workspaces they
        manage and their own lists. With a token with user scope: the lists of the user.
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: sort
          in: query
          description: >-
            Comma-separated list of fields (at most 5), prefixed with `-` for descending order. Fields: `name`,
            `owner_type`, `owner_id`, `created_at`, `updated_at`. An unknown field is refused (`unknown_sort_field`).
          schema:
            type: string
        - name: q
          in: query
          description: >-
            Search (case-insensitive substring) in the name. A token `<field>:<value>`, with `<field>` one of `name`,
            `owner_type`, `owner_id`, keeps lists whose field starts with `<value>`; `created_at:` and `updated_at:`
            take a comparator, e.g. `created_at:>2026-01-01`.
          schema:
            type: string
          example: owner_type:workspace
        - name: name
          in: query
          description: Filter by name (exact).
          schema:
            type: string
        - name: owner_type
          in: query
          description: Filter by kind of owner.
          schema:
            type: string
            enum:
              - user
              - workspace
        - name: owner_id
          in: query
          description: Filter by ID of the owner (according to `owner_type`).
          schema:
            type: string
        - name: created_at
          in: query
          description: Filter by created at (exact date and time).
          schema:
            type: string
            format: date-time
        - name: updated_at
          in: query
          description: Filter by updated at (exact date and time).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of lists matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/distribution_lists_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Distribution Lists
    post:
      operationId: create_distribution_list
      summary: Create a Distribution List
      description: >
        Create a distribution list. With a token with user scope, only `name`: the list belongs to the user. With a
        token with admin scope, the owner is given: a workspace that the user manages, or the user (an organization
        administrator can give any user or workspace of the organization). The list is added to the contacts.

        The name must not be the name of a group of the organization, nor of another list of the same owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/distribution_lists_params'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the object, `https://api.ibmaspera.com/api/v1/distribution_lists/{id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/distribution_lists_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '409':
          description: Conflict (name already used by a group or by another list of the owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '422':
          description: >-
            Unprocessable Entity: errors of fields (`name` or `owner_id` missing, `owner_type` not `user` or
            `workspace`, owner not found or not allowed, `available_to_*` set for a personal list or both `true`), or
            parameter error (missing body, other field: `unpermitted_parameters`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FieldValidationError'
                  - $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error (also for an `owner_type` other than `user` or `workspace`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Distribution Lists
  /distribution_lists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the distribution list.
        schema:
          type: string
    get:
      operationId: get_distribution_list
      summary: Get a Distribution List
      description: >-
        Get a distribution list. With a token with admin scope: all lists of the organization for an organization
        administrator; for a workspace manager, the lists of the workspaces they manage and their own lists. With a
        token with user scope: the lists of the user.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/distribution_lists_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Distribution Lists
    put:
      operationId: update_distribution_list
      summary: Modify a Distribution List
      description: >-
        Modify the name of a distribution list, or who can use a list of a workspace. The owner cannot change. The name
        of its contact changes too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/distribution_lists_update_params'
      responses:
        '204':
          description: No Content (modified)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Conflict (name already used by a group or by another list of the owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '422':
          description: >-
            Unprocessable Entity: errors of fields, or parameter error (other field: `unpermitted_parameters`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FieldValidationError'
                  - $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Distribution Lists
    delete:
      operationId: delete_distribution_list
      summary: Delete a Distribution List
      description: Delete a distribution list, with its members and its contact.
      responses:
        '204':
          description: No Content (deleted)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Distribution Lists
  /distribution_list_memberships:
    get:
      operationId: get_distribution_list_memberships
      summary: Get a Listing of Members of Distribution Lists
      description: >-
        Get a listing of the members of distribution lists: email addresses and groups. The lists are those that the
        user can read (see `GET /distribution_lists`). `name` is the name of the group, or of the user of the
        organization with the email, else the email.
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: sort
          in: query
          description: >-
            Comma-separated list of fields (at most 5), prefixed with `-` for descending order. Fields:
            `distribution_list_id`, `member_type`, `member_id`, `created_at`, `updated_at`. An unknown field is refused
            (`unknown_sort_field`).
          schema:
            type: string
        - name: q
          in: query
          description: >-
            Only tokens `<field>:<value>`, with `<field>` one of the filter parameters: keeps members whose field starts
            with `<value>` (`created_at:` and `updated_at:` take a comparator, e.g. `created_at:>2026-01-01`). Other
            text is ignored.
          schema:
            type: string
          example: member_type:email
        - name: distribution_list_id
          in: query
          description: Filter by ID of the distribution list.
          schema:
            type: string
        - name: member_type
          in: query
          description: Filter by kind of member.
          schema:
            type: string
            enum:
              - email
              - group
        - name: member_id
          in: query
          description: Filter by email address or group ID (exact).
          schema:
            type: string
        - name: created_at
          in: query
          description: Filter by created at (exact date and time).
          schema:
            type: string
            format: date-time
        - name: updated_at
          in: query
          description: Filter by updated at (exact date and time).
          schema:
            type: string
            format: date-time
        - name: embed[]
          in: query
          description: >-
            embed[]=distribution_list (list object from distribution_list_id), embed[]=member (group object, for a
            member of type `group` only: 500 for an email member). Repeat the parameter for several values.
          schema:
            type: string
            enum:
              - distribution_list
              - member
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of members matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/distribution_list_memberships_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Distribution List Memberships
    post:
      operationId: create_distribution_list_membership
      summary: Add a Member to a Distribution List
      description: >-
        Add an email address or a group to a distribution list (at most 500 members). The email address is not checked:
        an invalid one is ignored when a package is sent to the list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/distribution_list_memberships_params'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the object, `https://api.ibmaspera.com/api/v1/distribution_list_memberships/{id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/distribution_list_memberships_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '409':
          description: Conflict (already a member of the list)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '422':
          description: >-
            Unprocessable Entity: errors of fields (`member_type` not `email` or `group`, group or list of another
            organization, list of 500 members), or parameter error (missing body, other field: `unpermitted_parameters`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FieldValidationError'
                  - $ref: '#/components/schemas/ValidationError'
        '500':
          description: >-
            Internal Server Error (also when `distribution_list_id` is missing or not found, when `member_type` is in
            upper case or not the name of a model, e.g. `foo`, or when the group does not exist: the member is then
            added)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Distribution List Memberships
