  /client_registration/token:
    post:
      operationId: create_client_registration_token
      summary: Create Client Registration Token
      description: |
        Create a new client registration token for the current organization (admin only).
        The token is valid 24 hours, and can be used once, to register a client with `POST /client_registration`.
        The client is created with `jwt_grant_enabled` and `client_subject_enabled` set to `true`, whatever the values given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ClientRegistrationTokenData'
              required:
                - data
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Value of the token, to use in `POST /client_registration`.
                  expires_at:
                    type: string
                    format: date-time
                    description: Timestamp when the token expires.
                required:
                  - token
                  - expires_at
        '400':
          description: Bad Request (invalid payload)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      tags:
        - Client Registration Tokens
  /client_registration:
    post:
      operationId: register_client
      summary: Register a Client with a Client Registration Token
      description: |
        Create a client in the organization of the client registration token, with the public key given.
        The bearer token is the value of the client registration token (`Authorization: Bearer <TOKEN>`), not an OAuth token.
        The client registration token is deleted after this call, even if the payload is invalid.
      security:
        - ClientRegistrationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public_key:
                  type: string
                  description: Public key of the client, in PEM format.
              required:
                - public_key
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                description: Client created (a subset of the fields of `GET /clients/{id}`).
                properties:
                  id:
                    type: string
                    description: Identifier of the client (`client_id`).
                  name:
                    type: string
                    description: Name of the client, from the client registration token.
                  organization_id:
                    type: string
                    description: Identifier of the organization.
                  public_key:
                    type: string
                    description: Public key of the client, in PEM format.
                  jwt_grant_enabled:
                    type: boolean
                    description: Whether the client can use the JWT grant.
                  client_subject_enabled:
                    type: boolean
                    description: Whether the client can request a token with itself as subject.
                  client_subject_scopes:
                    type: array
                    description: Scopes allowed when the client is the subject.
                    items:
                      type: string
        '400':
          description: Bad Request (invalid payload)
        '401':
          description: Unauthorized (missing, invalid or expired client registration token)
      tags:
        - Client Registration Tokens
  /email_templates:
    get:
      operationId: get_email_templates
      summary: Get a Listing of Email Templates
      description: >
        Get a listing of email templates: the global templates of AoC (`source_type` `null`), and those of the
        organization, of its workspaces and of its shared inboxes. Requires a token with admin scope, for an
        organization administrator (global templates and all templates of the organization) or a workspace manager
        (global templates, templates of the workspaces they are a member of, and of the shared inboxes of the
        workspaces they manage or that they are a member of; not those of the organization).

        No sort field (any `sort` is refused, `unknown_sort_field`). Parameter `q` is not supported (500).
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: source_type
          in: query
          description: Filter by kind of source (class name; empty for the global templates).
          schema:
            type: string
            enum:
              - Organization
              - Workspace
              - Dropbox
        - name: source_id
          in: query
          description: Filter by ID of the organization, workspace or shared inbox.
          schema:
            type: string
        - name: email_type
          in: query
          description: Filter by type of email.
          schema:
            $ref: '#/components/schemas/email_template_type'
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of templates matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/email_templates_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: >-
            Forbidden (token without admin scope, user neither organization administrator nor workspace manager)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Email Templates
  /email_templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the email template.
        schema:
          type: string
    get:
      operationId: get_email_template_by_id
      summary: Get an Email Template
      description: >-
        Get an email template. Requires a token with admin scope, for an organization administrator (global templates
        and all templates of the organization) or a workspace manager (global templates, templates of their workspaces
        and shared inboxes, not those of the organization).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email_templates_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: >-
            Forbidden (token without admin scope, user neither organization administrator nor workspace manager)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found (also a template that the user cannot read)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Email Templates
    put:
      operationId: update_email_template
      summary: Modify an Email Template
      description: >
        Modify an email template: only the fields given change. Requires a token with admin scope, for an organization
        administrator (templates of the organization, its workspaces and shared inboxes) or a manager of the workspace
        (templates of the workspace and its shared inboxes, when the workspace allows it to managers). The global
        templates cannot be modified.

        The base templates (`base`, `base_external`) have the layout fields (`subject_prefix`, `from_display`,
        `from_email` required, logo, `header_color`, `footer`), and no `subject`, `body` or `button_text`. The other
        templates have `subject` (required), `body` and `button_text`, and no layout field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email_templates_params'
      responses:
        '204':
          description: No Content (modified)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (global template, or template that the user cannot modify)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: >-
            Unprocessable Entity: errors of fields (field required or not allowed for the type of template: error
            `fields`, logo too big, `header_color` or `logo_source` not allowed), or parameter error (missing body,
            other field: `unpermitted_parameters`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FieldValidationError'
                  - $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Email Templates
  /effective_templates:
    get:
      operationId: get_effective_templates
      summary: Get the Email Templates Used for a Source
      description: >
        Get the email templates used for the organization, a workspace or a shared inbox (`source_type` and
        `source_id`): its own template, or the inherited one (shared inbox, then workspace, then organization, then
        global, when `inherit_email_templates`), or the global one when the subscription has no email templates. One
        template by type available for the source, or only `email_type`; `[]` when the type is not available for the
        source. Not paginated.

        Without `source_type`: the global templates, paginated, with filters `source_id` and `email_type`. Requires a
        token with admin scope, for an organization administrator or a workspace manager. The source is only checked
        to be in the organization: a workspace manager also gets the templates of the organization, and of any
        workspace or shared inbox.
      parameters:
        - name: page
          in: query
          description: Without `source_type`, page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Without `source_type`, number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: source_type
          in: query
          description: Kind of source (lower case).
          schema:
            type: string
            enum:
              - organization
              - workspace
              - dropbox
        - name: source_id
          in: query
          description: >-
            With `source_type`, required: ID of the organization (the current one), workspace or shared inbox.
          schema:
            type: string
        - name: email_type
          in: query
          description: Type of email.
          schema:
            $ref: '#/components/schemas/email_template_type'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/email_templates_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: >-
            Forbidden (token without admin scope, user neither organization administrator nor workspace manager)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found (other `source_type`, `source_id` missing or not found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Email Templates
  /events:
    post:
      operationId: create_event
      summary: Notify a Shared Folder
      description: >
        Tell AoC that a folder of a workspace was shared, after the creation of the permission with the Node API (`POST
        /permissions` on the node). For type `permission.created`, AoC records that the user shared the folder with
        the user or group of the permission (`access_type`, `access_id`), notifies them (email and message, according
        to their notification preferences), and adds them to the contacts of the user. Processed in the background.

        Requires a token with user scope, or with admin scope for an organization administrator or a workspace manager.
        The workspace and the node must be in the organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/events_params'
      responses:
        '201':
          description: Created (no body)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: >-
            Unprocessable Entity: `parameter_missing` (`node_id`, `types` or `workspace_id`), `invalid_parameter_value`
            (workspace, node, or user or group of the permission, not in the organization)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error (also when `data` is missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Events
