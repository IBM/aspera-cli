    ErrorList:
      type: object
      description: |
        Error response with a list of errors, returned by some endpoints (e.g. KMS profiles) instead of the standard
        format.
      properties:
        errors:
          type: array
          description: Errors.
          items:
            type: object
            properties:
              code:
                type: string
                description: Error code, e.g. `not_found`, `bad_request`.
              message:
                type: string
                description: Human-readable error message
        status_code:
          type: integer
          description: HTTP status code
      required:
        - errors
      example:
        errors:
          - code: not_found
            message: Not Found
        status_code: 404
    ConflictError:
      type: object
      description: |
