  /group_permissions:
    get:
      operationId: get_group_permissions
      summary: Get a Listing of Group Owners and Managers
      description: >
        Get a listing of group permissions. A group permission makes a user or a group (`entity_type`, `entity_id`) an
        owner or a manager (`level`) of a group (`group_id`). The members of a group that has a permission (directly or
        through a group) have this permission too. Organization administrators are owners of all groups, without group
        permission.

        Requires a token with admin scope, for an organization administrator or a workspace manager. An organization
        administrator gets the permissions of the organization. A workspace manager gets the permissions of the groups
        they own or manage.

        The permissions on a group are deleted with the group, and the permissions of a user with the user. The
        permissions of a group on other groups remain when it is deleted: `embed[]=entity` gives `null` for them.

        Parameter `inherited` (sent by the web UI) has no effect: only direct permissions are listed.
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: sort
          in: query
          description: >-
            Comma-separated list of fields (at most 5), prefixed with `-` for descending order. Fields: `level`,
            `entity_name` (name of the user or group), `group_name`, `user_name`. An unknown field is refused
            (`unknown_sort_field`).
          schema:
            type: string
          example: entity_name
        - name: q
          in: query
          description: >-
            Search (case-insensitive substring) in the `email`, `first_name`, `last_name` and `name` of the user, and the
            `name` of the group, that has the permission. A token `<field>:<value>`, with `<field>` one of the filter
            parameters, keeps permissions whose field starts with `<value>`.
          schema:
            type: string
          example: group_id:123
        - name: group_id
          in: query
          description: Filter by group ID.
          schema:
            type: string
        - name: entity_id
          in: query
          description: Filter by ID of the user or group that has the permission (according to `entity_type`).
          schema:
            type: string
        - name: entity_type
          in: query
          description: Filter by kind of entity that has the permission.
          schema:
            type: string
            enum:
              - user
              - group
        - name: embed[]
          in: query
          description: >-
            embed[]=entity (user or group object from entity_id), embed[]=group (group object from group_id). Repeat the
            parameter for several values.
          schema:
            type: string
            enum:
              - entity
              - group
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of permissions matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/group_permissions_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user neither organization administrator nor workspace manager)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Group Permissions
    post:
      operationId: add_group_permission
      summary: Make a User or a Group Owner or Manager of a Group
      description: >
        Give a user or a group the permission `owner` or `manager` on a group. Requires a token with admin scope, for an
        organization administrator or a workspace manager. An owner of the group can give both levels, a manager of the
        group only `manager`.

        A user or a group has at most one permission on a group: to change its level, update the permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/group_permissions_params'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the permission, `https://api.ibmaspera.com/api/v1/group_permissions/{id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/group_permissions_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user neither organization administrator nor workspace manager)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: >-
            Unprocessable Entity: errors of fields (level not `owner` or `manager`, `entity_type` not `user` or
            `group`, entity that does not exist, entity that already has a permission on the group, level not allowed
            for the user), or parameter error (missing body, other field: `unpermitted_parameters`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FieldValidationError'
                  - $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error (also when the group does not exist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Group Permissions
  /group_permissions/{id}:
    get:
      operationId: get_group_permission_by_id
      summary: Get Information on a Specific Group Permission
      description: >-
