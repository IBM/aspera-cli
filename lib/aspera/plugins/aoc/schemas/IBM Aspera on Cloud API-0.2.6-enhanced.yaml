  /integrations/trend_micro_profiles:
    get:
      operationId: get_trend_micro_profiles
      summary: Get a Listing of Trend Micro Profiles
      description: >-
        Get a listing of the Trend Micro profiles of the organization: antivirus scan of the files of packages, by Trend
        Micro File Storage Security, on a bucket of a node of IBM Aspera Transfer Service (ATS). The packages sent in a
        workspace of a node on this storage are held until scanned. Requires a token with admin scope, for an
        organization administrator.
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: sort
          in: query
          description: >-
            Comma-separated list of fields (at most 5), prefixed with `-` for descending order. Fields: `name`,
            `bucket_name`, `region`, `provider`, `sqs_queue_url`, `created_at`. An unknown field is refused
            (`unknown_sort_field`).
          schema:
            type: string
        - name: q
          in: query
          description: >-
            Search (case-insensitive substring) in `name`, `bucket_name`, `region`, `provider` and `sqs_queue_url`. A
            token `<field>:<value>` (`name`, `region`, `provider`, `sqs_queue_url`) keeps profiles whose field starts
            with `<value>`; `created_at:` takes a comparator, e.g. `created_at:>2026-01-01`.
          schema:
            type: string
        - name: name
          in: query
          description: Filter by name (exact).
          schema:
            type: string
        - name: bucket_name
          in: query
          description: Filter by bucket name (exact).
          schema:
            type: string
        - name: region
          in: query
          description: Filter by region (exact).
          schema:
            type: string
        - name: provider
          in: query
          description: Filter by provider (exact).
          schema:
            type: string
        - name: sqs_queue_url
          in: query
          description: Filter by sqs queue url (exact).
          schema:
            type: string
        - name: created_at
          in: query
          description: Filter by created at (exact date and time).
          schema:
            type: string
            format: date-time
        - name: include
          in: query
          description: >-
            `associated_nodes`: add `associated_nodes`, the nodes of the organization on the storage of the profile (ATS
            node of the provider and region, same bucket). A comma-separated string, not an array (500).
          schema:
            type: string
            enum:
              - associated_nodes
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of profiles matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/trend_micro_profiles_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user not organization administrator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Trend Micro Profiles
    post:
      operationId: create_trend_micro_profile
      summary: Create a Trend Micro Profile
      description: >-
        Create a Trend Micro profile. Requires a token with admin scope, for an organization administrator. The packages
        sent in the workspaces of the nodes on this storage are then held until scanned (`trend_micro_enabled` of the
        workspace). `provider` and `region` are those of watermarking (`GET /integrations`), and not those of a
        watermark profile of the organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/trend_micro_profiles_params'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/trend_micro_profiles_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user not organization administrator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: >-
            Unprocessable Entity: errors of fields (field missing, provider or region not allowed, `iam_arn_role` not an
            IAM role ARN, provider and region of a watermark profile, other profile on the same bucket, provider and
            region: error `base`), or parameter error (missing body, other field: `unpermitted_parameters`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FieldValidationError'
                  - $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Trend Micro Profiles
  /integrations/trend_micro_profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the Trend Micro profile.
