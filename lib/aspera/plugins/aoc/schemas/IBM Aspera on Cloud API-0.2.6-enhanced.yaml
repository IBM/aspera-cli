        schema:
          type: string
    post:
      operationId: update_dropbox_self_registration_link
      summary: Renew the Self Registration Link of a Shared Inbox
      description: >-
        Renew the self registration link of a shared inbox (no body): a new `self_register_url_id`, so the links with
        the old one no longer work (short links of purpose `self_registration_link` keep working). Does not enable self
        registration (`self_registration_enabled`). Requires a token with admin scope, for an organization
        administrator, or a workspace manager who manages the workspace of the shared inbox or is a member of the shared
        inbox.
      responses:
        '201':
          description: Created (the shared inbox)
          headers:
