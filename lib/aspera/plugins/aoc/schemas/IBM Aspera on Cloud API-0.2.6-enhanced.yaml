  /packages/{id}/download_counts:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the package.
        schema:
          type: string
    get:
      operationId: get_package_download_counts
      summary: Get the Downloads of a Package by User
      description: >-
        Get the downloads of a package, one row per user who started a download: complete, partial, failed and in
        progress. All rows with a token with admin scope and no `user_id` (organization administrator, or workspace
        manager for a package of a workspace they manage), or with `include_all_sent_packages`. Else the rows that the
        user sees: all for the sender; for a recipient, those of the recipients who are not in BCC, and their own.
      parameters:
        - name: user_id
          in: query
          description: >-
            With a token with admin scope, ID of a user of the organization: the rows as this user sees them (the
            package must be visible to the user). With a token with user scope, only the ID of the current user.
          schema:
            type: string
        - name: include_all_sent_packages
          in: query
          description: >-
            `true` with `workspace_id`: package sent in a workspace whose members can see all the packages sent
            (option of the workspace), all rows, BCC included.
          schema:
            type: boolean
        - name: workspace_id
          in: query
          description: ID of a workspace of the current user, required with `include_all_sent_packages`.
          schema:
            type: string
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: embed[]
          in: query
          description: embed[]=user (user object from user_id). Repeat the parameter for several values.
          schema:
            type: string
            enum:
              - user
              - package
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of rows matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/package_download_counts_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: Unprocessable Entity (`include_all_sent_packages` without `workspace_id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Packages
