      operationId: update_notification_preferences
      summary: Modify Notification Preferences of a User
      description: >
        Modify the notification preferences of a user: only the preferences given change. A user can modify their own
        preferences, an organization administrator those of all users of the organization.

        Some preferences of the response cannot be modified (`package_recalled_message`, `package_resent_message`,
        `package_sidecar_failed_email`, `package_sidecar_failed_message`): sending one gives 422
        (`unpermitted_parameters`), so the response of `GET` cannot be sent back as is.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the user.
          schema:
            type: string
      requestBody:
        required: true
        content:
