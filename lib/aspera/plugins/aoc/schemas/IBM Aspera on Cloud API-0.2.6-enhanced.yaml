        name:
          description: >-
            The workspace name. Query parameter for GET method. POST Admin permission required. PUT Admin permission
            required. RESPONSE User scope. RESPONSE Admin scope (could be ws manager). RESPONSE Admin scope (org admin).
          type: string
          examples:
            - My New Workspace
        node_id:
          description: >-
            The ID of the node on which workspace folders and packages are stored. Query parameter for GET method. POST
            Admin permission required. PUT Manager permission required.
          type: integer
          examples:
            - 14
        package_download_counts_enabled:
          description: >-
            Whether or not package download counts are recorded. POST Admin permission required. PUT Manager permission
            and collaboration settings editable by managers required or PUT Admin permission required. RESPONSE User
            scope. RESPONSE Admin scope (could be ws manager). RESPONSE Admin scope (org admin).
          type: boolean
          examples:
            - false
        personalized_urls_enabled:
          description: >-
            Enable members of this workspace to configure personalized URLs to send when inviting people to submit
            packages (refer to public_links_allowed). You can set this parameter to true only if url_shortening_enabled
            is also set to true. Once you enable personalized URLs, you enable a default personalized URL construction
            and you also allow workspace member to configure the URLs they send. The default URL configuration contains
            the sender's username or the dropbox name; for example:
            https://aspera.pub/John_Doe;https://aspera.pub/Dropbox1. Note that dropboxes in the workspace inherit the
            settings you configure for the workspace as follows: When short URLs are enabled at the workspace
            (url_shortening_enabled=true): Short URLs are enabled for all dropboxes in that workspace. You cannot
            disable short URLs for a dropbox. When personalized URLs are enabled at the workspace: Personalized URLs are
            enabled for all dropboxes in that workspace. You can disable personalized URLs for specific dropboxes if
            desired. POST Admin permission required. PUT Manager permission and collaboration settings editable by
            managers required or PUT Admin permission required.
          type: boolean
          examples:
            - false
        public_invites_allowed:
          description: >-
            Allow workspace members to send invitations to users outside the workspace, inviting them to send a package
            to (1) the user who issues the invitation, and (2) the dropboxes in which the user who issues the invitation
            is a member. An outside user can be a person who is a member of a different AoC workspace, or a person
            without an AoC account. POST Admin permission required. PUT Manager permission and collaboration settings
            editable by managers required or PUT Admin permission required.
