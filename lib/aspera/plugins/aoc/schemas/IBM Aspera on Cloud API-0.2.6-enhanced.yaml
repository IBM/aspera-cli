  /saml_configurations:
    get:
      operationId: get_saml_configurations
      summary: Get a Listing of SAML Configurations
      description: >
        Get a listing of the SAML configurations of the organization: login of users with a SAML identity provider.
        Requires a token with admin scope, for an organization administrator or a workspace manager. A workspace manager
        gets only `id`, `name` and `enabled`.

        No sort field and no filter. Parameter `q` is not supported (500).
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of SAML configurations (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/saml_configurations_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user neither organization administrator nor workspace manager)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: Unprocessable Entity (e.g. parameter `sort`, `unknown_sort_field`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - SAML Configurations
    post:
      operationId: create_saml_configuration
      summary: Create a SAML Configuration
      description: >
        Create a SAML configuration. Requires a token with admin scope, for an organization administrator, and a
        subscription that includes SAML.

        AoC also creates a system group (`system_group_type`: `saml_users`, `group_id`), which gets the users who log in
        with this configuration, and an auth provider (`SamlAuthProvider`, last on the login page). The `name`,
        `enabled`, `login_text`, `instructions`, `included_domains` and `excluded_domains` of the configuration are
        copied to the auth provider, and the `name` to the group, at each change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/saml_configurations_params'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the SAML configuration, `https://api.ibmaspera.com/api/v1/saml_configurations/{id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saml_configurations_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: >-
            Forbidden (token without admin scope, user not organization administrator, subscription without SAML)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: >-
            Unprocessable Entity: errors of fields (`sso_target_url` or `attribute_mapping` missing, neither
            `fingerprint` nor `certificate`, invalid certificate, fingerprint that does not match the certificate,
            mapping missing for an attribute, both `included_domains` and `excluded_domains`), or parameter error
            (missing body, other field: `unpermitted_parameters`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FieldValidationError'
                  - $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error (also for `name` missing or empty, checked by the model only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - SAML Configurations
  /saml_configurations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the SAML configuration.
        schema:
          type: string
    get:
      operationId: get_saml_configuration
      summary: Get a SAML Configuration
      description: >-
        Get a SAML configuration. Requires a token with admin scope, for an organization administrator or a workspace
        manager. A workspace manager gets only `id`, `name` and `enabled`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saml_configurations_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user neither organization administrator nor workspace manager)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - SAML Configurations
    put:
      operationId: update_saml_configuration
      summary: Modify a SAML Configuration
      description: >
        Modify a SAML configuration: only the fields given change. Requires a token with admin scope, for an
        organization administrator. The changes are copied to the auth provider and to the group of the configuration.

        When `restrict_login_to_known_groups` becomes `true`, AoC removes from the group of the configuration, in the
        background, the users who are not members of a SAML group. At least one login method of the organization must
        stay enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/saml_configurations_params'
      responses:
        '204':
          description: No Content (modified)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user not organization administrator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: >-
            Unprocessable Entity: errors of fields (as for create, and `auth_method` when the last enabled login method
            is disabled), or parameter error (other field: `unpermitted_parameters`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FieldValidationError'
                  - $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error (also for an empty `name`, checked by the model only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - SAML Configurations
    delete:
      operationId: delete_saml_configuration
      summary: Delete a SAML Configuration
      description: >-
        Delete a SAML configuration, with its group and its auth provider. Requires a token with admin scope, for an
        organization administrator. An enabled configuration that is the last enabled login method of the organization
        is not deleted, but the response is still 204.
      responses:
        '204':
          description: No Content (deleted)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user not organization administrator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - SAML Configurations
