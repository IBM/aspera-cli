  /file_deletion_policy:
    get:
      operationId: get_file_deletion_policy
      summary: Get the Nodes of a Storage for a File Deletion Policy
      description: >
        Get the nodes of the organization on the same storage (host and bucket) as a node, or as a host and bucket: a
        file deletion policy of a node (`file_deletion_policy_expiration_days` of a node) applies to all of them. Also
        tells whether another organization has a policy on this storage. Requires a token with admin scope, for an
        organization administrator or a workspace manager.

        Give `node_id`, or `host` and `bucket_name`. A node not managed by IBM (tethered) is alone on its storage.
      parameters:
        - name: node_id
          in: query
          description: ID of a node of the organization (then `host` and `bucket_name` are not used).
          schema:
            type: string
        - name: host
          in: query
          description: Host of the storage, with `bucket_name`.
          schema:
            type: string
        - name: bucket_name
          in: query
          description: Bucket (or container) of the storage, with `host`.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/file_deletion_policy_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: >-
            Forbidden (token without admin scope, user neither organization administrator nor workspace manager)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found (no such node in the organization)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Nodes
  /file_upload_notifications:
    get:
      operationId: get_file_upload_notifications
      summary: Get a Listing of File Upload Notifications
      description: >
        Get a listing of the file upload notifications of the user: the user gets an email when files are uploaded in a
        folder (`node_id`, `file_id`) or its subfolders. A notification with `enabled` `false` on a subfolder turns them
        off below an enabled folder. Requires a token with user scope: only the notifications of the user.

        Parameter `q` is not supported (500).
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: sort
          in: query
          description: >-
            Comma-separated list of fields (at most 5), prefixed with `-` for descending order. Fields: `node_id`,
            `file_id`, `workspace_id`, `user_id`, `created_at`, `updated_at`. An unknown field is refused
            (`unknown_sort_field`).
          schema:
            type: string
        - name: node_id
          in: query
          description: Filter by node ID.
          schema:
            type: string
        - name: file_id
          in: query
          description: Filter by file ID.
          schema:
            type: string
        - name: workspace_id
          in: query
          description: Filter by workspace ID.
          schema:
            type: string
        - name: user_id
          in: query
          description: Filter by user ID.
          schema:
            type: string
        - name: created_at
          in: query
          description: Filter by created at (exact date and time).
          schema:
            type: string
            format: date-time
        - name: updated_at
          in: query
          description: Filter by updated at (exact date and time).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of notifications matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/file_upload_notifications_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without user scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - File Upload Notifications
    post:
      operationId: add_file_upload_notification
      summary: Create a File Upload Notification
      description: >-
        Create a file upload notification for the user, on a folder of a node that the user can read. Requires a token
        with user scope: only the notifications of the user. The notifications of the user on the subfolders are
        deleted, and the new one too when it has the same `enabled` as the notification of a parent folder (it is still
        in the response).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/file_upload_notifications_params'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/file_upload_notifications_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without user scope, or the node refused to read the folder)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: >-
            Unprocessable Entity: errors of fields (`file_id` missing, `enabled` not a boolean, folder that the user
            cannot read: error `user_id`), or parameter error (missing body, other field: `unpermitted_parameters`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FieldValidationError'
                  - $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error (also when `node_id` is missing, or for a notification that already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - File Upload Notifications
  /file_upload_notifications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the file upload notification.
        schema:
          type: string
    put:
      operationId: update_file_upload_notification
      summary: Turn a File Upload Notification On or Off
      description: >-
        Change `enabled` of a file upload notification of the user. Requires a token with user scope: only the
        notifications of the user. The notifications of the user on the subfolders are deleted, and this one too when it
        then has the same `enabled` as a parent folder.
      requestBody:
        required: true
        content:
