        ibm_uid:
          description: The ID for the user. PUT User, Manager, Admin for self.
          type: integer
          examples:
            - 0
        last_name:
          description: >-
            The user's last name. PUT User, Manager, Admin for self. POST Manager permission required. POST Admin
            permission required.
          type: string
          examples:
            - Lumra
        name:
          description: >-
            The user first_name and last_name. PUT User, Manager, Admin for self. POST Manager permission required. POST
            Admin permission required.
          type: string
          examples:
            - Arthur Lumra
        organization_admin:
          description: Whether or not this user has administrative privileges in the organization. PUT Admin permission required.
