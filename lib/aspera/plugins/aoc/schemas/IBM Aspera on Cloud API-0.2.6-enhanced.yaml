          description: Created
          headers:
            Location:
              description: URL of the object, `https://api.ibmaspera.com/api/v1/network_policies/{id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/network_policy_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user not organization administrator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: >-
            Unprocessable Entity: errors of fields (`name` already used: error `unique_error`, type not allowed), or
            parameter error (missing body, `name` missing or empty: `parameter_missing`, other field:
            `unpermitted_parameters`)
