              type:
                type: string
                enum:
                  - user
                  - group
                  - email
            type: object
          examples:
            - - id: email@foo.co
                type: email
        effective_content_retention_duration:
          description: >
            Amount of time in seconds it takes for packages in this shared inbox to be deleted once their transfers
            complete. If null, packages will not be deleted on a timer. Read-only.
          type:
            - integer
            - 'null'
          examples:
            - null
        effective_delete_package_content_after_download_duration:
          description: >
            Amount of time in seconds it takes a package in this shared inbox to be deleted once all recipients have
            downloaded the entire package. If null, packages will not be deleted on a timer. Read-only.
          type:
            - integer
            - 'null'
          examples:
            - null
        email_notification_settings:
          description: >
            Email notifications specification. See below. POST: Admin or Manager permission required. PUT: Admin or
            Manager permission required.
          type: object
          allOf:
            - $ref: '#/components/schemas/email_notification_settings'
        enable_external_email_templates:
          description: >
            If inherit_email_templates is set to false, you can enable or disable the ability to configure email
            templates specifically for users outside this shared inbox. When this parameter is set to false, external
            recipients receive the same email notification messages that users in the shared inbox receive. POST: Admin
            or Manager permission required. PUT: Admin or Manager permission required.
          type: boolean
          examples:
            - false
        id:
          description: The ID of the shared inbox. Read-only.
          type: string
          examples:
            - '123'
        image_url:
          description: The URL of the shared inbox logo image. Read-only.
          type: string
          examples:
            - https://api.asperafiles.com/api/v1/user_images/32850?oh=cg-nf7pFnNK0-N3g3r-f2nRg
        inherit_email_notification_settings:
          description: >
            Inherit the email notification settings configured at the workspace level. POST Admin or Manager permission
            required. PUT Admin or Manager permission required.
          type: boolean
          examples:
            - true
        inherit_email_templates:
          description: >
            Inherit the email templates configured at the workspace level. If false, you can configure email template
            settings for this shared inbox. POST: Admin or Manager permission required. PUT: Admin or Manager permission
            required.
          type: boolean
          examples:
            - true
        inherit_workspace_expiration_settings:
          description: >
            Inherit the content_retention_duration settings configured at the workspace level. POST: Admin or Manager
            permission required. PUT: Admin or Manager permission required.
          type: boolean
          examples:
            - true
        instructions:
          description: >
            User defined instructions for potential shared inbox submissions. POST: Admin or Manager permission
            required. PUT: Admin or Manager permission required.
          type: string
          examples:
            - Video submissions only.
        metadata_schema:
          $ref: '#/components/schemas/metadata'
        name:
          description: >
            shared inbox name. A query parameter for the GET method. POST: Admin or Manager permission required. PUT:
            Admin or Manager permission required.
          type: string
          examples:
            - My Dropbox
        package_name_and_message_validation_schema:
          description: >
            Defines illegal characters and/or max length for the name and message fields for package submissions to this
            shared inbox. Defaults to an empty array ([]). POST: Admin or Manager permission required. PUT: Admin or
            Manager permission required.
          type: array
          items:
            properties:
              field_name:
                type: string
                enum:
                  - package_name
                  - package_message
              illegal_characters:
                description: Defines all disallowed characters.
                type: string
                examples:
                  - '!@#'
              max_length:
                description: Defines the max length for the provided string.
                type: string
                examples:
                  - '50'
            type: object
          examples:
            - - field_name: package_name
                illegal_characters: '!@#'
                max_length: '100'
              - field_name: package_message
                illegal_characters: '!@#'
                max_length: '50'
        personalized_urls_enabled:
          description: >
            Enable members of this shared inbox to configure personalized URLs to send when inviting people to submit
            packages. POST: Admin or Manager permission required. PUT: Admin or Manager permission required.
          type: boolean
          examples:
            - false
        recipients_group_id:
          description: |
            ID of the group that all shared inbox recipients belong to. Read-only.
          type: string
          examples:
            - '123'
        senders_group_id:
          description: |
            ID of the group that all senders to the shared inbox belong to. Read-only.
          type: string
          examples:
            - '123'
        workspace_id:
          description: >
            ID of the workspace to which this shared inbox belongs. POST: Admin or Manager permission required. PUT:
            Admin or Manager permission required.
          type: string
          examples:
            - '123'
        self_registration_enabled:
          description: Whether people can ask to submit packages with the self registration link of the shared inbox.
          type: boolean
          default: false
        approval_required_for_self_registration:
          description: >-
            Whether a self registration must be approved (join requests, `/dropboxes/{id}/dropbox_join_requests`), else
            the person can submit at once.
          type: boolean
          default: true
        can_dropbox_managers_approve_self_registration:
          description: Whether the managers of the shared inbox can approve the join requests (else the administrators and the managers of the workspace).
          type: boolean
          default: false
        included_domains:
          description: Email domains of the people who can register (empty for all).
          type: array
          items:
            type: string
        excluded_domains:
          description: Email domains of the people who cannot register.
          type: array
          items:
            type: string
        default_notify_users:
          description: Whether all the approvers get an email for a join request, else those of `notify_users`.
          type: boolean
          default: true
        notify_users:
          description: >-
            IDs of the approvers who get an email for a join request, when `default_notify_users` is `false`, as they
            were sent (numbers).
          type: array
          items:
            type: integer
        self_register_url_id:
          description: ID in the self registration link (with a token with admin scope only).
          type:
            - string
            - 'null'
    email_notification_settings:
      type: object
      properties:
        dropbox_invitation:
          description: >-
            An email notification setting; refer to email_notification_settings. Notify users who receive an invitation
            to send a package to a dropbox. Refer also to public_invites_allowed(_by_managers).
          type: boolean
          examples:
            - true
        file_shared:
          description: >-
            An email notification setting; refer to email_notification_settings. Notify users who are recipients of a
            shared file. Refer also to public_links_allowed(_by_managers).
          type: boolean
          examples:
            - true
        invitation_to_send_to_me:
          description: >-
            An email notification setting; refer to email_notification_settings. Notifiy users who receive an invitation
            to send a package to an individual (as opposed to sending to a dropbox; see dropbox_invitation). Refer also
            to external_package_sending_allowed(_by_managers).
          type: boolean
          examples:
            - true
        package_contents_deleted:
          description: >-
            An email notification setting; refer to email_notification_settings. Notify package recipients when a
            package is deleted (senders or administrators can delete packages).
          type: boolean
          examples:
            - true
        package_downloaded:
          description: >-
            An email notification setting; refer to email_notification_settings. Notify package sender when recipients
            have downloaded the package.
          type: boolean
          examples:
            - true
        package_expired:
          description: >-
            An email notification setting; refer to email_notification_settings. Notify package recipients when package
            contents are deleted according to configured package expiration policy (see also
            delete_package_content_after_download_duration and content_retention_duration).
          type: boolean
          examples:
            - true
        package_failed:
          description: >-
            An email notification setting; refer to email_notification_settings. Notify package sender when a package
            transfer has failed.
          type: boolean
          examples:
            - true
        package_recalled:
          description: >-
            An email notification setting; refer to email_notification_settings. Notify package recipients when a
            package has been recalled by the sender. When a package is recalled, the recipient cannot browse or download
            package contents until the sender resends the package.
          type: boolean
          examples:
            - true
        package_received:
          description: >-
            An email notification setting; refer to email_notification_settings. Notify package recipients when they
            have received a package and the package is available.
          type: boolean
          examples:
            - true
        package_resent:
          description: >-
            An email notification setting; refer to email_notification_settings. Notify package recipients when a
            recalled package has been resent. The package will be available to the recipient when the transfer
            completes; at that point the recipient receives the package_received notification.
          type: boolean
          examples:
            - true
        package_sent:
          description: >-
            An email notification setting; refer to email_notification_settings. Notify package sender that the package
            was successfully sent. The package will be available to the recipient when the transfer completes; at that
            point the recipient receives the package_received notification.
          type: boolean
          examples:
            - true
        package_uploaded:
          description: >-
            An email notification setting; refer to email_notification_settings. Notify package sender that the package
            was successfully uploaded to the transfer server.
          type: boolean
          examples:
            - true
    group_memberships_params:
      description: Member to add to a group.
      type: object
      properties:
        group_id:
          description: ID of the group to which the member is added.
          type: string
          examples:
            - '123'
        member_id:
          description: ID of the member (user ID or group ID, according to `member_type`).
          type: string
          examples:
            - '42'
        member_type:
          description: Kind of member.
          type: string
          examples:
            - user
          enum:
            - user
            - group
      required:
        - group_id
        - member_id
        - member_type
    group_memberships_response:
      description: Membership of a user or a group in a group.
      type: object
      properties:
        id:
          description: ID of this group membership.
          type: string
          examples:
            - '99458'
        group_id:
          description: ID of the group.
          type: string
          examples:
            - '123'
        member_id:
          description: ID of the member (user ID or group ID, according to `member_type`).
          type: string
          examples:
            - '42'
        member_type:
          description: Kind of member.
          type: string
          examples:
            - user
          enum:
            - user
            - group
        queued_operation_count:
          description: Number of queued operations of this membership (creation of home folders).
          type: integer
          examples:
            - 0
        running_operation_count:
          description: Number of running operations of this membership.
          type: integer
          examples:
            - 0
        stopped_operation_count:
          description: Number of stopped operations of this membership (e.g. folder conflict).
          type: integer
          examples:
            - 0
        member:
          description: >-
            Member (user or group), with `embed[]=member`. `null` if the member cannot be read with the token used.
          anyOf:
            - $ref: '#/components/schemas/users_response'
            - $ref: '#/components/schemas/groups_response'
            - enum:
                - null
        group:
          description: Group, with `embed[]=group`. `null` if the group cannot be read with the token used.
          anyOf:
            - $ref: '#/components/schemas/groups_response'
            - enum:
                - null
      required:
        - id
        - group_id
        - member_id
        - member_type
    group_permissions_params:
      description: Permission to give to a user or a group on a group.
      type: object
      properties:
        group_id:
          description: ID of the group.
          type: string
          examples:
            - '123'
        entity_id:
          description: ID of the user or group that gets the permission (according to `entity_type`).
          type: string
          examples:
            - '42'
        entity_type:
          description: Kind of entity that gets the permission.
          type: string
          examples:
            - user
          enum:
            - user
            - group
        level:
          description: '`owner` or `manager` of the group.'
          type: string
          examples:
            - manager
          enum:
            - owner
            - manager
      required:
        - group_id
        - entity_id
        - entity_type
        - level
    group_permissions_update_params:
      description: New level of a group permission.
      type: object
      properties:
        level:
          description: '`owner` or `manager` of the group.'
          type: string
          examples:
            - owner
          enum:
            - owner
            - manager
      required:
        - level
    group_permissions_response:
      description: Permission of a user or a group (owner or manager) on a group.
      type: object
      properties:
        id:
          description: ID of this group permission.
          type: string
          examples:
            - '30086'
        group_id:
          description: ID of the group.
          type: string
          examples:
            - '123'
        entity_id:
          description: ID of the user or group that has the permission (according to `entity_type`).
          type: string
          examples:
            - '42'
        entity_type:
          description: Kind of entity that has the permission.
          type: string
          examples:
            - user
          enum:
            - user
            - group
        level:
          description: '`owner` or `manager` of the group.'
          type: string
          examples:
            - manager
          enum:
            - owner
            - manager
        entity:
          description: >-
            User or group that has the permission, with `embed[]=entity`. `null` if it cannot be read with the token
            used, or if the group was deleted.
          anyOf:
            - $ref: '#/components/schemas/users_response'
            - $ref: '#/components/schemas/groups_response'
            - enum:
                - null
        group:
          description: Group, with `embed[]=group`. `null` if the group cannot be read with the token used.
          anyOf:
            - $ref: '#/components/schemas/groups_response'
            - enum:
                - null
      required:
        - id
        - group_id
        - entity_id
        - entity_type
        - level
    groups_params:
      description: Group to create.
      type: object
      properties:
        name:
          description: Name of the group (not necessarily unique).
          type: string
          examples:
            - Engineering
        description:
          description: Description of the group.
          type:
            - string
            - 'null'
          examples:
            - Members of the engineering team
        saml_group:
          description: >-
            Indicates whether the members of this group are given by the SAML identity provider (attribute
            `saml_group_dn`). Members of a SAML group cannot be added or removed with `/group_memberships`.
          type: boolean
          default: false
          examples:
            - false
        saml_group_dn:
          description: >-
            Distinguished name of the group in the SAML assertion. Required if `saml_group` is `true`, unique in the
            organization.
          type: string
          examples:
            - CN=Engineering,OU=Groups,DC=example,DC=com
      required:
        - name
    groups_update_params:
      description: Group attributes to modify.
      type: object
      properties:
        name:
          description: Name of the group.
          type: string
          examples:
            - Engineering
        description:
          description: Description of the group.
          type:
            - string
            - 'null'
          examples:
            - Members of the engineering team
        saml_group:
          description: Indicates whether the members of this group are given by the SAML identity provider.
          type: boolean
          examples:
            - false
        saml_group_dn:
          description: Distinguished name of the group in the SAML assertion. Required if `saml_group` is `true`.
          type: string
          examples:
            - CN=Engineering,OU=Groups,DC=example,DC=com
    groups_response:
      description: Group of users and groups.
      type: object
      properties:
        id:
          description: ID of this group.
          type: string
          examples:
            - '31204'
        name:
          description: Name of the group.
          type: string
          examples:
            - Engineering
        description:
          description: Description of the group.
          type:
            - string
            - 'null'
          examples:
            - Members of the engineering team
        created_at:
          description: Creation date.
          type: string
          format: date-time
          examples:
            - '2018-04-23T18:09:43.000Z'
        updated_at:
          description: Last update date.
          type: string
          format: date-time
          examples:
            - '2024-07-04T15:29:37.000Z'
        manager:
          description: Indicates whether the current user is a manager of this group.
          type: boolean
          examples:
            - false
        owner:
          description: Indicates whether the current user is an owner of this group.
          type: boolean
          examples:
            - false
        saml_group:
          description: Indicates whether the members of this group are given by the SAML identity provider.
          type: boolean
          examples:
            - false
        saml_group_dn:
          description: >-
            Distinguished name of the group in the SAML assertion, for a SAML group. Returned only with a token with admin
            scope.
          type:
            - string
            - 'null'
          examples:
            - null
        system_group:
          description: >-
            Indicates whether this group is created and managed by AoC (e.g. members of a workspace or of a shared
            inbox). A system group cannot be modified or deleted, and its members are not managed with
            `/group_memberships`.
          type: boolean
          examples:
            - false
        system_group_type:
          description: Kind of system group. Returned only for a system group.
          type: string
          enum:
            - activity_members_group
            - dropbox_members
            - dropbox_recipients
            - dropbox_senders
            - saml_users
            - workspace_all_sent_group
            - workspace_managers
            - workspace_members
            - workspace_node_owners
          examples:
            - workspace_members
        queued_operation_count:
          description: Number of queued operations of this group.
          type: integer
          examples:
            - 0
        running_operation_count:
          description: Number of running operations of this group.
          type: integer
          examples:
            - 0
        stopped_operation_count:
          description: Number of stopped operations of this group.
          type: integer
          examples:
            - 0
      required:
        - id
        - name
        - system_group
    metadata:
      description: >
        A metadata schema is used to present a form to a user when the user is submitting content to a dropbox. It is an
        array with "Field" objects, and each Field object defines one field that the user can fill out when submitting
        content to a dropbox. Note that the order of the fields in the metadata schema array will be the order in which
        they are shown to the user.
      type: array
      items:
        properties:
          choices:
            description: |
              The value(s) to be configured by the sender. Required for single-dropdown and multiple-checkbox.
            type: array
            items:
              type: string
            examples:
              - - Option1
                - Option2
          default_values:
            description: >
              Sets the singular default value for each input_type except multiple-checkbox. In the case of
              multiple-checkbox, a default value is set for each checkbox.
            type: array
            items:
              type: string
            examples:
              - - Option2
          illegal_characters:
            description: Defines all disallowed characters for string fields.
            type: string
            examples:
              - '!@#'
          input_type:
            description: The type of the field.
            type: string
            enum:
              - single-text
              - date
              - textbox
              - single-dropdown
              - multiple-checkbox
          max_length:
            description: |
              For string fields defines the maximum number of characters allowed.
            type: string
            examples:
              - '100'
          name:
            description: The label of the metadata field.
            type: string
          required:
            description: Denotes a field as required.
            type: boolean
            examples:
              - true
        required:
          - name
          - input_type
        type: object
      examples:
        - - choices:
              - opt1
              - opt2
              - opt3
            default_values:
              - opt2
            input_type: single-dropdown
            name: Field 1
    nodes_params:
      type: object
      properties:
        access_key:
          description: >
            Access keys are used for authorization when AoC makes a request via the Node API. Each transfer node must
            have a unique access key.
          type: string
          examples:
            - abc123
        ats_access_key:
          description: >
            Indicates that access_key is a key for an Aspera Transfer Service node. Defaults to false. Used on POST
            only.
          type: boolean
          examples:
            - false
        ats_storage_type:
          description: |
            For Aspera Transfer Service nodes, this field defines which type of storage is used.
          type: string
          examples:
            - aws_s3
          enum:
            - aws_s3
            - azure
            - azure-files
            - azure_sas
            - google-gcs
            - ibm-s3
            - softlayer_swift
        configuration_policy_id:
          description: |
            References the configuration policy to which a transfer node belongs.
          type: integer
          examples:
            - 42
        name:
          description: User-defined identifier for the transfer node. Each transfer node must have a unique name.
          type: string
          examples:
            - myNode
        network_policy_id:
          description: |
            References the network configuration policy to which a transfer node belongs.
          type: integer
          examples:
            - 7
        ssh_fingerprint:
          description: |
            If your node has SSH capabilities, used for verifying SSH connections.
          type: string
          examples:
            - SHA256:abcdefghijklmnopqrstuvwxyz1234567890ABCDE
        status:
          description: >
            If a transfer node has status "error" but the problem has been fixed, it will automatically recover to the
            "ok" state. Similarly, if a node has status "ok", it will switch to status "error" automatically if there is
            a problem. Nodes with status "down" remain in the "down" state until marked "ok" by a user.
          type: string
          examples:
            - error
          enum:
            - ok
            - error
            - down
        url:
          description: |
            Specifies the URL where the transfer node is located. Necessary for AoC to make requests via the Node API.
          type: string
          examples:
            - https://example.com
        use_ssl:
          description: Describes node secure socket layer usage. Defaults to true.
          type: boolean
          examples:
            - true
        verify_ssl_certificate:
          description: |
            Specifies whether or not node must verify SSL certificate. Defaults to true.
          type: boolean
          examples:
            - true
    nodes_response:
      type: object
      properties:
        access_key:
          description: >
            Access keys are used for authorization when AoC makes a request via the Node API. Each transfer node must
            have a unique access key.
          type: string
          examples:
            - abc123
        ats_access_key:
          description: >
            Indicates that access_key is a key for an Aspera Transfer Service node. Defaults to false. Used on POST
            only.
          type: boolean
          examples:
            - false
        ats_storage_type:
          description: |
            For Aspera Transfer Service nodes, this field defines which type of storage is used.
          type:
            - string
            - 'null'
          examples:
            - null
          enum:
            - aws_s3
            - azure
            - azure-files
            - azure_sas
            - google-gcs
            - ibm-s3
            - softlayer_swift
            - null
        capabilities:
          type: array
          items:
            properties:
              name:
                type: string
              value:
                type:
                  - string
                  - 'null'
                anyOf:
                  - type: boolean
                  - type: integer
                  - type: string
            type: object
        configuration_policy_id:
          description: |
            References the configuration policy to which a node belongs.
          type: integer
          examples:
            - 42
        error_message:
          description: |
            Short message describing the nature of the most recent transfer node error.
          type: string
          examples:
            - 502 Bad Gateway
        error_time:
          description: Datetime. Indicates time of most recent error.
          type: string
          examples:
            - 2019-06-04T04:41:00.000Z
        host:
          description: Host portion of node URL.
          type: string
          examples:
            - example.com
        name:
          description: User-defined identifier for the transfer node. Each transfer node must have a unique name.
          type: string
          examples:
            - myNode
        network_policy_id:
          description: |
            References the network configuration policy to which a transfer node belongs.
          type: integer
          examples:
            - 42
        path:
          description: Path portion of the transfer node URL.
          type: string
          examples:
            - /
        port:
          description: Port portion of the transfer node URL.
          type: integer
          examples:
            - 9092
        settings:
          type: array
          items:
            properties:
              name:
                type: string
              value:
                type:
                  - string
                  - 'null'
                anyOf:
                  - type: boolean
                  - type: integer
                  - type: string
            type: object
        ssh_fingerprint:
          description: |
            If your node has SSH capabilities, used for verifying SSH connections.
          type:
            - string
            - 'null'
          examples:
            - null
        status:
          description: >
            If a transfer node has status "error" but the problem has been fixed, it will automatically recover to the
            "ok" state. Similarly, if a node has status "ok", it will switch to status "error" automatically if there is
            a problem. Nodes with status "down" remain in the "down" state until marked "ok" by a user.
          type: string
          examples:
            - error
          enum:
            - ok
            - error
            - down
        url:
          description: |
            Specifies the URL where the transfer node is located. Necessary for AoC to make requests via the Node API.
          type: string
          examples:
            - https://example.com:9092/
        use_ssl:
          description: Describes node secure socket layer usage. Defaults to true.
          type: boolean
          examples:
            - true
        verify_ssl_certificate:
          description: |
            Specifies whether or not node must verify SSL certificate. Defaults to true.
          type: boolean
          examples:
            - true
    organizations_params:
      description: >-
        Settings of the organization to change. Other fields (reserved to IBM) give 422 `unpermitted_parameters`.
      type: object
      properties:
        name:
          description: Name of the organization (required, not empty).
          type: string
        subdomain_name:
          description: >-
            Subdomain of the organization, only while it has none (lower case, unique: else 409).
          type: string
        access_rules:
          description: >-
            Access rules: `policy`, `countries` (list of country codes) and `markdown_text`.
          type: object
        access_token_duration:
          description: Duration of an access token. In seconds, 900 (15 minutes) to 86400 (24 hours).
          type: integer
        access_token_refresh_duration:
          description: Duration of a refresh token. In seconds, 86400 (1 day) to 31536000 (365 days), or `null`.
          type:
            - integer
            - 'null'
        node_token_duration:
          description: >-
            Duration of a node token, not less than `access_token_duration`. In seconds, 3600 (1 hour) to 1209600 (14
            days).
          type: integer
        session_duration:
          description: >-
            Inactivity timeout of a session of the web app (`null`: none). In seconds, 900 (15 minutes) to 604800 (7
            days), or `null`.
          type:
            - integer
            - 'null'
        password_reset_token_duration:
          description: Duration of a link to reset a password (required). In seconds, 3600 (1 hour) to 604800 (7 days).
          type: integer
        new_user_password_reset_token_duration:
          description: >-
            Duration of the link of a new user to set the password (required). In seconds, 3600 (1 hour) to 604800 (7
            days).
          type: integer
        minimum_password_age:
          description: >-
            Time before a password can be changed again. In seconds, 900 (15 minutes) to 604800 (7 days), or `null`.
          type:
            - integer
            - 'null'
        password_expiration_interval:
          description: Time before a password expires. In seconds, 1296000 (15 days) to 31536000 (365 days), or `null`.
          type:
            - integer
            - 'null'
        minimum_password_length:
          description: Minimum length of a password, 8 to 100.
          type: integer
          minimum: 8
          maximum: 100
        require_strong_passwords:
          description: Whether passwords must be strong.
          type: boolean
        enforce_password_history_count:
          description: Number of previous passwords that cannot be used again, 1 to 12, or `null`.
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 12
        consecutive_login_failures_limit:
          description: Number of failed logins before the account is locked, 2 to 10.
          type: integer
          minimum: 2
          maximum: 10
        mfa_enabled:
          description: Whether multi-factor authentication is enabled.
          type: boolean
        local_oauth_enabled:
          description: >-
            Whether users can log in with a password of AoC (local auth provider). The check that a login method stays
            enabled reads the methods enabled before the change: a request that disables the last ones is accepted.
          type: boolean
        google_oauth_enabled:
          description: Whether users can log in with Google (Google auth provider).
          type: boolean
        local_included_domains:
          description: Email domains of the users who can log in with a password of AoC (empty for all).
          type: array
          items:
            type: string
        local_excluded_domains:
          description: >-
            Email domains of the users who cannot log in with a password of AoC (empty if `local_included_domains` is
            set).
          type: array
          items:
            type: string
        google_included_domains:
          description: Email domains of the users who can log in with Google (empty for all).
          type: array
          items:
            type: string
        google_excluded_domains:
          description: >-
            Email domains of the users who cannot log in with Google (empty if `google_included_domains` is set).
          type: array
          items:
            type: string
        local_login_button_text:
          description: Text of the button of the login with a password of AoC.
          type: string
        sign_on_message:
          description: Message on the login page.
          type: string
        force_ibm_id_opt_in:
          description: Whether all users must use IBMid. Can only be turned on (not with `prevent_ibm_id_opt_in`).
          type: boolean
        prevent_ibm_id_opt_in:
          description: Whether users cannot opt in to IBMid. Can only be turned off.
          type: boolean
        allow_admin_opt_in_only:
          description: Whether only administrators can opt in to IBMid. Can only be turned off.
          type: boolean
        saml_can_reactivate_deactivated_users:
          description: Whether a login with SAML reactivates a deactivated user.
          type: boolean
        users_can_reactivate_deactivated_users:
          description: Whether deactivated users can reactivate themselves.
          type: boolean
        user_deactivation_policy:
          description: >-
            Deactivation of inactive users: `user_timeout` (since the last login) and `pending_user_timeout` (never
            logged in), in seconds, 86400 (1 day) to 315569520 (10 years of 365.2425 days), or `null`. Only the keys
            given change. A change deactivates at once the users concerned (not the administrators).
          type: object
        connect_suppressed_scope:
          description: >-
            Users who use the HTTP Gateway instead of IBM Aspera Connect: all, unauthenticated users (public links),
            none, or those selected (`/connect_suppressed_permissions`).
          type: string
          enum:
            - user:all
            - user:unauthenticated
            - user:none
            - user:selected
        connect_beta_opt_in:
          description: Whether the organization uses the beta versions of IBM Aspera Connect.
          type: boolean
        http_gateway_enabled:
          description: Whether the HTTP Gateway is enabled.
          type: boolean
        http_gateway_server_url:
          description: URL of the HTTP Gateway.
          type: string
        default_ear_setting:
          description: Default of encryption at rest for the packages (also set in the Packages app).
          type: boolean
        workspace_container_node_id:
          description: ID of the default node of new workspaces (not checked).
          type: string
        organization_contacts_visible_to_managers:
          description: Whether workspace managers can see all the users of the organization in contacts.
          type: boolean
        email_footer:
          description: Footer of the emails.
          type: string
        invitation_message:
          description: Message of the invitation emails.
          type: string
        inherit_email_templates:
          description: >-
            Whether the organization uses the global email templates. Turned off, the templates of the organization are
            created from the global ones.
          type: boolean
        enable_external_email_templates:
          description: Whether the email templates for external users (`*_external`) are used.
          type: boolean
        email_notification_settings:
          $ref: '#/components/schemas/organization_email_notification_settings'
        event_reporting_uri:
          description: URL that receives the events of the organization.
          type: string
        event_reporting_headers:
          description: HTTP headers sent with the events (any object).
          type: object
        support_contact:
          description: Support contact shown to the users (any keys).
          type: object
        nps_enabled:
          description: Whether the satisfaction survey (NPS) is shown to the users.
          type: boolean
        custom_theme:
          description: Custom theme of the web app (any keys), or `null`. Only in a body not wrapped in `organization`.
          type:
            - object
            - 'null'
        logo_image_data:
          description: Logo of the organization, base64 (at most 512 KB decoded), with `logo_image_type`.
          type: string
          format: byte
        logo_image_type:
          description: Media type of the logo image.
          type: string
          examples:
            - image/png
        app_logo_image_data:
          description: Logo of the web app, base64 (at most 512 KB decoded), with `app_logo_image_type`.
          type: string
          format: byte
        app_logo_image_type:
          description: Media type of the logo of the web app.
          type: string
          examples:
            - image/png
        app_logo_text:
          description: Text next to the logo of the web app.
          type: string
        background_image_data:
          description: Background image of the login page, base64 (at most 4 MB decoded), with `background_image_type`.
          type: string
          format: byte
        background_image_type:
          description: Media type of the background image.
          type: string
          examples:
            - image/jpeg
        background_image_position:
          description: Position of the background image of the login page.
          type: string
        login_layout:
          description: Layout of the login page.
          type: string
        announcement1_title:
          description: Title of the first announcement of the login page.
          type: string
        announcement1_message:
          description: Message of the first announcement of the login page.
          type: string
        announcement2_title:
          description: Title of the second announcement of the login page.
          type: string
        announcement2_message:
          description: Message of the second announcement of the login page.
          type: string
    node_update_status_response:
      $ref: '#/components/schemas/nodes_response'
    organizations_response:
      type: object
      properties:
        access_token_duration:
          description: >
            How long an access token is valid. Units: seconds. Valid values: 3600 - 86400 (1 - 24 hours). Viewable by
            organization admin only.
          type: integer
          examples:
            - 3600
        access_token_refresh_duration:
          description: >
            The maximum amount of time that can pass in which an access token can be refreshed. Units: seconds. Valid
            values: 3600 - 1209600 (1 hour - 14 days), or null to disable access token refreshing. Viewable by
            organization admin only.
          type: integer
          examples:
            - 3600
        background_image_data:
          description: >
            Data for the image to be displayed on the organization sign-in page. The data must be binary and have a
            maximum size of 4MB. Returned only when image_data is included in the request (e.g.
            include%5B%5D=image_data).
          type: string
          examples:
            - iVBORw0KGgoAAAANSUhEUgAA...
        background_image_type:
          description: The file type of the background image.
          type: string
          examples:
            - image/gif
        background_image_url:
          description: The URL at which the background image is stored.
          type: string
          examples:
            - https://example.com/images/background.png
        consecutive_login_failures_limit:
          description: >
            The number of login failures allowed before the user is required to change passwords. Valid values: 2 - 10.
            Requires organization admin permission to view or update.
          type: integer
          examples:
            - 2
        created_at:
          description: |
            The time at which the organization was created. Viewable by organization admin only.
          type: string
          format: date-time
          examples:
            - 2019-06-20T17:23:50.000Z
        default_ear_setting:
          description: >
            Indicates the default encryption-at-rest setting for your organization. Defaults to false. Requires
            organization admin permission to view or update.
          type: boolean
          examples:
            - false
        default_local_login_button_text:
          description: |
            The default text that appears on the local login button. Viewable by organization admin only.
          type: string
          examples:
            - Log in
        email_footer:
          description: >
            Text to be added as the footer in email notifications sent for your organization. Must have organization
            admin permission to view or update.
          type: string
          examples:
            - Thank you for using Aspera on Cloud.
        email_notification_settings:
          description: Must have organization admin permission to view or update.
          allOf:
            - $ref: '#/components/schemas/organization_email_notification_settings'
        enable_external_email_templates:
          description: >
            Indicates whether the organization has external email templates enabled. Requires organization admin
            permission to view or update.
          type: boolean
          examples:
            - false
        enforce_password_history_count:
          description: >
            The number of password changes that must occur before a password can be reused. Valid values are 1 - 12, or
            null to disable. Requires organization admin permission to view or update.
          type: integer
          examples:
            - 3
        event_reporting_uri:
          description: >
            Customer-configurable endpoint that can receive reporting for AoC events. Requires organization admin
            permission to view or update.
          type: string
          examples:
            - https://example.com/aoc/events
        google_excluded_domains:
          description: >
            If Google OAuth is enabled, this parameter can be used to define a list of domains for email addresses that
            are not allowed to log into your  organization. This parameter is mutually exclusive with
            google_included_domains. Requires organization admin permission to view or update.
          type: array
          items:
            type: string
          examples:
            - - example.com
              - abc.io
        google_included_domains:
          description: >
            If Google OAuth is enabled, this parameter can be used to define a list of domains for email addresses that
            are allowed to log into your organization. This parameter is mutually exclusive with
            google_excluded_domains. Requires organization admin permission to view or update.
          type: array
          items:
            type: string
          examples:
            - []
        google_oauth_included:
          description: >
            Indicates whether users can be authenticated through Google OAuth for your organization. Requires
            organization admin permission to view or update.
          type: boolean
          examples:
            - false
        id:
          description: The ID of your organization. Read-only.
          type: string
          examples:
            - '4'
        inherit_email_templates:
          description: >
            Indicates whether this organization is using customized email templates. Requires organization admin
            permission to view or update.
          type: boolean
          examples:
            - true
        invitation_message:
          description: >-
            Text for the email notification that is sent to new users when they are invited to join your organization.
            Requires organization admin permission to view or update.
          type: string
          examples:
            - Welcome to MyOrganization. Please activate your account.
        local_excluded_domains:
          description: >
            If local OAuth is enabled, this parameter can be used to define a list of domains for email addresses that
            are not allowed to log into your organization. This parameter is mutually exclusive with
            local_included_domains. Requires organization admin permission to view or update.
          type: array
          items:
            type: string
          examples:
            - []
        local_included_domains:
          description: >
            If local OAuth is enabled, this parameter can be used to define a list of domains for email addresses that
            are allowed to log into your organization. This parameter is mutually exclusive with local_excluded_domains.
            Requires organization admin permission to view or update.
          type: array
          items:
            type: string
          examples:
            - - example.com
              - abc.io
        local_login_button_text:
          description: >
            Customized text that will appear on the local login button. Requires organization admin permission to view
            or update.
          type: string
          examples:
            - Log into MyOrganization!
        local_oauth_enabled:
          description: >
            Indicates whether users can be authenticated through local OAuth for your organization. Requires
            organization admin permission to view or update.
          type: boolean
          examples:
            - false
        logo_image_data:
          description: >
            Data for the image to be used as organization logo. The data must be binary and have a maximum size of
            512KB. This field is included only when the query string includes "include%5B%5D=image_data".
          type: string
          examples:
            - iVBORw0KGgoAAAANSUhEUgAA...
        logo_image_type:
          description: The data type of the provided logo image.
          type: string
          examples:
            - image/gif
        logo_image_url:
          description: The URL at which your logo image is stored. Read-only.
          type: string
          examples:
            - https://example.com/images/logo.png
        minimum_password_age:
          description: >
            Defines the minimum age for a password before it can be reset. Units: seconds. Valid values: 15 minutes to 1
            year (900 - 31536000), or null to disable. Requires organization admin permission to view or update.
          type: integer
          examples:
            - 900
        minimum_password_length:
          description: >
            The minimum length for passwords for users in your organization. Valid values: 8 - 100. Requires
            organization admin permission to view or update.
          type: integer
          examples:
            - 8
        name:
          description: The name of your organization.
          type: string
          examples:
            - MyOrganization
        new_user_password_reset_token_duration:
          description: >
            How long a password reset link is valid, when it is sent as part of an invitation to a new user. Units:
            seconds. Valid values: 1 hour - 1 week (3600 - 604800), or null to disable. Requires organization admin
            permission to view or update.
          type: integer
          examples:
            - 3600
        node_token_duration:
          description: >
            Denotes the amount of time that a transfer node access token is valid. Must be at least as long as
            access_token_duration. Units: seconds. Valid values: 1 hour - 14 days (3600 - 1209600). Requires
            organization admin permission to view or update.
          type: integer
          examples:
            - 3600
        oauth_token_verification_key:
          description: >
            RSA public key used to verify OAuth tokens for this org. Requires organization admin permission to view.
            Read-only.
          type: string
          examples:
            - |
              -----BEGIN PUBLIC KEY-----
              ...
              -----END PUBLIC KEY-----
        organization_contacts_visible_to_managers:
          description: >
            If true, workspace managers can see all organization contacts. Otherwise, workspace managers can see only
            the contacts for their workspace. Requires organization admin permission to view or update.
          type: boolean
          examples:
            - true
        password_expiration_interval:
          description: >
            How often a password change is required. Units: seconds. Valid values: 15 days to 1 year (129600 -
            31536000), or null to disable. Requires organization admin permission to view or update.
          type: integer
          examples:
            - 129600
        password_reset_token_duration:
          description: >
            How long the password reset link is valid. Units: seconds. Valid values: 1 hour - 1 week (3600 - 604800), or
            null to disable. Requires organization admin permission to view or update.
          type: integer
          examples:
            - 3600
        require_strong_passwords:
          description: >
            Indicates whether to require users to set "strong" passwords. A "strong" password contains at least three of
            the following: 1. A lowercase letter 2. An uppercase letter 3. A non-word  character (!, @, #, etc.) 4. A
            number. Requires organization admin permission to view or update.
          type: boolean
          examples:
            - false
        session_duration:
          description: >
            How long a user can be inactive before their session is terminated and their access token is invalidated.
            Units: seconds. Valid values: 1 hour - 1 week (3600 - 604800), or null to disable.
          type: integer
          examples:
            - 3600
        sign_on_message:
          description: Message displayed to users on sign-in.
          type: string
          examples:
            - Welcome to MyOrganization!
        subdomain_name:
          description: The subdomain name for your organization. Read-only.
          type: string
          examples:
            - ibm
        tier:
          description: >
            The tier of your organization's Aspera on Cloud subscription. Can be any of "paygo", "standard", "advanced",
            or "enterprise". Read-only.
          type: string
          examples:
            - standard
        trial_expires_at:
          description: >
            For organizations on trial subscriptions, this denotes the time at which their subscription ends. Is null in
            all other cases. Read-only.
          type: string
          format: date-time
          examples:
            - 2025-12-31T23:59:59.000Z
        url_id:
          description: The URL ID for your organization. Read-only.
          type: string
          examples:
            - abc123
        workspace_container_node_id:
          description: >
            When creating a workspace, node_id is required, but the client app can choose to use this value as a
            default. This is set automatically to the first transfer node created in your organization. Requires
            organization admin permission to view or update.
          type: string
          examples:
            - '2'
    packages_params:
      type: object
      properties:
        archived:
          description: Whether or not this package has been archived by the user.
          type: boolean
          examples:
            - false
        bcc_recipients:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/senders_recipients_object'
        content_retention_duration:
          description: >-
            When a time-based content expiration value is set for this package, the duration to retain packages
            contents. When this duration passes, the packages contents are deleted. Valid values are null to 10 years.
            Units are seconds.
          type: integer
          examples:
            - 2592000
        delete_package_content_after_download_duration:
          description: >-
            If 'delete_after_download' is set to 'true', this parameter configures an optional 'grace period', during
            which the package contents will be retained even after all recipients have downloaded the package. The timer
            for this setting begins when all recipients have downloaded the package; when the timer expires, the package
            contents are deleted. Valid values are null - 10 years.  Units are seconds.
          type: integer
          examples:
            - 604800
        download_notification_recipients:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/senders_recipients_object'
        draft:
          description: Whether or not the package is in draft status.
          type: boolean
          examples:
            - true
        encryption_at_rest:
          description: >-
            Whether or not the package has encryption_at_rest applied. For transfers that use the Aspera Connect
            transfer client, note this requirement to enable Connect to decrypt package contents. When a package is
            uploaded with encryption-at-rest set to true, the parameter single-source must also be true.
          type: boolean
          examples:
            - false
        file_names:
          description: >-
            The names of the items to include in this package; multiple names separated by commas. Maximum characters:
            65535
          type: string
          examples:
            - file.txt, file2.txt
        metadata:
          description: 'JSON object. Maximum characters: 65535'
          type: object
          examples:
            - project: migration
              priority: high
        name:
          description: Package name. Required for POST. Optional for PUT.
          type: string
          examples:
            - Name of Package
        note:
          description: 'The sender''s message to recipients to include with the package. Maximum characters: 65535.'
          type: string
          examples:
            - Please review and process asap.
        read:
          description: Whether or not the package was read.
          type: boolean
          examples:
            - false
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/senders_recipients_object'
        sent:
          description: Whether or not the package was sent.
          type: boolean
          examples:
            - false
        single_source:
          description: >-
            Whether or not all the contents of this package originate from the same location (node, workstation, etc.).
            When the package recipient downloads a package with Encryption at Rest (EAR) applied by the sender, and all
            package contents are from the same source (single-source=true; for example, the sender's desktop; a specific
            remote server), AoC signals Aspera Connect to prompt the recipient to apply the passphrase created by the
            sender and decrypt package contents during the download operation. When package contents are from disparate
            sources, the recipient applies the password to individual files in the downloaded package when opening each
            file.
          type: boolean
          examples:
            - false
        transfers_expected:
          description: >-
            The number of transfer sessions expected to bring all package contents to the node supporting the workspace
            in which the package is sent. The number corresponds to the number of discrete source locations of the
            designated package contents. For example, if the package includes 20 files and folders from 5 discrete
            sources, the number of transfers expected is 5.
          type: integer
          examples:
            - 3
        upload_notification_recipients:
          type: array
          items:
            $ref: '#/components/schemas/senders_recipients_object'
        workspace_id:
          description: The ID of the workspace from which this package was sent. Required for POST. Optional for PUT.
          type: integer
          examples:
            - 65
      required:
        - name
        - workspace_id
    packages_response:
      type: object
      properties:
        active_download_count:
          description: The number of active downloads.
          type: integer
          examples:
            - 12
        archived:
          description: Whether or not this package has been archived by the user. If user_package only.
          type: boolean
          examples:
            - false
        average_rate:
          description: Float. User Packages.
          type: number
          examples:
            - 871.096
        bcc:
          description: Whether or not there is a BCC list. If user_package only.
          type: boolean
          examples:
            - true
        bcc_recipients:
          type: array
          items:
            $ref: '#/components/schemas/senders_recipients_object'
        bytes_transferred:
          description: How many bytes have been transferred.
          type: integer
          examples:
            - 546
        complete:
          description: >-
            Whether or not the package is fully available on the transfer node; when the package is complete, all
            transfers of the designated files and folders into the package have been successful and all designated files
            and folders are present on the node.
          type: boolean
          examples:
            - false
        completed_at:
          description: The timestamp that indicates when the package is complete. Refer to 'complete'.
          type: string
          format: date-time
          examples:
            - 2018-02-06T00:05:25.000Z
        content_expires_at:
          description: >-
            The time at which package content will expire according to configured expiration policies. Refer to
            'content_retention_duration' and to the related parameters 'delete_after_download' and
            'delete_package_content_after_download_duration'.
          type: string
          format: date-time
          examples:
            - 2018-02-06T00:03:24.000Z
        content_retention_duration:
          description: >-
            When a time-based content expiration value is set for this package, the duration to retain packages
            contents. When this duration passes, the packages contents are deleted. Valid values are null - 10 years.
            Units are seconds.
          type:
            - integer
            - 'null'
          examples:
            - null
        contents_file_id:
          description: The file ID on the node that contains package contents.
          type: string
          examples:
            - '479283475'
        created_at:
          description: The timestamp for when this package was created.
          type: string
          format: date-time
          examples:
            - 2018-02-06T00:03:24.000Z
        delete_after_download:
          description: >-
            Whether or not an expiration policy applies to this package, indicating that package contents will expire
            (be deleted) after all recipients have downloaded the package.
          type: boolean
          examples:
            - false
        delete_package_content_after_download_duration:
          description: >-
            If 'delete_after_download' is set to 'true', this parameter configures an optional 'grace period', during
            which the package contents will be retained even after all recipients have downloaded the package. The timer
            for this setting begins when all recipients have downloaded the package; when the timer expires, the package
            contents are deleted. Valid values are null - 10 years. Units are seconds.
          type:
            - integer
            - 'null'
          examples:
            - null
        deleted:
          description: >-
            Whether or not package contents have been deleted, either by the sender, by an administrator, or by
            configured expiration policies.
          type: boolean
          examples:
            - false
        deleted_after_download:
          description: Whether or not package contents were deleted by a download-based expiration policy.
          type: boolean
          examples:
            - false
        deleted_at:
          description: The timestamp for the deletion of package contents.
          type: string
          format: date-time
          examples:
            - 2018-02-06T00:03:24.000Z
        deleted_by_admin:
          description: Whether or not the deleted package was deleted by an administrator.
          type: boolean
          examples:
            - false
        deleted_by_user_id:
          description: The ID of the user who deleted the package.
          type: integer
          examples:
            - 151
        download_notification_recipients:
          $ref: '#/components/schemas/senders_recipients_object'
        draft:
          description: Whether or not the package is in draft status.
          type: boolean
          examples:
            - true
        draft_expires_at:
          description: The time the draft expired/expires.
          type: string
          format: date-time
          examples:
            - 2018-02-06T00:03:24.000Z
        encryption_at_rest:
          description: Whether or not the package has encryption_at_rest applied.
          type: boolean
          examples:
            - false
        expiration_reason:
          description: >-
            The reason for expiration. Package can be deleted by an administrator or by the sender, or can be deleted as
            a result of a configured time-based or download-based expiration policy.
          type: string
          examples:
            - contents_expired
        expired:
          description: Whether or not the package contents are expired due to a configured expiration policy.
          type: boolean
          examples:
            - false
        expired_at:
          description: The time the package expired/expires.
          type: string
          format: date-time
          examples:
            - 2018-02-06T00:03:24.000Z
        failed:
          description: Whether or not the transfer of this package failed.
          type: boolean
          examples:
            - false
        failed_download_count:
          description: >-
            The number of failed downloads of this package; download attempts may be full (the entire package) or
            partial (some contents of the package).
          type: integer
          examples:
            - 0
        file_count:
          description: >-
            The number of files included in this package. This counts individual files included in the package, not
            files that are contents of folders that are included in the package.
          type: integer
          examples:
            - 21
        file_count_from_disk:
          description: Whether or not the file_count value was obtained from the storage.
          type: boolean
          examples:
            - false
        file_id:
          description: The ID for the file comprising all package contents.
          type: string
          examples:
            - '7'
        files_completed:
          description: The number of files that have completed transferring.
          type: integer
          examples:
            - 46
        files_expected:
          description: Number (obtained directly from the node) of files expected to be transferred as part of the package.
          type: integer
          examples:
            - 54
        folder_count:
          description: >-
            The number of folders actually included in this package per the transfer session. This counts individual
            folder included in the package, not folders that are nested within other folders that are included in the
            package. This value may or may not match the value for folders_expected.
          type: integer
          examples:
            - 5
        folders_completed:
          description: Number (obtained directly from the node) of folders successfully transferred as part of the package.
          type: integer
          examples:
            - 7
        folders_expected:
          description: Number (obtained directly from the node) of folders expected to be transferred as part of the package.
          type: integer
          examples:
            - 8
        full_download_count:
          description: >-
            The number of full downloads completed for this package. This counts the times that recipients have
            downloaded the package as a whole, rather than partial downloads, when a recipient downloads individual
            files or folders of a package.
          type: integer
          examples:
            - 4
        has_content:
          description: >-
            Whether or not the package has contents. If content has been deleted, either by the user, by an
            administrator, or as the result of configured package expiration policies, the package record remains
            accessible, but the package content has been deleted from the transfer server and cannot be recovered.
          type: boolean
          examples:
            - false
        id:
          description: The ID for the package.
          type: string
          examples:
            - '87234'
        metadata:
          $ref: '#/components/schemas/metadata'
        name:
          description: Package name.
          type: string
          examples:
            - test package
        node_id:
          description: The ID of the node that contains the package.
          type: integer
          examples:
            - 21
        note:
          description: 'The sender''s message to recipients to include with the package. Maximum characters: 65535.'
          type: string
          examples:
            - Please download and process asap. Thanks.
        package_sent:
          example: 7
        read:
          description: Whether or not the package was read. If user_package only.
          type: boolean
          examples:
            - false
        recalled_at:
          description: When the package was recalled.
          type: string
          format: date-time
          examples:
            - 2018-02-06T00:03:24.000Z
        received:
          description: Whether or not the package was received. If user_package only.
          type: boolean
          examples:
            - true
        recipients:
          description: If not user_package only.
          allOf:
            - $ref: '#/components/schemas/senders_recipients_object'
        sender:
          $ref: '#/components/schemas/senders_recipients_object'
        sent:
          description: Whether or not the package was sent.
          type: boolean
          examples:
            - true
        sent_at:
          description: The timestamp for when the package was sent.
          type: string
          format: date-time
          examples:
            - 2018-02-06T00:03:24.000Z
        single_source:
          description: >-
            Whether or not all the contents of this package originate from the same location (node, workstation, etc.).
            When the package recipient downloads a package with Encryption at Rest (EAR) applied by the sender or by
            workspace configuration, and all package contents are from the same source (for example, the sender's
            desktop; a specific remote server), AoC signals Aspera Connect to prompt the recipient to apply the
            passphrase created by the sender and decrypt package contents during the download operation. When package
            contents are from disparate sources, previous behavior applies: the recipient applies the password to
            individual files in the downloaded package when opening each file.
          type: boolean
          examples:
            - false
        size:
          description: The cumulative size of all the files and folders in the package.
          type: integer
          examples:
            - 345543
        time_remaining:
          description: The time remaining to complete an in-progress transfer. Float.
          type: number
          examples:
            - 1.3
        transfers_expected:
          description: >-
            The number of transfer sessions expected to bring all package contents to the node supporting the workspace
            in which the package is sent. The number corresponds to the number of discrete source locations of the
            designated package contents. For example, if the package includes 20 files and folders from 5 discrete
            sources, the number of transfers expected is 5.
          type: integer
          examples:
            - 7
        updated_at:
          description: When the package was updated.
          type: string
          format: date-time
          examples:
            - 2018-02-06T00:03:24.000Z
        upload_notification_recipients:
          $ref: '#/components/schemas/senders_recipients_object'
        upload_started:
          description: Whether or not the upload of the package has started.
          type: boolean
          examples:
            - false
        upload_started_at:
          description: The timestamp for when the package upload began.
          type: string
          format: date-time
          examples:
            - 2018-02-06T00:03:24.000Z
        workspace_id:
          description: The ID of the workspace from which this package was sent.
          type: integer
          examples:
            - 64792
    senders_recipients_object:
      type: object
      properties:
        id:
          description: The ID of the recipient.
          type: string
        type:
          description: The entity type of the recipient.
          type: string
          enum:
            - user
            - group
      required:
        - id
    client_settings_response:
      type: object
      description: A key-value configuration setting scoped to the current OAuth client and user.
      properties:
        id:
          type: string
          description: Setting name (key).
        value:
          type: string
          description: Setting value.
        created_at:
          type: string
          format: date-time
          description: Time at which the setting was created.
        updated_at:
          type: string
          format: date-time
          description: Time at which the setting was last updated.
    feature_flags_response:
      type: object
      description: A feature flag controlling availability of an optional or experimental feature.
      properties:
        id:
          type: string
          description: Unique identifier of the feature flag.
        name:
          type: string
          description: Internal name of the feature flag.
        enabled:
          type: boolean
          description: Whether the feature is currently enabled.
        organization_id:
          type: string
          description: ID of the organization this flag applies to.
        created_at:
          type: string
          format: date-time
          description: Time at which the flag was created.
        updated_at:
          type: string
          format: date-time
          description: Time at which the flag was last updated.
    operations_response:
      type: object
      description: >
        An asynchronous operation tracking a long-running task such as a workspace membership creation
        or group membership change.
      properties:
        id:
          type: string
          description: Unique identifier of the operation.
        status:
          type: string
          description: Current status of the operation (e.g. `success`, `pending`, `failed`).
          example: success
        type:
          type: string
          description: >
            Type of the operation, expressed as `resource.action`
            (e.g. `workspace_membership.create`, `group_membership.create`).
          example: workspace_membership.create
        user_id:
          type: string
          description: ID of the user who initiated the operation.
        workspace_membership_id:
          type: string
          description: ID of the workspace membership affected by the operation, if applicable.
        group_membership_id:
          type: string
          description: ID of the group membership affected by the operation, if applicable.
        created_at:
          type: string
          format: date-time
          description: Time at which the operation was created.
        updated_at:
          type: string
          format: date-time
          description: Time at which the operation status was last updated.
    short_links_response:
      type: object
      description: A short link that maps a compact URL to a token-based redirection.
      properties:
        id:
          type: string
          description: Unique identifier of the short link.
        short_url:
          type: string
          description: The full short URL (e.g. `https://aspera.pub/MbgH-vg`).
          example: https://aspera.pub/MbgH-vg
        short_url_path:
          type: string
          description: The path segment of the short URL (e.g. `MbgH-vg`).
          example: MbgH-vg
        purpose:
          type: string
          description: Purpose of the short link (e.g. `token_auth_redirection`).
          example: token_auth_redirection
        resource_id:
          type: string
          description: Identifier of the associated resource (e.g. a URL token value).
        resource_type:
          type: string
          description: Type of the associated resource (e.g. `UrlToken`).
        token_value:
          type: string
          description: The URL token value embedded in this short link.
        password_enabled:
          type: boolean
          description: Whether a password is required to follow the short link.
        password_protected:
          type: boolean
          description: Whether the short link is currently password-protected.
        expired:
          type: boolean
          description: Whether the short link has expired.
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Expiry date-time, or null if the link does not expire.
        data:
          $ref: '#/components/schemas/short_link_data'
        updated_by_user_id:
          type: string
          description: ID of the user who last updated the short link.
        created_at:
          type: string
          format: date-time
          description: Time at which the short link was created.
        updated_at:
          type: string
          format: date-time
          description: Time at which the short link was last updated.
    short_link_purpose:
      type: string
      description: >-
        Purpose of a short link: `token_auth_redirection` for a public link (URL token, shared folder or shared inbox),
        `shared_folder_auth_link` for a private link (authentication required, shared folder only)
      enum:
        - token_auth_redirection
        - shared_folder_auth_link
    short_link_url_token_data:
      type: object
      description: URL token of a public short link
      properties:
        data:
          type: object
          description: >-
            Shared resource: shared inbox (`dropbox_id`, `name`) or shared folder (`node_id`, `file_id`), and `workspace_id`
          properties:
            workspace_id:
              type: string
              description: Workspace of the shared resource
            dropbox_id:
              type: string
              description: Shared inbox (token purpose `send_package_to_dropbox`)
            name:
              type: string
              description: Empty string for a shared inbox
            node_id:
              type: string
              description: Node of the shared folder (token purpose `view_shared_file`)
            file_id:
              type: string
              description: File identifier of the shared folder on the node
          additionalProperties: true
        purpose:
          type: string
          description: Purpose of the URL token, depends on the shared resource
          enum:
            - send_package_to_dropbox
            - view_shared_file
        password:
          type: string
          description: Password to follow the link (write only, with `password_enabled`)
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Expiry date-time of the URL token
    short_link_data:
      type: object
      description: >-
        Public link (purpose `token_auth_redirection`): `aoc` and `url_token_data`.
        Private link (purpose `shared_folder_auth_link`): the shared folder (`node_id`, `file_id`, `workspace_id`)
      properties:
        aoc:
          type: boolean
          description: Link to an Aspera on Cloud resource (public link)
        url_token_data:
          $ref: '#/components/schemas/short_link_url_token_data'
      additionalProperties: true
    short_link_create_params:
      type: object
      description: Short link creation
      required:
        - purpose
        - data
      properties:
        purpose:
          $ref: '#/components/schemas/short_link_purpose'
        data:
          $ref: '#/components/schemas/short_link_data'
        password_enabled:
          type: boolean
          description: Password required to follow the link (password in `data.url_token_data.password`)
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Expiry date-time, or null if the link does not expire
        user_selected_name:
          type:
            - string
            - 'null'
          description: Name of the link chosen by the user
    short_link_update_params:
      type: object
      description: >-
        Short link modification. Shared inbox link: `data.url_token_data.data` is `{"dropbox_id":..}`.
        Shared folder link: also `edit_access` and `json_query`
      properties:
        password_enabled:
          type: boolean
          description: Password required to follow the link (password in `data.url_token_data.password`)
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Expiry date-time, or null if the link does not expire
        data:
          $ref: '#/components/schemas/short_link_data'
        edit_access:
          type: boolean
          description: Check edit access on the shared folder given in `json_query` (shared folder links only)
        json_query:
          type: object
          description: Shared folder of the link (`node_id`, `file_id`), with `edit_access`
          additionalProperties: true
    transfer_report_response:
      type: object
      description: >
        A communication matrix describing transfer routing between nodes in the organization.
        Keys are node IDs; each value is a map of target node IDs to routing information.
      additionalProperties:
        type: object
        additionalProperties:
          type: object
          properties:
            allowed:
              type: boolean
              description: Whether transfers between these two nodes are permitted.
            preferred_node:
              type: integer
              description: ID of the preferred initiating node for transfers between the two nodes.
            prefered_node:
              type: integer
              description: Deprecated alias for `preferred_node`.
              deprecated: true
    transfers_response:
      type: object
      description: A file transfer record.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the transfer.
        status:
          type: string
          description: Current status of the transfer (e.g. `running`, `completed`, `failed`).
          example: failed
        bytes_expected:
          type: integer
          format: int64
          description: Total bytes expected to be transferred.
        bytes_transferred:
          type: integer
          format: int64
          description: Bytes transferred so far.
        created_at:
          type: string
          format: date-time
          description: Time at which the transfer was initiated.
        transfer_spec:
          type: object
          description: The transfer specification used for this transfer.
          additionalProperties: true

    tier_restrictions_response:
      type: object
      description: Feature availability flags for the organization's subscription tier.
      properties:
        dropbox_creation:
          type: boolean
          description: Whether shared inboxes (dropboxes) can be created.
        dropbox_package:
          type: boolean
          description: Whether packages can be sent to shared inboxes.
        email_template_creation:
          type: boolean
          description: Whether custom email notification templates can be created.
        file_deletion_policy_creation:
          type: boolean
          description: Whether file deletion policies can be configured.
        geo_fencing:
          type: boolean
          description: Whether geographic access restrictions (geo-fencing) are available.
        http_gateway_enabled:
          type: boolean
          description: Whether HTTP gateway transfers are enabled.
        preview_maker:
          type: boolean
          description: Whether file preview generation is available.
        saml_configuration_creation:
          type: boolean
          description: Whether SAML authentication providers can be configured.
        saml_login:
          type: boolean
          description: Whether SAML-based login is enabled.
        tethered_node_creation:
          type: boolean
          description: Whether tethered (sub-organization) nodes can be created.
        trend_antivirus_enabled:
          type: boolean
          description: Whether Trend Micro antivirus scanning is enabled.
        user_limit:
          type:
            - integer
            - 'null'
          description: Maximum number of users allowed. Null means unlimited.
        watermarking_enabled:
          type: boolean
          description: Whether watermarking of transferred files is available.
        workspace_creation:
          type: boolean
          description: Whether new workspaces can be created.
    usage_reports_response:
      type: object
      properties:
        node_id:
          description: The ID of the transfer node for which this usage report was generated.
          type: string
          examples:
            - '1'
        reporting_period_bytes:
          description: |
            The total number of bytes transferred during this reporting period.
          type: integer
          examples:
            - 1024
        reporting_period_bytes_in:
          description: |
            The total number of bytes received during this reporting period.
          type: integer
          examples:
            - 512
        reporting_period_bytes_out:
          description: The total number of bytes sent during this reporting period.
          type: integer
          examples:
            - 512
        total_bytes:
          description: |
            The total number of bytes transferred since the transfer node started collecting usage information.
          type: integer
          examples:
            - 2048
        total_bytes_in:
          description: |
            The total number bytes received since the transfer node started collecting usage information.
          type: integer
          examples:
            - 1024
        total_bytes_out:
          description: |
            The total number of bytes sent since the transfer node started collecting usage information.
          type: integer
          examples:
            - 1024
        updated_at:
          description: The date at which this usage report was last updated.
          type: string
          format: date-time
          examples:
            - 2019-06-18T21:46:36.000Z
        workspace_id:
          description: |
            The ID of the workspace for which this usage report was generated.
          type: string
          examples:
            - '2'
    users_params:
      type: object
      properties:
        avatar_image_data:
          description: PUT User, Manager, Admin for self.
          type: string
        avatar_image_type:
          description: The image type of the avatar image data. PUT User, Manager, Admin for self.
