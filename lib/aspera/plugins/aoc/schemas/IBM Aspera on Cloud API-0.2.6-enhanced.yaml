          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Dropboxes
  /group_memberships:
    get:
      operationId: get_group_memberships
      summary: Get a Listing of Group Members
      description: >
        Get a listing of group memberships. A group membership makes a user or a group (`member_type`, `member_id`) a
        member of a group (`group_id`).

        Requires a token with admin scope, for an organization administrator or a workspace manager. An organization
        administrator gets the memberships of the organization. A workspace manager gets the memberships of the members
        (direct or through a group) of the workspaces and groups they manage. With `workspace_id`, only the memberships
        of the members of that workspace are listed.

        Parameter `inherited` (sent by the web UI) has no effect: only direct memberships are listed.
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: sort
          in: query
          description: >-
            Comma-separated list of fields (at most 5), prefixed with `-` for descending order. Fields: `created_at`,
            `updated_at`, `group_id`, `member_id`, `member_type`, `member.name` (or `name`), `member.email`,
            `member.first_name`, `member.last_name`, `member.last_login_at`, `member.system_group`, `deactivated`,
            `group.system_group`. An unknown field is refused (`unknown_sort_field`).
          schema:
            type: string
          example: member.name
        - name: q
          in: query
          description: >-
            Search (case-insensitive substring) in member (user or group) fields `email`, `first_name`, `last_name`, and
            `name`. A token `<field>:<value>`, with `<field>` one of the filter parameters, keeps memberships whose field
            starts with `<value>` (for a date, a comparison, e.g. `created_at:>2024-01-01`).
          schema:
            type: string
          example: member.last_name:smi
        - name: group_id
          in: query
          description: Filter by group ID.
          schema:
            type: string
        - name: member_id
          in: query
          description: Filter by member ID (user or group ID, according to `member_type`).
          schema:
            type: string
        - name: member_type
          in: query
          description: Filter by member type.
          schema:
            type: string
            enum:
              - user
              - group
        - name: member.email
          in: query
          description: Filter by member (user) email address.
          schema:
            type: string
        - name: member.first_name
          in: query
          description: Filter by member (user) first name.
          schema:
            type: string
        - name: member.last_name
          in: query
          description: Filter by member (user) last name.
          schema:
            type: string
        - name: member.last_login_at
          in: query
          description: Filter by member (user) last login date (exact match).
          schema:
            type: string
            format: date-time
        - name: member.system_group
          in: query
          description: Filter memberships whose member is a group, by its `system_group` attribute.
          schema:
            type: boolean
        - name: deactivated
          in: query
          description: Filter memberships whose member is a user, by its `deactivated` attribute.
          schema:
            type: boolean
        - name: group.system_group
          in: query
          description: Filter by the `system_group` attribute of the group (e.g. `false` for groups created by users).
          schema:
            type: boolean
        - name: system_group
          in: query
          deprecated: true
          description: Same as `group.system_group`.
          schema:
            type: boolean
        - name: created_at
          in: query
          description: Filter by creation date (exact match).
          schema:
            type: string
            format: date-time
        - name: updated_at
          in: query
          description: Filter by last update date (exact match).
          schema:
            type: string
            format: date-time
        - name: workspace_id
          in: query
          description: List only the memberships of the members (direct or through a group) of this workspace.
          schema:
            type: string
        - name: embed[]
          in: query
          description: >-
            embed[]=member (user or group object from member_id), embed[]=group (group object from group_id). Repeat the
            parameter for several values.
          schema:
            type: string
            enum:
              - member
              - group
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of memberships matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/group_memberships_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Group Memberships
    post:
      operationId: add_group_membership
      summary: Add a Member to a Group
      description: >
        Add a user or a group as a member of a group. Requires a token with admin scope, for an organization
        administrator, or an owner or a manager of the group.

        Members cannot be added to a system group or to a SAML group, and a system group cannot be a member. A group
        cannot be a member of itself, directly or indirectly.

        The membership is created, and the response is `202`: an operation then creates the home folders of the users
        that become members of workspaces through the group. Header `Location` gives the operation, also listed by
        `/operations?group_membership_id=<id>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/group_memberships_params'
      responses:
        '202':
          description: Accepted (membership created, home folders are being created by an operation)
          headers:
            Location:
              description: Path of the operation, `/api/v1/group_memberships/{id}/operations/{operation_id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/group_memberships_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, system group or SAML group)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '409':
          description: Conflict (the member is already a member of this group)
        '422':
          description: Unprocessable Entity (e.g. group or member not found, no permission on the group, cycle of groups)
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
