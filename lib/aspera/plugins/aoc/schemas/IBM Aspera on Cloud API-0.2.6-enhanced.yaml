  /network_policies:
    get:
      operationId: get_network_policies
      summary: Get a Listing of Network Policies
      description: >-
        Get a listing of the network policies of the organization: which node initiates a transfer between two nodes,
        and which nodes a node can transfer with. A node uses a policy with its field `network_policy_id`. The rules are
        not in the listing (see `GET /network_policies/{id}`). Requires a token with admin scope, for an organization
        administrator.
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: sort
          in: query
          description: >-
            Comma-separated list of fields (at most 5), prefixed with `-` for descending order. Fields: `name`,
            `created_at`. An unknown field is refused (`unknown_sort_field`).
          schema:
            type: string
        - name: q
          in: query
          description: Search (case-insensitive substring) in `name`.
          schema:
            type: string
        - name: name
          in: query
          description: Filter by name (exact).
          schema:
            type: string
        - name: created_at
          in: query
          description: Filter by created at (exact date and time).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of policies matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/network_policy_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token without admin scope, user not organization administrator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Network Policies
    post:
      operationId: create_network_policy
      summary: Create a Network Policy
      description: >-
        Create a network policy, without rules. Requires a token with admin scope, for an organization administrator.
