  /url_tokens:
    get:
      operationId: get_url_tokens
      summary: Get a Listing of URL Tokens
      description: >
        Get a listing of URL tokens. A URL token gives access to a resource without an account, through a link: send a
        package to a user or a shared inbox, view a shared folder or a received package (`purpose`). Its `value` gives
        an access token (`grant_type=url_token`). Short links (`/short_links`) refer to URL tokens.

        - With a token with user scope: the URL tokens that the user created.

        - With a token with admin scope: all URL tokens of the organization for an organization administrator, those of
          the workspaces they manage (`data.workspace_id`) for a workspace manager, only when the workspace ID is stored
          as a number (in practice `view_received_package`: the others store it as a string, and are not listed).
          `creator_id` keeps those that a user created.

        - With the access token of a URL token: only this URL token.

        Parameter `q` is not supported (500).
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: sort
          in: query
          description: >-
            Comma-separated list of fields (at most 5), prefixed with `-` for descending order. Fields: `created_at`,
            `purpose`, `updated_at`. An unknown field is refused (`unknown_sort_field`).
          schema:
            type: string
          example: -created_at
        - name: purpose
          in: query
          description: Filter by purpose.
          schema:
            $ref: '#/components/schemas/url_token_purpose'
        - name: created_at
          in: query
          description: Filter by creation date and time (exact value).
          schema:
            type: string
            format: date-time
        - name: updated_at
          in: query
          description: Filter by date and time of last change (exact value).
          schema:
            type: string
            format: date-time
        - name: creator_id
          in: query
          description: With admin scope, ID of the user who created the URL tokens (404 if no such user).
          schema:
            type: string
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of URL tokens matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/url_tokens_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found (no such user for `creator_id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: Unprocessable Entity (e.g. unknown sort field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - URL Tokens
  /url_tokens/{id}:
    get:
      operationId: get_url_token
      summary: Get a URL Token
      description: Get a URL token, among those that the list gives with the same token.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the URL token.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/url_tokens_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
