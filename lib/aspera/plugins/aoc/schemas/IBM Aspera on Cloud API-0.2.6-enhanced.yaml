components:
  schemas:
    UnauthorizedError:
      type: object
      properties:
        code:
          type: string
          description: Error code
          example: unauthorized
        message:
          type: string
          description: Error message
          example: You are not authorized to perform the requested action
      required:
        - code
        - message
    OAuth2TokenError:
      type: object
      description: |
        OAuth 2.0 error response returned by token endpoint as defined in RFC 6749 section 5.2.
        This error format is used for all OAuth 2.0 token-related errors including authorization code exchange,
        refresh token usage, and URL token authentication.
      properties:
        error:
          type: string
          description: OAuth 2.0 error code indicating the type of error
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - access_denied
          example: invalid_grant
        error_description:
          type: string
          description: Human-readable error description providing additional context about the error
          example: invalid URL token
        state:
          type:
            - string
            - 'null'
          description: >-
            State parameter from the authorization request, if present. Used to maintain state between request and
            callback.
      required:
        - error
        - state
      example:
        error: invalid_grant
        error_description: invalid URL token
        state: null
    ValidationError:
      type: object
      description: |
        Standard validation error response for API v1 endpoints (422 Unprocessable Entity).
        Returned when request parameters are missing, invalid, or violate business rules.
      properties:
        code:
          type: string
          description: Error code identifying the type of validation error
          enum:
            - parameter_missing
            - unpermitted_parameters
            - invalid_parameter_value
            - unknown_sort_field
            - too_many_sort_fields
          example: parameter_missing
        message:
          type: string
          description: Human-readable error message
          example: param is missing or the value is empty
        param:
          type: string
          description: Name of the problematic parameter (for parameter_missing, invalid_parameter_value, unknown_sort_field)
          example: aspera_app_type or workspace_id must be present
        params:
          type: array
          description: List of unpermitted parameters (for unpermitted_parameters error)
          items:
            type: string
          example:
            - invalid_param1
            - invalid_param2
        request_id:
          type: string
          format: uuid
          description: Unique identifier for the request, useful for debugging and support
          example: 910723e1-d7ac-4d01-9b4a-5949cf870f98
      required:
        - code
        - message
        - request_id
      example:
        param: aspera_app_type or workspace_id must be present
        code: parameter_missing
        message: param is missing or the value is empty
        request_id: 910723e1-d7ac-4d01-9b4a-5949cf870f98
    FieldValidationError:
      type: object
      description: |
        Validation error of the fields of a request body (422 Unprocessable Entity), with the messages for each field.
      properties:
        errors:
          type: object
          description: Messages for each field in error, by name of field.
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - errors
      example:
        errors:
          level:
            - is not included in the list
          entity:
            - already has group permission
    NotFoundError:
      type: object
      description: |
        Standard error response for 404 Not Found.
        Returned when the requested resource does not exist.
      properties:
        code:
          type: string
          description: Error code identifying the type of error
          enum:
            - not_found
          example: not_found
        message:
          type: string
          description: Human-readable error message
          example: The resource you were looking for does not exist
        request_id:
          type: string
          format: uuid
          description: Unique identifier for the request, useful for debugging and support
          example: 58825f7f-42bb-4f4e-90bc-a6deb9b999db
      required:
        - code
