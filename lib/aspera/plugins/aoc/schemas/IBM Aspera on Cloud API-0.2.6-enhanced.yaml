  /shared_folders_memberships:
    get:
      operationId: get_shared_folders_memberships
      summary: Get the Shared Folders of a User or a Group
      description: >
        Get the shared folders of workspaces that a user or a group can access, on all the nodes of the organization,
        directly or through groups: one entry per folder, with the union of the access levels (`agg_access_levels`).

        With a token with admin scope (organization administrator, or workspace manager for the workspaces they manage):
        the member given by `member_type` and `member_id` (required). With a token with user scope: only the user.

        AoC reads the permissions of every node of the organization (slow with many nodes) and keeps a copy: at the
        first call for a node, `access_levels` is `null`.
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page (at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: member_type
          in: query
          description: Kind of member.
          schema:
            type: string
            enum:
              - user
              - group
        - name: member_id
          in: query
          description: ID of the user or group (according to `member_type`).
          schema:
            type: string
        - name: inherited
          in: query
          description: >-
            `true`: only the folders reached through a group (or through several permissions); `false`: only the
            permissions of the member itself.
          schema:
            type: boolean
        - name: sort
          in: query
          description: >-
            One field, prefixed with `-` for descending order: `file_id`, `share_as`, `node_name`, `created_at`. Another
            value, or a list of fields, is ignored (not sorted, no error).
          schema:
            type: string
        - name: q
          in: query
          description: Search (case-insensitive substring) in `file_id`, `share_as` and the name of the node.
          schema:
            type: string
        - name: node_id
          in: query
          description: Filter by node id (exact).
          schema:
            type: string
        - name: node_name
          in: query
          description: Filter by node name (exact).
          schema:
            type: string
        - name: workspace_id
          in: query
          description: Filter by workspace id (exact).
          schema:
            type: string
        - name: file_id
          in: query
          description: Filter by file id (exact).
          schema:
            type: string
        - name: share_as
          in: query
          description: Filter by share as (exact).
          schema:
            type: string
        - name: embed[]
          in: query
          description: >-
            embed[]=workspace (workspace object from workspace_id), embed[]=node (node object from node_id). Repeat the
            parameter for several values.
          schema:
            type: string
            enum:
              - workspace
              - node
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of folders matching the query (all pages).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/shared_folder_memberships_response'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden (token with user scope asking for another member)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '500':
          description: Internal Server Error (also with admin scope and no member)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - Workspaces
  /short_links:
    get:
      operationId: get_short_links
      summary: Get Short Links
      description: List short links of a shared resource (shared folder or shared inbox) visible to the current caller.
      parameters:
        - name: json_query
          in: query
          description: >-
            JSON-encoded shared resource of the links. Public link: `{"url_token_data":{"data":<resource>,"purpose":<token purpose>}}`
            (see `short_link_url_token_data`). Private link: `{"node_id":..,"file_id":..,"workspace_id":..}`
          schema:
