name: aoc
title: IBM Aspera on Cloud
depends:
  - node
  - ats
  - transfer_agents
  - faspex4
commands: true
schemas:
  - key: aoc
    file: schemas/IBM Aspera on Cloud API-0.2.6-enhanced.yaml
    source:
      url: https://raw.githubusercontent.com/laurent-martin/aspera-api-examples/refs/heads/main/openapi/IBM%20Aspera%20on%20Cloud%20API-0.2.6-enhanced.yaml
  - key: automation
    file: schemas/IBM Aspera on Cloud Automation API-1.0.5-enhanced.yaml
    source:
      url: https://raw.githubusercontent.com/laurent-martin/aspera-api-examples/refs/heads/main/openapi/IBM%20Aspera%20on%20Cloud%20Automation%20API-1.0.5-enhanced.yaml
  - key: aoc_opts
    file: schemas/options.yaml
    owned: true
# Section of the instructions of the MCP server
mcp: |-
  AOC AUTOMATION WORKFLOW DEVELOPMENT
  Before writing or modifying an Aspera on Cloud Automation workflow, read the development guide
  (large: read sections, not the whole document). Start with the section of each trigger and action
  used (for example "Send a package" is action type package_transfer, section "package-transfer"),
  then "payload-rules-enforced-by-the-api" and "finding-the-identifiers":
    ["aoc", "automation", "guide", "section", "package-transfer"]
  Other sections: "triggers", "actions", "substitution-variables", "importing-a-workflow",
  "design-recipes-and-patterns", "common-pitfalls-and-resolutions". List the anchors with:
    ["aoc", "automation", "guide", "toc"]
