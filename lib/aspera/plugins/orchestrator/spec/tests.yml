orch_wf_check_import:
  pre: |
    (TMP / 'orch_wf_check.yml').write(<<~YAML)
      ---
      - !ruby/object:Workflow
        attributes:
          name: check_import_test
          run_as: SYSTEM
      - !ruby/object:Whiteboard
        attributes:
          error_free: true
          xml_export: |
            <?xml version="1.0" encoding="UTF-8"?>
            <Workflow id="0">
            <Start x="100" y="50" id="start"><Parameters></Parameters></Start>
            <Error x="900" y="350" id="error"><Synch_factor>0</Synch_factor><Prerequisites></Prerequisites></Error>
            <End x="900" y="50" id="end"><Synch_factor>0</Synch_factor><Prerequisites><Prerequisite id="step1" status="Complete"/></Prerequisites></End>
            <Fail x="900" y="200" id="fail"><Synch_factor>0</Synch_factor><Prerequisites></Prerequisites></Fail>
            <Steps>
            <Step x="400" y="50" id="step1"><Action_id>1</Action_id><Step_name>Say hello</Step_name><Step_type>CustomRuby</Step_type><Synch_factor>0</Synch_factor><Prerequisites><Prerequisite id="start" status="true"/></Prerequisites><Parameters></Parameters><Inputs></Inputs><Outputs></Outputs></Step>
            </Steps>
            <Parameters></Parameters>
            <Notes></Notes>
            </Workflow>
      - CustomRuby__1: !ruby/object:CustomRuby
          attributes:
            name: W0__Say hello
            execute_code: "outputs['message'] = 'Hello'"
      - CustomRuby__1: []
      - {}
      - CustomRuby: 0.7.0
    YAML
  args:
    - orchestrator
    - workflow
    - check_import
    - $(TMP / 'orch_wf_check.yml')
orch_workorder_id:
  tags:
    - save_output
  args:
    - orchestrator
    - workflow
    - workorders
    - "@preset:orch.workflow_id"
    - --fields=id
    - --query.max_results=1
orch_workorder_status:
  depends_on:
    - orch_workorder_id
  args:
    - orchestrator
    - workorder
    - status
    - $(t.saved_output :orch_workorder_id)
orch_workorder_cancel:
  depends_on:
    - orch_workorder_id
  args:
    - orchestrator
    - workorder
    - cancel
    - $(t.saved_output :orch_workorder_id)
orch_workorder_reset:
  depends_on:
    - orch_workorder_id
  args:
    - orchestrator
    - workorder
    - reset
    - $(t.saved_output :orch_workorder_id)
orch_workorder_output:
  depends_on:
    - orch_workorder_id
  args:
    - orchestrator
    - workorder
    - output
    - $(t.saved_output :orch_workorder_id)
orch_wf_start_sleep:
  tags:
    - save_output
  args:
    - orchestrator
    - workflow
    - start
    - "@preset:orch.sleep_workflow_id"
    - --fields=work_order.id
orch_workstep_id:
  tags:
    - save_output
  depends_on:
    - orch_wf_start_sleep
  args:
    - orchestrator
    - workorders
    - worksteps
    - $(t.saved_output :orch_wf_start_sleep)
    - --select.status=In Progress
    - --fields=id
  harness:
    poll:
      interval: 5
      max: 60
      until: "@"
      show: last
orch_workstep_status:
  depends_on:
    - orch_workstep_id
  args:
    - orchestrator
    - worksteps
    - status
    - $(t.saved_output :orch_workstep_id)
orch_workstep_cancel:
  depends_on:
    - orch_workstep_id
  args:
    - orchestrator
    - worksteps
    - cancel
    - $(t.saved_output :orch_workstep_id)
