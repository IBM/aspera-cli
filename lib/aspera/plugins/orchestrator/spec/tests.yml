# Orchestrator ------------------------------------------------------
orch_health:
  args:
    - orchestrator
    - health
orch_health_bad:
  $comment: With nagios format, error goes to stdout and exit code is set.
  description: Try to use wrong URL.
  tags:
    - must_fail
    - no_doc
  expect: ""
  args:
    - orchestrator
    - health
    - --url=https://wrong.url
    - --format=nagios
orch_detect:
  tags:
    - no_doc
  args:
    - config
    - detect
    - "@:"
    - url=@preset:orch_user.url
orch_wizard:
  tags:
    - orchestrator
  pre: generated_secret(:dummy)
  args:
    - config
    - wizard
    - "@:"
    - url=@preset:orch_user.url
    - plugin=orchestrator
    - override=yes
    - --username=test
    - --password=$(secret :dummy)
orch_info:
  args:
    - orchestrator
    - info
