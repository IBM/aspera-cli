openapi: 3.1.0
info:
  title: Aspera Orchestrator API
  version: v1
  license:
    name: (c) IBM. All rights reserved
    url: https://ibm.com
  description: |
    API documentation for Aspera Orchestrator 4.1.6, checked against its source code (`config/routes.rb` and `ApiController`).

    ## Authentication

    The API supports two authentication modes:

    ### JWT Authentication (Recommended)

    When JWT authentication is enabled (default):

    1. Obtain a JWT token by calling POST /api/login with your credentials
    2. Include the token in subsequent requests using the Authorization header:
       `Authorization: Bearer <your_token>`

    ### Credentials in Each Request (When JWT is Disabled)

    If JWT authentication is disabled in your Orchestrator configuration (`/api/login` then returns 403), give the credentials with every API request, either:

    - as query parameters `login` and `password`, e.g. `/api/workflows_list?login=admin&password=<PASSWORD>&format=json`
    - as query parameters `login` and `api_key` (the API key of the user)
    - with HTTP Basic authentication

    **Note:** Check your Orchestrator configuration to determine which authentication mode is active.

    ## Routes

    - Some endpoints have their own route, `/api/<endpoint>`, with the HTTP method given here.
    - Every endpoint can also be called as `/api/<endpoint>/<id>`, with any HTTP method, where `<id>` is its main identifier.
      Endpoints without their own route can only be called this way: when `id` is not used by the endpoint, any value works, for example `0`.
    - Parameters can be given in the query, or in a JSON or form body.

    ## Response format

    Most endpoints return XML by default.
    For JSON, add `format=json`, or the extension `.json` to the last segment of the path (e.g. `/api/work_order_status/123.json`).

    ## Errors

    Errors are returned with HTTP status 200, or 404 when the server option `strict_api_validation` is set.
    The body is `<error time=... action=... id=...>message and backtrace</error>`, or in JSON `{"error": {"action": ..., "time": ..., "id": ..., "description": ...}}`.
servers:
  - url: https://158.176.9.141/aspera/orchestrator
    description: 'Configured host: 158.176.9.141'
  - url: https://orchestrator.aspera-emea.com/aspera/orchestrator
    description: 'Configured host: orchestrator.aspera-emea.com'
security:
  - bearerAuth: []
  - basicAuth: []
  - loginQuery: []
    passwordQuery: []
  - loginQuery: []
    apiKeyQuery: []
paths:
  /api/login:
    post:
      operationId: login
      security: []
      summary: Authenticate and obtain JWT token
      description: 'Returns a JWT for the `Authorization: Bearer` header of the other calls. Returns 403 when JWT authentication is disabled in the configuration.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: '`username`, with either `password` or `api_key` (the API key of that user)'
              oneOf:
                - title: Username and password
                  type: object
                  required:
                    - username
                    - password
                  properties:
                    username:
                      type: string
                      description: User login name
                    password:
                      type: string
                      format: password
                      description: User password
                  additionalProperties: false
                - title: Username and API key
                  type: object
                  required:
                    - username
                    - api_key
                  properties:
                    username:
                      type: string
                      description: User login name
                    api_key:
                      type: string
                      description: API key of the user
                  additionalProperties: false
            examples:
              credentials:
                summary: Username and password
                value:
                  username: admin
                  password: <PASSWORD>
              api_key:
                summary: Username and API key
                value:
                  username: admin
                  api_key: <API_KEY>
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                description: Token and identity of the user
                type: object
                properties:
                  message:
                    description: Result message
                    type: string
                    examples:
                      - Logged in successfully
                  user:
                    description: Authenticated user
                    type: object
                    properties:
                      id:
                        description: User ID
                        type: integer
                      login:
                        description: User login
                        type: string
                      email:
                        description: Email of the user
                        type: string
                  token:
                    type: string
                    description: JWT token for subsequent API calls
        '401':
          description: Invalid credentials
        '403':
          description: Secure API auth disabled
  /api/workflows_list:
    get:
      operationId: workflows_list
      summary: List all workflows
      description: Lists all the workflows, with their publication status, revisions and folder. Requires the monitor permission.
      tags:
        - Workflows
      parameters:
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                description: All workflows
                type: object
                properties:
                  workflows:
                    description: Wrapper of the list
                    type: object
                    properties:
                      time:
                        type: string
                        description: UTC time
                      action:
                        description: Name of the call
                        type: string
                        const: list
                      id:
                        description: Always `0` for this call
                        type: integer
                      workflow:
                        description: Workflows
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              description: Workflow ID
                              type: integer
                            name:
                              description: Workflow name
                              type: string
                            full_name:
                              type: string
                              description: Name with the folder path
                            folder_id:
                              description: Folder of the workflow, `null` at the root
                              type: [integer, 'null']
                            portable_id:
                              description: Portable ID, kept across export and import
                              type: [string, 'null']
                            published_status:
                              description: Whether a revision is published
                              type: string
                              enum:
                                - published
                                - draft
                            published_revision_id:
                              type: [integer, string]
                              description: '`-` when not published'
                            latest_revision_id:
                              type: [integer, string]
                              description: '`-` when there is no whiteboard'
                            last_modification:
                              description: Last update of the workflow
                              type: string
                              format: date-time
                            comments:
                              description: Comments of the workflow
                              type: [string, 'null']
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/workflows_status:
    get:
      operationId: workflows_status
      summary: Running status of workflows
      description: Tells, for each workflow or for one workflow, whether work orders are running.
      tags:
        - Workflows
      parameters:
        - name: id
          in: query
          schema:
            type: string
          description: Workflow ID or portable ID. Not set, or `0`, for all workflows.
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Workflow status information
          content:
            application/json:
              schema:
                description: Running status of the workflows
                type: object
                properties:
                  workflows:
                    description: Wrapper of the list
                    type: object
                    properties:
                      time:
                        type: string
                        description: UTC time
                      action:
                        description: Name of the call
                        type: string
                        const: status
                      id:
                        description: Always `0` for this call
                        type: integer
                      workflow:
                        description: Workflows
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              description: Workflow ID
                              type: integer
                            name:
                              description: Workflow name
                              type: string
                            status:
                              description: '`running` when the workflow has running work orders'
                              type: string
                              enum:
                                - running
                                - not running
                            last_activity:
                              type: string
                              description: Last update of the running work orders, or `-`
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/workflow_details/{id}:
    get:
      operationId: workflow_details
      summary: Number of work orders of a workflow, by status
      description: Counts the work orders of a workflow by status, optionally in a date range.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Workflow ID
        - name: start_date
          in: query
          schema:
            type: string
          description: Count work orders created after this date
        - name: end_date
          in: query
          schema:
            type: string
          description: Count work orders created before this date
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Work order counts by status
          content:
            application/json:
              schema:
                description: Work order counts of the workflow
                type: object
                properties:
                  workflows:
                    description: Wrapper of the result
                    type: object
                    properties:
                      time:
                        type: string
                        description: UTC time
                      action:
                        description: Name of the call
                        type: string
                        const: status
                      id:
                        description: Workflow ID
                        type: integer
                      workflow:
                        description: The workflow and its counts
                        type: object
                        properties:
                          name:
                            description: Workflow name
                            type: string
                          id:
                            description: Workflow ID
                            type: integer
                          statuses:
                            description: One entry per work order status
                            type: array
                            items:
                              type: object
                              properties:
                                count:
                                  description: Number of work orders with this status
                                  type: integer
                                last_activity:
                                  description: Last update of these work orders
                                  type: string
                                  format: date-time
                                workflow_name:
                                  description: Workflow name
                                  type: string
                                status:
                                  description: Work order status
                                  type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/workflow_inputs_spec/{id}:
    get:
      operationId: workflow_inputs_spec
      summary: Runtime parameters of a workflow
      description: Lists the runtime parameters of the published revision, to give in `external_parameters` of `initiate`.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID or portable ID, or `0` to use `workflow_name`, or `-1` to use `portable_id`
        - name: workflow_name
          in: query
          schema:
            type: string
          description: Workflow name, when `id` is `0`
        - name: portable_id
          in: query
          schema:
            type: string
          description: Workflow portable ID, when `id` is `-1`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Runtime parameters
          content:
            application/json:
              schema:
                description: Runtime parameters of the workflow
                type: object
                properties:
                  workflow_inputs_spec:
                    description: Wrapper of the result
                    type: object
                    properties:
                      time:
                        type: string
                        description: UTC time
                      action:
                        description: Name of the call
                        type: string
                        const: inputs_spec
                      workflow_name:
                        description: Workflow name
                        type: string
                      workflow_id:
                        description: Workflow ID
                        type: integer
                      parameter:
                        description: Runtime parameters
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              description: Parameter ID
                              type: integer
                            name:
                              description: Parameter name, the key in `external_parameters`
                              type: string
                            value_type:
                              description: Value type, e.g. `string`, `int`, `pwd`
                              type: string
                            optional:
                              description: '`true` when the parameter can be omitted'
                              type: [boolean, 'null']
                            value:
                              type: string
                              description: Default value, for an optional parameter
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/workflow_outputs_spec/{id}:
    get:
      operationId: workflow_outputs_spec
      summary: Outputs of the steps of a workflow
      description: Lists the outputs of the steps of the published revision, as used by `explicit_output` of `initiate` and by `work_order_output`.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID or portable ID (also accepted as query parameter `workflow_id`)
        - name: workflow_id
          in: query
          schema:
            type: string
          description: Workflow ID or portable ID, takes precedence over `id`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Outputs of the workflow
          content:
            application/json:
              schema:
                description: Outputs of the workflow
                type: object
                properties:
                  workflow_outputs_spec:
                    description: Wrapper of the result
                    type: object
                    properties:
                      time:
                        type: string
                        description: UTC time
                      action:
                        description: Name of the call
                        type: string
                        const: outputs_spec
                      output:
                        description: Outputs
                        type: array
                        items:
                          type: object
                          properties:
                            context_id:
                              description: ID of the step that produces the output
                              type: integer
                            name:
                              type: string
                              description: '`<step name>:<output name>`'
                            workflow_id:
                              description: Workflow ID
                              type: integer
                            step_name:
                              description: Step name
                              type: string
                            variable_name:
                              description: Output name
                              type: string
                            value_type:
                              description: Value type, e.g. `string`, `int`
                              type: string
                            variable_type:
                              description: Variable type
                              type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/import_workflow:
    post:
      operationId: import_workflow
      summary: Import a workflow
      description: Always creates a new workflow. The response is the new workflow as JSON, whatever the format.
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              description: Workflow file and import options
              type: object
              required:
                - import_file
                - import_file_name
              properties:
                import_file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: The workflow file to import (.wkf or .yml)
                import_file_name:
                  type: string
                  pattern: ^.*(wkf|yml)$
                  description: File name ending with `wkf` or `yml`. The file is saved under this name in the import folder of the server.
                  examples:
                    - my_workflow.wkf
                folder_id:
                  type: integer
                  description: Folder of the new workflow
                link_to_subworkflows:
                  type: string
                  description: Link to existing sub-workflows instead of importing them. Any value, including `false`, is taken as true.
                publish_workflow:
                  type: string
                  description: '`true` or `1` to publish the workflow after import. Default: server option `publish_api_imported_workflow`.'
                format:
                  description: Format of the error responses (the result is JSON in both formats)
                  type: string
                  enum:
                    - xml
                    - json
                  default: xml
      responses:
        '200':
          description: The new workflow (JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
        '500':
          description: Import failed
          content:
            application/json:
              schema:
                description: Import error
                type: object
                properties:
                  error:
                    description: Error type
                    type: string
                  message:
                    description: Error summary
                    type: string
                  details:
                    type: string
                    description: Error message
  /api/find_constraints:
    get:
      operationId: find_constraints
      summary: Find workflow import constraints
      description: 'Analyzes a workflow file present on the Orchestrator host, and returns the list expected by `import_with_constraints`, with the possible choices for each conflict with existing sub-workflows, global templates and remote nodes, and the plugins that are not enabled. The file existence is not checked: a wrong path returns the same empty lists as a file without conflict.'
      tags:
        - Workflows
      parameters:
        - name: file
          in: query
          required: true
          schema:
            type: string
          description: Path of the workflow file (`.yml` or `.wkf`) on the Orchestrator host
        - name: wf_id
          in: query
          schema:
            type: integer
          description: ID of an existing workflow, to import the file as a new revision of it
      responses:
        '200':
          description: 'Array of six objects, in the order expected by `import_with_constraints`: `filename`, `add as revision`, `subwf constraints`, `action template constraints`, `remote node constraints`, and `missing plugins` with `Auto-enable missing plugins?`.'
          content:
            application/json:
              schema:
                description: The six objects of the body of `import_with_constraints`, with the choices
                type: array
                minItems: 6
                maxItems: 6
                prefixItems:
                  - type: object
                    properties:
                      filename:
                        type: string
                  - type: object
                    properties:
                      add as revision:
                        type: [string, 'null']
                        description: The `wf_id` parameter
                  - type: object
                    properties:
                      subwf constraints:
                        type: object
                        description: Sub-workflow name to possible choices
                        additionalProperties:
                          type: array
                          items:
                            type: string
                  - type: object
                    properties:
                      action template constraints:
                        type: object
                        description: Global template name to possible choices
                        additionalProperties:
                          type: array
                          items:
                            type: string
                  - type: object
                    properties:
                      remote node constraints:
                        type: object
                        description: Remote node name to possible choices
                        additionalProperties:
                          type: array
                          items:
                            type: string
                  - type: object
                    properties:
                      missing plugins:
                        type: [array, 'null']
                        description: Plugins to enable, or `null`
                      Auto-enable missing plugins?:
                        type: [array, 'null']
                        description: '`[true, false]` when plugins are missing, else `null`'
                items: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/import_with_constraints:
    post:
      operationId: import_with_constraints
      summary: Import workflow with constraint resolution
      description: 'Imports a workflow file present on the Orchestrator host, as a new workflow or as a new revision of an existing workflow. The workflow is not published. Orchestrator does not check what `find_constraints` reports: if plugins to enable are listed and `Auto-enable missing plugins?` is not `true`, the call fails with an internal error; a conflict without choice is imported as a copy, without error. `Auto-enable missing plugins?` must be a JSON boolean: the string `"false"` is taken as true.'
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Array of six objects with one key each, in this order
              minItems: 6
              maxItems: 6
              prefixItems:
                - type: object
                  required:
                    - filename
                  properties:
                    filename:
                      type: string
                      description: Path of the workflow file on the Orchestrator host
                  additionalProperties: false
                - type: object
                  required:
                    - add as revision
                  properties:
                    add as revision:
                      type: [integer, string, 'null']
                      description: ID or portable ID of the workflow to add a revision to, or `null` for a new workflow
                  additionalProperties: false
                - type: object
                  required:
                    - subwf constraints
                  properties:
                    subwf constraints:
                      type: object
                      description: Sub-workflow name to choice
                      additionalProperties:
                        type: string
                        enum:
                          - Map to the Existing Sub-Workflow
                          - Create a new Sub-Workflow with a unique name
                          - Add a new revision to the existing Sub-Workflow
                  additionalProperties: false
                - type: object
                  required:
                    - action template constraints
                  properties:
                    action template constraints:
                      type: object
                      description: Global template name to choice
                      additionalProperties:
                        type: string
                        enum:
                          - Map to the existing Global Template
                          - Create a new Global Template with a different name
                          - Override the existing Global Template with this new template
                  additionalProperties: false
                - type: object
                  required:
                    - remote node constraints
                  properties:
                    remote node constraints:
                      type: object
                      description: Remote node name to choice
                      additionalProperties:
                        type: string
                        enum:
                          - Map to the existing Remote Node
                          - Create a new Remote Node with a different name
                          - Override the Existing Remote Node with this importing node
                  additionalProperties: false
                - type: object
                  required:
                    - Auto-enable missing plugins?
                  properties:
                    Auto-enable missing plugins?:
                      type: boolean
                  additionalProperties: false
              items: false
              examples:
                - - filename: /opt/aspera/orchestrator/var/run/orchestrator/workflows/import/my_workflow.yml
                  - add as revision: 239
                  - subwf constraints: {}
                  - action template constraints:
                      Search Files: Map to the existing Global Template
                  - remote node constraints:
                      Baton: Map to the existing Remote Node
                  - Auto-enable missing plugins?: true
      responses:
        '200':
          description: The workflow that was imported (JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
        '500':
          description: Internal error, e.g. plugins to enable and not auto-enabled, or a file that cannot be read
  /api/publish_workflow:
    post:
      operationId: publish_workflow
      summary: Publish a workflow
      description: Publishes the last whiteboard revision. The result is `true`, or `false` when the whiteboard has no `error_free` value.
      tags:
        - Workflows
      parameters:
        - name: id
          in: query
          schema:
            type: string
          description: Workflow ID or portable ID (also accepted in a JSON body, or in the path `/api/publish_workflow/<id>`)
          example: '123'
        - $ref: '#/components/parameters/Format'
      requestBody:
        content:
          application/json:
            schema:
              description: Workflow to publish, instead of the query parameter
              type: object
              properties:
                id:
                  type: string
                  description: Workflow ID or portable ID
      responses:
        '200':
          description: '`true` or `false` (JSON), or `<WorkflowPublish><Success>true</Success></WorkflowPublish>` (XML)'
          content:
            application/json:
              schema:
                description: '`true` when published'
                type: boolean
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/export_workflow/{id}:
    get:
      operationId: export_workflow
      summary: Export a workflow
      description: Returns the workflow file (`.yml`), or a package (`.wkf`) with its sub-workflows and remote nodes.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID or portable ID
        - name: export_with_dependencies
          in: query
          schema:
            type: string
          description: Export a package with dependencies. Any non-empty value, including `false`, enables it.
      responses:
        '200':
          description: The workflow file
          content:
            application/octet-stream:
              schema:
                description: Content of the `.yml` file, or of the `.wkf` package
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/list_by_subworkflow/{id}:
    get:
      operationId: list_by_subworkflow
      summary: Published workflows that use a sub-workflow
      description: Lists the published workflows that call a sub-workflow, e.g. before changing or deleting it.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Sub-workflow ID (or query parameter `sub_wf_id`, which takes precedence)
        - name: sub_wf_id
          in: query
          schema:
            type: integer
          description: Sub-workflow ID
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: IDs of the parent workflows
          content:
            application/json:
              schema:
                description: Parent workflows
                type: object
                properties:
                  parent_workflows:
                    description: IDs of the published workflows that use the sub-workflow
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/retrieve_steps/{id}:
    get:
      operationId: retrieve_steps
      summary: Steps of a type in published workflows, with their work orders
      description: Finds the steps of a plugin type in the workflow revisions used by work orders, with the ID and status of each work order.
      tags:
        - Workflows
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: type
          in: query
          required: true
          schema:
            type: string
          description: Step type (plugin class name), e.g. `CustomRuby`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: List of steps
          content:
            application/json:
              schema:
                description: Matching steps, one entry per step and work order
                type: array
                items:
                  type: object
                  properties:
                    step_id:
                      description: Step ID in the workflow revision
                      type: string
                    step_name:
                      description: Step name
                      type: string
                    step_status:
                      type: [string, 'null']
                      description: Status of the first prerequisite of the step
                    wf_id:
                      description: Workflow ID, from the revision
                      type: string
                    wo_id:
                      description: Work order ID
                      type: integer
                    wo_status:
                      description: Status of the work order
                      type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_orders_list/{id}:
    get:
      operationId: work_orders_list
      summary: List work orders of a workflow
      description: Lists the work orders of one workflow or of all workflows, filtered by status, priority, date range and tags.
      tags:
        - Work Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID, portable ID or name, or `all` for all workflows
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: 'Filter by work order status, comma-separated (case insensitive): `Initializing`, `Initialized`, `Created`, `Ready`, `In Progress`, `Complete`, `Rolled-back`, `Canceled`, `Paused`, `Cut-off`, `Failed`, `Error`, `Destroyed`, `Cleared`, `Flagged`. Not set: all but `Rolled-back`, `Cut-off`, `Ready`, `Destroyed`, `Cleared`, `Flagged` and `Unknown`.'
          example:
            - Failed
            - Canceled
        - name: priority
          in: query
          schema:
            type: string
            enum:
              - low
              - medium
              - high
              - preemptive
          description: 'Filter by priority (case insensitive): `low` (1), `medium` (2), `high` (3) or `preemptive` (below 1). Another value is ignored.'
        - name: from_date
          in: query
          schema:
            type: string
          description: 'Work orders updated after this date. Format `<date> HH:MM:SS`, with `<date>` as `mm-dd-yyyy` (default), `mm/dd/yyyy` (server date format `american`), `dd-mm-yyyy` (`continental`) or `yyyy-mm-dd` (`swedish`). Another format is ignored.'
          example: 06-27-2015 02:40:59
        - name: to_date
          in: query
          schema:
            type: string
          description: 'Work orders updated before this date. Format `<date> HH:MM:SS`, with `<date>` as `mm-dd-yyyy` (default), `mm/dd/yyyy` (server date format `american`), `dd-mm-yyyy` (`continental`) or `yyyy-mm-dd` (`swedish`). Another format is ignored.'
          example: 06-29-2015 02:40:59
        - name: tag
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated list of tags, all required
        - name: max_results
          in: query
          schema:
            type: integer
          description: Maximum number of work orders
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: List of work orders
          content:
            application/json:
              schema:
                description: Work orders found
                type: object
                properties:
                  work_orders:
                    description: Work orders
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkOrder'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_order_status/{id}:
    get:
      operationId: work_order_status
      summary: Get work order status
      description: |
        Returns the status of a work order and its work steps.

        If the work order includes sub-workflows, only the sub-workflow status is displayed, not the steps within the sub-workflow.
      tags:
        - Work Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Work order status
          content:
            application/json:
              schema:
                description: Work order and its work steps
                type: object
                properties:
                  work_order:
                    allOf:
                      - $ref: '#/components/schemas/WorkOrder'
                    properties:
                      percent_complete:
                        description: Progress of the work order, from the weights of its steps
                        type: integer
                        minimum: 0
                        maximum: 100
                  work_steps:
                    type: array
                    description: Steps with `step_id` greater than 0
                    items:
                      $ref: '#/components/schemas/WorkStepStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_order_output/{id}:
    get:
      operationId: work_order_output
      summary: Outputs of a work order
      description: |
        All outputs, the outputs of a step (`step_name`), or the outputs of a given name (`variable_name`).
        With both `step_name` and `variable_name`, JSON returns the value only.
        Format `text` (or `string`) returns the values, one per line.
      tags:
        - Work Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID (or query parameter `workorder_id`, which takes precedence)
        - name: workorder_id
          in: query
          schema:
            type: integer
          description: Work order ID
        - name: step_name
          in: query
          schema:
            type: string
          description: Only the outputs of this step
        - name: variable_name
          in: query
          schema:
            type: string
          description: Only the outputs with this name
        - name: detailed
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: 'JSON: also the variable type, value type, work order ID and status of each output'
        - name: format
          in: query
          schema:
            type: string
            enum:
              - xml
              - json
              - text
              - string
            default: xml
          description: Response format
      responses:
        '200':
          description: Outputs
          content:
            application/json:
              schema:
                description: |
                  - Without both `step_name` and `variable_name`: object `{"<step name>:<output name>": <value>}`
                  - With `detailed=true`: array of `{"<step name>:<output name>": <value>, "variable_type", "value_type", "<work order name>:WorkOrder_ID", "<work order name>:WorkOrder_Status"}`
                  - With both `step_name` and `variable_name`: the value only
            text/plain:
              schema:
                type: string
                description: Format `text` or `string`, one value per line
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_order_cancel/{id}:
    get:
      operationId: work_order_cancel
      summary: Cancel a work order
      description: Cancels a running work order and its steps. Use `force` for a work order that does not stop.
      tags:
        - Work Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID
        - name: force
          in: query
          schema:
            type: string
          description: Force the cancellation (any value except `false`)
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The work order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_order_reset/{id}:
    get:
      operationId: work_order_reset
      summary: Reset a work order
      description: Resets all the steps of the work order to `Inactive`, to run it again from the start.
      tags:
        - Work Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The work order and its work steps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderWithSteps'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/reset/{id}.{format}:
    post:
      operationId: reset
      summary: Reset a work order (XML result)
      description: Same as `work_order_reset`, implemented by the work order pages. The response is always XML.
      tags:
        - Work Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID
        - name: format
          in: path
          required: true
          schema:
            type: string
            const: xml
          description: Required by the route
      responses:
        '200':
          description: The work order (XML)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/work_order_destroy/{id}:
    get:
      operationId: work_order_destroy
      summary: Delete a work order and its dependents
      description: Deletes the work order and its dependent records.
      tags:
        - Work Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Confirmation message
          content:
            application/json:
              schema:
                description: Confirmation message, as a JSON string
                type: string
                examples:
                  - " Work order '123' was deleted"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/initiate:
    post:
      operationId: initiate
      summary: Initiate a new work order
      description: |
        Starts a new work order for the specified workflow.

        Runtime input values are passed under the `external_parameters` key.
        To discover what parameters a workflow accepts, call `/api/workflow_inputs_spec/{workflow_id}` first.
        With format `json`, the keys of a JSON body are also merged into the runtime parameters.
      tags:
        - Work Orders
      parameters:
        - $ref: '#/components/parameters/Format'
        - name: synchronous
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: '`true`: wait for the end of the work order'
        - name: timeout
          in: query
          schema:
            type: integer
            minimum: 0
          description: 'With `synchronous`, maximum wait in seconds (0 or not set: no limit)'
        - name: explicit_output
          in: query
          schema:
            type: string
          description: Return only this output, as `<step name>:<output name>`
        - name: explicit_output_step
          in: query
          schema:
            type: string
          description: Return only an output of this step (with `explicit_output_variable`)
        - name: explicit_output_variable
          in: query
          schema:
            type: string
          description: Name of the output to return (with `explicit_output_step`)
        - name: on_error_return_code
          in: query
          schema:
            type: integer
          description: HTTP status to return when the work order ends with status `Error`
        - name: on_failed_return_code
          in: query
          schema:
            type: integer
          description: HTTP status to return when the work order ends with status `Failed`
        - name: tags
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated tags of the work order
        - name: preemptive_level
          in: query
          schema:
            type: integer
          description: Priority of the work order (its opposite is used)
        - name: wo_id_only
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: '`true`: return only the work order ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Workflow to start and its runtime parameters
              type: object
              required:
                - workflow_id
              properties:
                workflow_id:
                  type: string
                  description: ID, portable ID or name of the workflow to execute
                  examples:
                    - '123'
                external_parameters:
                  type: object
                  description: Runtime parameters of the workflow (name to value)
                  additionalProperties: true
      responses:
        '200':
          description: Work order initiated (or the status given by `on_error_return_code`, `on_failed_return_code`)
          content:
            application/json:
              schema:
                description: The new work order, or an output value
                anyOf:
                  - title: Work order
                    allOf:
                      - $ref: '#/components/schemas/WorkOrderWithSteps'
                    properties:
                      parameters:
                        type: object
                        description: Runtime parameters of the work order
                        additionalProperties: true
                  - title: Output value
                    description: With `explicit_output`, or `explicit_output_step` and `explicit_output_variable`
        '400':
          description: Workflow not found or not published, or missing required parameters
          content:
            application/json:
              schema:
                description: Error, or the work order that was not started
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - title: Missing parameters
                    type: object
                    required:
                      - work_order
                      - missing_parameters
                    properties:
                      work_order:
                        allOf:
                          - $ref: '#/components/schemas/WorkOrder'
                        properties:
                          status:
                            description: Status of the work order that was not started
                            const: Not started
                          status_details:
                            description: Reason
                            const: Missing required parameters
                      missing_parameters:
                        description: Names of the required parameters not given
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/work_step_status/{id}:
    get:
      operationId: work_step_status
      summary: Status, inputs and outputs of a work step, or change its status
      description: |
        Returns the work step with its inputs and outputs,
        or only the value of an output (`output_name`), or only the status (`status_only`, as plain text).
        With `set_status` or `set_status_details`, modifies the work step and returns its new status.
      tags:
        - Work Steps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Work step ID, or `work_order` to use `work_order_id` and `step_name`
        - name: work_order_id
          in: query
          schema:
            type: integer
          description: Work order ID, when `id` is `work_order`
        - name: step_name
          in: query
          schema:
            type: string
          description: Step name, when `id` is `work_order`
        - name: output_name
          in: query
          schema:
            type: string
          description: Return only the value of this output
        - name: status_only
          in: query
          schema:
            type: string
          description: Return only the status (any value except `false`)
        - name: set_status
          in: query
          schema:
            type: string
          description: New status of the work step
        - name: set_status_details
          in: query
          schema:
            type: string
          description: New status details of the work step
        - name: set_percent_complete
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
          description: New percentage of completion, with `set_status` or `set_status_details`
        - name: format
          in: query
          schema:
            type: string
            enum:
              - xml
              - json
              - txt
            default: xml
          description: Response format (`txt` for a value or a status as plain text)
      responses:
        '200':
          description: Work step status
          content:
            application/json:
              schema:
                description: Work step, new status, or output value
                anyOf:
                  - title: Work step
                    type: object
                    properties:
                      work_step:
                        $ref: '#/components/schemas/WorkStep'
                      outputs:
                        description: Outputs of the work step
                        type: array
                        items:
                          $ref: '#/components/schemas/StepVariable'
                      inputs:
                        description: Inputs of the work step
                        type: array
                        items:
                          $ref: '#/components/schemas/StepVariable'
                      carry_thrus:
                        type: array
                        description: Variables of other steps
                        items:
                          $ref: '#/components/schemas/StepVariable'
                  - title: New status
                    description: With `set_status` or `set_status_details`
                    type: object
                    properties:
                      Work_step_id:
                        description: Work step ID
                        type: integer
                      Work_step_status:
                        description: New status
                        type: string
                      Work_step_status_details:
                        description: New status details
                        type: [string, 'null']
                      Work_step_percent_complete:
                        description: New percentage of completion
                        type: [integer, 'null']
                  - title: Output value
                    description: With `output_name`
            text/plain:
              schema:
                type: string
                description: 'Format `txt`: a value or a status. With `status_only`, the status is also plain text in format `json`.'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_step_cancel/{id}:
    get:
      operationId: work_step_cancel
      summary: Cancel a work step
      description: Cancels a running work step.
      tags:
        - Work Steps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work step ID
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The work step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkStep'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/workstep_reset/{id}:
    get:
      operationId: workstep_reset
      summary: Restart work orders from work steps
      description: Restarts the work order of each work step from that step.
      tags:
        - Work Steps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: array
            items:
              type: integer
          description: Work step ID, or comma-separated list of IDs
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The restarted work orders
          content:
            application/json:
              schema:
                description: Restarted work order, or a list for several work steps
                oneOf:
                  - $ref: '#/components/schemas/WorkstepReset'
                  - type: array
                    description: For several work step IDs
                    items:
                      $ref: '#/components/schemas/WorkstepReset'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/queues_list:
    get:
      operationId: queues_list
      summary: List all queues
      description: Lists the managed queues (queue headers, without their items).
      tags:
        - Queues
