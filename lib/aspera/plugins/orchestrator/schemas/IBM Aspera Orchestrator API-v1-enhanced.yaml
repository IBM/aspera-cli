        - name: queued_item
          in: query
          required: true
          schema:
            type: string
          description: Item to queue
        - name: description
          in: query
          schema:
            type: string
          description: Description of the item
        - name: priority
          in: query
          schema:
            type: integer
          description: Priority of the item
        - name: weight
          in: query
          schema:
            type: integer
          description: Weight of the item
        - name: tags
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated tags
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The queued item
          content:
            application/json:
              schema:
                description: The new item
                type: object
                properties:
                  item:
                    type: string
                    description: The queued item, as given in `queued_item`
                  description:
