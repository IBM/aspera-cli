  /api/control_process/{id}:
    get:
      operationId: control_process
      summary: Start, stop or kill a process
      description: Returns the status of the processes (in XML, the same as `processes_status`).
      tags:
        - System
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum:
              - engine
              - monitor
              - worker
          description: Process type
        - name: command
          in: query
          required: true
          schema:
            type: string
            enum:
              - start
              - stop
              - kill
              - status
          description: Command (`status` does nothing but returns the status)
        - name: worker_id
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          description: Comma-separated worker IDs, required for type `worker`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Status of the processes
          content:
            application/json:
              schema:
                description: Status of the processes after the command
                type: object
                properties:
                  processes:
                    description: Wrapper of the result
                    type: object
                    properties:
                      time:
                        description: Time of the call
                        type: string
                      action:
                        description: Name of the call
                        type: string
                        const: status
                      engine_id:
                        description: ID of the engine that answers
                        type: integer
                      process:
                        description: Processes
                        type: array
                        items:
                          type: object
                          properties:
                            class:
                              description: Process type
                              type: string
                              enum:
                                - engine
                                - monitor
                                - node_mesh
                                - worker
                            id:
                              type: integer
                              description: Worker ID
                            pid:
                              type: [integer, string]
                              description: '`-` when not running'
                            status:
                              description: Whether the process runs
                              type: string
                              enum:
                                - running
                                - not running
                            type:
                              type: string
                              description: Worker type
                              enum:
                                - normal
                                - asynchronous
                                - dedicated
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/custom_api_call:
    get:
      operationId: custom_api_call
      summary: Store data in the shared state, for a database trigger
      description: The query parameters and the request body are stored in table `SharedState`, where a workflow can watch them with a database trigger. The response is always XML.
      tags:
        - System
      parameters:
        - name: uniq_id
          in: query
          required: true
          schema:
            type: integer
          description: Aggregate ID of the shared state, an integer
        - name: identifier
          in: query
          schema:
            type: string
          description: 'Aggregate type of the shared state (default: `custom_api_call`)'
        - name: object
          in: query
          schema:
            type: string
          description: JSON text of the object to store
      responses:
        '200':
          description: ID of the shared state (XML)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/execution_queue_stats/{id}:
    get:
      operationId: execution_queue_stats
      summary: Statistics of the execution queue of the engine
      description: Counts the items of the execution queue of the engine (steps waiting for or run by workers) and the running work orders, by status.
      tags:
        - System
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Queue statistics
          content:
            application/json:
              schema:
                description: Execution queue and work order counts
                type: object
                properties:
                  next_polling_due:
                    type: [integer, string]
                    description: Seconds until the next polling, or `-`
                  completed_items:
                    description: Execution queue items with status `Complete`
                    type: integer
                  unassigned_items:
                    description: Execution queue items not assigned to a worker yet
                    type: integer
                  error_items:
                    description: Execution queue items with status `Error`
                    type: integer
                  inprogress_synch_count:
                    description: Synchronous items in progress
                    type: integer
                  inprogress_asynch_count:
                    description: Asynchronous items in progress
                    type: integer
                  created:
                    type: integer
                    description: Number of work orders with this status
                  ready:
                    description: Number of work orders with status `Ready`
                    type: integer
                  initializing:
                    description: Number of work orders with status `Initializing`
                    type: integer
                  initialized:
                    description: Number of work orders with status `Initialized`
                    type: integer
                  in_progress:
                    description: Number of work orders with status `In Progress`
                    type: integer
                  paused:
                    description: Number of work orders with status `Paused`
                    type: integer
                  time_executed:
                    description: Time of the statistics (`YYYY-MM-DD HH:MM:SS`)
                    type: string
                  engine_id:
                    description: ID of the engine
                    type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/alerts/{id}:
    get:
      operationId: alerts
      summary: Alerts of the categories the user is subscribed to
      description: Returns the alerts of the categories the user is subscribed to, or their number.
      tags:
        - System
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: count_only
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: 'Return only the number of alerts: `{"count"}`'
        - name: category
          in: query
          schema:
            type: string
            enum:
              - WorkflowAlerts
              - UserAlerts
              - WorkorderAlerts
              - MonitorAlerts
              - PluginAlerts
          description: Only alerts of this category (case sensitive). With another value, no alert is returned.
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: List of alerts, or their number
          content:
            application/json:
              schema:
                description: Alerts, or their number
                oneOf:
                  - title: Count
                    description: With `count_only=true`
                    type: object
                    properties:
                      count:
                        description: Number of alerts
                        type: integer
                  - type: array
                    items:
                      $ref: '#/components/schemas/AlertNotification'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/remote_node_ping:
    get:
      operationId: remote_node_ping
      summary: Version and platform of this Orchestrator
      description: Returns the version and platform of this Orchestrator. Used by another Orchestrator to check a federation link.
      tags:
        - Remote Nodes
      parameters:
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Orchestrator information
          content:
            application/json:
              schema:
                description: Information on this Orchestrator
                type: object
                properties:
                  remote_orchestrator_info:
                    description: Wrapper of the result
                    type: object
                    properties:
                      orchestrator-version:
                        description: Orchestrator version
                        type: string
                      platform:
                        description: Platform of the Ruby runtime, e.g. `x86_64-pc-linux-gnu`
                        type: string
                      engine_id:
                        description: ID of the engine
                        type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/test_step/{id}:
    get:
      operationId: test_step
      summary: Launch test cases for a workflow step
      description: |
        Launches test cases against a workflow and returns a **Test_run_id** UUID.
        Pass that UUID to `/api/test_step_status` to poll for results.
      tags:
        - Testing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID or portable ID to test
          example: my_workflow
        - name: step
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated step name(s) to test. Omit to test all steps.
          example:
            - Get file size
        - name: case
          in: query
          schema:
            type: string
          description: Test case name to run. Omit to run all cases for the step.
          example: File doesnt exist
        - name: synchronous
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: '`true`: wait for all test cases to complete before returning'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Test run launched. Response contains `Test_run_id` UUID to use with `/api/test_step_status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
        '404':
          description: Workflow not found
  /api/test_step_status/{id}:
    get:
      operationId: test_step_status
      summary: Get test step status
      description: |
        Poll the status of a test run previously launched by `/api/test_step`.
        The `id` parameter must be the **Test_run_id UUID** returned by that call, not a numeric workflow or step ID.
      tags:
        - Testing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Test run UUID returned by /api/test_step (e.g. 935e0080-97f5-0135-26f8-34363bc6aedc)
          example: 935e0080-97f5-0135-26f8-34363bc6aedc
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Test status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_order_stats/{id}:
    get:
      operationId: work_order_stats
      summary: Work order statistics, monthly or for a day
      description: Returns the text `No Statistics found. Change the filter and try again.` when there is none.
      tags:
        - Statistics
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: workflow_id
          in: query
          schema:
            type: integer
          description: Only this workflow
        - name: label
          in: query
          schema:
            type: string
          description: Only work orders with this label
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: 'Statistics of this day, e.g. `2017-04-04`. Not set: monthly statistics.'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Work order statistics
          content:
            application/json:
              schema:
                type: array
                description: By day (monthly statistics of the last 30 days), or by hour (statistics of a day). The sums are decimal strings.
                items:
                  type: object
                  properties:
                    Date:
                      description: Day of the statistics
                      type: string
                    Last_hour:
                      description: Hour of the statistics, for the statistics of a day
                      type: string
                      format: date-time
                    Complete_Work_Orders:
                      description: Work orders with status `Complete`
                      type: [string, integer]
                    Failed_Work_Orders:
                      description: Work orders with status `Failed`
                      type: [string, integer]
                    Errored_Work_Orders:
                      description: Work orders with status `Error`
                      type: [string, integer]
                    Canceled_Work_Orders:
                      description: Work orders with status `Canceled`
                      type: [string, integer]
                    Rolled_Back_Work_Orders:
                      description: Work orders with status `Rolled-back`
                      type: [string, integer]
                    Destroyed_Work_Orders:
                      description: Work orders with status `Destroyed`
                      type: [string, integer]
                    Cleared_Work_Orders:
                      description: Work orders with status `Cleared`
                      type: [string, integer]
                    Flagged_Work_Orders:
                      description: Work orders with status `Flagged`
                      type: [string, integer]
                    Initializing_Work_Orders:
                      description: Work orders with status `Initializing`
                      type: [string, integer]
                    Initialized_Work_Orders:
                      description: Work orders with status `Initialized`
                      type: [string, integer]
                    Created_Work_Orders:
                      description: Work orders with status `Created`
                      type: [string, integer]
                    Ready_Work_Orders:
                      description: Work orders with status `Ready`
                      type: [string, integer]
                    In_Progress_Work_Orders:
                      description: Work orders with status `In Progress`
                      type: [string, integer]
                    Unknown_Work_Orders:
                      description: Work orders with status `Unknown`
                      type: [string, integer]
            text/plain:
              schema:
                description: Message when there is no statistic
                type: string
                const: No Statistics found. Change the filter and try again.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_step_stats/{id}:
    get:
      operationId: work_step_stats
      summary: Work step statistics, monthly or for a day
      description: 'Returns the text `No Statistics found. Change the filter and try again.` when there is none. The filters are inserted as is in an SQL condition (`workflow_id in (...)`): give comma-separated numbers or quoted values.'
      tags:
        - Statistics
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: workflow_id
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          description: Comma-separated workflow IDs
        - name: step_id
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          description: Comma-separated step IDs
        - name: step_type
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated step types, quoted (e.g. `'CustomRuby'`)
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: 'Statistics of this day, e.g. `2017-04-04`. Not set: monthly statistics.'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Work step statistics
          content:
            application/json:
              schema:
                type: array
                description: By day (monthly statistics of the last 30 days), or by hour (statistics of a day). The sums are decimal strings.
                items:
                  type: object
                  properties:
                    Date:
                      description: Day of the statistics
                      type: string
                    Last_hour:
                      description: Hour of the statistics, for the statistics of a day
                      type: string
                      format: date-time
                    Completed_Steps:
                      description: Work steps with status `Complete`
                      type: [string, integer]
                    Failed_Steps:
                      description: Work steps with status `Failed`
                      type: [string, integer]
                    Errored_steps:
                      description: Work steps with status `Error`
                      type: [string, integer]
                    Obsolete_Steps:
                      description: Work steps with status `Obsolete`
                      type: [string, integer]
                    Activating_Steps:
                      description: Work steps with status `Activating`
                      type: [string, integer]
                    In_Progress_Steps:
                      description: Work steps with status `In Progress`
                      type: [string, integer]
                    Paused_Steps:
                      description: Work steps with status `Paused`
                      type: [string, integer]
                    Pausing_Steps:
                      description: Work steps with status `Pausing`
                      type: [string, integer]
                    Canceling_Steps:
                      description: Work steps with status `Canceling`
                      type: [string, integer]
                    Resuming_Steps:
                      description: Work steps with status `Resuming`
                      type: [string, integer]
                    Rolling_Back_Steps:
                      description: Work steps with status `Rolling Back`
                      type: [string, integer]
                    Undefined_Steps:
                      description: Work steps with status `Undefined`
                      type: [string, integer]
            text/plain:
              schema:
                description: Message when there is no statistic
                type: string
                const: No Statistics found. Change the filter and try again.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/journal_files/{id}:
    get:
      operationId: journal_files
      summary: Files recorded in a journal book
      description: Lists the files recorded in a journal book, grouped by package, with the steps that processed each file.
      tags:
        - Journals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Journal book name or ID
        - name: details
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: '`false`: without the states (steps) of each file'
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated statuses, e.g. `In Progress,Processing complete`
        - name: file
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated file paths
        - name: package
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated package names (not with `package_id`)
        - name: package_id
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          description: Comma-separated package IDs (not with `package`)
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Journal entries
          content:
            application/json:
              schema:
                description: Journal book and its files
                type: object
                properties:
                  Journal:
                    description: The journal book
                    type: object
                    properties:
                      name:
                        description: Journal book name
                        type: string
                      id:
                        description: Journal book ID
                        type: integer
                      description:
                        description: Description of the journal book
                        type: [string, 'null']
                      active:
                        description: '`true` when the journal book records files'
                        type: [boolean, 'null']
                  Packages:
                    type: array
                    description: Only when the journal has packages
                    items:
                      type: object
                      properties:
                        name:
                          description: Package name
                          type: string
                        id:
                          description: Package ID
                          type: integer
                        files:
                          description: Files of the package
                          type: array
                          items:
                            $ref: '#/components/schemas/JournalFile'
                  Files:
                    type: array
                    description: Files without package
                    items:
                      $ref: '#/components/schemas/JournalFile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/add_resource/{id}:
    get:
      operationId: add_resource
      summary: Add a resource to a resource pool
      description: Adds a resource to a resource pool.
      tags:
        - Resources
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/ResourceName'
        - name: capacity
          in: query
          schema:
            type: integer
            default: 1
          description: Capacity of the resource
        - name: tags
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated tags
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The new resource
          content:
            application/json:
              schema:
                description: The new resource
                type: object
                properties:
                  ManagedResource:
                    $ref: '#/components/schemas/ManagedResource'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/edit_resource_capacity/{id}:
    get:
      operationId: edit_resource_capacity
      summary: Change the capacity of a resource
      description: Sets the capacity of one resource of a pool.
      tags:
        - Resources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: New capacity, a positive integer
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/ResourceName'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The resource
          content:
            application/json:
              schema:
                description: The resource
                type: object
                properties:
                  ManagedResource:
                    $ref: '#/components/schemas/ManagedResource'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/edit_pool_capacity/{id}:
    get:
      operationId: edit_pool_capacity
      summary: Change the capacity of a resource pool
      description: Sets the capacity of all the resources of a pool.
      tags:
        - Resources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: New capacity, a positive integer
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The resources of the pool
          content:
            application/json:
              schema:
                description: The resources of the pool
                type: object
                properties:
                  ManagedResource:
                    description: Resources of the pool
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagedResource'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/resource_online/{id}:
    get:
      operationId: resource_online
      summary: Take a resource online
      description: Puts a resource back in use.
      tags:
        - Resources
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/ResourceName'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The resource is online
          content:
            application/json:
              schema:
                description: New status of the resource
                type: object
                properties:
                  ManagedResource:
                    type: object
                    description: Resource ID (with `>` replaced by `-`) to new status
                    additionalProperties:
                      const: Online
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/resource_offline/{id}:
    get:
      operationId: resource_offline
      summary: Take a resource offline
      description: Takes a resource out of use. Steps do not get it until it is online again.
      tags:
        - Resources
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/ResourceName'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The resource is offline
          content:
            application/json:
              schema:
                description: New status of the resource
                type: object
                properties:
                  ManagedResource:
                    type: object
                    description: Resource ID (with `>` replaced by `-`) to new status
                    additionalProperties:
                      const: Offline
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/pool_status/{id}:
    get:
      operationId: pool_status
      summary: Resources of a resource pool and their status
      description: Lists the resources of a pool with their use and capacity.
      tags:
        - Resources
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Name of the resource pool (with or without the suffix `__a` of the database)
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Pool status
          content:
            application/json:
              schema:
                description: Resources of the pool
                type: object
                properties:
                  ManagedResource:
                    description: Resources
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Resource name
                        taken:
                          description: Units in use (sum of the reservations)
                          type: integer
                        capacity:
                          description: Capacity of the resource
                          type: integer
                        status:
                          description: '`online` or `offline`'
                          type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/create_user/{id}:
    post:
      operationId: create_user
      summary: Create a user
      description: The response is JSON unless format is `xml`.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: The new user
              type: object
              required:
                - login
                - password
                - email
              properties:
                login:
                  type: string
                  description: Login of the user
                password:
                  description: Password of the user
                  type: string
                  format: password
                first_name:
                  description: First name
                  type: string
                last_name:
                  description: Last name
                  type: string
                email:
                  type: string
                  format: email
                  description: Email of the user, unique
                phone:
                  description: Phone number
                  type: string
                SMS:
                  description: Number for SMS notifications
                  type: string
                is_active:
                  description: '`true` to let the user log in'
                  type: boolean
                  default: false
                require_password_change_on_login:
                  description: '`true` to make the user change the password at the first login'
                  type: boolean
                  default: false
                alternate_emails:
                  description: Other email addresses of the user
                  type: array
                  items:
                    type: string
                    format: email
                groups:
                  type: array
                  description: Names of existing groups
                  items:
                    type: string
      responses:
        '200':
          description: Confirmation message
          content:
            application/json:
              schema:
                description: Result
                type: object
                properties:
                  create_user:
                    description: Wrapper of the result
                    type: object
                    properties:
                      success:
                        description: Confirmation message
                        type: string
                        examples:
                          - User 'jdoe' was successfully created.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/login endpoint
    basicAuth:
      type: http
      scheme: basic
      description: Login and password, when JWT authentication is disabled
    loginQuery:
      type: apiKey
      in: query
      name: login
      description: User login, with `password` or `api_key`, when JWT authentication is disabled
    passwordQuery:
      type: apiKey
      in: query
      name: password
      description: User password, when JWT authentication is disabled
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: API key of the user, when JWT authentication is disabled
  parameters:
    Format:
      name: format
      in: query
      schema:
        type: string
        enum:
          - xml
          - json
        default: xml
      description: Response format (also given by the extension `.json` or `.xml` of the path)
    AnyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples:
          - "0"
      description: Not used by the endpoint, but required by the route (any value, e.g. `0`)
    MonitorType:
      name: monitor_type
      in: query
      required: true
      schema:
        type: string
        enum:
          - workflow
          - workorder
          - folder
          - node
          - script
      description: Type of monitor (also accepted `work_order`, `remotenode`, `remote_node`, `remotescript`, `remote_script`)
    PoolName:
      name: pool_name
      in: query
      required: true
      schema:
        type: string
      description: Name of the resource pool
    ResourceName:
      name: resource_name
      in: query
      required: true
      schema:
        type: string
      description: Name of the resource, e.g. an IP address
  schemas:
    Error:
      type: object
      description: 'Error of an API call in format `json`. In format `xml`: `<error time="..." action="..." id="...">message</error>`.'
      required:
        - error
      properties:
        error:
          description: Details of the error
          type: object
          required:
            - action
            - time
            - id
            - description
          properties:
            action:
              type: string
              description: Called endpoint
            time:
              type: string
              description: UTC time
              examples:
                - '2026-10-21 08:30:00'
            id:
              type: string
              description: The `id` of the call, or `0`
            description:
              type: string
              description: Error message and backtrace
    Workflow:
      type: object
      description: Workflow (database record)
      properties:
        id:
          description: Workflow ID
          type: integer
        name:
          description: Workflow name
          type: string
        portable_id:
          description: Portable ID, kept across export and import
          type: [string, 'null']
        created_by:
          type: [integer, 'null']
          description: User ID
        folder_id:
          description: Folder of the workflow, `null` at the root
          type: [integer, 'null']
        generated_from:
          type: [integer, 'null']
          description: Published whiteboard, `null` for a draft
        revision_id:
          type: [integer, 'null']
          description: Published revision
        label:
          description: Label of the workflow
          type: [string, 'null']
        run_as:
          description: 'User the work orders run as: `OPERATOR` (the user who starts them), `CREATOR` (the creator of the workflow), `SYSTEM`, or a user login'
          type: [string, 'null']
        source_revision:
          description: '`<name>|<revision ID>` of the published revision, used to match a workflow at import'
          type: [string, 'null']
        comments:
          description: Comments of the workflow
          type: [string, 'null']
        description:
          description: Description of the workflow
          type: [string, 'null']
        tags:
          description: Tags of the workflow
          type: [string, 'null']
        templates:
          description: Templates of the workflow (serialized hash)
          type: [string, 'null']
        max_running:
          description: 'Maximum number of work orders running at the same time, `0` or `null`: no limit'
          type: [integer, 'null']
        cleanup_after_days:
          description: Days after which the work orders are cleaned up, copied to each work order
          type: [integer, 'null']
        purge_after_days:
          description: Days after which the work orders are purged, copied to each work order
          type: [integer, 'null']
        user_lock:
          description: '`true` when a user has locked the workflow for editing'
          type: [boolean, 'null']
        locked_by:
          description: User ID of the user who locked the workflow
          type: [integer, 'null']
        created_at:
          description: Creation time
          type: string
          format: date-time
        updated_at:
          description: Last update
          type: string
          format: date-time
    WorkOrder:
      type: object
      description: Work order (database record)
      properties:
        id:
          description: Work order ID
          type: integer
        name:
          description: Work order name
          type: [string, 'null']
        monitor_id:
          description: Workflow monitor that started the work order, if any
          type: [integer, 'null']
        workflow_id:
          description: Workflow ID
          type: [integer, 'null']
        workflow_revision_id:
          description: Revision of the workflow that runs
          type: [integer, 'null']
        workflow_name:
          description: Workflow name
          type: [string, 'null']
        branched_from_order:
          type: [integer, 'null']
          description: Parent work order, for a sub-workflow
        branched_from:
          type: [integer, 'null']
          description: Parent work step, for a sub-workflow
        forked_at:
          description: For a work order restarted from a step, the step ID it restarted from
          type: [integer, 'null']
        derived_from:
          description: For a work order restarted from a step, the original work order
          type: [integer, 'null']
        master_id:
          description: First work order of the group of restarts (its own ID when not restarted)
          type: [integer, 'null']
        launched_by:
          type: [integer, 'null']
          description: User ID
        initiated_by:
          type: [integer, 'null']
          description: User ID
        running_as:
          description: User ID the work order runs as (see `run_as` of the workflow)
          type: [integer, 'null']
        priority:
          description: 'Priority: 1 low, 2 medium (default), 3 high'
          type: [integer, 'null']
        exec_priority:
          description: Order of execution in the queue of the engine, computed from `priority` (lower runs first)
          type: [number, 'null']
        higher_priority:
          description: '`true` when the work order runs on a dedicated worker'
          type: [boolean, 'null']
        label:
          description: Label of the work order, used as a filter by `work_order_stats`
          type: [string, 'null']
        status:
          description: Status of the work order
          type: [string, 'null']
          examples:
            - In Progress
        status_details:
          description: Details of the status
          type: [string, 'null']
        comments:
          description: Comments of the work order
          type: [string, 'null']
        tags:
          type: [string, 'null']
          description: Tags separated by `|`, e.g. `|tag1|tag2|`
        initiate_date:
          description: Start time
          type: [string, 'null']
          format: date-time
        completion_date:
          description: End time
          type: [string, 'null']
          format: date-time
        max_running:
          description: Maximum number of running work orders of the workflow (parameter `WORK_ORDER_MAX_RUNNING`, or the value of the workflow)
          type: [integer, 'null']
        cleanup_after_days:
          description: Days after which the work order is cleaned up
          type: [integer, 'null']
        purge_after_days:
          description: Days after which the work order is purged
          type: [integer, 'null']
        created_at:
          description: Creation time
          type: string
          format: date-time
        updated_at:
          description: Last update
          type: string
          format: date-time
    WorkStepBase:
      type: object
      description: Work step (database record), common columns
      properties:
        id:
          description: Work step ID
          type: integer
        action_id:
          description: Template (action) used by the step
          type: [integer, 'null']
        step_id:
          description: Step ID in the workflow revision
          type: [integer, 'null']
        step_type:
          type: [string, 'null']
          description: Plugin class name, e.g. `CustomRuby`
        step_name:
          description: Step name
          type: [string, 'null']
        work_step_name:
          description: Step name, as shown in the work order
          type: [string, 'null']
        attempt:
          description: Number of executions, retries included
          type: [integer, 'null']
        execution_timeout:
          description: Timeout of the current execution, in seconds (the step timeout, else the template timeout, else the default)
          type: [integer, 'null']
        group:
          description: Work order the step belongs to, or the original work order for a restarted one
          type: [integer, 'null']
        percent_complete:
          description: Progress of the step, 0 to 100
          type: [integer, 'null']
        rank:
          description: Display order of the step
          type: [integer, 'null']
        running_as:
          description: For a step of a sub-workflow, the work step of the parent work order that called it
          type: [integer, 'null']
        synch_filter:
          description: Number of incoming links that must be complete before the step starts
          type: [integer, 'null']
        timeout:
          description: Timeout of the step, in seconds, as set in the workflow
          type: [integer, 'null']
        weight:
          description: Percentage of the work order completed when this step ends, for `percent_complete` of the work order
          type: [integer, 'null']
        activation_time:
          description: Start time, in seconds since the epoch
          type: [number, 'null']
        on_timeout:
          description: 'Status set when the timeout is reached: `Pass` (Complete), `Fail` (Failed, the default), `Error`, or `Raise` (Error, and the timeout action of the work order)'
          type: [string, 'null']
        status:
          description: 'Status: `Inactive`, `Activating`, `In Progress`, `Paused`, `Pausing`, `Resuming`, `Canceling`, `Rolling Back`, `Complete`, `Failed`, `Error`, `Obsolete`, `Undefined`; `False` for the end step'
          type: [string, 'null']
        status_details:
          description: Details of the status
          type: [string, 'null']
        prerequisites:
          description: Links from the previous steps (YAML)
          type: [string, 'null']
        episteps:
          description: Links to the next steps (YAML)
          type: [string, 'null']
        journaling:
          description: Journal settings of the step
          type: [string, 'null']
        work_inputs:
          description: Inputs (YAML)
          type: [string, 'null']
        work_outputs:
          description: Outputs (YAML)
          type: [string, 'null']
        activable_date:
          description: Time the step was made ready to run, `null` when not ready
          type: [string, 'null']
          format: date-time
        activation_date:
          description: Start of the current execution
          type: [string, 'null']
          format: date-time
        original_activation_date:
          description: Start of the first execution, kept on retries
          type: [string, 'null']
          format: date-time
        completion_date:
          description: End time
          type: [string, 'null']
          format: date-time
        created_at:
          description: Creation time
          type: string
          format: date-time
        updated_at:
          description: Last update
          type: string
          format: date-time
    WorkStep:
      description: Work step (database record)
      allOf:
        - $ref: '#/components/schemas/WorkStepBase'
      properties:
        work_order_id:
          description: Work order ID
          type: [integer, 'null']
        workflow_id:
          description: Workflow ID
          type: [integer, 'null']
        pre_processing:
          description: Ruby code run before the step, as set in the workflow
          type: [string, 'null']
        post_processing:
          description: Ruby code run after the step, as set in the workflow
          type: [string, 'null']
    WorkStepStatus:
      description: Work step in `work_order_status`, without `workflow_id`, `pre_processing` and `post_processing`
      allOf:
        - $ref: '#/components/schemas/WorkStepBase'
      properties:
        percent_complete:
          type: integer
          description: 0 for a running step, 100 for a finished step, when not set
        category:
          type: string
          description: Category of the plugin, e.g. `Basic/Ruby`, or `-`
        work_order_id:
          type: [integer, string]
          description: 'Only for steps of type `SubWorkflow`, `WorkflowLauncher` and `FederatedWorkflow`: the launched work order, or `-`'
        node_id:
          type: string
          description: 'Only for `FederatedWorkflow`: execution node, or `-`'
        address:
          type: string
          description: 'Only for `FederatedWorkflow`: execution address, or `-`'
    WorkOrderWithSteps:
      description: Work order and its work steps
      type: object
      properties:
        work_order:
          $ref: '#/components/schemas/WorkOrder'
        work_steps:
          description: Work steps of the work order
          type: array
          items:
            $ref: '#/components/schemas/WorkStep'
    WorkstepReset:
      allOf:
        - $ref: '#/components/schemas/WorkOrderWithSteps'
      properties:
        workstep_reset:
          description: Always `true`
          const: true
    StepVariable:
      type: object
      description: Input or output of a work step
      properties:
        value:
          type: [string, integer, number, boolean, array, object, 'null']
          description: 'Value, of the type given by `type`: integer for `int`, number for `float`, boolean for `flag`, array for `array`, object for `hash`, string for the others'
        name:
          description: Variable name
          type: string
        id:
          description: Variable ID
          type: integer
        type:
          type: string
          description: Value type
    QueuedItem:
      type: object
      description: Item of a queue (database record, without the columns of the queue)
      properties:
        id:
          description: ID of the queued item
          type: integer
        queued_item:
          type: [string, integer, number, boolean, array, object, 'null']
          description: The queued item, decoded from YAML. A string for an item added with `queue_item`, any type for an item added by a workflow.
        item_description:
          description: Description of the item
          type: [string, 'null']
        priority:
          description: Priority of the item
          type: [integer, 'null']
        weight:
          description: Weight of the item
          type: [integer, 'null']
        position:
          description: Sort key of the item in the queue
          type: [integer, 'null']
        rank:
          type: [integer, 'null']
          description: Position in the queue, from 0
        originator_type:
          description: Not used for items
          type: [string, 'null']
        originator_id:
          description: Not used
          type: [integer, 'null']
        tags:
          description: Tags of the item
          type: [string, 'null']
        created_at:
          description: Time the item was queued
          type: string
          format: date-time
        updated_at:
          description: Last update
          type: string
          format: date-time
    QueueMetadata:
      description: Attributes of the queue
      type: object
      properties:
        id:
          type: string
          description: Queue name given in the call (`queued_items` only)
        name:
          type: string
          description: Displayed name of the queue
        comments:
          description: Comments of the queue
          type: [string, 'null']
        administrators:
          description: Users and groups who administer the queue
          type: object
          properties:
            groups:
              description: Group IDs
              type: array
              items:
                type: integer
            users:
              description: User IDs
              type: array
              items:
                type: integer
        paused:
          description: '`true` when the queue is paused: no item is taken'
          type: [boolean, 'null']
    QueuedItems:
      description: Items of a queue and the queue attributes
      type: object
      properties:
        queued_items:
          description: Items, in queue order
          type: array
          items:
            $ref: '#/components/schemas/QueuedItem'
        queue_metadata:
          $ref: '#/components/schemas/QueueMetadata'
    Task:
      type: object
      description: Task, i.e. a user input waiting for a user (database record)
      properties:
        id:
          description: Task ID
          type: integer
        state_id:
          type: [integer, 'null']
          description: Work step ID
        user_input_id:
          description: User input template of the step
          type: [integer, 'null']
        role_id:
          type: [integer, 'null']
          description: Group ID
        user_id:
          description: User the task is assigned to
          type: [integer, 'null']
        status:
          description: Status of the task
          type: [string, 'null']
        completed_by:
          type: [integer, 'null']
          description: User ID
        created_at:
          description: Creation time
          type: string
          format: date-time
        updated_at:
          description: Last update
          type: string
          format: date-time
    UserInput:
      type: object
      properties:
        name:
          description: Input name, the key in `outputs` of `submit_task`
          type: string
        type:
          type: string
          description: Value type
          enum: [int, float, string, array, hash, flag, date, object, pwd, attachment]
        value:
          type: [string, integer, number, boolean, array, object, 'null']
          description: 'Current value, of the type given by `type`: integer for `int`, number for `float`, boolean for `flag`, array for `array`, object for `hash`, string for the others'
        required:
          description: '`true` when the input must be given'
          type: boolean
    TaskUserInputs:
      type: object
      description: >-
        Values of the user inputs of a task: one key per user input, as listed in `user_inputs` of `task_details` (`name`, `type`, `required`).
        All inputs with `required: true` must be given, else Orchestrator refuses with `Missing data for <names>`.
        Values are sent as text and converted by Orchestrator to the type of the input:
        `int` (e.g. `-12`), `float` (e.g. `1.5`), `flag` (`true` or `false`), `date` (e.g. `2026-01-31 10:00:00`),
        `hash` (JSON or Ruby hash, starts with `{`), `array` (JSON array, or items separated by `;`),
        `string`, `object` (YAML), `pwd` (password).
        For an input with `required: true`, a value that does not match the type is refused (`Invalid output type(s)`).
        An input not given is overwritten with the conversion of the text `nil` (e.g. `0` for an `int`).
      additionalProperties: true
      examples:
        - Retries: '3'
          Ratio: '1.5'
          Filename: tron.avi
          Files: '["a.mov","b.mov"]'
          Options: '{"quality":"high"}'
          Approved: 'true'
          Deadline: '2026-01-31 10:00:00'
          Metadata: 'title: Tron'
          Secret: <SECRET>
    MonitorChange:
      description: Result of the activation or deactivation
      type: object
      properties:
        action:
          description: Name of the call
          type: string
          enum:
            - activate_monitor
            - deactivate_monitor
        time:
          type: string
          description: Local time
        id:
          type: string
          description: Monitor ID
        description:
          description: New state of the monitor
          type: string
          enum:
            - activated
            - deactivated
    PluginReloadStatus:
      type: object
      description: 'Plugin class name, or `All Plugins`, to `true`, `false` or an error message'
      additionalProperties:
        type: [boolean, string]
    ProcessNode:
      type: object
      properties:
        id:
          description: Node ID
          type: string
        name:
          description: Node name
          type: string
        current:
          description: '`true` for the node that answers the call'
          type: string
          enum:
            - 'true'
            - 'false'
        process:
          description: Processes of the node
          type: array
          items:
            type: object
            properties:
              class:
                description: Process type
                type: string
                enum:
                  - engine
                  - monitor
                  - process_manager
                  - node_mesh
                  - worker
              id:
                type: string
                description: Worker ID
              pid:
                type: string
                description: '`-` when not running'
              status:
                description: Whether the process runs
                type: string
              type:
                type: string
                description: Worker type
                enum:
                  - normal
                  - asynchronous
                  - dedicated
    AlertNotification:
      type: object
      properties:
        id:
          description: Alert ID
          type: integer
        category_id:
          type: [integer, 'null']
          description: 'Category: 1 `WorkflowAlerts`, 2 `UserAlerts`, 3 `WorkorderAlerts`, 4 `MonitorAlerts`, 5 `PluginAlerts`'
        alert_header:
          description: Title of the alert
          type: [string, 'null']
        alert_description:
          description: Text of the alert
          type: [string, 'null']
        created_at:
          description: Time of the alert
          type: string
          format: date-time
        updated_at:
          description: Last update
          type: string
          format: date-time
    TestRun:
      description: Test run and, when finished, its results
      type: object
      properties:
        Test_run_id:
          description: ID of the test run, for `test_step_status`
          type: string
          format: uuid
        Workflow_id:
          description: Tested workflow
          type: [integer, 'null']
        Test_cases_launched:
          description: Number of test cases started
          type: integer
        Steps:
          type: array
          description: Only when synchronous, and in `test_step_status`
          items:
            type: object
            properties:
              Step_name:
                description: Tested step
                type: string
              Result:
                description: '`true` when all the test cases of the step passed'
                type: boolean
              Test_cases:
                description: Test cases of the step
                type: array
                items:
                  type: object
                  properties:
                    Id:
                      description: Test case ID
                      type: integer
                    Name:
                      description: Test case name
                      type: string
                    status:
                      description: Status of the test execution
                      type: string
                    Status_details:
                      description: Details of the status
                      type: [string, 'null']
                    Result_message:
                      description: Explanation of the result
                      type: [string, 'null']
                    Last_update:
                      description: Last update
                      type: string
                      format: date-time
                    Inputs:
                      type: object
                      description: Inputs of the test case (name to value), empty if none
                      additionalProperties: true
                    Outputs:
                      type: object
                      description: Outputs of the test case (name to value), `null` values until the test case has run
                      additionalProperties: true
                    Result:
                      description: '`true` when the test case passed, `null` until it has run'
                      type: [boolean, 'null']
        Result:
          type: boolean
          description: Only when synchronous, and in `test_step_status`
    JournalFile:
      type: object
      properties:
        file_id:
          description: File ID in the journal
          type: integer
        file:
          description: Path of the file
          type: string
        status:
          description: Status of the file, e.g. `In Progress`, `Processing complete`
          type: [string, 'null']
        status_details:
          description: Details of the status
          type: [string, 'null']
        created_at:
          description: Time the file was recorded
          type: string
          format: date-time
        updated_at:
          description: Last update
          type: string
          format: date-time
        states:
          type: array
          description: Steps that processed the file, unless `details=false`
          items:
            type: object
            properties:
              path:
                description: Path of the file in this step
                type: [string, 'null']
              status:
                description: Status of the file in this step
                type: [string, 'null']
              status_details:
                description: Details of the status
                type: [string, 'null']
              progress:
                description: Progress, 0 to 100
                type: [integer, 'null']
              work_step_id:
                description: Work step ID
                type: [integer, 'null']
              work_order_id:
                description: Work order ID
                type: [integer, 'null']
              step_name:
                description: Step name
                type: [string, 'null']
              workflow_id:
                description: Workflow ID
                type: [integer, 'null']
              workflow_name:
                description: Workflow name
                type: [string, 'null']
              created_at:
                description: Time of the state
                type: string
                format: date-time
    ManagedResource:
      type: object
      description: Resource of a resource pool (database record)
      properties:
        id:
          description: Record ID
          type: integer
        resource_id:
          description: Resource name (`resource_name` of the calls)
          type: string
        resource_name:
          type: string
          description: Pool name, with the suffix `__a`
        status:
          description: '`online` or `offline`, `null` for online'
          type: [string, 'null']
        max:
          type: [integer, 'null']
          description: Capacity
        reserved:
          description: Units reserved by running steps
          type: [integer, 'null']
        properties:
          description: Properties of the resource (serialized)
          type: [string, 'null']
        tags:
          description: Tags of the resource
          type: [string, 'null']
        created_at:
          description: Creation time
          type: string
          format: date-time
        updated_at:
          description: Last update
          type: string
          format: date-time
  responses:
    UnauthorizedError:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            description: JWT error, or the error body of the API
            anyOf:
              - title: JWT authentication
                type: object
                properties:
                  error:
                    description: Error message
                    type: string
                    examples:
                      - Unauthorized
              - $ref: '#/components/schemas/Error'
    Error:
      description: 'Error: status 403 when access is denied, else 404 when the server option `strict_api_validation` is set, else 200 (see Errors in the introduction)'
      content:
        application/json:
          schema:
