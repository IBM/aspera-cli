                $ref: '#/components/schemas/QueuedItems'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/bulk_reorder_queue:
    get:
      operationId: bulk_reorder_queue
      summary: Move several queued items
      description: Moves several items of a queue up, down, first or last.
      tags:
        - Queues
      parameters:
        - name: queued_item_ids
          in: query
          style: form
          explode: false
          required: true
          schema:
            type: array
            items:
              type: integer
          description: Comma-separated IDs of queued items
        - name: operation
          in: query
          required: true
          schema:
            type: string
            enum:
              - up
              - down
              - first
              - last
          description: Move
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The moved items
          content:
            application/json:
              schema:
                description: Moved items
                type: object
                properties:
                  queued_items:
                    description: Each moved item with its queue
                    type: array
                    items:
                      type: object
                      properties:
                        queued_item:
                          $ref: '#/components/schemas/QueuedItem'
                        queue_data:
                          $ref: '#/components/schemas/QueueMetadata'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/delete_queued_item:
    get:
      operationId: delete_queued_item
      summary: Delete a queued item
      description: Deletes one item from a queue.
      tags:
        - Queues
      parameters:
        - name: queue_name
          in: query
          required: true
          schema:
            type: string
          description: Queue name
        - name: queued_item_id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the queued item
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Confirmation message
          content:
            application/json:
              schema:
                type: string
                description: Plain text, not JSON-encoded, although the content type is `application/json`
