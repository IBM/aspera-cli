                  weight:
                    description: Weight of the item
                    type: integer
                  id:
                    description: ID of the queued item
                    type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/lookup_queued_item:
    get:
      operationId: lookup_queued_item
