        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/monitor_snapshot:
    get:
      operationId: monitor_snapshot
      summary: Status of the monitors
      description: Returns the state of the monitors, by type, as shown on the Monitors page.
      tags:
        - Monitors
      parameters:
        - name: id
          in: query
          schema:
            type: string
            enum:
              - workflows
              - workorders
              - folders
              - nodes
              - scripts
          description: 'Only monitors of this type (also in the path `/api/monitor_snapshot/<type>`). Not set: all.'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Monitor snapshot data
          content:
            application/json:
              schema:
                description: Monitors by type
                type: object
                properties:
                  monitor:
                    description: Monitors by type, each type empty when there is no monitor of this type
                    type: object
                    properties:
                      monitor_workflows:
                        type: object
                        description: Empty when there is no monitor
                        properties:
                          monitor_workflow:
                            description: Workflow monitors
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  description: Monitor ID
                                  type: integer
                                workflow_id:
                                  description: Monitored workflow
                                  type: integer
                                workflow_name:
                                  description: Name of the monitored workflow
                                  type: string
                                last_activity:
                                  type: string
                                  description: Last activity of the workflow or work order (`YYYY-MM-DD HH:MM:SS`), `-` if none. Only when active.
                                active:
                                  description: '`true` when the monitor is on'
                                  type: boolean
                                status:
                                  type: string
                                  description: 'Status of the monitor: `Monitoring Off`, `No Issues`, `Alerts`, `Warnings`, or `Fetching` (remote node monitor)'
                                  examples:
                                    - No Issues
                                status_report:
                                  type: string
                                  description: Status text of the monitor, `-` when there is nothing to report. Only when active.
                                last_polled:
                                  type: [string, 'null']
                                  format: date-time
                                  description: Time of the last refresh of the status. Only when active.
                      monitor_workorders:
                        type: object
                        description: Empty when there is no monitor
                        properties:
                          monitor_workorder:
                            description: Work order monitors
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  description: Monitor ID
                                  type: integer
                                workflow_id:
                                  description: Workflow of the monitored work orders
                                  type: integer
                                workflow_name:
                                  description: Name of that workflow
                                  type: string
                                last_activity:
                                  type: string
                                  description: Last activity of the workflow or work order (`YYYY-MM-DD HH:MM:SS`), `-` if none. Only when active.
                                active:
                                  description: '`true` when the monitor is on'
                                  type: boolean
                                status:
                                  type: string
                                  description: 'Status of the monitor: `Monitoring Off`, `No Issues`, `Alerts`, `Warnings`, or `Fetching` (remote node monitor)'
                                  examples:
                                    - No Issues
                                status_report:
                                  type: string
                                  description: Status text of the monitor, `-` when there is nothing to report. Only when active.
                                last_polled:
                                  type: [string, 'null']
                                  format: date-time
                                  description: Time of the last refresh of the status. Only when active.
                      monitor_folders:
                        type: object
                        description: Empty when there is no monitor
                        properties:
                          monitor_folder:
                            description: Folder monitors
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  description: Monitor ID
                                  type: integer
                                folder:
                                  type: string
                                  description: Description of the monitor
                                path:
                                  description: Monitored folder
                                  type: string
                                content:
                                  type: string
                                  description: Number of files and folders, e.g. `3 files, 1 folders`, or `-`. Only when active.
                                age_range:
                                  type: string
                                  description: Age of the youngest and oldest entries, with the aging unit of the monitor, or `-`. Only when active.
                                active:
                                  description: '`true` when the monitor is on'
                                  type: boolean
                                status:
                                  type: string
                                  description: 'Status of the monitor: `Monitoring Off`, `No Issues`, `Alerts`, `Warnings`, or `Fetching` (remote node monitor)'
                                  examples:
                                    - No Issues
                                status_report:
                                  type: string
                                  description: Status text of the monitor, `-` when there is nothing to report. Only when active.
                                last_polled:
                                  type: [string, 'null']
                                  format: date-time
                                  description: Time of the last refresh of the status. Only when active.
                      monitor_nodes:
                        type: object
                        description: Empty when there is no monitor
                        properties:
                          monitor_node:
                            description: Remote node monitors
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  description: Monitor ID
                                  type: integer
                                name:
                                  description: Monitor name
                                  type: string
                                remote_node:
                                  description: Name of the monitored remote node
                                  type: string
                                active:
                                  description: '`true` when the monitor is on'
                                  type: boolean
                                status:
                                  type: string
                                  description: 'Status of the monitor: `Monitoring Off`, `No Issues`, `Alerts`, `Warnings`, or `Fetching` (remote node monitor)'
                                  examples:
                                    - No Issues
                                status_report:
                                  type: string
                                  description: Status text of the monitor, `-` when there is nothing to report. Only when active.
                                last_polled:
                                  type: [string, 'null']
                                  format: date-time
                                  description: Time of the last refresh of the status. Only when active.
                      monitor_scripts:
                        type: object
                        description: Empty when there is no monitor
                        properties:
                          monitor_script:
                            description: Remote script monitors
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  description: Monitor ID
                                  type: integer
                                script:
                                  type: string
                                  description: Description of the monitor
                                node:
                                  description: Remote node that runs the script
                                  type: string
                                path:
                                  description: Path of the script on the remote node
                                  type: string
                                active:
                                  description: '`true` when the monitor is on'
                                  type: boolean
                                status:
                                  type: string
                                  description: 'Status of the monitor: `Monitoring Off`, `No Issues`, `Alerts`, `Warnings`, or `Fetching` (remote node monitor)'
                                  examples:
                                    - No Issues
                                status_report:
                                  type: string
                                  description: Status text of the monitor, `-` when there is nothing to report. Only when active.
                                last_polled:
                                  type: [string, 'null']
                                  format: date-time
                                  description: Time of the last refresh of the status. Only when active.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/list_monitors/{id}:
    get:
      operationId: list_monitors
      summary: List the monitors of a type
      description: Lists the monitors of one type with all their attributes.
      tags:
        - Monitors
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/MonitorType'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: List of monitors
          content:
            application/json:
              schema:
                type: array
                description: All the attributes of the monitors. For type `workorder`, each monitor is in an object with key `monitor-workorder`. Remote node monitors give the names of the monitored remote nodes (`remote_node_name`).
                items:
                  type: object
                  description: Attributes of one monitor (depend on the monitor type)
                  additionalProperties: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/activate_monitor/{id}:
    get:
      operationId: activate_monitor
      summary: Activate a monitor
      description: Turns a monitor on.
      tags:
        - Monitors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Monitor ID or portable ID
        - $ref: '#/components/parameters/MonitorType'
        - name: portable_id
          in: query
          schema:
            type: string
