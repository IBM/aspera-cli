                              type: [string, 'null']
                            update_at:
                              description: Last update of the queue (spelled `update_at`)
                              type: string
                              format: date-time
                            created_at:
                              description: Creation of the queue
                              type: string
                              format: date-time
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/queued_items/{id}:
    get:
      operationId: queued_items
