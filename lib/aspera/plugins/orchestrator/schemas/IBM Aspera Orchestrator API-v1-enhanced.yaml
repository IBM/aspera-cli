  /api/list_tasks/{id}:
    get:
      operationId: list_tasks
      summary: Tasks (user inputs) waiting for a user
      description: Lists the active user input tasks assigned to a user, completed by the user, or assigned to a group of the user, with the inputs they request.
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User login or ID, or `self`. Only an administrator can list the tasks of another user.
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                description: Tasks of the user
                type: object
                properties:
                  user:
                    type: string
                    description: Login of the user
                  tasks:
                    description: Tasks
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Task'
                      properties:
                        event:
                          description: Event description of the user input step, with its variables expanded
                          type: string
                        group:
                          type: string
                          description: Group the task is assigned to
                        user:
                          type: string
                          description: User the task is assigned to
                        requested_user_inputs:
                          description: Inputs to give in `submit_task`
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                description: Input name, the key in `outputs` of `submit_task`
                                type: string
                              required:
                                description: '`true` when the input must be given'
                                type: boolean
                              value_type:
                                description: Value type, see `TaskUserInputs`
                                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/task_details/{id}:
    get:
      operationId: task_details
      summary: Details of a task
      description: Returns a task with the parameters it received and its user inputs.
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^(WO)?[0-9]+$
          description: Task ID, or `WO<work order ID>` for the user input of a work order
        - name: step_name
          in: query
          schema:
            type: string
          description: 'With `WO<id>`, step of the user input when the work order has several. Orchestrator 4.1.6 checks that `Step_name` is set and compares `step_name`: give both.'
        - name: Step_name
          in: query
          schema:
            type: string
          description: Same value as `step_name` (see `step_name`)
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                description: Task, its parameters and its user inputs
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
                  task_inputs:
                    type: object
                    description: Parameters received by the task (name to value)
                    additionalProperties: true
                  user_inputs:
                    description: Inputs to give in `submit_task`
                    type: array
                    items:
                      $ref: '#/components/schemas/UserInput'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/submit_task/{id}:
    get:
      operationId: submit_task
      summary: Complete a task with the user inputs
      description: Gives the values of the user inputs and completes the task, so the work order continues.
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Task ID
        - name: outputs
          in: query
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/TaskUserInputs'
          description: Values of the user inputs, e.g. `outputs[Filename]=tron.avi`. All required inputs must be given.
        - name: input_provider
          in: query
          schema:
            type: string
          description: Login of the user who provides the inputs (administrator only)
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The completed task
          content:
            application/json:
              schema:
                description: Completed task and the values given
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
                  user_inputs:
                    type: object
                    description: Values of the user inputs (name to value)
                    additionalProperties: true
                  input_provider:
                    description: Login of the user recorded as provider of the inputs
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/search_tasks/{id}:
    get:
      operationId: search_tasks
      summary: Search the tasks of the current user
      description: Searches the tasks of the current user by a search key.
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: value
          in: query
          required: true
          schema:
            type: string
          description: Search key
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Tasks found
          content:
            application/json:
              schema:
                description: Tasks found
                type: array
                items:
                  anyOf:
                    - title: Task
                      type: object
                      properties:
                        id:
                          description: Task ID
                          type: integer
                        task:
                          $ref: '#/components/schemas/Task'
                        task_inputs:
                          type: object
                          description: Parameters received by the task (name to value)
                          additionalProperties: true
                        user_inputs:
                          description: Inputs to give in `submit_task`
                          type: array
                          items:
                            $ref: '#/components/schemas/UserInput'
                    - title: Task without access
                      type: object
                      properties:
                        id:
                          description: Task ID
                          type: integer
                        error:
                          description: Why the task is not returned
                          type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
