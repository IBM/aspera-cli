        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Monitor activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorChange'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/deactivate_monitor/{id}:
    get:
      operationId: deactivate_monitor
      summary: Deactivate a monitor
      description: Turns a monitor off.
      tags:
        - Monitors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Monitor ID or portable ID
        - $ref: '#/components/parameters/MonitorType'
        - name: portable_id
          in: query
          schema:
            type: string
          description: Portable ID of the monitor, used when the `id` segment is empty
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Monitor deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorChange'
        '401':
