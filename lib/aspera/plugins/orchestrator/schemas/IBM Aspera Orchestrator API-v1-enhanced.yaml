        - name: queued_item
          in: query
          schema:
            type: string
          description: Queued item
        - name: queue_desc
          in: query
          schema:
            type: string
          description: Description of the queued item
        - name: queue_name
          in: query
          schema:
            type: string
          description: Queue name, to restrict the search by `queued_item` or `queue_desc`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Queued items found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedItems'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/reorder_queued_item:
