openapi: 3.1.0
info:
  title: Options of bundle node
  version: 1.0.0
  description: Schema definitions of the options of bundle `node`
  license:
    name: Apache-2.0
    identifier: Apache-2.0
paths: {}
components:
  schemas:
    NodeBearerTokenOptions:
      type: object
      description: >-
        JWT payload used to generate an Aspera Node bearer token (`node bearer_token`).
        `user_id` is the only mandatory field.
        The CLI strips the `_validity` and `_scope` convenience keys before signing;
        remaining fields are embedded verbatim in the token.
      required:
        - user_id
      properties:
        user_id:
          type: string
          description: Identifier of the user for whom the token is generated.
          examples:
            - jdoe # cspell:disable-line
        _validity:
          type: integer
          description: Token lifetime in seconds (convenience key, removed before signing).
          default: 86400
        _scope:
          type: string
          description: >-
            Scope shorthand used to build the `scope` field (convenience key, removed before signing).
            Maps to `node.<access_key>:<scope>`.
          enum:
            - user
            - admin
          default: user
        scope:
          type: string
          description: >-
            Full scope string. Computed automatically from `_scope` when absent.
            Example: `node::ik-00000000-0000-0000-0000-000000000000:user`.
        auth_type:
          type: string
          description: Authentication type embedded in the token.
          default: access_key
        expires_at:
          type: string
          description: >-
            Token expiry timestamp in ISO 8601 format (`YYYY-MM-DDTHH:MM:SSZ`).
            Computed automatically from `_validity` when absent.
          examples:
            - "2030-01-01T00:00:00Z"
    NodeEmulatorOptions:
      type: object
      description: >-
        Configuration for the embedded Node API emulator (`node emulator`), for testing without HSTS.
        The emulator starts a local web server that answers a subset of the Node API:
        `/info`, `/ops/transfers` (list, start), `/ops/transfers/{id}` (show, modify, cancel) and `/files/browse`.
        Transfers are executed by the Transfer Daemon (`transferd`), started by the emulator.
        Clients authenticate with HTTP Basic when `username` and `password` are set.
      additionalProperties: false
      properties:
        url:
          type: string
          description: >-
            Address and port the emulator listens on.
            Use `https://` with `cert`/`key` for TLS.
          default: http://localhost:8080
        cert:
          type: string
          x-cli-complete: file
          description: >-
            Path to the TLS certificate file.
            Accepted formats: PEM (`.pem`) or PKCS12 (`.p12` / `.pfx`).
          examples:
            - /path/to/cert.pem
        key:
          type: string
          x-cli-complete: file
          description: >-
            Path to the PEM private key file, or the PKCS12 passphrase when `cert` is a `.p12`/`.pfx` file.
          examples:
            - /path/to/key.pem
        chain:
          type: string
          x-cli-complete: file
          description: Path to the PEM certificate chain file (appended as extra chain certificates).
          examples:
            - /path/to/chain.pem
        docroot:
          type: string
          x-cli-complete: folder
          description: >-
            Local folder of the node files.
            Paths of `/files/browse` and local paths of transfers (sources of `send`, destination of `receive`) are relative to it, and confined in it.
            Defaults to the current working directory.
          examples:
            - /data/aspera
        retention_sec:
          type: integer
          minimum: 1
          description: Time in seconds a transfer stays in the list of transfers after it ended (completed, failed or canceled, and no more retried).
          default: 86400
        username:
          type: string
          description: >-
            Username expected from clients in HTTP Basic authentication.
            Set together with `password`.
            When not set, requests are accepted without authentication.
            Mandatory when `url` is not a loopback address (`localhost`, `127.0.0.0/8`, `::1`).
          examples:
            - node_user
        password:
          type: string
          description: >-
            Password expected from clients in HTTP Basic authentication, for the above `username`.
            Generate it with `openssl rand -hex 32`: a weak password is refused (see `password_min_bits`).
          examples:
            - "<PASSWORD>"
        password_min_bits:
          type: integer
          minimum: 0
          default: 80
          description: >-
            Minimum estimated strength of `password`, in bits (log2 of the number of guesses to find it).
            The strength is estimated with gem `zxcvbn` if installed, else with a built-in estimate
            that detects repeats, sequences, keyboard rows, words and years.
            `0` disables the check.
            A random password of 32 bytes (`openssl rand -hex 32`) is far above the default.
    NodeTelemetryOptions:
      type: object
      description: >-
        Configuration for the telemetry reporter (`node telemetry`).
        The command periodically queries `ops/transfers?active_only=true` and sends
        an OpenTelemetry gauge metric to an Instana backend.
      required:
        - url
        - key
      properties:
        url:
          type: string
          description: Base URL of the Instana backend (without `/v1`).
          examples:
            - https://my-instana.example.com
        key:
          type: string
          description: Instana API key sent in the `x-instana-key` header.
          examples:
            - <API_KEY>
        interval:
          type: number
          description: >-
            Polling interval in seconds. Use `0` for a single-shot run (no loop).
          default: 10
        hostname:
          type: string
          description: >-
            Value sent in the `x-instana-host` header.
            Defaults to the local machine's hostname.
          examples:
            - hsts-prod-01
