nd_service_clean:
  tags:
    - cleanup
    - no_doc
  args:
    - --preset=node_ak_adm
    - node
    - service
    - delete
    - service1
nd_service_clean_wait:
  description: The service is deleted asynchronously.
  tags:
    - no_doc
  depends_on:
    - nd_service_clean
  args:
    - --preset=node_ak_adm
    - node
    - service
    - list
  harness:
    poll:
      interval: 5
      max: 60
      until: "!contains([].id,'service1')"
      show: last
