    - transfer
    - show
    - $(t.saved_output :nd_xfer_active_id)
nd_xfer_cancel:
  depends_on:
    - nd_xfer_active_id
    - nd_xfer_show
    - nd_xfer_modify
    - nd_xfer_show_after_modify
