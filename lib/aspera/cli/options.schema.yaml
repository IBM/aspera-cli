openapi: 3.0.0
info:
  title: Aspera CLI Options Schema
  version: 1.0.0
  description: Schema definitions for Aspera CLI options
paths: {}
components:
  schemas:
    LogOptions:
      type: object
      description: Logging options. Use dot-notation to set individual keys (e.g. `--log.level=debug --log.type=stdout`).
      properties:
        level:
          type: string
          description: Minimum log level displayed.
          enum: [trace2, trace1, debug, info, warn, error, fatal, unknown]
          default: warn
        type:
          type: string
          description: Log output destination.
          enum: [stderr, stdout, syslog]
          default: stderr
        format:
          type: string
          description: Log line formatter. Use `@ruby:` for a custom lambda.
          enum: [default, caller, standard]
          default: default
        secrets:
          type: boolean
          description: Show passwords and secrets in logs.
          default: false
    TransferOptions:
      type: object
      description: >-
        Transfer agent selector and parameters.
        When set to a `String`, it selects the agent type (e.g. `direct`, `node`).
        When set to a `Hash`, the optional `agent` key selects the agent type and the remaining keys are agent-specific parameters.
        Use dot-notation to set individual keys (e.g. `--transfer.agent=node --transfer.url=https://...`).
      properties:
        wss:
          type: boolean
          description: Enable Web Socket Session when available.
          default: true
        quiet:
          type: boolean
          description: Suppress the `ascp` progress bar display.
          default: false
        file_list:
          type: boolean
          description: >-
            If `true`, source paths are written to a temp file passed to `ascp` via `--file-list` or `--file-pair-list`.
            
            If `false`, source paths are placed directly on the `ascp` command line.
          default: true
        trusted_certs:
          type: array
          description: List of trusted certificate repositories.
          items:
            type: string
        client_ssh_key:
          type: string
          description: SSH key type to use for token-based transfers.
          enum:
            - rsa
            - dsa_rsa
            - per_client
          default: rsa
        ascp_args:
          type: array
          description: List of native `ascp` command-line arguments.
          items:
            type: string
          default: []
        spawn_timeout_sec:
          type: number
          format: float
          description: Multi session - Maximum time (in seconds) to verify that `ascp` is running.
          default: 3
        spawn_delay_sec:
          type: number
          format: float
          description: Multi session - Delay (in seconds) between starting each `ascp` session.
          default: 2
        multi_incr_udp:
          type: boolean
          description: >-
            Multi session - Increment UDP port for each session.
            
            If `true`, each session uses a different UDP port starting at `fasp_port` (default: 33001).
            
            If `false`, all sessions use the same `fasp_port` (or `ascp` default).
          default: true
        resume:
          type: object
          description: Configuration for automatic transfer resume on interruption.
          properties:
            iter_max:
              type: integer
              description: Maximum number of retry attempts on error.
              default: 7
            sleep_initial:
              type: integer
              description: Initial sleep duration (in seconds) before first retry.
              default: 2
            sleep_factor:
              type: integer
              description: Multiplier applied to sleep duration between consecutive retry attempts.
              default: 2
            sleep_max:
              type: integer
              description: Maximum sleep duration (in seconds) between retry attempts.
              default: 60
        monitor:
          type: boolean
          description: Enable use of the `ascp` management port for transfer monitoring.
          default: true
    NodeAgentOptions:
      type: object
      description: Parameters for the `node` transfer agent (Node API).
      required:
        - url
        - username
        - password
      properties:
        url:
          type: string
          description: URL of the Node API.
        username:
          type: string
          description: Node API user or access key.
        password:
          type: string
          description: Password, secret, or bearer token.
        root_id:
          type: string
          description: Root file ID. Mandatory only when `password` is a bearer token.
    HttpgwAgentOptions:
      type: object
      description: Parameters for the `httpgw` transfer agent (HTTP Gateway).
      required:
        - url
      properties:
        url:
          type: string
          description: URL of the HTTP Gateway.
        upload_chunk_size:
          type: integer
          description: Size in bytes of each upload chunk.
          default: 64000
        api_version:
          type: string
          description: Force use of a specific API version.
          enum:
            - v1
            - v2
          default: v2
        synchronous:
          type: boolean
          description: Wait for acknowledgment after each message.
          default: false
    TransferdAgentOptions:
      type: object
      description: Parameters for the `transferd` transfer agent (Transfer Daemon).
      properties:
        url:
          type: string
          description: >-
            Address and port listened by the daemon (e.g. `:55002`).
            If port is `0`, the daemon listens on a random available port.
            If no address is given, `127.0.0.1` is used.
          default: ':0'
        start:
          type: boolean
          description: Start a new daemon instance.
          default: true
        stop:
          type: boolean
          description: Stop the daemon when `ascli` exits.
          default: true
