            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Workflow name
                  example: My Workflow
                description:
                  type: string
                  description: Workflow description
                  example: This is a sample workflow
                workflow_data:
                  type: object
                  description: Complete workflow definition
      responses:
