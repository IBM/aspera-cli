openapi: 3.0.1
info:
  title: Aspera Orchestrator API
  version: v1
  description: |
    API documentation for Aspera Orchestrator.

    ## Authentication

    The API supports two authentication modes:

    ### JWT Authentication (Recommended)

    When JWT authentication is enabled (default):

    1. Obtain a JWT token by calling POST /api/login with your credentials
    2. Include the token in subsequent requests using the Authorization header:
       `Authorization: Bearer <your_token>`

    ### Basic Authentication (When JWT is Disabled)

    If JWT authentication is disabled in your Orchestrator configuration:

    - Add query parameters to every API request: `?login=username&password=password`
    - Example: `/api/workflows_list?login=admin&password=mypassword&format=json`

    **Note:** Check your Orchestrator configuration to determine which authentication mode is active.

    ## API Endpoints

    The Orchestrator API provides comprehensive workflow management capabilities including:
    - Workflow management and execution
    - Work order tracking and control
    - Monitor management
    - Queue & Task management
    - Plugin and resource management
