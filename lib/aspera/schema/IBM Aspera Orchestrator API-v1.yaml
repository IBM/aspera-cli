    post:
      summary: Create a new user
      tags:
      - Users
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              - email
              properties:
                username:
                  type: string
                  description: Unique username for login
                  example: john.doe
                  minLength: 3
                  maxLength: 50
                password:
                  type: string
                  format: password
                  description: User password (must meet security requirements)
                  example: "*********"
                  minLength: 8
                email:
                  type: string
                  format: email
                  description: User email address
                  example: john.doe@example.com
                full_name:
                  type: string
                  description: Full name of the user
                  example: John Doe
                  maxLength: 100
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                    example: 789
                  message:
                    type: string
                    example: User created successfully
        '400':
          description: Invalid user data or username already exists
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/login endpoint
  responses:
    UnauthorizedError:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Unauthorized
tags:
- name: Authentication
  description: Obtain JWT tokens for API access. All other endpoints require authentication.
- name: Workflows
  description: Create, import, export, and manage workflow definitions. Workflows define the automation logic.
- name: Work Orders
  description: Initiate and track workflow executions. Each work order represents a single workflow run.
- name: Work Steps
  description: Monitor and control individual steps within work orders. Steps are the atomic units of workflow execution.
- name: Queues
  description: Manage execution queues and prioritize work items. Control the order and timing of workflow execution.
- name: Monitors
  description: Configure and control workflow monitors. Monitors automatically trigger workflows based on events or schedules.
- name: Tasks
  description: Submit and track one-off tasks. Tasks are standalone operations not tied to workflows.
- name: Plugins
  description: Install, enable, and reload action plugins. Plugins extend Orchestrator with new capabilities.
- name: Portlets
  description: Query portlet version information. Portlets provide UI components for the Orchestrator interface.
- name: System
  description: Monitor system health, control processes, and access system-wide information.
- name: Remote Nodes
  description: Test connectivity and manage remote Orchestrator nodes in distributed deployments.
- name: Testing
  description: Test workflow steps in isolation before deploying to production workflows.
- name: Statistics
  description: Retrieve execution statistics and performance metrics for workflows and work orders.
- name: Journals
  description: Access detailed execution logs and journal files for troubleshooting and auditing.
- name: Resources
  description: Manage resource pools and capacity allocation for workflow execution. Control concurrency limits.
- name: Users
  description: Create and manage user accounts for Orchestrator access.
