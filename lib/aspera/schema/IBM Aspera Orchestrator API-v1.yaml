paths:
  "/api/login":
    post:
      summary: Authenticate and obtain JWT token
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  description: User login name
                password:
                  type: string
                  format: password
                  description: User password
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged in successfully
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      login:
                        type: string
                      email:
                        type: string
                  token:
                    type: string
                    description: JWT token for subsequent API calls
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid credentials
        '403':
          description: Secure API auth disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Secure API authentication is disabled
