  "/api/initiate":
    post:
      summary: Initiate a new work order
      description: |
        Starts a new work order for the specified workflow.

        **Important:** The `parameters` object should contain workflow-specific input values.
        To discover what parameters a workflow accepts, call `/api/workflow_inputs_spec?id={workflow_id}` first.
      tags:
      - Work Orders
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workflow_id
              properties:
                workflow_id:
                  type: integer
                  description: ID of the workflow to execute
                  example: 123
                parameters:
                  type: object
                  description: |
                    Input parameters for the workflow (key-value pairs).
                    Valid keys are defined by the workflow's input specification.
                    Use `/api/workflow_inputs_spec?id={workflow_id}` to discover required parameters.
                  additionalProperties: true
                  example:
                    input_file: "/path/to/source/video.mp4"
                    output_format: mp4
                    quality: high
                    bitrate: 5000k
      responses:
        '200':
          description: Work order initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  work_order_id:
                    type: integer
                    description: ID of the newly created work order
                    example: 456
                  status:
                    type: string
                    description: Initial status of the work order
                    example: queued
                    enum:
                    - queued
                    - running
              example:
                work_order_id: 456
                status: queued
        '400':
          description: Invalid request or missing required workflow parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Missing required parameter: input_file'
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
