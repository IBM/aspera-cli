openapi: 3.1.0
info:
  title: IBM Aspera faspio Gateway API
  description: |
    REST API for managing IBM Aspera faspio Gateway bridges and monitoring.

    ## Overview
    IBM Aspera faspio Gateway bridges local TCP or UDP connections over the FASP (Fast, Adaptive, and Secure Protocol)
    transport to a remote gateway peer. You can use this API to create, inspect, and delete **dynamic**
    bridges at runtime without restarting the gateway.

    Static bridges (defined in `gateway.toml`) are read-only via this API — they can be retrieved
    but cannot be deleted or modified.

    ## Authentication
    The API supports three authentication modes, configured in `gateway.toml` under `[admin]`:

    | Mode | Description |
    |------|-------------|
    | `none` | No authentication (development only) |
    | `basic` | HTTP Basic Authentication (username + SHA-512/PBKDF2 password digest) |
    | `oauth2` | Bearer JWT token obtained via `POST /auth/token` |

    ## OAuth 2.0 quick start

    This gateway implements the **JWT Bearer grant** (RFC 7523). There is no identity provider
    involved — the gateway itself issues and verifies tokens using RSA key pairs you generate.

    ### Step 1 — Generate key pairs

    The gateway needs **two** RSA key pairs:

    | Key pair | Who holds it | Purpose |
    |----------|-------------|---------|
    | **Client key pair** | Your application | Sign JWT assertions sent to `POST /auth/token` |
    | **Server key pair** | The gateway | Sign access tokens returned to your application |

    ```bash
    # Client key pair (your application uses the private key to sign assertions)
    openssl genrsa -out client_private.pem 2048
    openssl rsa -in client_private.pem -pubout -out client_public.pem

    # Server key pair (the gateway uses the private key to sign access tokens)
    openssl genrsa -out server_private.pem 2048
    openssl rsa -in server_private.pem -pubout -out server_public.pem
    ```

    ### Step 2 — Configure `gateway.toml`

    Give the gateway the **client's public key** (to verify assertions) and the
    **server's private key** (to sign access tokens):

    ```toml
    [admin]
    rest_api_auth = "oauth2"
    rest_api_enabled = true

    [admin.oauth2]
    client_id            = "my-gateway-client"
    jwt_grant_enabled    = true
    jwt_verification_key = "/etc/faspio-gateway/client_public.pem"   # verifies your assertion
    jwt_signing_key      = "/etc/faspio-gateway/server_private.pem"  # signs the access token
    ```

    ### Step 3 — Create a JWT assertion

    Your application signs a short-lived JWT with its **private key**.
    The `iss` and `sub` claims must both equal the `client_id` in `gateway.toml`.

    Example using Python (PyJWT):
    ```python
    import jwt, time

    with open("client_private.pem") as f:
        private_key = f.read()

    assertion = jwt.encode(
        {"iss": "my-gateway-client", "sub": "my-gateway-client",
         "exp": int(time.time()) + 300},   # valid for 5 minutes
        private_key,
        algorithm="RS256"
    )
    ```

    Example using `openssl` + `bash` (no extra libraries):
    ```bash
    HEADER=$(echo -n '{"alg":"RS256","typ":"JWT"}' | base64url)
    NOW=$(date +%s); EXP=$((NOW + 300))
    PAYLOAD=$(echo -n "{\"iss\":\"my-gateway-client\",\"sub\":\"my-gateway-client\",\"exp\":$EXP}" | base64url)
    SIG=$(echo -n "$HEADER.$PAYLOAD" | openssl dgst -sha256 -sign client_private.pem | base64url)
    ASSERTION="$HEADER.$PAYLOAD.$SIG"
    ```

    ### Step 4 — Exchange the assertion for an access token

    ```bash
    curl -s -X POST http://127.0.0.1:8080/auth/token \
      -H "Content-Type: application/json" \
      -d "{\"grant_type\":\"urn:ietf:params:oauth:grant-type:jwt-bearer\",
           \"assertion\":\"$ASSERTION\",
           \"client_id\":\"my-gateway-client\"}"
    ```

    Response:
    ```json
    {
      "access_token": "<TOKEN>",
      "token_type": "Bearer",
      "expires_in": 3600
    }
    ```

    ### Step 5 — Call the API with the access token

    ```bash
    TOKEN="<TOKEN>"

    # List all bridges
    curl -s http://127.0.0.1:8080/bridges \
      -H "Authorization: Bearer $TOKEN"

    # Create a bridge
    curl -s -X POST http://127.0.0.1:8080/bridges \
      -H "Authorization: Bearer $TOKEN" \
      -H "Content-Type: application/json" \
      -d '{"name":"Bridge-1","local":{"bind_address":"127.0.0.1","port":"2000","protocol":"tcp","tls_enabled":false},"forward":{"host":["10.0.0.2"],"port":"3000","protocol":"fasp","tls_enabled":false}}'
    ```

    The access token expires after **1 hour** (`expires_in: 3600`). Repeat steps 3–4 to renew it.

    ## Bridge lifecycle
    ```text
    POST /bridges
        ↓
    (bridge created and started)
        ↓
    GET /bridges/{id}
        ↓
    DELETE /bridges/{id}
        ↓
    (bridge stopped and removed)
    ```

    Bridges created via the API are **dynamic** — they are persisted to a runtime state file
    and survive gateway restarts.
