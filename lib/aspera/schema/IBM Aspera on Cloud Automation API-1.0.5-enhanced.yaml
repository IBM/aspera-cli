            $ref: '#/components/schemas/PackageRecipient'
        download_notification_recipients:
          type: array
          items:
            $ref: '#/components/schemas/PackageRecipient'
      additionalProperties: false
    PackageTransferData:
      description: Data of a `package_transfer` action. `timeout` is in milliseconds. Conditions work as for `transfer`.
      type: object
      properties:
        timeout:
          type:
            - integer
            - 'null'
        source:
          type: object
