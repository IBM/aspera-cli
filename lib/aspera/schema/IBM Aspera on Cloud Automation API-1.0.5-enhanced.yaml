# Use 'rake tools:openapi' to update this file

openapi: 3.1.0
info:
  title: Automation API
  description: |-
    The Automation API allows you to create multistep workflows with event-based triggers cued to IBM Aspera on Cloud endpoints. The first step in your workflow contains the trigger, which can be a person or an API, a series of scheduled times, a new file added to a folder, or a package arriving in a shared inbox, or the deletion of a file or folder.

    The rest of the steps in the workflow contain one or more actions. An action can transfer a file, send a package, call an API, notify users, create custom substitution variables, or create a folder. Identifiers are numeric strings. Identifiers are numeric strings. After you activate the workflow, you can monitor active jobs and update the state of the workflow, which allows you to make edits. Note: To be activated, a workflow must have at least two steps, and contain an action that transfers a file or sends a package.

    Access Control: You must include a JSON Web Token (bearer token) in the authorization header of your request. The token must give access to the Automation application. Except for the administrator scope, a user acts only on the workflows shared with them (`edit`, `manage_jobs` or `duplicate` permission). The token must give access to the Automation application. Except for the administrator scope, a user acts only on the workflows shared with them (`edit`, `manage_jobs` or `duplicate` permission).

    For additional information, visit the Aspera Developer Center at https://developer.ibm.com/aspera/
  version: 1.0.5
  license:
    url: https://ibm.com
    name: (c) IBM. All rights reserved
servers:
  - url: https://api.ibmaspera.com/automation/v1
    description: The Automation App production server
security:
  - bearerAuth: []
tags:
  - name: workflows
    description: Workflows
  - name: workflow_instances
    description: Jobs (workflow instances)
  - name: steps
    description: Steps of a workflow
  - name: actions
    description: Actions within a step
  - name: workflow_permissions
    description: Permissions on workflows
  - name: app_permissions
    description: Application settings and permissions
  - name: external
    description: Callbacks and health check, without authentication
paths:
  /workflows:
    get:
      operationId: listWorkflows
      summary: Get workflows
      description: Returns the workflows on which the caller has a permission. With `show_org_workflows=true` and an administrator token, returns all the non-hidden workflows of the organization. Hidden workflows are never listed. `user_id` and `organization_id` are taken from the bearer token when it carries them.
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/show_org_workflows'
        - $ref: '#/components/parameters/user_id'
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/response_type'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-Workflows'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - workflows
    post:
      operationId: createWorkflow
      summary: Create a workflow
      description: Creates a new workflow in the `draft` state. Once you have created the workflow, create its steps, then add each step to the workflow `step_order` with a PUT request, before creating the actions of the step. The trigger type of the workflow is that of the first action of the first step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createWorkflowRequest'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/201-Workflow'
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - workflows
  /workflows/{id}:
    get:
      operationId: getWorkflow
      summary: Gets a workflow
      description: Returns a workflow with a unique ID, with its steps. Requires a permission on the workflow, or the administrator scope. A hidden workflow is not accessible.
      parameters:
        - $ref: '#/components/parameters/workflowIdPath'
        - name: workflow_version_id
          in: query
          description: Numeric ID of the workflow version to get. The state, status, statistics and `workflow_can_activate` are not returned for a version.
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/response_type'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workflowData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - workflows
    put:
      operationId: updateWorkflow
      summary: Update a workflow
      description: Edits a workflow with a unique ID. Requires the `edit` permission on the workflow. The ID of the user and of the organization are taken from the bearer token.
      parameters:
        - $ref: '#/components/parameters/workflowIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateWorkflow'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - workflows
    delete:
      operationId: deleteWorkflow
      summary: Delete a workflow
      description: Deletes a workflow with a unique ID. Requires the administrator scope or the `edit` permission. Fails with 422 while a job of the workflow is executing, initiating or queued; cancel the jobs first.
      parameters:
        - $ref: '#/components/parameters/workflowIdPath'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - workflows
  /workflows/{id}/update_state:
    put:
      operationId: updateWorkflowState
      summary: Update the workflow state
      description: |-
        Fires a state event on a workflow with a unique ID.

        - `activate`: from `draft` or `inactive`. A workflow in `draft` first goes to `validating`, then to `active` once the permissions on the nodes are granted. Fails with 422 if the workflow was never validated (status `not_started`), or if a scheduled trigger has a start date in the past.
        - `deactivate`: from `active` to `inactive`. Running jobs are not stopped.
        - `save_as_draft`: back to `draft`. Fails with 422 while the workflow is `validating`, or while a job is executing, initiating or queued.

        `activate` and `deactivate` require the administrator scope or the `edit` permission; `save_as_draft` requires the `edit` permission.
      parameters:
        - $ref: '#/components/parameters/workflowIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateState'
            example:
              event: activate
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - workflows
  /workflows/{id}/launch:
    post:
      operationId: launchWorkflow
      summary: Launch a workflow
      description: Launches a job of an `active` workflow. Only workflows with a `manual` or `scheduled` trigger can be launched; a `watch_folder`, `shared_inbox` or `delete_folder` trigger returns 422. A `scheduled` workflow that already has a running job returns 422. Requires the administrator scope, or the `manage_jobs` or `edit` permission.
      parameters:
        - $ref: '#/components/parameters/workflowIdPath'
      responses:
        '200':
          description: The launch request was accepted; the workflow engine executes the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - workflows
  /workflows/{id}/pause_all:
    put:
      operationId: pauseWorkflowInstances
      summary: Pause all jobs
      description: Same behavior as `cancel_instances`; the running jobs of the workflow are canceled. Requires the administrator scope, or the `manage_jobs` or `edit` permission.
      parameters:
        - $ref: '#/components/parameters/workflowIdPath'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - workflows
  /workflows/{id}/cancel_instances:
    put:
      operationId: cancelWorkflowInstances
      summary: Cancel all jobs
      description: Cancels all running jobs of the workflow with a particular ID. Requires the administrator scope, or the `manage_jobs` or `edit` permission.
      parameters:
        - $ref: '#/components/parameters/workflowIdPath'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - workflows
  /workflows/{id}/delete_instances:
    delete:
      operationId: deleteWorkflowInstances
      summary: Delete all jobs
      description: Deletes all jobs of the workflow with a particular ID. Requires the administrator scope, or the `manage_jobs` or `edit` permission.
      parameters:
        - $ref: '#/components/parameters/workflowIdPath'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - workflows
  /workflows/{id}/default_copy_name:
    get:
      operationId: getWorkflowDefaultCopyName
      summary: Get the default name of a copy
      description: Returns the first free name of the form `<name> (<n>)` among the workflows of the user. Requires the administrator scope, or the `duplicate` or `edit` permission.
      parameters:
        - $ref: '#/components/parameters/workflowIdPath'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultCopyName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - workflows
  /workflows/{id}/copy:
    post:
      operationId: copyWorkflow
      summary: Duplicate a workflow
      description: Creates a copy of a workflow, in the `draft` state, with a new name. Requires the administrator scope, or the `duplicate` or `edit` permission. Returns 422 while the status of the workflow is `submitted`.
      parameters:
        - $ref: '#/components/parameters/workflowIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name for the duplicated workflow
                  example: Copy of Send Files to Media
              required:
                - name
      responses:
        '200':
          description: Successfully duplicated. The copy is returned with its steps and actions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workflowData'
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - workflows
  /workflow_instances:
    get:
      operationId: listWorkflowInstances
      summary: Get jobs
      description: Returns the jobs, whether running, complete, or failed, of the non-hidden workflows on which the caller has a permission. With `show_org_workflow_instances=true` and an administrator token, returns the jobs of all the workflows of the organization. Deleted jobs are not returned. `user_id` and `organization_id` are taken from the bearer token when it carries them.
      parameters:
        - $ref: '#/components/parameters/workflowID'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/user_id'
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/show_org_workflow_instances'
        - $ref: '#/components/parameters/start_time'
        - $ref: '#/components/parameters/stop_time'
        - $ref: '#/components/parameters/embed'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-WorkflowInstances'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - workflow_instances
  /workflow_instances/{id}:
    get:
      operationId: getWorkflowInstance
      summary: Get a job
      description: Returns a job with a unique ID. Requires the administrator scope, or the `manage_jobs` or `edit` permission on the workflow.
      parameters:
        - $ref: '#/components/parameters/instanceIdPath'
        - $ref: '#/components/parameters/embed'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstances'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - workflow_instances
    delete:
      operationId: deleteWorkflowInstance
      summary: Delete a job
      description: Deletes a job with a unique ID. Requires the administrator scope, or the `manage_jobs` or `edit` permission on the workflow.
      parameters:
        - $ref: '#/components/parameters/instanceIdPath'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - workflow_instances
    put:
      operationId: cancelWorkflowInstance
      summary: Cancel a job
      description: Sets the status of a job with a unique ID. To cancel a running job, send `canceled`; doing so allows you to edit the workflow that generated the job. Requires the administrator scope, or the `manage_jobs` or `edit` permission on the workflow.
      parameters:
        - $ref: '#/components/parameters/instanceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cancelWorkflowInstance'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - workflow_instances
  /steps:
    post:
      operationId: createStep
      summary: Create a step
      description: Creates a step in the workflow. The step is not part of the workflow until its ID is added to the workflow `step_order` with a PUT /workflows/{id} request; the API refuses to create an action in a step that is not in `step_order`. Each step can hold one or more actions, which you create with POST /actions after that. Requires the `edit` permission on the workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Step'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/201-Step'
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - steps
  /steps/{id}:
    get:
      operationId: getStep
      summary: Get a step
      description: Returns the data for a step with a unique ID, with its actions. A deleted step returns 404.
      parameters:
        - $ref: '#/components/parameters/stepIdPath'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-StepsID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - steps
    put:
      operationId: updateStep
      summary: Update a step
      description: Edits the details of a step with a unique ID. Requires the `edit` permission on the workflow.
      parameters:
        - $ref: '#/components/parameters/stepIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateStepRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - steps
    delete:
      operationId: deleteStep
      summary: Delete a step
      description: Deletes a step with a unique ID, and its actions. Requires the `edit` permission on the workflow. Fails with 422 while a job of the workflow is executing, initiating or queued.
      parameters:
        - $ref: '#/components/parameters/stepIdPath'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - steps
  /actions:
    post:
      operationId: createAction
      summary: Create an action
      description: |-
        Creates an action, or a trigger, in a step. The `type` selects the structure of `data`. The step must be in the `step_order` of its workflow. The first step of a workflow contains exactly one action, a trigger (`manual`, `scheduled`, `watch_folder`, `shared_inbox` or `delete_folder`); the other steps contain no trigger. Requires the `edit` permission on the workflow.

        The `data` is validated strictly: a property that is not listed for the type is rejected. Sensitive values (tokens, passwords, credentials) are not returned in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createAction'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/actionData'
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - actions
  /actions/validate:
    post:
      operationId: validateActionCredentials
      summary: Validate the credentials of a node
      description: Checks the `authentication` of the `source` and of the `destination` of a `transfer` action against the node. Only `transfer` is supported. Returns 422 if neither location has an `authentication`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - transfer
                source:
                  $ref: '#/components/schemas/TransferSource'
                destination:
                  $ref: '#/components/schemas/TransferDestination'
              required:
                - type
      responses:
        '200':
          description: Result of the validation, for each location that has an `authentication`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - actions
  /actions/{id}:
    get:
      operationId: getAction
      summary: Get an action
      description: Returns data for an action with a unique ID. A deleted action returns 404.
      parameters:
        - $ref: '#/components/parameters/actionIdPath'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/actionData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - actions
    put:
      operationId: updateAction
      summary: Update an action
      description: Edits the values of an action with a unique ID. The `type` is required, because it selects the allowed properties of `data`. Requires the `edit` permission on the workflow.
      parameters:
        - $ref: '#/components/parameters/actionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createAction'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - actions
    delete:
      operationId: deleteAction
      summary: Delete an action
      description: Deletes an action with a unique ID. Requires the `edit` permission on the workflow. Fails with 422 while a job of the workflow is executing, initiating or queued.
      parameters:
        - $ref: '#/components/parameters/actionIdPath'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - actions
  /workflow_permissions:
    get:
      operationId: listWorkflowPermissions
      summary: Get workflow permissions
      description: Returns the permissions of a workflow, as an array. Requires a permission on the workflow, or the administrator scope.
      parameters:
        - $ref: '#/components/parameters/workflow_ID'
        - $ref: '#/components/parameters/user_id'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowPermissions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - workflow_permissions
    post:
      operationId: createWorkflowPermission
      summary: Create a workflow permission
      description: Shares a workflow with a user. At least one of `edit`, `manage_jobs` and `duplicate` must be true, and a user has one permission per workflow. The user receives a notification. Requires the `edit` permission on the workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createWorkflowPermissionRequest'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPermissions'
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - workflow_permissions
  /workflow_permissions/{id}:
    put:
      operationId: updateWorkflowPermission
      summary: Update a workflow permission
      description: Edits a workflow permission with a unique ID. The permission of the owner of the workflow cannot be edited (422). Requires the `edit` permission on the workflow.
      parameters:
        - $ref: '#/components/parameters/permissionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateWorkflowPermissionRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - workflow_permissions
    delete:
      operationId: deleteWorkflowPermission
      summary: Delete a workflow permission
      description: Deletes a workflow permission with a unique ID. The permission of the owner of the workflow cannot be deleted (422). Requires the `edit` permission on the workflow.
      parameters:
        - $ref: '#/components/parameters/permissionIdPath'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - workflow_permissions
  /app_permissions/{id}:
    get:
      operationId: getAppPermissions
      summary: Get automation application permissions
      description: Returns the configuration settings of the Automation application for the organization. The `id` must be the organization of the bearer token.
      parameters:
        - $ref: '#/components/parameters/organizationIdPath'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppPermissions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - app_permissions
    put:
      operationId: updateAppPermissions
      summary: Update automation application permissions
      description: Updates the configuration settings of the Automation application for the organization. Requires the administrator scope; the `id` must be the organization of the bearer token.
      parameters:
        - $ref: '#/components/parameters/organizationIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateAppPermissionsRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
        - app_permissions
  /external/api_callback:
    post:
      operationId: apiCallback
      summary: Report the progress or the result of an API action
      description: 'Called by the service reached by an `api` action with `callback: true`. The request is not authenticated: the `token` that Automation injected in the payload identifies the action. The service sends `in_progress` notifications, then a final `success` or `failed`. The body is forwarded as is to the workflow engine.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCallbackRequest'
      responses:
        '200':
          description: The callback was accepted.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          description: Internal Server Error
      tags:
        - external
  /external/telestream:
    post:
      operationId: telestreamCallback
      summary: Report the result of a Telestream quality control
      description: Called by the Telestream service for a `telestream_qc` action. The request is not authenticated. The body is forwarded as is to the workflow engine.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The callback was accepted.
        '500':
          description: Internal Server Error
      tags:
        - external
  /ping:
    get:
      operationId: ping
      summary: Check the service
      description: Checks the database and the message broker. The request is not authenticated.
      security: []
      responses:
        '200':
          description: The database and the broker are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
        '503':
          description: The database or the broker is not reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
      tags:
        - external
components:
  parameters:
    status:
      name: status
      in: query
      description: 'Status of the job. Allowed values: initiating, executing, queued, queue_full, paused, resumed, complete, failed, canceled, timeout.'
      required: false
      schema:
        type: string
        enum:
          - initiating
          - executing
          - queued
          - queue_full
          - paused
          - resumed
          - complete
          - failed
          - canceled
          - timeout
      example: executing
    workflow_ID:
      name: workflow_id
      in: query
      description: ID of the workflow
      required: true
      schema:
        type: string
      example: '362'
    workflowID:
      name: workflow_id
      in: query
      description: ID of the workflow
      required: false
      schema:
        type: string
      example: '362'
    response_type:
      name: response_type
      in: query
      description: Detail level of returned workflows ('long' returns full steps and actions)
      required: false
      schema:
        type: string
        enum:
          - short
          - long
        default: short
      example: long
    start_time:
      name: start_time
      in: query
      description: Start of the time window (ISO 8601) on the job last update time. Ignored unless stop_time is also provided.
      required: false
      schema:
        type: string
        format: date-time
      example: '2026-11-07T00:00:00Z'
    stop_time:
      name: stop_time
      in: query
      description: End of the time window (ISO 8601) on the job last update time. Ignored unless start_time is also provided.
      required: false
      schema:
        type: string
        format: date-time
      example: '2026-11-09T00:00:00Z'
    show_org_workflow_instances:
      name: show_org_workflow_instances
      in: query
      description: If true and the caller is an administrator, return jobs of all workflows of the organization, else only jobs of workflows on which the user has a permission. Ignored for non-administrators. Not needed if workflow_id is provided.
      required: false
      schema:
        type: boolean
      example: true
    workflowIdPath:
      name: id
      in: path
      description: Numeric ID of the workflow
      required: true
      schema:
        type: string
      example: '1120'
    instanceIdPath:
      name: id
      in: path
      description: Numeric ID of the job, or its `instance_id` (UUID)
      required: true
      schema:
        type: string
      example: '8588'
    stepIdPath:
      name: id
      in: path
      description: Numeric ID of the step
      required: true
      schema:
        type: string
      example: '1076'
    actionIdPath:
      name: id
      in: path
      description: Numeric ID of the action
      required: true
      schema:
        type: string
      example: '1071'
    permissionIdPath:
      name: id
      in: path
      description: Numeric ID of the workflow permission
      required: true
      schema:
        type: string
      example: '26'
    organizationIdPath:
      name: id
      in: path
      description: Numeric ID of the organization. It must be the organization of the bearer token.
      required: true
      schema:
        type: string
      example: '58'
    offset:
      name: offset
      in: query
      description: Number of records to skip (pagination). The first page is offset 0; the second page is offset `limit`.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    limit:
      name: limit
      in: query
      description: Maximum number of records to return. Values above 1000 are reduced to 1000.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 20
    q:
      name: q
      in: query
      description: Search string. It filters workflows on name, state, status, organization_id, user_id and user_name; it filters jobs on status, status_details, organization_id, user_id, instance_id, workflow_id and workflow name.
      required: false
      schema:
        type: string
      example: My Workflow
    sort:
      name: sort
      in: query
      description: Column to sort by (e.g. `state_change_time` for jobs, `name` for workflows). If the value contains `-`, the sort is descending (e.g. `-state_change_time`), else ascending.
      required: false
      schema:
        type: string
      example: '-state_change_time'
    embed:
      name: embed
      in: query
      description: Comma-separated list of objects to embed in each job. Allowed values are `workflow` and `step`.
      required: false
      schema:
        type: string
      example: workflow,step
    user_id:
      name: user_id
      in: query
      description: User ID. Ignored when the bearer token carries a user ID.
      required: false
      schema:
        type: string
      example: '1072'
    organization_id:
      name: organization_id
      in: query
      description: Organization ID. Ignored when the bearer token carries an organization ID; if provided, it must be the organization of the token.
      required: false
      schema:
        type: string
      example: '58'
    show_org_workflows:
      name: show_org_workflows
      in: query
      description: If true and the caller is an administrator, return all the non-hidden workflows of the organization, else only those on which the user has a permission. Must be `true` or `false`.
      required: false
      schema:
        type: boolean
      example: true
  schemas:
    Error:
      description: Error returned by the API
      type: object
      properties:
        message:
          description: The error message
          type: string
          examples:
            - No permission on the resource you are trying to access
        request_id:
          description: ID of the request, for support
          type: string
      required:
        - message
    Pagination:
      description: Properties shared by the lists
      type: object
      properties:
        total_count:
          description: Number of records that match the request
          type: integer
          examples:
            - 6
        offset:
          description: Number of records skipped
          type: integer
          examples:
            - 0
        limit:
          description: Maximum number of records returned
          type: integer
          examples:
            - 20
        first:
          description: The link for the first page of results
          type: object
          properties:
            href:
              type: string
              format: uri
        last:
          description: The link for the last page of results
          type: object
          properties:
            href:
              type: string
              format: uri
        next:
          description: The link for the next page of results. Absent on the last page.
          type: object
          properties:
            href:
              type: string
              format: uri
        previous:
          description: The link for the previous page of results. Absent on the first page.
          type: object
          properties:
            href:
              type: string
              format: uri
    200-WorkflowInstances:
      description: Returned data for the list of jobs
      title: Success response
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            workflow_instances:
              description: Array of jobs
              type: array
              items:
                $ref: '#/components/schemas/WorkflowInstances'
    200-Workflows:
      description: Returned data for the list of workflows
      title: Success response
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            workflows:
              type: array
              items:
                $ref: '#/components/schemas/workflowData'
    JobStatus:
      description: Status of a job
      type: string
      enum:
        - initiating
        - executing
        - queued
        - queue_full
        - paused
        - resumed
        - complete
        - failed
        - canceled
        - timeout
        - deleted
    WorkflowInstances:
      description: Job data
      type: object
      properties:
        id:
          description: ID for the workflow instance
          type: string
          examples:
            - '8588'
        workflow_version_id:
          description: ID for the workflow version that is used in generating this workflow instance
          type:
            - string
            - 'null'
          examples:
            - '8588'
        instance_id:
          description: UUID. Can be used for debugging purposes, and in place of `id` in the path.
          type: string
          examples:
            - f5d74b9c-e2de-4782-9a44-e65b4857d98b
        organization_id:
          description: ID of organization from which the workflow originates
          type: string
          examples:
            - '58'
        user_id:
          description: User ID of the owner of the workflow
          type: string
          examples:
            - '3201'
        workflow_id:
          description: ID of the workflow that generates the workflow instance
          type: string
          examples:
            - '699'
        step_id:
          description: ID of the step currently executed
          type: string
          examples:
            - '1290'
        step_name:
          description: Name of step in the workflow that is currently active. If the workflow is complete or failed, step_name is the name of the final step in the workflow.
          type: string
          examples:
            - transfer step
        action_id:
          description: ID of current action in the workflow instance
          type: string
          examples:
            - '1406'
        status:
          $ref: '#/components/schemas/JobStatus'
        current_status:
          description: Human-readable current status description
          type: string
          examples:
            - Transfer in progress
        status_details:
          description: Error message - only returned for a failed workflow instance
          type: string
          examples:
            - No valid permission on the source node available
        launch_time:
          description: Original start time for activation of the workflow
          type: string
          format: date-time
          examples:
            - 2019-03-17T07:07:15.000Z
        state_change_time:
          description: Time the workflow instance state was changed--for example, with a PUT request.
          type: string
          format: date-time
          examples:
            - 2019-03-17T07:07:22.000Z
        queue_position:
          description: Position in queue when job is queued
          type: integer
          examples:
            - 1
        workflow_name:
          description: Name of the workflow
          type: string
          examples:
            - media content
        workflow_trigger_type:
          description: Type of the trigger of the workflow. Null if the workflow has no trigger.
          type:
            - string
            - 'null'
          enum:
            - manual
            - scheduled
            - watch_folder
            - shared_inbox
            - delete_folder
            - null
        workflow:
          description: The workflow. Present only if `embed` contains `workflow`.
          type: object
        step:
          description: The current step. Present only if `embed` contains `step`.
          type:
            - object
            - 'null'
        action_statuses:
          description: Status breakdown per step and action
          type: object
          properties:
            steps:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                          enum:
                            - initiating
                            - executing
                            - queued
                            - paused
                            - complete
                            - failed
                        outputs:
                          description: Output data of the action
                          type:
                            - object
                            - 'null'
                          additionalProperties: true
                        name:
                          type:
                            - string
                            - 'null'
                        type:
                          type:
                            - string
                            - 'null'
    WorkflowPermissions:
      description: A permission of a user on a workflow. The `edit` permission is accepted in the requests but is not returned.
      type: object
      properties:
        id:
          description: Workflow Permission ID
          type: string
          examples:
            - '26'
        user_id:
          description: User ID
          type: string
          examples:
            - '26'
        workflow_id:
          description: Workflow ID
          type: string
          examples:
            - '26'
        manage_jobs:
          description: Whether there is permission to view, cancel and delete the jobs
          type: boolean
          examples:
            - true
        duplicate:
          description: Whether there is permission to duplicate the workflow
          type: boolean
          examples:
            - true
        updated_at:
          description: Time the permission is updated
          type: string
          format: date-time
          examples:
            - 2019-01-10T21:25:24.000Z
        created_at:
          description: Time workflow permission is created
          type: string
          format: date-time
          examples:
            - 2019-01-10T21:25:24.000Z
    RecipientHash:
      description: Recipient of a notification. The `id` is a numeric ID for `User` and `Group`, and an email address for `Email`.
      type: object
      properties:
        id:
          type: string
          examples:
            - example@email.com
        type:
          type: string
          enum:
            - User
            - Group
            - Email
      required:
        - id
        - type
    WorkflowNotifications:
      description: Recipients of the notifications of the workflow, by event. If `allow_notifications` is true, at least one list must be non-empty.
      type: object
      properties:
        started:
          description: Recipients notified when a job starts
          type: array
          items:
            $ref: '#/components/schemas/RecipientHash'
        failed:
          description: Recipients notified when a job fails
          type: array
          items:
            $ref: '#/components/schemas/RecipientHash'
        completed:
          description: Recipients notified when a job completes
          type: array
          items:
            $ref: '#/components/schemas/RecipientHash'
    WorkflowState:
      description: State of the workflow. `activate` on a `draft` workflow goes through `validating`, while the permissions on the nodes are requested.
      type: string
      enum:
        - draft
        - validating
        - active
        - inactive
    WorkflowStatus:
      description: Status of the workflow, from the validation of its permissions. `not_started` is the initial status, `submitted` while the permissions are requested, `success` when they are granted and `error` otherwise.
      type: string
      enum:
        - not_started
        - submitted
        - success
        - error
    workflowData:
      description: Returned workflow data. `steps` is present only for a single workflow (GET /workflows/{id}, copy) and for a list with `response_type=long`. For a workflow version, `state`, `status`, `instance_stats` and `workflow_can_activate` are not returned.
      type: object
      properties:
        id:
          description: Workflow ID
          type: string
          examples:
            - '26'
        name:
          description: Workflow name. It is unique for a user.
          type: string
          examples:
            - test workflow
        organization_id:
          description: ID of organization associated with the workflow
          type: string
          examples:
            - '58'
        user_id:
          description: ID of the user who owns the workflow
          type: string
          examples:
            - '1072'
        user_name:
          description: Name of the user who owns the workflow
          type: string
          examples:
            - John Doe
        workflow_version_id:
          description: ID of the current workflow version
          type:
            - string
            - 'null'
          examples:
            - '150'
        allow_notifications:
          description: Whether email notifications are enabled for this workflow
          type: boolean
          examples:
            - true
        state:
          $ref: '#/components/schemas/WorkflowState'
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        steps:
          description: Array of step data
          type: array
          items:
            $ref: '#/components/schemas/Steps'
        step_order:
          description: Array of step IDs, in the order they appear in the workflow
          type: array
          items:
            type: string
          examples:
            - - '1076'
              - '1077'
              - '1078'
        workflow_notifications:
          oneOf:
            - $ref: '#/components/schemas/WorkflowNotifications'
            - type: 'null'
        updated_at:
          description: Time workflow is updated
          type: string
          format: date-time
          examples:
            - 2019-01-10T21:25:24.000Z
        trigger_type:
          description: Type of the first action of the first step. Null if the workflow has no trigger yet.
          type:
            - string
            - 'null'
          examples:
            - scheduled
          enum:
            - manual
            - shared_inbox
            - watch_folder
            - scheduled
            - delete_folder
            - null
        workflow_can_activate:
          description: True if the workflow has at least two steps and an action that transfers files or sends a package (`transfer`, `package_transfer`), or a `watch_folder`, `delete_folder`, `shared_inbox` or `antivirus` trigger or action.
          type: boolean
          examples:
            - false
        instance_stats:
          $ref: '#/components/schemas/InstanceStats'
        outputs:
          description: Global variables that the actions of the workflow can use as substitution variables. The values are the type names.
          type: object
          additionalProperties: true
          examples:
            - workflow_instance:
                uuid: string
                launched_at:
                  DD: string
                  MM: string
                  Month: string
                  YYYY: string
                  hh: string
                  mm: string
                  date_time: string
    201-Workflow:
      description: The created workflow, without steps
      title: Success response
      allOf:
        - $ref: '#/components/schemas/workflowData'
    InstanceStats:
      description: Shows runtime statistics of a workflow
      type: object
      properties:
        running:
          description: Number of executing and initiating jobs
          type: string
          examples:
            - '10'
        failed:
          description: Number of failed jobs
          type: string
          examples:
            - '10'
        completed:
          description: Number of completed jobs
          type: string
          examples:
            - '10'
    Steps:
      description: Object that contains step data. `actions` is present only in the long form.
      type: object
      properties:
        id:
          description: Step ID
          type: string
          examples:
            - '1260'
        name:
          description: Name you assign to the step
          type:
            - string
            - 'null'
          examples:
            - transcode step
        workflow_id:
          description: ID of the workflow that contains the step
          type: string
        user_id:
          type: string
        organization_id:
          type: string
        deleted:
          type: boolean
        action_order:
          description: Order of actions in a step, listed by action ID. The actions of a step run in parallel; this order is for display.
          type: array
          items:
            type: string
          examples:
            - - '1272'
              - '1263'
        actions:
          description: Data for actions in the step
          type: array
          items:
            $ref: '#/components/schemas/actionData'
    200-StepsID:
      description: Returned data for a step with a unique ID.
      title: Success response
      allOf:
        - $ref: '#/components/schemas/Steps'
    201-Step:
      description: The created step
      title: Success response
      allOf:
        - $ref: '#/components/schemas/Steps'
    ActionType:
      description: Type of an action. The first five are triggers.
      type: string
      enum:
        - manual
        - scheduled
        - watch_folder
        - shared_inbox
        - delete_folder
        - transfer
        - package_transfer
        - api
        - email_notification
        - custom_var
        - folder
        - telestream_qc
        - antivirus
    actionData:
      description: Returned action data. `data` is present for a single action (GET, POST) and in the long form of a step or workflow. Sensitive values (tokens, passwords, credentials) are removed from `data`.
      type: object
      properties:
        id:
          description: ID of the action
          type: string
          examples:
            - '1071'
        name:
          description: Name of the action. Null if no name is assigned.
          type:
            - string
            - 'null'
          examples:
            - null
        type:
          $ref: '#/components/schemas/ActionType'
        data:
          description: Detailed action data, as defined by the request schema of the type. Defaults are added, for example `timeout`.
          type: object
          additionalProperties: true
        deleted:
          type: boolean
        step_id:
          type: string
        organization_id:
          type: string
        user_id:
          type: string
        outputs:
          description: |-
            Describes the format of action outputs that can be used as substitution variables in subsequent actions. The values are the type names.

            - `manual`: none.
            - `scheduled`: `timestamp`.
            - `watch_folder`, `delete_folder`: `filename`, `file_id`, `timestamp`, `node_id`, `file_ext`, `filepath`, `parent_path`.
            - `shared_inbox`: `metadata`, `name`, `message`, `shared_inbox_name`, `timestamp`, `dropbox_id`, `file_id`, `node_id`, `sender_name`, `sender_email`, `sender_type`, `sender_id`.
            - `transfer`: `status`, `transfer_uuid`, `timestamp`.
            - `package_transfer`: `package_id`, `status`, `package_subject`, `package_message`.
            - `api`: `status`, `response_code`, `response_body`.
            - `email_notification`: `status`.
            - `folder`: `node_id`, `file_id`, `parent_file_id`, `timestamp`.
            - `custom_var`: one output for each variable of `custom_variables`.
            - `telestream_qc`: `status`, `project_id`, `state`, `filename`, `source_url`, `created_at`, `updated_at`, `error_class`, `error_message`.
            - `antivirus`: `status`, `file_scanned`, `virus_detected`, `virus_file_list`.
          type: object
          additionalProperties:
            type: string
          examples:
            - timestamp: iso8601
    LaunchResponse:
      type: object
      properties:
        workflow_id:
          type: integer
          examples:
            - 2116
        message:
          type: string
          examples:
            - Workflow has been triggered and Caldera will execute it.
    DefaultCopyName:
      type: object
      properties:
        default_copy_name:
          type: string
          examples:
            - Send Files to Media (1)
    Ping:
      type: object
      properties:
        db:
          type: string
          enum:
            - ok
            - connection_lost
        kafka:
          type: string
          enum:
            - ok
            - connection_error
    ApiCallbackRequest:
      description: Message of the service called by an `api` action with `callback`. Other properties are forwarded as is.
      type: object
      properties:
        token:
          description: The `token` injected by Automation in the payload of the request
          type: string
        status:
          description: '`in_progress` to report progress, `success` or `failed` to end the action.'
          type: string
          examples:
            - success
        progress:
          description: Percentage of progress, with `in_progress`
          type: integer
          minimum: 0
          maximum: 100
      required:
        - token
        - status
      additionalProperties: true
    ValidateActionResponse:
      description: Result of the validation, by location that has an `authentication`.
      type: object
      properties:
        source:
          $ref: '#/components/schemas/CredentialValidation'
        destination:
          $ref: '#/components/schemas/CredentialValidation'
    CredentialValidation:
      type: object
      properties:
        valid:
          type: boolean
        error:
          description: Reason of the failure. Present only if `valid` is false.
          type: string
          examples:
            - Authentication failed (HTTP 401)
      required:
        - valid
    substitutionVariables:
      description: Puts the value of a variable, or of the output of a previous action, in the field of `data` that `path` designates.
      type: object
      properties:
        template:
          description: 'Text that contains the variables: `{{global}}` for a global variable, `{{{step_id_<STEP>.action_id_<ACTION>.<FIELD>}}}` for the output of an action.'
          type: string
          examples:
            - '{{{step_id_1357.action_id_1409.node_id}}}'
        path:
          description: Path of the field of `data` that receives the text
          type: array
          items:
            $ref: '#/components/schemas/substitutionVariablesPath'
      required:
        - template
        - path
    substitutionVariablesPath:
      type: object
      properties:
        name:
          description: Name of the field in `data` (for a `map`).
          type: string
          examples:
            - source
        type:
          description: Path type. `map` is an object key, `array` a list; `input_map` is accepted by `custom_var` only.
          type: string
          examples:
            - map
          enum:
            - map
            - array
            - input_map
        index:
          description: Index in the list (for an `array`)
          type:
            - integer
            - string
          examples:
            - 0
      required:
        - type
    Step:
      type: object
      properties:
        workflow_id:
          description: ID of workflow that contains the step
          type: string
          examples:
            - '1260'
        name:
          description: The name of the step
          type: string
          examples:
            - transfer step
        action_order:
          description: Order of actions in a step, listed by action ID
          type: array
          items:
            type: string
          examples:
            - - '1273'
              - '1262'
              - '1274'
      required:
        - workflow_id
    createWorkflowRequest:
      type: object
      title: Creates a new workflow
      properties:
        name:
          description: Name of new workflow. It must be unique among the workflows of the user.
          type: string
          examples:
            - Send Files to Media
        hidden:
          description: Whether the workflow is hidden. A hidden workflow is not listed, and only the Secure Reports Service can access it.
          type: boolean
          examples:
            - false
        allow_notifications:
          description: Whether email notifications are enabled
          type: boolean
          examples:
            - false
        workflow_notifications:
          $ref: '#/components/schemas/WorkflowNotifications'
        step_order:
          description: Order of steps. Normally empty at creation.
          type: array
          items:
            type: string
      required:
        - name
    createWorkflowPermissionRequest:
      type: object
      title: Creates a new workflow permission
      properties:
        user_id:
          description: User ID to associate with the permission
          type: string
          examples:
            - '32'
        workflow_id:
          description: ID for the workflow on which to create the permission
          type: string
          examples:
            - '32'
        organization_id:
          description: ID of organization
          type: string
          examples:
            - '58'
        edit:
          description: Whether to give permission to edit the workflow. It implies the other permissions in the checks of the API.
          type: boolean
          default: false
        duplicate:
          description: Whether to give permission to duplicate the workflow
          type: boolean
          default: false
        manage_jobs:
          description: Whether to give permission to manage workflow jobs
          type: boolean
          default: false
      required:
        - user_id
        - workflow_id
    updateWorkflow:
      description: Updates an existing workflow
      title: Updates an existing workflow
      type: object
      properties:
        name:
          description: Name of workflow
          type: string
          examples:
            - Send Files to Media
        step_order:
          description: Array of workflow steps, in the order they appear in the workflow. The first step contains the trigger.
          type: array
          items:
            type: string
          examples:
            - - '321'
              - '123'
              - '111'
        allow_notifications:
          description: Whether email notifications are enabled for this workflow
          type: boolean
          examples:
            - true
        workflow_notifications:
          $ref: '#/components/schemas/WorkflowNotifications'
        hidden:
          description: Whether the workflow is hidden
          type: boolean
    cancelWorkflowInstance:
      title: Set the status of a job
      type: object
      properties:
        status:
          description: Status of the workflow instance. To cancel a workflow instance, the value is `canceled`. Any other value of the enumeration is accepted and sent to the workflow engine; another value is rejected with 422.
          type: string
          examples:
            - canceled
          enum:
            - initiating
            - executing
            - queued
            - queue_full
            - paused
            - resumed
            - complete
            - failed
            - canceled
            - timeout
            - deleted
      required:
        - status
    updateStepRequest:
      title: Updates a step
      type: object
      properties:
        name:
          description: Name of the step
          type: string
          examples:
            - notification step
        action_order:
          description: Order of actions in a step, listed by action ID
          type: array
          items:
            type: string
          examples:
            - - '1273'
              - '1262'
              - '1274'
    updateState:
      title: Updates the state of the workflow
      type: object
      properties:
        event:
          description: Request a state change. `save_as_draft` makes the workflow editable. `activate` goes to `active`, through `validating` from `draft`. `deactivate` goes to `inactive`; the running jobs are not stopped.
          type: string
          examples:
            - save_as_draft
          enum:
            - save_as_draft
            - activate
            - deactivate
      required:
        - event
    updateWorkflowPermissionRequest:
      title: Updates an existing workflow permission
      type: object
      properties:
        edit:
          description: Whether to give permission to edit the workflow
          type: boolean
        duplicate:
          description: Whether to give permission to duplicate the workflow
          type: boolean
        manage_jobs:
          description: Whether to give permission to manage workflow jobs
          type: boolean
    AppPermissions:
      description: Application permissions and settings for an organization
      title: Automation App Permissions
      type: object
      properties:
        organization_id:
          type: string
          examples:
            - '58'
        failed_count_to_deactivate:
          description: Number of consecutive failed workflow runs before automatic deactivation. The default is 10.
          type: integer
          examples:
            - 10
        enabled:
          description: Whether the Automation application is enabled for the organization
          type: boolean
        available:
          description: Whether the Automation application is available to the organization (edition)
          type: boolean
    updateAppPermissionsRequest:
      description: Request payload to update application permissions for an organization
      title: Update Automation App Permissions Request
      type: object
      properties:
        failed_count_to_deactivate:
          description: Number of consecutive failed workflow runs before automatic deactivation
          type: integer
          examples:
            - 5
      required:
        - failed_count_to_deactivate
    Headers:
      type: object
      properties:
        key:
          description: Header key
          type:
            - string
            - 'null'
          examples:
            - Content-Type
        value:
          description: Header value
          type:
            - string
            - 'null'
          examples:
            - text/html
      required:
        - key
        - value
    Paths:
      description: A path of a location. A `source` location uses `source` (`"/"` is the location itself); a `destination` location uses `destination` (a folder to create at the destination, which can contain substitution variables).
      type: object
      properties:
        source:
          type: string
          examples:
            - /
        destination:
          type: string
          examples:
            - '{{workflow_instance.uuid}}'
    Conditions:
      description: A condition of a `transfer`, `package_transfer`, `watch_folder` or `delete_folder` filter.
      type: object
      properties:
        field_name:
          description: Name of the field. `file_name`, `extension_name` and `file_size` for `watch_folder`; `file_name`, `folder_name` and `extension_name` for `delete_folder`.
          type: string
          examples:
            - file_name
          enum:
            - file_name
            - folder_name
            - extension_name
            - file_size
        field_type:
          description: '`string` with `file_name`, `folder_name` and `extension_name`; `byte` with `file_size` (`watch_folder` only).'
          type: string
          examples:
            - string
          enum:
            - string
            - byte
        match_type:
          description: '`includes`, `excludes`, `matches`, `regex` (and `equal`, `does_not_match` for a `watch_folder`) with a string field. `equal`, `greater_than`, `less_than`, `greater_than_or_equal`, `less_than_or_equal` with `file_size`. `delete_folder` accepts `includes`, `excludes`, `matches` and `regex`.'
          type: string
          examples:
            - includes
          enum:
            - includes
            - excludes
            - matches
            - does_not_match
            - regex
            - equal
            - greater_than
            - less_than
            - greater_than_or_equal
            - less_than_or_equal
        value:
          description: Value of the condition. A string (a list of strings for a `watch_folder`), or a number of bytes for `file_size`.
          oneOf:
            - type: string
            - type: integer
            - type: array
              items:
                type: string
            - type: array
              items:
                type: integer
          examples:
            - .jpg
        required:
          type: boolean
        max_length:
          type: string
      required:
        - field_name
        - field_type
        - match_type
    SharedInboxCondition:
      description: A condition on a metadata field of the shared inbox
      type: object
      properties:
        id:
          type: string
        field_name:
          type: string
        field_type:
          type: string
          enum:
            - single-text
            - single-text-read-only
            - textbox
            - multiple-checkbox
            - single-dropdown
            - date
        match_type:
          type: string
          enum:
            - excludes
            - regex
            - includes
            - matches
            - does_not_match
            - equal
            - on_or_after
            - on
            - after
            - before
            - on_or_before
        value:
          type:
            - array
            - string
        required:
          type: boolean
        max_length:
          type: string
      additionalProperties: false
    TransferAuthentication:
      description: Credentials of an unmanaged node. Null for a node managed by Aspera on Cloud. The credentials are encrypted, and are not returned.
      oneOf:
        - type: 'null'
        - title: node_api
          type: object
          properties:
            type:
              type: string
              enum:
                - node_api
            credentials:
              type: string
              description: Base64-encoded username:password
            validate_tls:
              type:
                - boolean
                - 'null'
          required:
            - type
          additionalProperties: false
        - title: ssh
          type: object
          properties:
            type:
              type: string
              enum:
                - ssh
            credentials:
              type: string
              description: 'Base64-encoded username:password:: (password) or username::private_key:passphrase (key)'
          required:
            - type
            - credentials
          additionalProperties: false
    TargetRate:
      description: Rate and retry conditions for the transfer
      type: object
      properties:
        rate:
          description: Transfer rate in Kbps
          type: integer
          examples:
            - 100000
        allow_retry:
          description: Whether to allow retry of a failed transfer
          type: boolean
        retry_attempts:
          description: Number of times Automation can retry the transfer
          type: integer
        retry_interval:
          description: Length of time to wait before retrying the transfer, in seconds
          type: integer
      additionalProperties: false
    ContentEncryption:
      description: Encryption of the content in transit
      type: object
      properties:
        encryption:
          type: string
          enum:
            - none
            - aes-128
            - aes-192
            - aes-256
        apply_protection:
          description: Apply content protection (password) to the file transfer
          type: boolean
        password:
          description: Password of the content protection, used if `apply_protection` is true.
          type:
            - string
            - 'null'
      additionalProperties: false
    TransferSourceArchive:
      description: What to do with the source after the transfer. With `archive`, `move_after_transfer` is required. With `delete` or `none`, the three `remove_*` options are accepted.
      type: object
      properties:
        archive_option:
          type: string
          enum:
            - none
            - archive
            - delete
        move_after_transfer:
          description: Archive folder, relative to the source node
          type: string
          examples:
            - /abc/def
        remove_empty_directories:
          type: boolean
        remove_empty_source_dir:
          type: boolean
        remove_skipped:
          description: Delete the files skipped because they already exist at the destination
          type: boolean
      additionalProperties: false
    TransferSource:
      description: |-
        Source of a transfer. `node_id` is a numeric string, or null. Accepted shapes, with `paths` always required:
        - `type: node`: `node_id` and `file_id`, or `node_id` and `root_file_id`, or `access_key` and `node_url` (unmanaged node).
        - `type: workspace`: `node_id` and `file_id`, or `node_id` and `root_file_id`.

        For "same as trigger", `node_id` and `file_id` are null.
      type: object
      properties:
        type:
          type: string
          enum:
            - node
            - workspace
        node_id:
          type:
            - string
            - 'null'
          pattern: ^[0-9]+$
          examples:
            - '95'
        file_id:
          type:
            - string
            - 'null'
          examples:
            - '1730980'
        root_file_id:
          type:
            - string
            - 'null'
        node_name:
          type: string
          examples:
            - Tor02_node
        file_name:
          type: string
          examples:
            - 01-test
        workspace_id:
          type: string
        workspace_name:
          type: string
        paths:
          type: array
          items:
            $ref: '#/components/schemas/Paths'
        transfer_contents_only:
          type: boolean
        token:
          type: string
        access_key:
          type:
            - string
            - 'null'
        node_url:
          type: string
        authentication:
          $ref: '#/components/schemas/TransferAuthentication'
      required:
        - type
        - paths
      additionalProperties: false
    TransferDestination:
      description: |-
        Destination of a transfer. `node_id` is a numeric string. Accepted shapes, with `paths` always required:
        - `type: node`: `node_id` and `file_id`, or `access_key` and `node_url` (unmanaged node).
        - `type: workspace`: `workspace_id`, `workspace_name`, `node_id` and `file_name`; `file_id` is optional.
      type: object
      properties:
        type:
          type: string
          enum:
            - node
            - workspace
        node_id:
          type:
            - string
            - 'null'
          pattern: ^[0-9]+$
          examples:
            - '95'
        file_id:
          type:
            - string
            - 'null'
          examples:
            - '1818255'
        root_file_id:
          type:
            - string
            - 'null'
        node_name:
          type: string
        file_name:
          type: string
          examples:
            - folder1
        workspace_id:
          type: string
        workspace_name:
          type: string
        paths:
          type: array
          items:
            $ref: '#/components/schemas/Paths'
        token:
          type: string
        access_key:
          type:
            - string
            - 'null'
        node_url:
          type: string
        authentication:
          $ref: '#/components/schemas/TransferAuthentication'
      required:
        - type
        - paths
      additionalProperties: false
    TransferData:
      description: 'Data of a `transfer` action. When `conditions_type` is `custom`, `join_type` and at least one condition are required; when it is `all_new`, `conditions` must be empty. The source and the destination must differ. `timeout` is in milliseconds: 86400000 (24 h) when omitted.'
      type: object
      properties:
        name:
          type: string
        timeout:
          type:
            - integer
            - 'null'
          examples:
            - 86400000
        source:
          $ref: '#/components/schemas/TransferSource'
        destination:
          $ref: '#/components/schemas/TransferDestination'
        rate_policy:
          type: string
          enum:
            - fair
            - low
            - high
            - fixed
        target_rate:
          $ref: '#/components/schemas/TargetRate'
        content_encryption:
          $ref: '#/components/schemas/ContentEncryption'
        resume_policy:
          type: object
          properties:
            resume_partials:
              description: Resume partial transfers
              type: boolean
            allow_retry:
              type: boolean
            difference_check:
              type: string
              enum:
                - attrs
                - none
            destination_file_options:
              type: string
              enum:
                - overwrite_always
                - overwrite_newer
                - overwrite_different
                - overwrite_both_newer_different
                - overwrite_never
          additionalProperties: false
        file_attributes:
          description: Preserve the file attributes
          type: boolean
        srs_action:
          type: boolean
        bearer_token:
          type: string
        source_archive:
          $ref: '#/components/schemas/TransferSourceArchive'
        conditions_type:
          type: string
          enum:
            - all_new
            - custom
        join_type:
          type: string
          enum:
            - and
            - or
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Conditions'
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/substitutionVariables'
      required:
        - source
        - destination
      additionalProperties: false
    PackageRecipient:
      type: object
      properties:
        id:
          type:
            - string
            - 'null'
        type:
          description: Lowercase, unlike `email_notification`.
          type: string
          enum:
            - dropbox
            - user
            - email
            - newEmail
            - group
        name:
          type:
            - string
            - 'null'
      required:
        - type
      additionalProperties: false
    PackageDefinition:
