              type:
                - string
                - 'null'
              pattern: ^[0-9]+$
            file_id:
              type:
                - string
                - 'null'
            node_name:
              type: string
            file_name:
              type: string
            workspace_id:
              type: string
            workspace_name:
              type: string
            paths:
              type: array
              items:
                $ref: '#/components/schemas/Paths'
            token:
              type: string
            access_key:
              type:
                - string
                - 'null'
            node_url:
              type: string
          required:
            - type
            - node_id
            - file_id
            - paths
          additionalProperties: false
        package:
          $ref: '#/components/schemas/PackageDefinition'
        target_rate:
          $ref: '#/components/schemas/TargetRate'
        content_encryption:
          type: object
          properties:
