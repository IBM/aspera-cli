          additionalProperties: false
        resume_policy:
          type: object
          properties:
            resume_partials:
              type: boolean
            allow_retry:
              type: boolean
            difference_check:
              type: string
              enum:
                - attrs
                - none
          additionalProperties: false
        file_attributes:
          type: boolean
        source_archive:
          type: object
          properties:
            archive_option:
              type: string
              enum:
                - delete
                - archive
                - none
          additionalProperties: false
        conditions_type:
          type: string
          enum:
            - all_new
            - custom
        join_type:
          type: string
          enum:
            - and
            - or
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Conditions'
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/substitutionVariables'
      required:
        - source
        - package
      additionalProperties: false
    ApiAuthentication:
      description: Authentication of the request. `bearer` requires `token`; `basic` requires `username` and `password`. The secrets are not returned.
      type: object
      properties:
        type:
          type: string
          enum:
            - none
            - bearer
            - basic
          default: none
        token:
          type:
            - string
            - 'null'
        username:
          type:
            - string
            - 'null'
        password:
          type:
            - string
            - 'null'
      required:
        - type
      additionalProperties: false
    ApiData:
      description: 'Data of an `api` action. `endpoint` must be an HTTP or HTTPS URL. `timeout` is in milliseconds: 300000 (5 min) when omitted.'
      type: object
      properties:
        timeout:
          type:
            - integer
            - 'null'
        method:
          type: string
          enum:
            - get
            - post
            - put
            - delete
        endpoint:
          type: string
          examples:
            - https://api.example.com/v1/ingest
        headers:
          type: array
          items:
            $ref: '#/components/schemas/Headers'
        authentication:
          $ref: '#/components/schemas/ApiAuthentication'
        payload:
          type:
            - string
            - 'null'
        callback:
          description: Wait for the callback on /external/api_callback
          type: boolean
        verify_ssl:
          type: boolean
        srs_action:
          type: boolean
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/substitutionVariables'
      required:
        - method
        - endpoint
      additionalProperties: false
    EmailNotificationData:
      description: Data of an `email_notification` action. `email_addresses` or `recipient_hashes` is required. `timeout` is in milliseconds, 300000 (5 min) when omitted.
      type: object
      properties:
        timeout:
          type:
            - integer
            - 'null'
        subject:
          type:
            - string
            - 'null'
        message:
          type:
            - string
            - 'null'
        send_as_type:
          description: Only `User` is accepted.
          type:
            - string
            - 'null'
          enum:
            - User
            - null
        email_addresses:
          type: array
          items:
            type: string
        recipient_hashes:
          type: array
          items:
            $ref: '#/components/schemas/RecipientHash'
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/substitutionVariables'
      additionalProperties: false
    CustomVarData:
      description: Data of a `custom_var` action. The action cannot be in the first step. Variable names cannot contain spaces. The value of a variable comes from a substitution whose `path` targets it.
      type: object
      properties:
        timeout:
          type:
            - integer
            - 'null'
        custom_variables:
          type: object
          additionalProperties: true
          examples:
            - year: string
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/substitutionVariables'
      required:
        - custom_variables
        - substitutions
      additionalProperties: false
    FolderData:
      description: Data of a `folder` action. If `folder_name` is null, a substitution must target `folder_name`. `timeout` is in milliseconds, 86400000 (24 h) when omitted.
      type: object
      properties:
        timeout:
          type:
            - integer
            - 'null'
        mount_point:
          type: boolean
        folder_name:
          type:
            - string
            - 'null'
          examples:
            - '{{workflow_instance.launched_at.YYYY}}-{{workflow_instance.launched_at.MM}}'
        parent_folder:
          type: object
          description: Parent folder. `type`, `node_id`, `file_id` and `paths` are required.
          properties:
            type:
              type: string
              enum:
                - node
                - workspace
            node_id:
              type: string
              pattern: ^[0-9]+$
            file_id:
              type: string
            node_name:
              type: string
            file_name:
              type: string
            workspace_id:
              type: string
            workspace_name:
              type: string
            paths:
              type: array
              items: {}
            token:
              type: string
          required:
            - type
            - node_id
            - file_id
            - paths
          additionalProperties: false
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/substitutionVariables'
      required:
        - folder_name
        - parent_folder
      additionalProperties: false
    ManualData:
      description: Data of a `manual` trigger. Send `{}`, or omit it.
      type: object
      additionalProperties: true
    ScheduledData:
      description: |-
        Data of a `scheduled` trigger. `start_date` (and `end_date`) must be in the future, and `start_date` before `end_date`.

        Rules on `repeat_number`: `minutes` greater than 4; `hours` 1 to 24; `days` 1 to 7; `weeks` 1 to 4, with `days_of_the_week`; `months` 1 to 12, with `day_of_the_month` (1 to 31).
      type: object
      properties:
        repeat_interval:
          type: object
          properties:
            repeat_type:
              type: string
              enum:
                - minutes
                - hours
                - days
                - weeks
                - months
            repeat_number:
              type: integer
            days_of_the_week:
              description: Boolean flags by day name (`monday` to `sunday`). Required for `weeks`.
              type: object
              additionalProperties:
                type: boolean
            day_of_the_month:
              type: integer
              minimum: 1
              maximum: 31
          required:
            - repeat_type
            - repeat_number
          additionalProperties: false
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/substitutionVariables'
      required:
        - repeat_interval
        - start_date
      additionalProperties: false
    WatchFolderData:
      description: Data of a `watch_folder` trigger. With `conditions_type` `custom`, `join_type` and at least one condition are required; with `all_new`, there are no conditions and no `join_type`. The API adds `source.absolute_path`.
      type: object
      properties:
        source:
          type: object
          description: 'Monitored folder. Required: `type`, `node_id`, `node_name`, `file_id`, `file_name`, `paths` (at least one item) and `absolute_path`; for a `workspace` also `workspace_id` and `workspace_name`.'
          properties:
            type:
              type: string
              enum:
                - node
                - workspace
            node_id:
              type: string
              pattern: ^[0-9]+$
            node_name:
              type: string
            file_id:
              type: string
            file_name:
              type: string
            absolute_path:
              type: string
            workspace_id:
              type: string
            workspace_name:
              type: string
            paths:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Paths'
            token:
              type: string
            node_url:
              type: string
          required:
            - type
            - node_id
            - node_name
            - file_id
            - file_name
            - paths
          additionalProperties: false
        recursive_trigger:
          type: boolean
        conditions_type:
          type: string
          enum:
            - all_new
            - custom
        join_type:
          type: string
          enum:
            - and
            - or
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Conditions'
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/substitutionVariables'
      required:
        - source
      additionalProperties: false
    SharedInboxData:
      description: Data of a `shared_inbox` trigger. With `conditions_type` `custom`, `join_type` and at least one condition are required.
      type: object
      properties:
        source:
          type: object
          properties:
            type:
              type: string
              enum:
                - workspace
            workspace_id:
              type: string
            workspace_name:
              type: string
            inbox_id:
              description: The `dropbox_id` of the shared inbox
              type: string
            inbox_name:
              type: string
          required:
            - type
            - workspace_id
            - workspace_name
            - inbox_id
            - inbox_name
          additionalProperties: false
        conditions_type:
          type: string
          enum:
            - all_new
            - custom
        join_type:
          type: string
          enum:
            - and
            - or
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/SharedInboxCondition'
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/substitutionVariables'
      required:
        - source
        - conditions_type
      additionalProperties: false
    DeleteFolderData:
      description: Data of a `delete_folder` trigger. `trigger_on_file_deletes` and `trigger_on_folder_deletes` cannot be set with `conditions_type` `custom`.
      type: object
      properties:
        source:
          type: object
          description: 'Monitored folder. Required: `type`, `file_id`, `paths` and `access_key`.'
          properties:
            type:
              type: string
              enum:
                - node
                - workspace
            node_id:
              type: string
              pattern: ^[0-9]+$
            node_name:
              type: string
            file_id:
              type: string
            file_name:
              type: string
            workspace_id:
              type: string
            workspace_name:
              type: string
            paths:
              type: array
              items:
                $ref: '#/components/schemas/Paths'
            token:
              type: string
            access_key:
              type: string
            node_url:
              type: string
          required:
            - type
            - file_id
            - paths
            - access_key
          additionalProperties: false
        trigger_on_folder_deletes:
          type: boolean
        trigger_on_file_deletes:
          type: boolean
        conditions_type:
          type: string
          enum:
            - all_new
            - custom
        join_type:
          type: string
          enum:
            - and
            - or
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Conditions'
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/substitutionVariables'
      required:
        - source
        - conditions_type
      additionalProperties: false
    TelestreamQcData:
      description: Data of a `telestream_qc` action, offered only when the feature is enabled for the organization. `timeout` is in milliseconds.
      type: object
      properties:
        endpoint:
          type: string
        api_key:
          type: string
        body:
          type: string
        timeout:
          type:
            - integer
            - 'null'
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/substitutionVariables'
      required:
        - endpoint
        - api_key
        - body
    AntivirusData:
      description: Data of an `antivirus` action. The action is created by the system, not by a user.
      type: object
      properties:
        package_id:
          type: string
        package_contents_path:
          type: string
        file_count:
          type: integer
        node_id:
          type: integer
        file_id:
          type:
            - string
            - 'null'
        contents_file_id:
          type:
            - string
            - 'null'
        sender_id:
          type:
            - string
            - 'null'
      required:
        - package_id
        - package_contents_path
        - file_count
        - node_id
      additionalProperties: false
    createActionManual:
      title: Creates a manual trigger
      type: object
      properties:
        type:
          type: string
          enum:
            - manual
        step_id:
          type: string
        name:
          type: string
        data:
          $ref: '#/components/schemas/ManualData'
      required:
        - type
        - step_id
    createActionScheduled:
      title: Creates a scheduled trigger
      type: object
      properties:
        type:
          type: string
          enum:
            - scheduled
        step_id:
          type: string
        name:
          type: string
        data:
          $ref: '#/components/schemas/ScheduledData'
      required:
        - type
        - step_id
        - data
    createActionWatchFolder:
      title: Creates a watch folder trigger
      type: object
      properties:
        type:
          type: string
          enum:
            - watch_folder
        step_id:
          type: string
        name:
          type: string
        data:
          $ref: '#/components/schemas/WatchFolderData'
      required:
        - type
        - step_id
        - data
    createActionSharedInbox:
      title: Creates a shared inbox trigger
      type: object
      properties:
        type:
          type: string
          enum:
            - shared_inbox
        step_id:
          type: string
        name:
          type: string
        data:
          $ref: '#/components/schemas/SharedInboxData'
      required:
        - type
        - step_id
        - data
    createActionDeleteFolder:
      title: Creates a delete folder trigger
      type: object
      properties:
        type:
          type: string
          enum:
            - delete_folder
        step_id:
          type: string
        name:
          type: string
        data:
          $ref: '#/components/schemas/DeleteFolderData'
      required:
        - type
        - step_id
        - data
    createActionTransfer:
      title: Creates a new action to send a file or folder
      type: object
      properties:
        type:
          description: Action type. For an action that transfers a file, the type is always transfer.
          type: string
          enum:
            - transfer
        step_id:
          description: ID for step that contains the action
          type: string
          examples:
            - '1314'
        name:
          type: string
        data:
          $ref: '#/components/schemas/TransferData'
      required:
        - type
        - step_id
        - data
    createActionPackageTransfer:
      title: Creates a new action to send a package
      type: object
      properties:
        type:
          type: string
          enum:
            - package_transfer
        step_id:
          type: string
        name:
          type: string
        data:
          $ref: '#/components/schemas/PackageTransferData'
      required:
        - type
        - step_id
        - data
    createActionAPI:
      title: Creates a new action that calls an API
      type: object
      properties:
        type:
          description: Action type. For an action that calls an API, the type is always api.
          type: string
          enum:
            - api
        step_id:
          description: ID of step that contains the action
          type: string
          examples:
            - '1406'
        name:
          type: string
        data:
          $ref: '#/components/schemas/ApiData'
      required:
        - type
        - step_id
        - data
    createActionEmailNotification:
      title: Creates a new action that sends an email
      type: object
      properties:
        type:
          type: string
          enum:
            - email_notification
        step_id:
          type: string
        name:
          type: string
        data:
          $ref: '#/components/schemas/EmailNotificationData'
      required:
        - type
        - step_id
        - data
    createActionCustomVar:
      title: Creates a new action that defines custom variables
      type: object
      properties:
        type:
          type: string
          enum:
            - custom_var
        step_id:
          type: string
        name:
          type: string
        data:
          $ref: '#/components/schemas/CustomVarData'
      required:
        - type
        - step_id
        - data
    createActionFolder:
      title: Creates a new action that creates a folder
      type: object
      properties:
        type:
          type: string
          enum:
            - folder
        step_id:
          type: string
        name:
          type: string
        data:
          $ref: '#/components/schemas/FolderData'
      required:
        - type
        - step_id
        - data
    createActionTelestreamQc:
      title: Creates a new Telestream quality control action
      type: object
      properties:
        type:
          type: string
          enum:
            - telestream_qc
        step_id:
          type: string
        name:
          type: string
        data:
          $ref: '#/components/schemas/TelestreamQcData'
      required:
        - type
        - step_id
        - data
    createActionAntivirus:
      title: Creates an antivirus action
      type: object
      properties:
        type:
          type: string
          enum:
            - antivirus
        step_id:
          type: string
        name:
          type: string
        data:
          $ref: '#/components/schemas/AntivirusData'
      required:
        - type
        - step_id
        - data
    createAction:
      description: Request to create or update an action. The `type` selects the structure of `data`.
      oneOf:
        - $ref: '#/components/schemas/createActionManual'
        - $ref: '#/components/schemas/createActionScheduled'
        - $ref: '#/components/schemas/createActionWatchFolder'
        - $ref: '#/components/schemas/createActionSharedInbox'
        - $ref: '#/components/schemas/createActionDeleteFolder'
        - $ref: '#/components/schemas/createActionTransfer'
        - $ref: '#/components/schemas/createActionPackageTransfer'
        - $ref: '#/components/schemas/createActionAPI'
        - $ref: '#/components/schemas/createActionEmailNotification'
        - $ref: '#/components/schemas/createActionCustomVar'
        - $ref: '#/components/schemas/createActionFolder'
        - $ref: '#/components/schemas/createActionTelestreamQc'
        - $ref: '#/components/schemas/createActionAntivirus'
      discriminator:
        propertyName: type
        mapping:
          manual: '#/components/schemas/createActionManual'
          scheduled: '#/components/schemas/createActionScheduled'
          watch_folder: '#/components/schemas/createActionWatchFolder'
          shared_inbox: '#/components/schemas/createActionSharedInbox'
          delete_folder: '#/components/schemas/createActionDeleteFolder'
          transfer: '#/components/schemas/createActionTransfer'
          package_transfer: '#/components/schemas/createActionPackageTransfer'
          api: '#/components/schemas/createActionAPI'
          email_notification: '#/components/schemas/createActionEmailNotification'
          custom_var: '#/components/schemas/createActionCustomVar'
          folder: '#/components/schemas/createActionFolder'
          telestream_qc: '#/components/schemas/createActionTelestreamQc'
          antivirus: '#/components/schemas/createActionAntivirus'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JSON Web Token (bearer token) in the Authorization header
  responses:
    Unauthorized:
      description: Unauthorized. The bearer token is missing or is not a valid JSON Web Token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden. The token does not give access to the Automation application, the Automation application is not enabled for the organization, or the user has no permission on the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found. The identifier submitted in the request is incorrect, or the resource was deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Unprocessable Entity. A parameter is missing or incorrect, or the operation is not allowed in the current state. The message gives the reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
