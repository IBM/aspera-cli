                    - Tor02_node
                paths:
                  description: Array of objects that contain destination paths for transfer
                  type: array
                  items:
                    $ref: '#/components/schemas/Paths'
                type:
                  description: 'Type of destination for transfer. Allowed values: workspace, node.'
                  type: string
                  examples:
                    - workspace
                  enum:
                    - workspace
                    - node
                workspace_id:
                  description: ID of workspace at destination
                  type: string
                  examples:
                    - '638'
                workspace_name:
                  description: Name of workspace at destination
                  type: string
                  examples:
                    - dev_workspace
              required:
                - node_id
                - file_id
            file_attributes:
              description: File attributes are defined
              type: boolean
              examples:
                - true
            conditions_type:
              description: 'The conditions type for the transfer. Allowed values: all_new (transfers all new files), custom (adds custom filtering conditions). Default: all-new.'
              type: string
              examples:
                - custom
              default: all_new
              enum:
                - custom
                - all_new
            join_type:
              description: 'The logical operator that joins multiple conditions. Allowed values: and, or.'
              type: string
              examples:
                - and
              enum:
                - and
                - or
            conditions:
              description: Filtering conditions for the transfer
              type: array
              items:
                $ref: '#/components/schemas/Conditions'
            resume_policy:
              description: Policy for resuming a transfer
              type: object
              properties:
                destination_file_options:
                  description: 'Processing options for file at destination. Allowed values: overwrite_always, overwrite_both_newer_and_different, overwrite_different, overwrite_newer, overwrite_never.'
                  type: string
                  examples:
                    - overwrite_always
                  enum:
                    - overwrite_always
                    - overwrite_both_newer_and_different
                    - overwrite_different
                    - overwrite_newer
                    - overwrite_never
                difference_check:
                  description: 'Type of check used to validate content. Allowed values: attrs, none.'
                  type: string
                  examples:
                    - attrs
                  enum:
                    - attrs
                    - none
                resume_partials:
                  description: Partial transfers should be resumed
                  type: boolean
                  examples:
                    - true
            source:
              description: Source of the transfer
              type: object
              properties:
                type:
                  description: 'Source type. Allowed values: workspace, node.'
                  type: string
                  examples:
                    - node
                  enum:
                    - workspace
                    - node
                file_id:
                  description: ID of file that is transferred
                  type: string
                  examples:
                    - '1730980'
                file_name:
                  description: Name of file that is transferred
                  type: string
                  examples:
                    - 01-test
                node_id:
                  description: ID of the source node.
                  type: string
                  examples:
                    - '95'
                node_name:
                  description: Name of the source node.
                  type: string
                  examples:
                    - Tor02_node
                paths:
                  description: Array of objects that contain source paths for transfer
                  type: array
                  items:
                    $ref: '#/components/schemas/Paths'
                token:
                  description: Token for the transfer
                  type: string
                  examples:
                    - <token>
              required:
                - node_id
                - file_id
                - paths
            source_archive:
              description: Archive policy for the transfer source
              type: object
              properties:
                archive_option:
                  description: 'Archive policy for the package at the source. Allowed values: none, archive, delete.'
                  type: string
                  examples:
                    - none
                  enum:
                    - none
                    - archive
                    - delete
                delete_empty_subdirectories:
                  description: Delete empty subdirectories at source after transfer
                  type: boolean
                  examples:
                    - false
                move_after_transfer:
                  description: Archive location in case of archiving. (location relative to source path)
                  type: string
                  examples:
                    - /abc/def
                remove_skipped:
                  description: Archive location in case of delete source. to remove the skipped files
                  type: boolean
                  examples:
                    - true
            substitutions:
              description: Data for substitution variables from previous steps, inserted into the message
              type: array
              items:
                $ref: '#/components/schemas/substitutionVariables'
            timeout:
              description: 'The maximum time, in seconds, the action can take before it is marked as failed. Default: 24 hours, minimum: 1 hour, maximum: 48 hours.'
              type: integer
              examples:
                - 144000
              default: 86400
              minimum: 3600
              maximum: 172800
            target_rate:
              description: Rate and retry conditions for the transfer
              type: object
              properties:
                rate:
                  description: Transfer rate, in bytes per second
                  type: integer
                  examples:
                    - 10000
                  default: 10000
                allow_retry:
                  description: Whether to allow retry of a failed transfer
                  type: boolean
                  examples:
                    - true
                  default: true
                retry_attempts:
                  description: Number of times Automation can retry the transfer
                  type: integer
                  examples:
                    - 3
                  default: 3
                retry_interval:
                  description: Length of time to wait before retrying the transfer, in seconds
                  type: integer
                  examples:
                    - 30
                  default: 30
          required:
            - source
            - destination
        step_id:
          description: ID for step that contains the action
          type: string
          examples:
            - '1314'
        type:
          description: Action type. For an action that transfers a file, the type is always transfer.
          type: string
          examples:
            - transfer
          enum:
            - transfer
      required:
        - data
        - type
        - step_id
      title: Creates a new action to send a file or folder
    Conditions:
      type: object
      properties:
        field_name:
          description: 'Name of the condition field. Allowed values: file_name, extension_name, file_size'
          type: string
          examples:
            - file_name
          enum:
            - file_name
            - extension_name
            - file_size
        field_type:
          description: 'Type of the condition field. Allowed values: string, byte. The value ''string'' is used with a field_name of file_name or extension_name. The value ''byte'' is used with a field_name of file_size.'
          type: string
          examples:
            - string
          enum:
            - string
            - byte
        match_type:
          description: 'Logic for the matching condition. Allowed values: includes, excludes, matches, regex, equal, greater_than, less_than, greater_than_or_equal, less_than_or_equal. A value of includes, excludes, matches, or regex is used with a field_name of file_name or extension_name. A value of equal, greater_than, less_than, greater_than_or_equal or less_than_or_equal is used with a field_name of file_size.'
          type: string
          examples:
            - includes
          enum:
            - includes
            - excludes
            - matches
            - regex
            - equal
            - greater_than
            - less_than
            - greater_than_or_equal
            - less_than_or_equal
        value:
          description: Value of the condition
          type: string
          examples:
            - .jpg
        size:
          description: Size of file being transferred, in bytes
          type: integer
          examples:
            - 500000
      required:
        - field_name
        - field_type
        - match_type
        - value
    Recipients:
      type: object
      properties:
        id:
          description: Recipient ID
          type: string
          examples:
