# Use 'rake tools:openapi' to update this file

openapi: 3.1.0
info:
  title: Automation API
  description: |-
    The Automation API allows you to create multistep workflows with event-based triggers cued to IBM Aspera on Cloud endpoints. The first step in your workflow contains the trigger, which can be a person or an API, a series of scheduled times, a new file added to a folder, or a package arriving in a shared inbox, or the deletion of a file or folder.

    The rest of the steps in the workflow contain one or more actions. An action can transfer a file, send a package, call an API, notify users, create custom substitution variables, or create a folder. After you activate the workflow, you can monitor active jobs and update the state of the workflow, which allows you to make edits. Note: Each workflow must contain at least one action that transfers a file or sends a package.

    Access Control: You must include a JSON Web Token (bearer token) in the authorization header of your request.

    For additional information, visit the Aspera Developer Center at https://developer.ibm.com/aspera/
  version: 1.0.5
  license:
    url: https://ibm.com
    name: (c) IBM. All rights reserved
servers:
  - url: https://api.ibmaspera.com/automation/v1
    description: The Automation App production server
security:
  - bearerAuth: []
tags:
  - name: workflows
    description: Workflows
  - name: workflow_instances
    description: Jobs (workflow instances)
  - name: steps
    description: Steps of a workflow
  - name: actions
    description: Actions within a step
  - name: workflow_permissions
    description: Permissions on workflows
paths:
  /workflows:
    get:
      operationId: listWorkflows
      summary: Get workflows
      description: Returns all workflows.
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-Workflows'
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '500':
          description: Internal Server Error
      tags:
        - workflows
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
    post:
      operationId: createWorkflow
      summary: Create a workflow
      description: Creates a new workflow. Once you have created the workflow, you can create one or more steps within the workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createWorkflowRequest'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/201-Workflow'
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
      tags:
        - workflows
  /workflows/{id}:
    get:
      operationId: getWorkflow
      summary: Gets a workflow
      description: Returns a workflow with a unique ID.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the workflow to get
          required: true
          schema:
            type: string
        - name: workflow_version_id
          in: query
          description: Numeric ID of the workflow version to get
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workflowData'
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '500':
          description: Internal Server Error
      tags:
        - workflows
    put:
      operationId: updateWorkflow
      summary: Update a workflow
      description: Allows user to edit a workflow with a unique ID.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the workflow to update
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateWorkflow'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
      tags:
        - workflows
    delete:
      operationId: deleteWorkflow
      summary: Delete a workflow
      description: Allows user to delete a workflow with a unique ID.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the workflow to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
      tags:
        - workflows
  /workflows/{id}/update_state:
    put:
      operationId: updateWorkflowState
      summary: Update the workflow state
      description: Updates the state of a workflow with a unique ID.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the workflow to edit
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateState'
            example:
              event: activate
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
      tags:
        - workflows
  /workflows/{id}/launch:
    post:
      operationId: launchWorkflow
      summary: Launch a workflow
      description: For a workflow with a manual trigger, launches (activates) a workflow.
      parameters:
        - name: id
          in: path
          description: ID of the workflow that you intend to launch
          required: true
          schema:
            type: string
          example: '2116'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
      tags:
        - workflows
  /workflows/{id}/cancel_instances:
    put:
      operationId: cancelWorkflowInstances
      summary: Cancel all jobs
      description: Cancels all running jobs of an active workflow with a particular ID.
      parameters:
        - name: id
          in: path
          description: ID of the workflow for which you are cancelling all running jobs
          required: true
          schema:
            type: string
          example: '1120'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '404':
          description: Not Found. The workflow ID submitted in the request is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404-Workflows'
      tags:
        - workflows
  /workflows/{id}/delete_instances:
    delete:
      operationId: deleteWorkflowInstances
      summary: Delete all jobs
      description: Deletes all jobs for an active workflow with a particular ID.
      parameters:
        - name: id
          in: path
          description: ID of the workflow for which you are deleting all jobs
          required: true
          schema:
            type: string
          example: '1120'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '404':
          description: Not Found. The workflow ID submitted in the request is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404-Workflows'
      tags:
        - workflows
  /workflow_instances:
    get:
      operationId: listWorkflowInstances
      summary: Get jobs
      description: Returns all jobs of active workflows - whether running, complete, or failed. If you add query parameters (for a particular workflow ID or status), returns a filtered subset of jobs associated with that workflow or status.
      parameters:
        - $ref: '#/components/parameters/workflowID'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-WorkflowInstances'
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '500':
          description: Internal Server Error
      tags:
        - workflow_instances
  /workflow_instances/{id}:
    get:
      operationId: getWorkflowInstance
      summary: Get a job
      description: Returns a job with a unique ID.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the job to get
          required: true
          schema:
            type: string
            examples:
              - '8588'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstances'
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '500':
          description: Internal Server Error
      tags:
        - workflow_instances
    delete:
      operationId: deleteWorkflowInstance
      summary: Delete a job
      description: Allows user to delete a job with a unique ID.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the job to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
      tags:
        - workflow_instances
    put:
      operationId: cancelWorkflowInstance
      summary: Cancel a job
      description: Cancels a running job with a unique ID. Doing so allows you to edit the workflow that generated the job.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the job to cancel
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cancelWorkflowInstance'
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
      tags:
        - workflow_instances
  /steps:
    post:
      operationId: createStep
      summary: Create a step
      description: Creates a step in the workflow. Each step can hold one or more actions, which you create with POST /actions after creating the step. Steps can be re-ordered within the workflow after they are created, using a PUT /steps/{id} request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Step'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/201-Step'
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
      tags:
        - steps
  /steps/{id}:
    get:
      operationId: getStep
      summary: Get a step
      description: Returns the data for a step with a unique ID, such as the actions associated with that step.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the step to get
          required: true
          schema:
            type: string
            examples:
              - '1076'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-StepsID'
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '500':
          description: Internal Server Error
      tags:
        - steps
    put:
      operationId: updateStep
      summary: Update a step
      description: Allows user to edit the details of a step with a unique ID.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the step to update
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createStepRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
      tags:
        - steps
    delete:
      operationId: deleteStep
      summary: Delete a step
      description: Allows user to delete a step with a unique ID.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the step to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
      tags:
        - steps
  /actions:
    post:
      operationId: createAction
      summary: Create an action
      description: Creates an action that can be used in one or more workflows. Actions can transfer to a node or workspace, send a package, call an API, or notify users. An action is contained in a step; a step can contain multiple actions. Request bodies for transfer and API actions are defined below. For examples of the other action types, go to https://developer.ibm.com/aspera/docs/automation-api-guide/automation-api-action-examples/.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/createActionTransfer'
                - $ref: '#/components/schemas/createActionAPI'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/201-ActionTransfer'
                  - $ref: '#/components/schemas/201-ActionAPI'
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
      tags:
        - actions
  /actions/{id}:
    get:
      operationId: getAction
      summary: Get an action
      description: Returns data for an action with a unique ID.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the action to get
          required: true
          schema:
            type: string
            examples:
              - '1076'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/actionData'
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '500':
          description: Internal Server Error
      tags:
        - actions
    put:
      operationId: updateAction
      summary: Update an action
      description: Allows user to edit the values of an action with a unique ID.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the action to update
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/createActionTransfer'
                - $ref: '#/components/schemas/createActionAPI'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
      tags:
        - actions
    delete:
      operationId: deleteAction
      summary: Delete an action
      description: Allows user to delete an action with a unique ID.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the action to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
      tags:
        - actions
  /workflow_permissions:
    get:
      operationId: listWorkflowPermissions
      summary: Get workflow permissions
      description: Returns all workflow permissions.
      parameters:
        - $ref: '#/components/parameters/workflow_ID'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-WorkflowPermissions'
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '500':
          description: Internal Server Error
      tags:
        - workflow_permissions
    post:
      operationId: createWorkflowPermission
      summary: Create a workflow permission
      description: Creates a new permission for a workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createWorkflowPermissionRequest'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPermissions'
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
      tags:
        - workflow_permissions
  /workflow_permissions/{id}:
    put:
      operationId: updateWorkflowPermission
      summary: Update a workflow permission
      description: Allows the user to edit a workflow permission with a unique ID.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the workflow permission
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateWorkflowPermissionRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request. The payload may not be in the correct format (JSON format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
      tags:
        - workflow_permissions
    delete:
      operationId: deleteWorkflowPermission
      summary: Delete a workflow permission
      description: Allows user to delete a workflow permission with a unique ID.
      parameters:
        - name: id
          in: path
          description: Numeric ID of the workflow permission to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
      tags:
        - workflow_permissions
components:
  parameters:
    status:
      name: status
      in: query
      description: 'Status of the job. Allowed values: executing, failed, complete, canceled.'
      required: false
      schema:
        type: string
        enum:
          - executing
          - failed
          - complete
          - canceled
      example: executing
    workflow_ID:
      name: workflow_id
      in: query
      description: ID of the workflow
      required: true
      schema:
        type: string
      example: '362'
    workflowID:
      name: workflow_id
      in: query
      description: ID of the workflow
      required: false
      schema:
        type: string
      example: '362'
    offset:
      name: offset
      in: query
      description: Offset of the first result to return (pagination)
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      required: false
      schema:
        type: integer
        minimum: 1
        examples:
          - 20
  schemas:
    200-WorkflowInstances:
      description: Returned data for all jobs
      type: object
      properties:
        offset:
          description: Controls pagination of the response, in coordination with the limit parameter. If offset = 0 and limit = 20, returns results 1-20 (first page of results). If offset = 1 and limit = 20, returns results 21-40 (second page of results)
          type: integer
          examples:
            - 0
          default: 0
        limit:
          description: Maximum number of workflows for which to return data
          type: integer
          examples:
            - 20
        first:
          description: The link for the first page of results
          type: object
          properties:
            href:
              description: URL for the first page of results
              type: string
              format: uri
              examples:
                - http://api.qa.ibmaspera.com/automation/v1/workflow_instances?limit=20&offset=0
        last:
          description: The link for the last page of results
          type: object
          properties:
            href:
              description: URL for the last page of results
              type: string
              format: uri
              examples:
                - http://api.qa.ibmaspera.com/automation/v1/workflow_instances?limit=20&offset=20
        next:
          description: The link for the second page of results
          type: object
          properties:
            href:
              description: URL for the second page of results
              type: string
              format: uri
              examples:
                - http://api.qa.ibmaspera.com/automation/v1/workflow_instances?limit=20&offset=1
        workflow_instances:
          description: Array of jobs
          type: array
          items:
            $ref: '#/components/schemas/WorkflowInstances'
      title: Success response
    WorkflowInstances:
      description: Job data
      type: object
      properties:
        id:
          description: ID for the workflow instance
          type: string
          examples:
            - '8588'
        workflow_version_id:
          description: ID for the workflow version that is used in generating this workflow instance
          type: string
          examples:
            - '8588'
        instance_id:
          description: UUID. Can be used for debugging purposes.
          type: string
          examples:
            - f5d74b9c-e2de-4782-9a44-e65b4857d98b
        organization_id:
          description: ID of organization from which the workflow originates
          type: string
          examples:
            - '58'
        user_id:
          description: User ID of user initiating the workflow instance
          type: string
          examples:
            - '3201'
        workflow_id:
          description: ID of the workflow that generates the workflow instance
          type: string
          examples:
            - '699'
        step_id:
          description: ID of step in the workflow that generates the workflow instance
          type: string
          examples:
            - '1290'
        step_name:
          description: Name of step in the workflow that is currently active. If the workflow is complete or failed, step_name is the name of the final step in the workflow.
          type: string
          examples:
            - transfer step
        status:
          description: 'Status of the workflow instance. Allowed values: executing, failed, complete, canceled.'
          type: string
          examples:
            - complete
          enum:
            - executing
            - failed
            - complete
            - canceled
        status_details:
          description: Error message - only returned for a failed workflow instance
          type: string
          examples:
            - No valid permission on the source node available
        launch_time:
          description: Original start time for activation of the workflow
          type: string
          format: date-time
          examples:
            - 2019-03-17T07:07:15.000Z
        state_change_time:
          description: Time the workflow instance state was changed--for example, with a PUT request.
          type: string
          format: date-time
          examples:
            - 2019-03-17T07:07:22.000Z
        workflow_name:
          description: Name of the workflow
          type: string
          examples:
            - media content
    200-WorkflowPermissions:
      description: Returned data for all workflow permissions
      type: object
      properties:
        workflow_permissions:
          description: Array of workflow permissions
          type: array
          items:
            $ref: '#/components/schemas/WorkflowPermissions'
      title: Success response
    WorkflowPermissions:
      type: object
      properties:
        id:
          description: Workflow Permission ID
          type: string
          examples:
            - '26'
        user_id:
          description: User ID
          type: string
          examples:
            - '26'
        workflow_id:
          description: Workflow ID
          type: string
          examples:
            - '26'
        manage_jobs:
          description: Whether there is permission to manage jobs
          type: boolean
          examples:
            - true
        duplicate:
          description: Whether there is permission to duplicate workflows
          type: boolean
          examples:
            - true
        updated_at:
          description: Time workflow is updated
          type: string
          format: date-time
          examples:
            - 2019-01-10T21:25:24.000Z
        created_at:
          description: Time workflow permission is created
          type: string
          format: date-time
          examples:
            - 2019-01-10T21:25:24.000Z
      title: Success response
    200-Workflows:
      type: object
      properties:
        offset:
          description: Controls pagination of the response, in coordination with the limit parameter. If offset = 0 and limit = 20, returns results 1-20 (first page of results). If offset = 1 and limit = 20, returns results 21-40 (second page of results)
          type: integer
          examples:
            - 0
          default: 0
        limit:
          description: Maximum number of workflows for which to return data
          type: integer
          examples:
            - 20
        first:
          description: The link for the first page of results
          type: object
          properties:
            href:
              description: URL for the first page of results
              type: string
              format: uri
              examples:
                - http://api.qa.ibmaspera.com/automation/v1/workflows?limit=20&offset=0
        last:
          description: The link for the last page of results
          type: object
          properties:
            href:
