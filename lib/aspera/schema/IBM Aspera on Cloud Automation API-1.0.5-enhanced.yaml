          enum:
            - user
            - admin
        name:
          description: Name of recipient
          type: string
          examples:
            - Benita Tyme
      required:
        - id
        - type
    uploadNotificationRecipients:
      description: Properties of user (recipient) who receives notification that the package is sent
      type: object
