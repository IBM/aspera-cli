    updateState:
      type: object
      properties:
        event:
          description: 'Request a state change. Allowed values: save_as_draft, activate, deactivate. To save a workflow in a state that can be edited, use ''save_as_draft''. To launch running instances of the workflow, use ''activate''. To stop all running instances of a workflow, use ''deactivate''; this event allows you to edit the workflow.'
          type: string
          examples:
