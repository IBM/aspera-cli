            - string
            - 'null'
        note:
          type:
            - string
            - 'null'
        send_as_type:
          type:
            - string
            - 'null'
        content_retention_duration:
          description: Seconds
          type: integer
        delete_package_content_after_download_duration:
          type: boolean
        watermark:
          type: boolean
        encryption_at_rest:
