        default:
          $ref: '#/components/responses/Error'
  /api/initiate:
    post:
      operationId: initiate
      summary: Initiate a new work order
      description: |
        Starts a new work order for the specified workflow.

        Runtime input values are passed under the `external_parameters` key.
        To discover what parameters a workflow accepts, call `/api/workflow_inputs_spec/{workflow_id}` first.
        With format `json`, the keys of a JSON body are also merged into the runtime parameters.
      tags:
        - Work Orders
      parameters:
        - $ref: '#/components/parameters/Format'
        - name: synchronous
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: '`true`: wait for the end of the work order'
        - name: timeout
          in: query
          schema:
            type: integer
            minimum: 0
          description: 'With `synchronous`, maximum wait in seconds (0 or not set: no limit)'
        - name: explicit_output
          in: query
          schema:
            type: string
          description: Return only this output, as `<step name>:<output name>`
        - name: explicit_output_step
          in: query
          schema:
            type: string
          description: Return only an output of this step (with `explicit_output_variable`)
        - name: explicit_output_variable
          in: query
          schema:
            type: string
          description: Name of the output to return (with `explicit_output_step`)
        - name: on_error_return_code
          in: query
          schema:
            type: integer
          description: HTTP status to return when the work order ends with status `Error`
        - name: on_failed_return_code
          in: query
          schema:
            type: integer
          description: HTTP status to return when the work order ends with status `Failed`
        - name: tags
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated tags of the work order
        - name: preemptive_level
          in: query
          schema:
            type: integer
          description: Priority of the work order (its opposite is used)
        - name: wo_id_only
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: '`true`: return only the work order ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workflow_id
              properties:
                workflow_id:
                  type: string
                  description: ID, portable ID or name of the workflow to execute
                  examples:
                    - '123'
                external_parameters:
                  type: object
                  description: Runtime parameters of the workflow (name to value)
                  additionalProperties: true
      responses:
        '200':
          description: Work order initiated (or the status given by `on_error_return_code`, `on_failed_return_code`)
          content:
            application/json:
              schema:
                anyOf:
                  - title: Work order
                    allOf:
                      - $ref: '#/components/schemas/WorkOrderWithSteps'
                    properties:
                      parameters:
                        type: object
                        description: Runtime parameters of the work order
                  - title: Output value
                    description: With `explicit_output`, or `explicit_output_step` and `explicit_output_variable`
        '400':
          description: Workflow not found or not published, or missing required parameters
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - title: Missing parameters
                    type: object
                    required:
                      - work_order
                      - missing_parameters
                    properties:
                      work_order:
                        allOf:
                          - $ref: '#/components/schemas/WorkOrder'
                        properties:
                          status:
                            const: Not started
                          status_details:
                            const: Missing required parameters
                      missing_parameters:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/work_step_status/{id}:
    get:
      operationId: work_step_status
      summary: Status, inputs and outputs of a work step, or change its status
      description: |
        Returns the work step with its inputs and outputs,
        or only the value of an output (`output_name`), or only the status (`status_only`, as plain text).
        With `set_status` or `set_status_details`, modifies the work step and returns its new status.
      tags:
        - Work Steps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Work step ID, or `work_order` to use `work_order_id` and `step_name`
        - name: work_order_id
          in: query
          schema:
            type: integer
          description: Work order ID, when `id` is `work_order`
        - name: step_name
          in: query
          schema:
            type: string
          description: Step name, when `id` is `work_order`
        - name: output_name
          in: query
          schema:
            type: string
          description: Return only the value of this output
        - name: status_only
          in: query
          schema:
            type: string
          description: Return only the status (any value except `false`)
        - name: set_status
          in: query
          schema:
            type: string
          description: New status of the work step
        - name: set_status_details
          in: query
          schema:
            type: string
          description: New status details of the work step
        - name: set_percent_complete
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
          description: New percentage of completion, with `set_status` or `set_status_details`
        - name: format
          in: query
          schema:
            type: string
            enum:
              - xml
              - json
              - txt
            default: xml
          description: Response format (`txt` for a value or a status as plain text)
      responses:
        '200':
          description: Work step status
          content:
            application/json:
              schema:
                anyOf:
                  - title: Work step
                    type: object
                    properties:
                      work_step:
                        $ref: '#/components/schemas/WorkStep'
                      outputs:
                        type: array
                        items:
                          $ref: '#/components/schemas/StepVariable'
                      inputs:
                        type: array
                        items:
                          $ref: '#/components/schemas/StepVariable'
                      carry_thrus:
                        type: array
                        description: Variables of other steps
                        items:
                          $ref: '#/components/schemas/StepVariable'
                  - title: New status
                    description: With `set_status` or `set_status_details`
                    type: object
                    properties:
                      Work_step_id:
                        type: integer
                      Work_step_status:
                        type: string
                      Work_step_status_details:
                        type: [string, 'null']
                      Work_step_percent_complete:
                        type: [integer, 'null']
                  - title: Output value
                    description: With `output_name`
            text/plain:
              schema:
                type: string
                description: 'Format `txt`: a value or a status. With `status_only`, the status is also plain text in format `json`.'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_step_cancel/{id}:
    get:
      operationId: work_step_cancel
