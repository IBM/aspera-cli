  /api/task_details/{id}:
    get:
      operationId: task_details
      summary: Details of a task
      description: 'JSON: `{"task", "task_inputs", "user_inputs": [{"name", "type", "value", "required"}]}`.'
      tags:
        - Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Task ID, or `WO<work order ID>` for the user input of a work order
        - name: step_name
          in: query
          schema:
            type: string
          description: 'With `WO<id>`, step of the user input when the work order has several. Orchestrator 4.1.6 checks that `Step_name` is set and compares `step_name`: give both.'
        - name: Step_name
          in: query
          schema:
            type: string
          description: Same value as `step_name` (see `step_name`)
        - $ref: '#/components/parameters/Format'
      responses:
