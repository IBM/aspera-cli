      description: 'JSON: `{"remote_orchestrator_info": {"orchestrator-version", "platform", "engine_id"}}`.'
      tags:
        - Remote Nodes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Orchestrator information
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/test_step/{id}:
    get:
      operationId: test_step
      summary: Launch test cases for a workflow step
      description: |
        Launches test cases against a workflow and returns a **Test_run_id** UUID.
        Pass that UUID to `/api/test_step_status` to poll for results.
      tags:
        - Testing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID or portable ID to test
          example: my_workflow
        - name: step
          in: query
          schema:
            type: string
          description: Comma-separated step name(s) to test. Omit to test all steps.
          example: Get file size
        - name: case
          in: query
          schema:
            type: string
          description: Test case name to run. Omit to run all cases for the step.
          example: File doesnt exist
        - name: synchronous
          in: query
          schema:
            type: boolean
            default: false
          description: Wait for all test cases to complete before returning
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Test run launched. Response contains `Test_run_id` UUID to use with `/api/test_step_status`.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Workflow not found
  /api/test_step_status/{id}:
    get:
      operationId: test_step_status
      summary: Get test step status
      description: |
        Poll the status of a test run previously launched by `/api/test_step`.
        The `id` parameter must be the **Test_run_id UUID** returned by that call, not a numeric workflow or step ID.
      tags:
        - Testing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Test run UUID returned by /api/test_step (e.g. 935e0080-97f5-0135-26f8-34363bc6aedc)
          example: 935e0080-97f5-0135-26f8-34363bc6aedc
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Test status
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/work_order_stats/{id}:
    get:
      operationId: work_order_stats
      summary: Work order statistics, monthly or for a day
      description: Returns the text `No Statistics found. Change the filter and try again.` when there is none.
      tags:
        - Statistics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: workflow_id
          in: query
          schema:
            type: integer
          description: Only this workflow
        - name: label
          in: query
          schema:
            type: string
          description: Only work orders with this label
        - name: date
          in: query
          schema:
            type: string
          description: 'Statistics of this day, e.g. `2017-04-04`. Not set: monthly statistics.'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Work order statistics
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/work_step_stats/{id}:
    get:
      operationId: work_step_stats
      summary: Work step statistics, monthly or for a day
      description: 'Returns the text `No Statistics found. Change the filter and try again.` when there is none. The filters are inserted as is in an SQL condition (`workflow_id in (...)`): give comma-separated numbers or quoted values.'
      tags:
        - Statistics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: workflow_id
          in: query
          schema:
            type: string
          description: Comma-separated workflow IDs
        - name: step_id
          in: query
          schema:
            type: string
          description: Comma-separated step IDs
        - name: step_type
          in: query
          schema:
            type: string
          description: Comma-separated step types, quoted (e.g. `'CustomRuby'`)
        - name: date
          in: query
          schema:
            type: string
          description: 'Statistics of this day, e.g. `2017-04-04`. Not set: monthly statistics.'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Work step statistics
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/journal_files/{id}:
    get:
      operationId: journal_files
      summary: Files recorded in a journal book
      description: 'JSON: `{"Journal": {"name", "id", "description", "active"}, "Packages": [{"name", "id", "files": [...]}], "Files": [...]}`; each file has `file_id`, `file`, `status`, `status_details`, `created_at`, `updated_at`, and `states` when detailed.'
      tags:
        - Journals
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Journal book name or ID
        - name: details
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: '`false`: without the states (steps) of each file'
        - name: status
          in: query
          schema:
            type: string
          description: Comma-separated statuses, e.g. `In Progress,Processing complete`
        - name: file
          in: query
          schema:
            type: string
          description: Comma-separated file paths
        - name: package
          in: query
          schema:
            type: string
          description: Comma-separated package names (not with `package_id`)
        - name: package_id
          in: query
          schema:
            type: string
          description: Comma-separated package IDs (not with `package`)
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Journal entries
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/add_resource/{id}:
    get:
      operationId: add_resource
      summary: Add a resource to a resource pool
      description: 'JSON: `{"ManagedResource": {...}}`.'
      tags:
        - Resources
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/ResourceName'
        - name: capacity
          in: query
          schema:
            type: integer
            default: 1
          description: Capacity of the resource
        - name: tags
          in: query
          schema:
            type: string
          description: Comma-separated tags
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The new resource
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/edit_resource_capacity/{id}:
    get:
      operationId: edit_resource_capacity
      summary: Change the capacity of a resource
      description: 'JSON: `{"ManagedResource": {...}}`.'
      tags:
        - Resources
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: New capacity, a positive integer
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/ResourceName'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The resource
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/edit_pool_capacity/{id}:
    get:
      operationId: edit_pool_capacity
      summary: Change the capacity of a resource pool
      description: 'JSON: `{"ManagedResource": [...]}`.'
      tags:
        - Resources
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: New capacity, a positive integer
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The resources of the pool
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/resource_online/{id}:
    get:
      operationId: resource_online
      summary: Take a resource online
      tags:
        - Resources
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/ResourceName'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: 'JSON: `{"ManagedResource": {"resource_id": "Online"}}`'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/resource_offline/{id}:
    get:
      operationId: resource_offline
      summary: Take a resource offline
      tags:
        - Resources
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/ResourceName'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: 'JSON: `{"ManagedResource": {"resource_id": "Offline"}}`'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/pool_status/{id}:
    get:
      operationId: pool_status
      summary: Resources of a resource pool and their status
      description: 'JSON: `{"ManagedResource": [{"id", ...}]}`.'
      tags:
        - Resources
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Name of the resource pool (with or without the suffix `__a` of the database)
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Pool status
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/create_user/{id}:
    post:
      operationId: create_user
      summary: Create a user
      description: 'The response is JSON unless format is `xml`: `{"create_user": {"success": "..."}}`.'
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                  description: Login of the user
                password:
                  type: string
                  format: password
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                SMS:
                  type: string
                is_active:
                  type: boolean
                  default: false
                require_password_change_on_login:
                  type: boolean
                  default: false
                alternate_emails:
                  type: array
                  items:
                    type: string
                groups:
                  type: array
                  description: Names of existing groups
                  items:
                    type: string
      responses:
        '200':
          description: Confirmation message
        '401':
          $ref: '#/components/responses/UnauthorizedError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/login endpoint
  parameters:
    Format:
      name: format
      in: query
      schema:
        type: string
        enum:
          - xml
          - json
        default: xml
      description: Response format (also given by the extension `.json` or `.xml` of the path)
    AnyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        default: '0'
      description: Not used by the endpoint, but required by the route (any value, e.g. `0`)
    MonitorType:
      name: monitor_type
      in: query
      required: true
      schema:
        type: string
        enum:
          - workflow
          - workorder
          - folder
          - node
          - script
      description: Type of monitor (also accepted `work_order`, `remotenode`, `remote_node`, `remotescript`, `remote_script`)
    PoolName:
      name: pool_name
      in: query
      required: true
      schema:
        type: string
      description: Name of the resource pool
    ResourceName:
      name: resource_name
      in: query
      required: true
      schema:
        type: string
      description: Name of the resource, e.g. an IP address
  responses:
    UnauthorizedError:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                examples:
                  - Unauthorized
tags:
  - name: Authentication
    description: Obtain JWT tokens for API access. All other endpoints require authentication.
  - name: Workflows
    description: Import, export, publish and inspect workflow definitions.
  - name: Work Orders
    description: Initiate and track workflow executions. Each work order is one execution of a workflow.
  - name: Work Steps
    description: Status and control of the steps of a work order.
  - name: Queues
    description: Managed queues (plugin Queue stager) and their items.
  - name: Monitors
    description: Monitors of workflows, work orders, folders, remote nodes and scripts.
  - name: Tasks
    description: User inputs (tasks) waiting for an operator.
  - name: Plugins
    description: Versions, import, enabling and reloading of action plugins.
  - name: Portlets
    description: Versions of the portlets of the web interface.
  - name: System
    description: Processes, execution queue, alerts, and shared state for external applications.
  - name: Remote Nodes
    description: Information on this Orchestrator, used by remote Orchestrator nodes.
  - name: Testing
    description: Test cases of workflow steps.
  - name: Statistics
    description: Statistics of work orders and work steps.
  - name: Journals
    description: Journal books and the files recorded in them.
  - name: Resources
    description: Resource pools (plugin Load manager) and their resources.
  - name: Users
    description: User accounts.
