openapi: 3.1.0
info:
  title: Aspera Orchestrator API
  version: v1
  license:
    name: (c) IBM. All rights reserved
    url: https://ibm.com
  description: |
    API documentation for Aspera Orchestrator 4.1.6, checked against its source code (`config/routes.rb` and `ApiController`).

    ## Authentication

    The API supports two authentication modes:

    ### JWT Authentication (Recommended)

    When JWT authentication is enabled (default):

    1. Obtain a JWT token by calling POST /api/login with your credentials
    2. Include the token in subsequent requests using the Authorization header:
       `Authorization: Bearer <your_token>`

    ### Credentials in Each Request (When JWT is Disabled)

    If JWT authentication is disabled in your Orchestrator configuration (`/api/login` then returns 403), give the credentials with every API request, either:

    - as query parameters `login` and `password`, e.g. `/api/workflows_list?login=admin&password=mypassword&format=json`
    - as query parameters `login` and `api_key` (the API key of the user)
    - with HTTP Basic authentication

    **Note:** Check your Orchestrator configuration to determine which authentication mode is active.

    ## Routes

    - Some endpoints have their own route, `/api/<endpoint>`, with the HTTP method given here.
    - Every endpoint can also be called as `/api/<endpoint>/<id>`, with any HTTP method, where `<id>` is its main identifier.
      Endpoints without their own route can only be called this way: when `id` is not used by the endpoint, any value works, for example `0`.
    - Parameters can be given in the query, or in a JSON or form body.

    ## Response format

    Most endpoints return XML by default.
    For JSON, add `format=json`, or the extension `.json` to the last segment of the path (e.g. `/api/work_order_status/123.json`).

    ## Errors

    Errors are returned with HTTP status 200, or 404 when the server option `strict_api_validation` is set.
    The body is `<error time=... action=... id=...>message and backtrace</error>`, or in JSON `{"error": {"action": ..., "time": ..., "id": ..., "description": ...}}`.
servers:
  - url: https://158.176.9.141/aspera/orchestrator
    description: 'Configured host: 158.176.9.141'
  - url: https://orchestrator.aspera-emea.com/aspera/orchestrator
    description: 'Configured host: orchestrator.aspera-emea.com'
security:
  - bearerAuth: []
  - basicAuth: []
  - loginQuery: []
    passwordQuery: []
  - loginQuery: []
    apiKeyQuery: []
paths:
  /api/login:
    post:
      operationId: login
      security: []
      summary: Authenticate and obtain JWT token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: '`username`, with either `password` or `api_key` (the API key of that user)'
              oneOf:
                - title: Username and password
                  type: object
                  required:
                    - username
                    - password
                  properties:
                    username:
                      type: string
                      description: User login name
                    password:
                      type: string
                      format: password
                      description: User password
                  additionalProperties: false
                - title: Username and API key
                  type: object
                  required:
                    - username
                    - api_key
                  properties:
                    username:
                      type: string
                      description: User login name
                    api_key:
                      type: string
                      description: API key of the user
                  additionalProperties: false
            examples:
              credentials:
                summary: Username and password
                value:
                  username: admin
                  password: mypassword
              api_key:
                summary: Username and API key
                value:
                  username: admin
                  api_key: my_api_key
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - Logged in successfully
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      login:
                        type: string
                      email:
                        type: string
                  token:
                    type: string
                    description: JWT token for subsequent API calls
        '401':
          description: Invalid credentials
        '403':
          description: Secure API auth disabled
  /api/workflows_list:
    get:
      operationId: workflows_list
      summary: List all workflows
      tags:
        - Workflows
      parameters:
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflows:
                    type: object
                    properties:
                      time:
                        type: string
                        description: UTC time
                      action:
                        type: string
                        const: list
                      id:
                        type: integer
                      workflow:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            full_name:
                              type: string
                              description: Name with the folder path
                            folder_id:
                              type: [integer, 'null']
                            portable_id:
                              type: [string, 'null']
                            published_status:
                              type: string
                              enum:
                                - published
                                - draft
                            published_revision_id:
                              type: [integer, string]
                              description: '`-` when not published'
                            latest_revision_id:
                              type: [integer, string]
                              description: '`-` when there is no whiteboard'
                            last_modification:
                              type: string
                              format: date-time
                            comments:
                              type: [string, 'null']
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/workflows_status:
    get:
      operationId: workflows_status
      summary: Running status of workflows
      tags:
        - Workflows
      parameters:
        - name: id
          in: query
          schema:
            type: string
          description: Workflow ID or portable ID. Not set, or `0`, for all workflows.
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Workflow status information
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflows:
                    type: object
                    properties:
                      time:
                        type: string
                        description: UTC time
                      action:
                        type: string
                        const: status
                      id:
                        type: integer
                      workflow:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            status:
                              type: string
                              enum:
                                - running
                                - not running
                            last_activity:
                              type: string
                              description: Last update of the running work orders, or `-`
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/workflow_details/{id}:
    get:
      operationId: workflow_details
      summary: Number of work orders of a workflow, by status
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Workflow ID
        - name: start_date
          in: query
          schema:
            type: string
          description: Count work orders created after this date
        - name: end_date
          in: query
          schema:
            type: string
          description: Count work orders created before this date
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Work order counts by status
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflows:
                    type: object
                    properties:
                      time:
                        type: string
                        description: UTC time
                      action:
                        type: string
                        const: status
                      id:
                        type: integer
                      workflow:
                        type: object
                        properties:
                          name:
                            type: string
                          id:
                            type: integer
                          statuses:
                            type: array
                            items:
                              type: object
                              properties:
                                count:
                                  type: integer
                                last_activity:
                                  type: string
                                  format: date-time
                                workflow_name:
                                  type: string
                                status:
                                  type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/workflow_inputs_spec/{id}:
    get:
      operationId: workflow_inputs_spec
      summary: Runtime parameters of a workflow
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID or portable ID, or `0` to use `workflow_name`, or `-1` to use `portable_id`
        - name: workflow_name
          in: query
          schema:
            type: string
          description: Workflow name, when `id` is `0`
        - name: portable_id
          in: query
          schema:
            type: string
          description: Workflow portable ID, when `id` is `-1`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Runtime parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_inputs_spec:
                    type: object
                    properties:
                      time:
                        type: string
                        description: UTC time
                      action:
                        type: string
                        const: inputs_spec
                      workflow_name:
                        type: string
                      workflow_id:
                        type: integer
                      parameter:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            value_type:
                              type: string
                            optional:
                              type: [boolean, 'null']
                            value:
                              type: string
                              description: Default value, for an optional parameter
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/workflow_outputs_spec/{id}:
    get:
      operationId: workflow_outputs_spec
      summary: Outputs of the steps of a workflow
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID or portable ID (also accepted as query parameter `workflow_id`)
        - name: workflow_id
          in: query
          schema:
            type: string
          description: Workflow ID or portable ID, takes precedence over `id`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Outputs of the workflow
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_outputs_spec:
                    type: object
                    properties:
                      time:
                        type: string
                        description: UTC time
                      action:
                        type: string
                        const: outputs_spec
                      output:
                        type: array
                        items:
                          type: object
                          properties:
                            context_id:
                              type: integer
                            name:
                              type: string
                              description: '`<step name>:<output name>`'
                            workflow_id:
                              type: integer
                            step_name:
                              type: string
                            variable_name:
                              type: string
                            value_type:
                              type: string
                            variable_type:
                              type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/import_workflow:
    post:
      operationId: import_workflow
      summary: Import a workflow
      description: Always creates a new workflow. The response is the new workflow as JSON, whatever the format.
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - import_file
                - import_file_name
              properties:
                import_file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: The workflow file to import (.wkf or .yml)
                import_file_name:
                  type: string
                  pattern: (wkf|yml)$
                  description: File name ending with `wkf` or `yml`. The file is saved under this name in the import folder of the server.
                  examples:
                    - my_workflow.wkf
                folder_id:
                  type: integer
                  description: Folder of the new workflow
                link_to_subworkflows:
                  type: string
                  description: Link to existing sub-workflows instead of importing them. Any value, including `false`, is taken as true.
                publish_workflow:
                  type: string
                  description: '`true` or `1` to publish the workflow after import. Default: server option `publish_api_imported_workflow`.'
                format:
                  type: string
                  enum:
                    - xml
                    - json
                  default: xml
      responses:
        '200':
          description: The new workflow (JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
        '500':
          description: Import failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  details:
                    type: string
                    description: Error message
  /api/find_constraints:
    get:
      operationId: find_constraints
      summary: Find workflow import constraints
      description: 'Analyzes a workflow file present on the Orchestrator host, and returns the list expected by `import_with_constraints`, with the possible choices for each conflict with existing sub-workflows, global templates and remote nodes, and the plugins that are not enabled. The file existence is not checked: a wrong path returns the same empty lists as a file without conflict.'
      tags:
        - Workflows
      parameters:
        - name: file
          in: query
          required: true
          schema:
            type: string
          description: Path of the workflow file (`.yml` or `.wkf`) on the Orchestrator host
        - name: wf_id
          in: query
          schema:
            type: integer
          description: ID of an existing workflow, to import the file as a new revision of it
      responses:
        '200':
          description: 'Array of six objects, in the order expected by `import_with_constraints`: `filename`, `add as revision`, `subwf constraints`, `action template constraints`, `remote node constraints`, and `missing plugins` with `Auto-enable missing plugins?`.'
          content:
            application/json:
              schema:
                type: array
                minItems: 6
                maxItems: 6
                prefixItems:
                  - type: object
                    properties:
                      filename:
                        type: string
                  - type: object
                    properties:
                      add as revision:
                        type: [string, 'null']
                        description: The `wf_id` parameter
                  - type: object
                    properties:
                      subwf constraints:
                        type: object
                        description: Sub-workflow name to possible choices
                        additionalProperties:
                          type: array
                          items:
                            type: string
                  - type: object
                    properties:
                      action template constraints:
                        type: object
                        description: Global template name to possible choices
                        additionalProperties:
                          type: array
                          items:
                            type: string
                  - type: object
                    properties:
                      remote node constraints:
                        type: object
                        description: Remote node name to possible choices
                        additionalProperties:
                          type: array
                          items:
                            type: string
                  - type: object
                    properties:
                      missing plugins:
                        type: [array, 'null']
                        description: Plugins to enable, or `null`
                      Auto-enable missing plugins?:
                        type: [array, 'null']
                        description: '`[true, false]` when plugins are missing, else `null`'
                items: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/import_with_constraints:
    post:
      operationId: import_with_constraints
      summary: Import workflow with constraint resolution
      description: 'Imports a workflow file present on the Orchestrator host, as a new workflow or as a new revision of an existing workflow. The workflow is not published. Orchestrator does not check what `find_constraints` reports: if plugins to enable are listed and `Auto-enable missing plugins?` is not `true`, the call fails with an internal error; a conflict without choice is imported as a copy, without error. `Auto-enable missing plugins?` must be a JSON boolean: the string `"false"` is taken as true.'
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Array of six objects with one key each, in this order
              minItems: 6
              maxItems: 6
              prefixItems:
                - type: object
                  required:
                    - filename
                  properties:
                    filename:
                      type: string
                      description: Path of the workflow file on the Orchestrator host
                  additionalProperties: false
                - type: object
                  required:
                    - add as revision
                  properties:
                    add as revision:
                      type: [integer, string, 'null']
                      description: ID or portable ID of the workflow to add a revision to, or `null` for a new workflow
                  additionalProperties: false
                - type: object
                  required:
                    - subwf constraints
                  properties:
                    subwf constraints:
                      type: object
                      description: Sub-workflow name to choice
                      additionalProperties:
                        type: string
                        enum:
                          - Map to the Existing Sub-Workflow
                          - Create a new Sub-Workflow with a unique name
                          - Add a new revision to the existing Sub-Workflow
                  additionalProperties: false
                - type: object
                  required:
                    - action template constraints
                  properties:
                    action template constraints:
                      type: object
                      description: Global template name to choice
                      additionalProperties:
                        type: string
                        enum:
                          - Map to the existing Global Template
                          - Create a new Global Template with a different name
                          - Override the existing Global Template with this new template
                  additionalProperties: false
                - type: object
                  required:
                    - remote node constraints
                  properties:
                    remote node constraints:
                      type: object
                      description: Remote node name to choice
                      additionalProperties:
                        type: string
                        enum:
                          - Map to the existing Remote Node
                          - Create a new Remote Node with a different name
                          - Override the Existing Remote Node with this importing node
                  additionalProperties: false
                - type: object
                  required:
                    - Auto-enable missing plugins?
                  properties:
                    Auto-enable missing plugins?:
                      type: boolean
                  additionalProperties: false
              items: false
              examples:
                - - filename: /opt/aspera/orchestrator/var/run/orchestrator/workflows/import/my_workflow.yml
                  - add as revision: 239
                  - subwf constraints: {}
                  - action template constraints:
                      Search Files: Map to the existing Global Template
                  - remote node constraints:
                      Baton: Map to the existing Remote Node
                  - Auto-enable missing plugins?: true
      responses:
        '200':
          description: The workflow that was imported (JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
        '500':
          description: Internal error, e.g. plugins to enable and not auto-enabled, or a file that cannot be read
  /api/publish_workflow:
    post:
      operationId: publish_workflow
      summary: Publish a workflow
      description: Publishes the last whiteboard revision. The result is `true`, or `false` when the whiteboard has no `error_free` value.
      tags:
        - Workflows
      parameters:
        - name: id
          in: query
          schema:
            type: string
          description: Workflow ID or portable ID (also accepted in a JSON body, or in the path `/api/publish_workflow/<id>`)
          example: '123'
        - $ref: '#/components/parameters/Format'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Workflow ID or portable ID
      responses:
        '200':
          description: '`true` or `false` (JSON), or `<WorkflowPublish><Success>true</Success></WorkflowPublish>` (XML)'
          content:
            application/json:
              schema:
                type: boolean
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/export_workflow/{id}:
    get:
      operationId: export_workflow
      summary: Export a workflow
      description: Returns the workflow file (`.yml`), or a package (`.wkf`) with its sub-workflows and remote nodes.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID or portable ID
        - name: export_with_dependencies
          in: query
          schema:
            type: string
          description: Export a package with dependencies. Any non-empty value, including `false`, enables it.
      responses:
        '200':
          description: The workflow file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/list_by_subworkflow/{id}:
    get:
      operationId: list_by_subworkflow
      summary: Published workflows that use a sub-workflow
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Sub-workflow ID (or query parameter `sub_wf_id`, which takes precedence)
        - name: sub_wf_id
          in: query
          schema:
            type: integer
          description: Sub-workflow ID
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: IDs of the parent workflows
          content:
            application/json:
              schema:
                type: object
                properties:
                  parent_workflows:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/retrieve_steps/{id}:
    get:
      operationId: retrieve_steps
      summary: Steps of a type in published workflows, with their work orders
      tags:
        - Workflows
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: type
          in: query
          required: true
          schema:
            type: string
          description: Step type (plugin class name), e.g. `CustomRuby`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: List of steps
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    step_id:
                      type: string
                    step_name:
                      type: string
                    step_status:
                      type: [string, 'null']
                      description: Status of the first prerequisite of the step
                    wf_id:
                      type: string
                    wo_id:
                      type: integer
                    wo_status:
                      type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_orders_list/{id}:
    get:
      operationId: work_orders_list
      summary: List work orders of a workflow
      tags:
        - Work Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID, portable ID or name, or `all` for all workflows
        - name: status
          in: query
          schema:
            type: string
          description: Filter by work order status, e.g. `Failed`
        - name: priority
          in: query
          schema:
            type: string
          description: Filter by priority
        - name: from_date
          in: query
          schema:
            type: string
          description: Work orders updated after this date, e.g. `'06-27-2015 02:40:59'`
        - name: to_date
          in: query
          schema:
            type: string
          description: Work orders updated before this date
        - name: tag
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated list of tags, all required
        - name: max_results
          in: query
          schema:
            type: integer
          description: Maximum number of work orders
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: List of work orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  work_orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkOrder'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_order_status/{id}:
    get:
      operationId: work_order_status
      summary: Get work order status
      description: |
        Returns the status of a work order and its work steps.

        If the work order includes sub-workflows, only the sub-workflow status is displayed, not the steps within the sub-workflow.
      tags:
        - Work Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Work order status
          content:
            application/json:
              schema:
                type: object
                properties:
                  work_order:
                    allOf:
                      - $ref: '#/components/schemas/WorkOrder'
                    properties:
                      percent_complete:
                        type: integer
                        minimum: 0
                        maximum: 100
                  work_steps:
                    type: array
                    description: Steps with `step_id` greater than 0
                    items:
                      $ref: '#/components/schemas/WorkStepStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_order_output/{id}:
    get:
      operationId: work_order_output
      summary: Outputs of a work order
      description: |
        All outputs, the outputs of a step (`step_name`), or the outputs of a given name (`variable_name`).
        With both `step_name` and `variable_name`, JSON returns the value only.
        Format `text` (or `string`) returns the values, one per line.
      tags:
        - Work Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID (or query parameter `workorder_id`, which takes precedence)
        - name: workorder_id
          in: query
          schema:
            type: integer
          description: Work order ID
        - name: step_name
          in: query
          schema:
            type: string
          description: Only the outputs of this step
        - name: variable_name
          in: query
          schema:
            type: string
          description: Only the outputs with this name
        - name: detailed
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: 'JSON: also the variable type, value type, work order ID and status of each output'
        - name: format
          in: query
          schema:
            type: string
            enum:
              - xml
              - json
              - text
              - string
            default: xml
          description: Response format
      responses:
        '200':
          description: Outputs
          content:
            application/json:
              schema:
                description: |
                  - Without both `step_name` and `variable_name`: object `{"<step name>:<output name>": <value>}`
                  - With `detailed=true`: array of `{"<step name>:<output name>": <value>, "variable_type", "value_type", "<work order name>:WorkOrder_ID", "<work order name>:WorkOrder_Status"}`
                  - With both `step_name` and `variable_name`: the value only
            text/plain:
              schema:
                type: string
                description: Format `text` or `string`, one value per line
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_order_cancel/{id}:
    get:
      operationId: work_order_cancel
