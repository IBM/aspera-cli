      tags:
        - Plugins
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: action_type
          in: query
          schema:
            type: string
          description: 'Plugin class name. Not set: all plugins.'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Installation ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  install_id:
                    type: integer
                    description: '`0` for all plugins'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/import_plugin/{id}:
    get:
      operationId: import_plugin
      summary: Import a plugin from a file on the Orchestrator host
      tags:
