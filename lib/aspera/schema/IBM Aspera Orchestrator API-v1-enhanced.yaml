        default:
          $ref: '#/components/responses/Error'
  /api/reload_plugin_set:
    post:
      operationId: reload_plugin_set
      summary: Reload a set of plugins
      description: 'With format `json`, the body is `{"plugin_set": [...]}`; with format `xml`, `<plugin_set><action_type>...</action_type>...</plugin_set>`.'
      tags:
        - Plugins
      parameters:
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plugin_set
              properties:
                plugin_set:
                  type: array
                  description: Plugin class names
                  items:
                    type: string
                  examples:
                    - - Adi3Parser
                      - AdiParser
          application/xml:
            schema:
              type: string
              examples:
                - <plugin_set><action_type>Adi3Parser</action_type></plugin_set>
      responses:
        '200':
          description: Reload status of each plugin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginReloadStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/enable_plugin/{id}:
    get:
      operationId: enable_plugin
