      description: The query parameters and the request body are stored in table `SharedState`, where a workflow can watch them with a database trigger. The response is always XML.
      tags:
        - System
      security:
        - bearerAuth: []
      parameters:
        - name: identifier
          in: query
          schema:
            type: string
          description: 'Aggregate type of the shared state (default: `custom_api_call`)'
        - name: uniq_id
          in: query
          required: true
          schema:
            type: integer
          description: Aggregate ID of the shared state, an integer
        - name: object
          in: query
          schema:
            type: string
          description: JSON text of the object to store
      responses:
        '200':
          description: ID of the shared state (XML)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
