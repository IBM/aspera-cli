        - System
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Process status information
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/control_process/{id}:
    get:
      operationId: control_process
      summary: Start, stop or kill a process
      description: 'Returns the status of the processes (as `processes_status`). JSON: `{"processes": {"process": [{"class", "id", "pid", "status", "type"}]}}`.'
      tags:
        - System
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum:
              - engine
              - monitor
              - worker
          description: Process type
        - name: command
          in: query
          required: true
          schema:
            type: string
            enum:
              - start
              - stop
              - kill
              - status
          description: Command (`status` does nothing but returns the status)
        - name: worker_id
          in: query
          schema:
            type: string
          description: Comma-separated worker IDs, required for type `worker`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Status of the processes
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/custom_api_call:
