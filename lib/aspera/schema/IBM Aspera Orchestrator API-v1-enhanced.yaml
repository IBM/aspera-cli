openapi: 3.1.0
info:
  title: Aspera Orchestrator API
  version: v1
  license:
    name: (c) IBM. All rights reserved
    url: https://ibm.com
  description: |
    API documentation for Aspera Orchestrator 4.1.6, checked against its source code (`config/routes.rb` and `ApiController`).

    ## Authentication

    The API supports two authentication modes:

    ### JWT Authentication (Recommended)

    When JWT authentication is enabled (default):

    1. Obtain a JWT token by calling POST /api/login with your credentials
    2. Include the token in subsequent requests using the Authorization header:
       `Authorization: Bearer <your_token>`

    ### Basic Authentication (When JWT is Disabled)

    If JWT authentication is disabled in your Orchestrator configuration:

    - Add query parameters to every API request: `?login=username&password=password`
    - Example: `/api/workflows_list?login=admin&password=mypassword&format=json`

    **Note:** Check your Orchestrator configuration to determine which authentication mode is active.

    ## Routes

    - Some endpoints have their own route, `/api/<endpoint>`, with the HTTP method given here.
    - Every endpoint can also be called as `/api/<endpoint>/<id>`, with any HTTP method, where `<id>` is its main identifier.
      Endpoints without their own route can only be called this way: when `id` is not used by the endpoint, any value works, for example `0`.
    - Parameters can be given in the query, or in a JSON or form body.

    ## Response format

    Most endpoints return XML by default.
    For JSON, add `format=json`, or the extension `.json` to the last segment of the path (e.g. `/api/work_order_status/123.json`).

    ## Errors

    Errors are returned with HTTP status 200, or 404 when the server option `strict_api_validation` is set.
    The body is `<error time=... action=... id=...>message and backtrace</error>`, or in JSON `{"error": {"action": ..., "time": ..., "id": ..., "description": ...}}`.
servers:
  - url: https://158.176.9.141/aspera/orchestrator
    description: 'Configured host: 158.176.9.141'
  - url: https://orchestrator.aspera-emea.com/aspera/orchestrator
    description: 'Configured host: orchestrator.aspera-emea.com'
paths:
  /api/login:
    post:
      operationId: login
      security: []
      summary: Authenticate and obtain JWT token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: User login name
                password:
                  type: string
                  format: password
                  description: User password
                api_key:
                  type: string
                  description: API key, instead of `username` and `password`
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - Logged in successfully
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      login:
                        type: string
                      email:
                        type: string
                  token:
                    type: string
                    description: JWT token for subsequent API calls
        '401':
          description: Invalid credentials
        '403':
          description: Secure API auth disabled
  /api/workflows_list:
    get:
      operationId: workflows_list
      summary: List all workflows
      description: 'JSON: `{"workflows": {"time", "action", "id", "workflow": [{"id", "name", "full_name", "folder_id", "portable_id", "published_status", "published_revision_id", "latest_revision_id", "last_modification", "comments"}]}}`.'
      tags:
        - Workflows
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: List of workflows
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/workflows_status:
    get:
      operationId: workflows_status
      summary: Running status of workflows
      description: 'JSON: `{"workflows": {"workflow": [{"id", "name", "status" (running or not running), "last_activity"}]}}`.'
      tags:
        - Workflows
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          schema:
            type: string
          description: Workflow ID or portable ID. Not set, or `0`, for all workflows.
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Workflow status information
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/workflow_details/{id}:
    get:
      operationId: workflow_details
      summary: Number of work orders of a workflow, by status
      description: 'JSON: `{"workflows": {"workflow": {"name", "id", "statuses": [{"count", "last_activity", "workflow_name", "status"}]}}}`.'
      tags:
        - Workflows
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Workflow ID
        - name: start_date
          in: query
          schema:
            type: string
          description: Count work orders created after this date
        - name: end_date
          in: query
          schema:
            type: string
          description: Count work orders created before this date
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Work order counts by status
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/workflow_inputs_spec/{id}:
    get:
      operationId: workflow_inputs_spec
      summary: Runtime parameters of a workflow
      description: 'JSON: `{"workflow_inputs_spec": {"workflow_name", "workflow_id", "parameter": [{"id", "name", "value_type", "optional", "value"}]}}`.'
      tags:
        - Workflows
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID or portable ID, or `0` to use `workflow_name`, or `-1` to use `portable_id`
        - name: workflow_name
          in: query
          schema:
            type: string
          description: Workflow name, when `id` is `0`
        - name: portable_id
          in: query
          schema:
            type: string
          description: Workflow portable ID, when `id` is `-1`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Runtime parameters
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/workflow_outputs_spec/{id}:
    get:
      operationId: workflow_outputs_spec
      summary: Outputs of the steps of a workflow
      description: 'JSON: `{"workflow_outputs_spec": {"output": [{"context_id", "name", "workflow_id", "step_name", "variable_name", "value_type", "variable_type"}]}}`.'
      tags:
        - Workflows
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID or portable ID (also accepted as query parameter `workflow_id`)
        - name: workflow_id
          in: query
          schema:
            type: string
          description: Workflow ID or portable ID, takes precedence over `id`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Outputs of the workflow
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/import_workflow:
    post:
      operationId: import_workflow
      summary: Import a workflow
      description: Always creates a new workflow. The response is the new workflow as JSON, whatever the format.
      tags:
        - Workflows
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - import_file
                - import_file_name
              properties:
                import_file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: The workflow file to import (.wkf or .yml)
                import_file_name:
                  type: string
                  description: File name ending with `wkf` or `yml`. The file is saved under this name in the import folder of the server.
                  examples:
                    - my_workflow.wkf
                folder_id:
                  type: integer
                  description: Folder of the new workflow
                link_to_subworkflows:
                  type: string
                  description: Link to existing sub-workflows instead of importing them. Any value, including `false`, is taken as true.
                publish_workflow:
                  type: string
                  description: '`true` or `1` to publish the workflow after import. Default: server option `publish_api_imported_workflow`.'
                format:
                  type: string
                  enum:
                    - xml
                    - json
                  default: xml
      responses:
        '200':
          description: The new workflow (JSON)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: 'Import failed: `{"error", "message", "details"}`'
  /api/find_constraints:
    get:
      operationId: find_constraints
      summary: Find workflow import constraints
      description: 'Analyzes a workflow file present on the Orchestrator host, and returns the list expected by `import_with_constraints`, with the possible choices for each conflict with existing sub-workflows, global templates and remote nodes, and the plugins that are not enabled. The file existence is not checked: a wrong path returns the same empty lists as a file without conflict.'
      tags:
        - Workflows
      security:
        - bearerAuth: []
      parameters:
        - name: file
          in: query
          required: true
          schema:
            type: string
          description: Path of the workflow file (`.yml` or `.wkf`) on the Orchestrator host
        - name: wf_id
          in: query
          schema:
            type: integer
          description: ID of an existing workflow, to import the file as a new revision of it
      responses:
        '200':
          description: 'Array of six objects, in the order expected by `import_with_constraints`: `filename`, `add as revision`, `subwf constraints`, `action template constraints`, `remote node constraints`, and `missing plugins` with `Auto-enable missing plugins?`.'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/import_with_constraints:
    post:
      operationId: import_with_constraints
      summary: Import workflow with constraint resolution
      description: 'Imports a workflow file present on the Orchestrator host, as a new workflow or as a new revision of an existing workflow. The workflow is not published. Orchestrator does not check what `find_constraints` reports: if plugins to enable are listed and `Auto-enable missing plugins?` is not `true`, the call fails with an internal error; a conflict without choice is imported as a copy, without error. `Auto-enable missing plugins?` must be a JSON boolean: the string `"false"` is taken as true.'
      tags:
        - Workflows
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Array of six objects with one key each, in this order
              minItems: 6
              maxItems: 6
              items:
                type: object
              examples:
                - - filename: /opt/aspera/orchestrator/var/run/orchestrator/workflows/import/my_workflow.yml
                  - add as revision: 239
                  - subwf constraints: {}
                  - action template constraints:
                      Search Files: Map to the existing Global Template
                  - remote node constraints:
                      Baton: Map to the existing Remote Node
                  - Auto-enable missing plugins?: true
      responses:
        '200':
          description: The workflow that was imported (JSON)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Internal error, e.g. plugins to enable and not auto-enabled, or a file that cannot be read
  /api/publish_workflow:
    post:
      operationId: publish_workflow
      summary: Publish a workflow
      description: Publishes the last whiteboard revision. The result is `true`, or `false` when the whiteboard has no `error_free` value.
      tags:
        - Workflows
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          schema:
            type: string
          description: Workflow ID or portable ID (also accepted in a JSON body, or in the path `/api/publish_workflow/<id>`)
          example: '123'
        - $ref: '#/components/parameters/Format'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Workflow ID or portable ID
      responses:
        '200':
          description: '`true` or `false` (JSON), or `<WorkflowPublish><Success>true</Success></WorkflowPublish>` (XML)'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/export_workflow/{id}:
    get:
      operationId: export_workflow
      summary: Export a workflow
      description: Returns the workflow file (`.yml`), or a package (`.wkf`) with its sub-workflows and remote nodes.
      tags:
        - Workflows
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID or portable ID
        - name: export_with_dependencies
          in: query
          schema:
            type: string
          description: Export a package with dependencies. Any non-empty value, including `false`, enables it.
      responses:
        '200':
          description: The workflow file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/list_by_subworkflow/{id}:
    get:
      operationId: list_by_subworkflow
      summary: Published workflows that use a sub-workflow
      description: 'JSON: `{"parent_workflows": [<workflow id>...]}`.'
      tags:
        - Workflows
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Sub-workflow ID (or query parameter `sub_wf_id`, which takes precedence)
        - name: sub_wf_id
          in: query
          schema:
            type: integer
          description: Sub-workflow ID
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: IDs of the parent workflows
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/retrieve_steps/{id}:
    get:
      operationId: retrieve_steps
      summary: Steps of a type in published workflows, with their work orders
      description: 'JSON: `[{"step_id", "step_name", "step_status", "wf_id", "wo_id", "wo_status"}]`.'
      tags:
        - Workflows
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: type
          in: query
          required: true
          schema:
            type: string
          description: Step type (plugin class name), e.g. `CustomRuby`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: List of steps
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/work_orders_list/{id}:
    get:
      operationId: work_orders_list
      summary: List work orders of a workflow
      description: 'JSON: `{"work_orders": [...]}`.'
      tags:
        - Work Orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID, portable ID or name, or `all` for all workflows
        - name: status
          in: query
          schema:
            type: string
          description: Filter by work order status, e.g. `Failed`
        - name: priority
          in: query
          schema:
            type: string
          description: Filter by priority
        - name: from_date
          in: query
          schema:
            type: string
          description: Work orders updated after this date, e.g. `'06-27-2015 02:40:59'`
        - name: to_date
          in: query
          schema:
            type: string
          description: Work orders updated before this date
        - name: tag
          in: query
          schema:
            type: string
          description: Comma-separated list of tags, all required
        - name: max_results
          in: query
          schema:
            type: integer
          description: Maximum number of work orders
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: List of work orders
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/work_order_status/{id}:
    get:
      operationId: work_order_status
      summary: Get work order status
      description: |
        Returns the status of a work order and its work steps.
        JSON: `{"work_order": {..., "percent_complete"}, "work_steps": [...]}`.

        If the work order includes sub-workflows, only the sub-workflow status is displayed, not the steps within the sub-workflow.
      tags:
        - Work Orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Work order status
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/work_order_output/{id}:
    get:
      operationId: work_order_output
      summary: Outputs of a work order
      description: |
        All outputs, the outputs of a step (`step_name`), or the outputs of a given name (`variable_name`).
        With both `step_name` and `variable_name`, JSON returns the value only.
        Format `text` (or `string`) returns the values, one per line.
      tags:
        - Work Orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID (or query parameter `workorder_id`, which takes precedence)
        - name: workorder_id
          in: query
          schema:
            type: integer
          description: Work order ID
        - name: step_name
          in: query
          schema:
            type: string
          description: Only the outputs of this step
        - name: variable_name
          in: query
          schema:
            type: string
          description: Only the outputs with this name
        - name: detailed
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: 'JSON: also the variable type, value type, work order ID and status of each output'
        - name: format
          in: query
          schema:
            type: string
            enum:
              - xml
              - json
              - text
              - string
            default: xml
          description: Response format
      responses:
        '200':
          description: Outputs
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/work_order_cancel/{id}:
    get:
      operationId: work_order_cancel
      summary: Cancel a work order
      tags:
        - Work Orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID
        - name: force
          in: query
          schema:
            type: string
          description: Force the cancellation (any value except `false`)
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The work order
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/work_order_reset/{id}:
    get:
      operationId: work_order_reset
      summary: Reset a work order
      description: 'JSON: `{"work_order": {...}, "work_steps": [...]}`.'
      tags:
        - Work Orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The work order and its work steps
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/reset/{id}.{format}:
    post:
      operationId: reset
      summary: Reset a work order (XML result)
      description: Same as `work_order_reset`, implemented by the work order pages. The response is always XML.
      tags:
        - Work Orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID
        - name: format
          in: path
          required: true
          schema:
            type: string
            const: xml
          description: Required by the route
      responses:
        '200':
          description: The work order (XML)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/work_order_destroy/{id}:
    get:
      operationId: work_order_destroy
      summary: Delete a work order and its dependents
      tags:
        - Work Orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Work order ID
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Confirmation message
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/initiate:
    post:
      operationId: initiate
      summary: Initiate a new work order
      description: |
        Starts a new work order for the specified workflow.

        Runtime input values are passed under the `external_parameters` key.
        To discover what parameters a workflow accepts, call `/api/workflow_inputs_spec/{workflow_id}` first.
        With format `json`, the keys of a JSON body are also merged into the runtime parameters.

        JSON response: `{"work_order": {...}, "work_steps": [...], "parameters": {...}}`,
        or `{"work_order": {..., "status": "Not started"}, "missing_parameters": [...]}` (status 400) when required parameters are missing.
      tags:
        - Work Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Format'
        - name: synchronous
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: '`true`: wait for the end of the work order'
        - name: timeout
          in: query
          schema:
            type: integer
          description: 'With `synchronous`, maximum wait in seconds (0 or not set: no limit)'
        - name: explicit_output
          in: query
          schema:
            type: string
          description: Return only this output, as `<step name>:<output name>`
        - name: explicit_output_step
          in: query
          schema:
            type: string
          description: Return only an output of this step (with `explicit_output_variable`)
        - name: explicit_output_variable
          in: query
          schema:
            type: string
          description: Name of the output to return (with `explicit_output_step`)
        - name: on_error_return_code
          in: query
          schema:
            type: integer
          description: HTTP status to return when the work order ends with status `Error`
        - name: on_failed_return_code
          in: query
          schema:
            type: integer
          description: HTTP status to return when the work order ends with status `Failed`
        - name: tags
          in: query
          schema:
            type: string
          description: Comma-separated tags of the work order
        - name: preemptive_level
          in: query
          schema:
            type: integer
          description: Priority of the work order (its opposite is used)
        - name: wo_id_only
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: '`true`: return only the work order ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workflow_id
              properties:
                workflow_id:
                  type: string
                  description: ID, portable ID or name of the workflow to execute
                  examples:
                    - '123'
                external_parameters:
                  type: object
                  description: Runtime parameters of the workflow (name to value)
                  additionalProperties: true
      responses:
        '200':
          description: Work order initiated (or the status given by `on_error_return_code`, `on_failed_return_code`)
        '400':
          description: Workflow not found or not published, or missing required parameters
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/work_step_status/{id}:
    get:
      operationId: work_step_status
      summary: Status, inputs and outputs of a work step, or change its status
      description: |
        Returns `{"work_step": {...}, "outputs": [...], "inputs": [...], "carry_thrus": [...]}`,
        or only the value of an output (`output_name`), or only the status (`status_only`).
        With `set_status` or `set_status_details`, modifies the work step and returns its new status.
      tags:
        - Work Steps
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Work step ID, or `work_order` to use `work_order_id` and `step_name`
        - name: work_order_id
          in: query
          schema:
            type: integer
          description: Work order ID, when `id` is `work_order`
        - name: step_name
          in: query
          schema:
            type: string
          description: Step name, when `id` is `work_order`
        - name: output_name
          in: query
          schema:
            type: string
          description: Return only the value of this output
        - name: status_only
          in: query
          schema:
            type: string
          description: Return only the status (any value except `false`)
        - name: set_status
          in: query
          schema:
            type: string
          description: New status of the work step
        - name: set_status_details
          in: query
          schema:
            type: string
          description: New status details of the work step
        - name: set_percent_complete
          in: query
          schema:
            type: integer
          description: New percentage of completion, with `set_status` or `set_status_details`
        - name: format
          in: query
          schema:
            type: string
            enum:
              - xml
              - json
              - txt
            default: xml
          description: Response format (`txt` for a value or a status as plain text)
      responses:
        '200':
          description: Work step status
        '401':
          $ref: '#/components/responses/UnauthorizedError'
