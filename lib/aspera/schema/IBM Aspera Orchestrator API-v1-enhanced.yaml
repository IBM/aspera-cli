        - Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Task ID
        - name: outputs
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: true
          description: Values of the user inputs, e.g. `outputs[Filename]=tron.avi`. All required inputs must be given.
        - name: input_provider
          in: query
          schema:
            type: string
          description: Login of the user who provides the inputs (administrator only)
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
