      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: file
          in: query
          required: true
          schema:
            type: string
          description: Path of the plugin archive on the Orchestrator host
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Class name of the imported plugin
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_type:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/portlet_version:
    get:
      operationId: portlet_version
      summary: Versions of the portlets
      tags:
        - Portlets
      parameters:
        - name: id
          in: query
          schema:
            type: string
          description: Only this portlet (name), also in the path `/api/portlet_version/<name>`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Portlet versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  Portlet:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        version:
                          type: string
                          examples:
                            - 1.2.3
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/processes_status:
    get:
      operationId: processes_status
      summary: Status of the processes (engine, monitor, workers)
      tags:
        - System
      parameters:
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Process status information
          content:
            application/json:
              schema:
                type: object
                description: Conversion of the XML, so all values are strings
                properties:
                  processes:
                    type: object
                    properties:
                      time:
                        type: string
                      action:
                        type: string
                        const: status
                      engine_id:
                        type: string
                      node:
                        description: A node, or a list when there are several
                        oneOf:
                          - $ref: '#/components/schemas/ProcessNode'
                          - type: array
                            items:
                              $ref: '#/components/schemas/ProcessNode'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/control_process/{id}:
    get:
      operationId: control_process
      summary: Start, stop or kill a process
      description: Returns the status of the processes (in XML, the same as `processes_status`).
      tags:
        - System
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum:
              - engine
              - monitor
              - worker
          description: Process type
        - name: command
          in: query
          required: true
          schema:
            type: string
            enum:
              - start
              - stop
              - kill
              - status
          description: Command (`status` does nothing but returns the status)
        - name: worker_id
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          description: Comma-separated worker IDs, required for type `worker`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Status of the processes
          content:
            application/json:
              schema:
                type: object
                properties:
                  processes:
                    type: object
                    properties:
                      time:
                        type: string
                      action:
                        type: string
                        const: status
                      engine_id:
                        type: integer
                      process:
                        type: array
                        items:
                          type: object
                          properties:
                            class:
                              type: string
                              enum:
                                - engine
                                - monitor
                                - node_mesh
                                - worker
                            id:
                              type: integer
                              description: Worker ID
                            pid:
                              type: [integer, string]
                              description: '`-` when not running'
                            status:
                              type: string
                              enum:
                                - running
                                - not running
                            type:
                              type: string
                              description: Worker type
                              enum:
                                - normal
                                - asynchronous
                                - dedicated
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/custom_api_call:
    get:
      operationId: custom_api_call
      summary: Store data in the shared state, for a database trigger
      description: The query parameters and the request body are stored in table `SharedState`, where a workflow can watch them with a database trigger. The response is always XML.
      tags:
        - System
      parameters:
        - name: identifier
          in: query
          schema:
            type: string
          description: 'Aggregate type of the shared state (default: `custom_api_call`)'
        - name: uniq_id
          in: query
          required: true
          schema:
            type: integer
          description: Aggregate ID of the shared state, an integer
        - name: object
          in: query
          schema:
            type: string
          description: JSON text of the object to store
      responses:
        '200':
          description: ID of the shared state (XML)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/execution_queue_stats/{id}:
    get:
      operationId: execution_queue_stats
      summary: Statistics of the execution queue of the engine
      tags:
        - System
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Queue statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_polling_due:
                    type: [integer, string]
                    description: Seconds until the next polling, or `-`
                  completed_items:
                    type: integer
                  unassigned_items:
                    type: integer
                  error_items:
                    type: integer
                  inprogress_synch_count:
                    type: integer
                  inprogress_asynch_count:
                    type: integer
                  created:
                    type: integer
                    description: Number of work orders with this status
                  ready:
                    type: integer
                  initializing:
                    type: integer
                  initialized:
                    type: integer
                  in_progress:
                    type: integer
                  paused:
                    type: integer
                  time_executed:
                    type: string
                  engine_id:
                    type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/alerts/{id}:
    get:
      operationId: alerts
      summary: Alerts of the categories the user is subscribed to
      tags:
        - System
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: count_only
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: 'Return only the number of alerts: `{"count"}`'
        - name: category
          in: query
          schema:
            type: string
          description: Only alerts of this category, e.g. `user`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: List of alerts, or their number
          content:
            application/json:
              schema:
                oneOf:
                  - title: Count
                    description: With `count_only=true`
                    type: object
                    properties:
                      count:
                        type: integer
                  - type: array
                    items:
                      $ref: '#/components/schemas/AlertNotification'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/remote_node_ping:
    get:
      operationId: remote_node_ping
      summary: Version and platform of this Orchestrator
      tags:
        - Remote Nodes
      parameters:
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Orchestrator information
          content:
            application/json:
              schema:
                type: object
                properties:
                  remote_orchestrator_info:
                    type: object
                    properties:
                      orchestrator-version:
                        type: string
                      platform:
                        type: string
                      engine_id:
                        type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/test_step/{id}:
    get:
      operationId: test_step
      summary: Launch test cases for a workflow step
      description: |
        Launches test cases against a workflow and returns a **Test_run_id** UUID.
        Pass that UUID to `/api/test_step_status` to poll for results.
      tags:
        - Testing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID or portable ID to test
          example: my_workflow
        - name: step
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated step name(s) to test. Omit to test all steps.
          example:
            - Get file size
        - name: case
          in: query
          schema:
            type: string
          description: Test case name to run. Omit to run all cases for the step.
          example: File doesnt exist
        - name: synchronous
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: '`true`: wait for all test cases to complete before returning'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Test run launched. Response contains `Test_run_id` UUID to use with `/api/test_step_status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
        '404':
          description: Workflow not found
  /api/test_step_status/{id}:
    get:
      operationId: test_step_status
      summary: Get test step status
      description: |
        Poll the status of a test run previously launched by `/api/test_step`.
        The `id` parameter must be the **Test_run_id UUID** returned by that call, not a numeric workflow or step ID.
      tags:
        - Testing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Test run UUID returned by /api/test_step (e.g. 935e0080-97f5-0135-26f8-34363bc6aedc)
          example: 935e0080-97f5-0135-26f8-34363bc6aedc
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Test status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_order_stats/{id}:
    get:
      operationId: work_order_stats
      summary: Work order statistics, monthly or for a day
      description: Returns the text `No Statistics found. Change the filter and try again.` when there is none.
      tags:
        - Statistics
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: workflow_id
          in: query
          schema:
            type: integer
          description: Only this workflow
        - name: label
          in: query
          schema:
            type: string
          description: Only work orders with this label
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: 'Statistics of this day, e.g. `2017-04-04`. Not set: monthly statistics.'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Work order statistics
          content:
            application/json:
              schema:
                type: array
                description: By day (monthly statistics of the last 30 days), or by hour (statistics of a day). The sums are decimal strings.
                items:
                  type: object
                  properties:
                    Date:
                      type: string
                    Last_hour:
                      type: string
                      format: date-time
                    Complete_Work_Orders:
                      type: [string, integer]
                    Failed_Work_Orders:
                      type: [string, integer]
                    Errored_Work_Orders:
                      type: [string, integer]
                    Canceled_Work_Orders:
                      type: [string, integer]
                    Rolled_Back_Work_Orders:
                      type: [string, integer]
                    Destroyed_Work_Orders:
                      type: [string, integer]
                    Cleared_Work_Orders:
                      type: [string, integer]
                    Flagged_Work_Orders:
                      type: [string, integer]
                    Initializing_Work_Orders:
                      type: [string, integer]
                    Initialized_Work_Orders:
                      type: [string, integer]
                    Created_Work_Orders:
                      type: [string, integer]
                    Ready_Work_Orders:
                      type: [string, integer]
                    In_Progress_Work_Orders:
                      type: [string, integer]
                    Unknown_Work_Orders:
                      type: [string, integer]
            text/plain:
              schema:
                type: string
                const: No Statistics found. Change the filter and try again.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/work_step_stats/{id}:
    get:
      operationId: work_step_stats
      summary: Work step statistics, monthly or for a day
      description: 'Returns the text `No Statistics found. Change the filter and try again.` when there is none. The filters are inserted as is in an SQL condition (`workflow_id in (...)`): give comma-separated numbers or quoted values.'
      tags:
        - Statistics
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: workflow_id
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          description: Comma-separated workflow IDs
        - name: step_id
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          description: Comma-separated step IDs
        - name: step_type
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated step types, quoted (e.g. `'CustomRuby'`)
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: 'Statistics of this day, e.g. `2017-04-04`. Not set: monthly statistics.'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Work step statistics
          content:
            application/json:
              schema:
                type: array
                description: By day (monthly statistics of the last 30 days), or by hour (statistics of a day). The sums are decimal strings.
                items:
                  type: object
                  properties:
                    Date:
                      type: string
                    Last_hour:
                      type: string
                      format: date-time
                    Completed_Steps:
                      type: [string, integer]
                    Failed_Steps:
                      type: [string, integer]
                    Errored_steps:
                      type: [string, integer]
                    Obsolete_Steps:
                      type: [string, integer]
                    Activating_Steps:
                      type: [string, integer]
                    In_Progress_Steps:
                      type: [string, integer]
                    Paused_Steps:
                      type: [string, integer]
                    Pausing_Steps:
                      type: [string, integer]
                    Canceling_Steps:
                      type: [string, integer]
                    Resuming_Steps:
                      type: [string, integer]
                    Rolling_Back_Steps:
                      type: [string, integer]
                    Undefined_Steps:
                      type: [string, integer]
            text/plain:
              schema:
                type: string
                const: No Statistics found. Change the filter and try again.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/journal_files/{id}:
    get:
      operationId: journal_files
      summary: Files recorded in a journal book
      tags:
        - Journals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Journal book name or ID
        - name: details
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: '`false`: without the states (steps) of each file'
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated statuses, e.g. `In Progress,Processing complete`
        - name: file
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated file paths
        - name: package
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated package names (not with `package_id`)
        - name: package_id
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          description: Comma-separated package IDs (not with `package`)
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Journal entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  Journal:
                    type: object
                    properties:
                      name:
                        type: string
                      id:
                        type: integer
                      description:
                        type: [string, 'null']
                      active:
                        type: [boolean, 'null']
                  Packages:
                    type: array
                    description: Only when the journal has packages
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        id:
                          type: integer
                        files:
                          type: array
                          items:
                            $ref: '#/components/schemas/JournalFile'
                  Files:
                    type: array
                    description: Files without package
                    items:
                      $ref: '#/components/schemas/JournalFile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/add_resource/{id}:
    get:
      operationId: add_resource
      summary: Add a resource to a resource pool
      tags:
        - Resources
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/ResourceName'
        - name: capacity
          in: query
          schema:
            type: integer
            default: 1
          description: Capacity of the resource
        - name: tags
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated tags
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The new resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  ManagedResource:
                    $ref: '#/components/schemas/ManagedResource'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/edit_resource_capacity/{id}:
    get:
      operationId: edit_resource_capacity
      summary: Change the capacity of a resource
      tags:
        - Resources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: New capacity, a positive integer
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/ResourceName'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  ManagedResource:
                    $ref: '#/components/schemas/ManagedResource'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/edit_pool_capacity/{id}:
    get:
      operationId: edit_pool_capacity
      summary: Change the capacity of a resource pool
      tags:
        - Resources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: New capacity, a positive integer
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The resources of the pool
          content:
            application/json:
              schema:
                type: object
                properties:
                  ManagedResource:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagedResource'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/resource_online/{id}:
    get:
      operationId: resource_online
      summary: Take a resource online
      tags:
        - Resources
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/ResourceName'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The resource is online
          content:
            application/json:
              schema:
                type: object
                properties:
                  ManagedResource:
                    type: object
                    description: Resource ID (with `>` replaced by `-`) to new status
                    additionalProperties:
                      const: Online
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/resource_offline/{id}:
    get:
      operationId: resource_offline
      summary: Take a resource offline
      tags:
        - Resources
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/PoolName'
        - $ref: '#/components/parameters/ResourceName'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The resource is offline
          content:
            application/json:
              schema:
                type: object
                properties:
                  ManagedResource:
                    type: object
                    description: Resource ID (with `>` replaced by `-`) to new status
                    additionalProperties:
                      const: Offline
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/pool_status/{id}:
    get:
      operationId: pool_status
      summary: Resources of a resource pool and their status
      tags:
        - Resources
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Name of the resource pool (with or without the suffix `__a` of the database)
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Pool status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ManagedResource:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Resource name
                        taken:
                          type: integer
                        capacity:
                          type: integer
                        status:
                          type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
  /api/create_user/{id}:
    post:
      operationId: create_user
      summary: Create a user
      description: The response is JSON unless format is `xml`.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/AnyId'
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
                - password
                - email
              properties:
                login:
                  type: string
                  description: Login of the user
                password:
                  type: string
                  format: password
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                  description: Email of the user, unique
                phone:
                  type: string
                SMS:
                  type: string
                is_active:
                  type: boolean
                  default: false
                require_password_change_on_login:
                  type: boolean
                  default: false
                alternate_emails:
                  type: array
                  items:
                    type: string
                    format: email
                groups:
                  type: array
                  description: Names of existing groups
                  items:
                    type: string
      responses:
        '200':
          description: Confirmation message
          content:
            application/json:
              schema:
                type: object
                properties:
                  create_user:
                    type: object
                    properties:
                      success:
                        type: string
                        examples:
                          - User 'jdoe' was successfully created.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/login endpoint
    basicAuth:
      type: http
      scheme: basic
      description: Login and password, when JWT authentication is disabled
    loginQuery:
      type: apiKey
      in: query
      name: login
      description: User login, with `password` or `api_key`, when JWT authentication is disabled
    passwordQuery:
      type: apiKey
      in: query
      name: password
      description: User password, when JWT authentication is disabled
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: API key of the user, when JWT authentication is disabled
  parameters:
    Format:
      name: format
      in: query
      schema:
        type: string
        enum:
          - xml
          - json
        default: xml
      description: Response format (also given by the extension `.json` or `.xml` of the path)
    AnyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        default: '0'
      description: Not used by the endpoint, but required by the route (any value, e.g. `0`)
    MonitorType:
      name: monitor_type
      in: query
      required: true
      schema:
        type: string
        enum:
          - workflow
          - workorder
          - folder
          - node
          - script
      description: Type of monitor (also accepted `work_order`, `remotenode`, `remote_node`, `remotescript`, `remote_script`)
    PoolName:
      name: pool_name
      in: query
      required: true
      schema:
        type: string
      description: Name of the resource pool
    ResourceName:
      name: resource_name
      in: query
      required: true
      schema:
        type: string
      description: Name of the resource, e.g. an IP address
  schemas:
    Error:
      type: object
      description: 'Error of an API call in format `json`. In format `xml`: `<error time="..." action="..." id="...">message</error>`.'
      required:
        - error
      properties:
        error:
          type: object
          required:
            - action
            - time
            - id
            - description
          properties:
            action:
              type: string
              description: Called endpoint
            time:
              type: string
              description: UTC time
              examples:
                - '2026-10-21 08:30:00'
            id:
              type: string
              description: The `id` of the call, or `0`
            description:
              type: string
              description: Error message and backtrace
    Workflow:
      type: object
      description: Workflow (database record)
      properties:
        id:
          type: integer
        name:
          type: string
        portable_id:
          type: [string, 'null']
        created_by:
          type: [integer, 'null']
          description: User ID
        folder_id:
          type: [integer, 'null']
        generated_from:
          type: [integer, 'null']
          description: Published whiteboard, `null` for a draft
        revision_id:
          type: [integer, 'null']
          description: Published revision
        label:
          type: [string, 'null']
        run_as:
          type: [string, 'null']
        source_revision:
          type: [string, 'null']
        comments:
          type: [string, 'null']
        description:
          type: [string, 'null']
        tags:
          type: [string, 'null']
        templates:
          type: [string, 'null']
        max_running:
          type: [integer, 'null']
        cleanup_after_days:
          type: [integer, 'null']
        purge_after_days:
          type: [integer, 'null']
        user_lock:
          type: [boolean, 'null']
        locked_by:
          type: [integer, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkOrder:
      type: object
      description: Work order (database record)
      properties:
        id:
          type: integer
        name:
          type: [string, 'null']
        monitor_id:
          type: [integer, 'null']
        workflow_id:
          type: [integer, 'null']
        workflow_revision_id:
          type: [integer, 'null']
        workflow_name:
          type: [string, 'null']
        branched_from_order:
          type: [integer, 'null']
          description: Parent work order, for a sub-workflow
        branched_from:
          type: [integer, 'null']
          description: Parent work step, for a sub-workflow
        forked_at:
          type: [integer, 'null']
        derived_from:
          type: [integer, 'null']
        master_id:
          type: [integer, 'null']
        launched_by:
          type: [integer, 'null']
          description: User ID
        initiated_by:
          type: [integer, 'null']
          description: User ID
        running_as:
          type: [integer, 'null']
        priority:
          type: [integer, 'null']
        exec_priority:
          type: [number, 'null']
        higher_priority:
          type: [boolean, 'null']
        label:
          type: [string, 'null']
        status:
          type: [string, 'null']
          examples:
            - In Progress
        status_details:
          type: [string, 'null']
        comments:
          type: [string, 'null']
        tags:
          type: [string, 'null']
          description: Tags separated by `|`, e.g. `|tag1|tag2|`
        initiate_date:
          type: [string, 'null']
          format: date-time
        completion_date:
          type: [string, 'null']
          format: date-time
        max_running:
          type: [integer, 'null']
        cleanup_after_days:
          type: [integer, 'null']
        purge_after_days:
          type: [integer, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkStepBase:
      type: object
      description: Work step (database record), common columns
      properties:
        id:
          type: integer
        action_id:
          type: [integer, 'null']
        step_id:
          type: [integer, 'null']
        step_type:
          type: [string, 'null']
          description: Plugin class name, e.g. `CustomRuby`
        step_name:
          type: [string, 'null']
        work_step_name:
          type: [string, 'null']
        attempt:
          type: [integer, 'null']
        execution_timeout:
          type: [integer, 'null']
        group:
          type: [integer, 'null']
        percent_complete:
          type: [integer, 'null']
        rank:
          type: [integer, 'null']
        running_as:
          type: [integer, 'null']
        synch_filter:
          type: [integer, 'null']
        timeout:
          type: [integer, 'null']
        weight:
          type: [integer, 'null']
        activation_time:
          type: [number, 'null']
        on_timeout:
          type: [string, 'null']
        status:
          type: [string, 'null']
        status_details:
          type: [string, 'null']
        prerequisites:
          type: [string, 'null']
        episteps:
          type: [string, 'null']
        journaling:
          type: [string, 'null']
        work_inputs:
          type: [string, 'null']
        work_outputs:
          type: [string, 'null']
        activable_date:
          type: [string, 'null']
          format: date-time
        activation_date:
          type: [string, 'null']
          format: date-time
        original_activation_date:
          type: [string, 'null']
          format: date-time
        completion_date:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkStep:
      description: Work step (database record)
      allOf:
        - $ref: '#/components/schemas/WorkStepBase'
      properties:
        work_order_id:
          type: [integer, 'null']
        workflow_id:
          type: [integer, 'null']
        pre_processing:
          type: [string, 'null']
        post_processing:
          type: [string, 'null']
    WorkStepStatus:
      description: Work step in `work_order_status`, without `workflow_id`, `pre_processing` and `post_processing`
      allOf:
        - $ref: '#/components/schemas/WorkStepBase'
      properties:
        percent_complete:
          type: integer
          description: 0 for a running step, 100 for a finished step, when not set
        category:
          type: string
          description: Category of the plugin, e.g. `Basic/Ruby`, or `-`
        work_order_id:
          type: [integer, string]
          description: 'Only for steps of type `SubWorkflow`, `WorkflowLauncher` and `FederatedWorkflow`: the launched work order, or `-`'
        node_id:
          type: string
          description: 'Only for `FederatedWorkflow`: execution node, or `-`'
        address:
          type: string
          description: 'Only for `FederatedWorkflow`: execution address, or `-`'
    WorkOrderWithSteps:
      type: object
      properties:
        work_order:
          $ref: '#/components/schemas/WorkOrder'
        work_steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkStep'
    WorkstepReset:
      allOf:
        - $ref: '#/components/schemas/WorkOrderWithSteps'
      properties:
        workstep_reset:
          const: true
    StepVariable:
      type: object
      description: Input or output of a work step
      properties:
        value:
          description: Value, of any type
        name:
          type: string
        id:
          type: integer
        type:
          type: string
          description: Value type
    QueuedItem:
      type: object
      description: Item of a queue (database record, without the columns of the queue)
      properties:
        id:
          type: integer
        queued_item:
          description: The queued item
        item_description:
          type: [string, 'null']
        priority:
          type: [integer, 'null']
        weight:
          type: [integer, 'null']
        position:
          type: [integer, 'null']
        rank:
          type: [integer, 'null']
          description: Position in the queue, from 0
        originator_type:
          type: [string, 'null']
        originator_id:
          type: [integer, 'null']
        tags:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    QueueMetadata:
      type: object
      properties:
        id:
          type: string
          description: Queue name given in the call (`queued_items` only)
        name:
          type: string
          description: Displayed name of the queue
        comments:
          type: [string, 'null']
        administrators:
          type: object
          properties:
            groups:
              type: array
              items:
                type: integer
            users:
              type: array
              items:
                type: integer
        paused:
          type: [boolean, 'null']
    QueuedItems:
      type: object
      properties:
        queued_items:
          type: array
          items:
            $ref: '#/components/schemas/QueuedItem'
        queue_metadata:
          $ref: '#/components/schemas/QueueMetadata'
    Task:
      type: object
      description: Task, i.e. a user input waiting for a user (database record)
      properties:
        id:
          type: integer
        state_id:
          type: [integer, 'null']
          description: Work step ID
        user_input_id:
          type: [integer, 'null']
        role_id:
          type: [integer, 'null']
          description: Group ID
        user_id:
          type: [integer, 'null']
        status:
          type: [string, 'null']
        completed_by:
          type: [integer, 'null']
          description: User ID
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserInput:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          description: Value type
        value:
          description: Current value
        required:
          type: boolean
    MonitorChange:
      type: object
      properties:
        action:
          type: string
          enum:
            - activate_monitor
            - deactivate_monitor
        time:
          type: string
          description: Local time
        id:
          type: string
          description: Monitor ID
        description:
          type: string
          enum:
            - activated
            - deactivated
    PluginReloadStatus:
      type: object
      description: 'Plugin class name, or `All Plugins`, to `true`, `false` or an error message'
      additionalProperties:
        type: [boolean, string]
    ProcessNode:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        current:
          type: string
          enum:
            - 'true'
            - 'false'
        process:
          type: array
          items:
            type: object
            properties:
              class:
                type: string
                enum:
                  - engine
                  - monitor
                  - process_manager
                  - node_mesh
                  - worker
              id:
                type: string
                description: Worker ID
              pid:
                type: string
                description: '`-` when not running'
              status:
                type: string
              type:
                type: string
                description: Worker type
                enum:
                  - normal
                  - asynchronous
                  - dedicated
    AlertNotification:
      type: object
      properties:
        id:
          type: integer
        category_id:
          type: [integer, 'null']
        alert_header:
          type: [string, 'null']
        alert_description:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TestRun:
      type: object
      properties:
        Test_run_id:
          type: string
          format: uuid
        Workflow_id:
          type: [integer, 'null']
        Test_cases_launched:
          type: integer
        Steps:
          type: array
          description: Only when synchronous, and in `test_step_status`
          items:
            type: object
            properties:
              Step_name:
                type: string
              Result:
                type: boolean
              Test_cases:
                type: array
                items:
                  type: object
                  properties:
                    Id:
                      type: integer
                    Name:
                      type: string
                    status:
                      type: string
                    Status_details:
                      type: [string, 'null']
                    Result_message:
                      type: [string, 'null']
                    Last_update:
                      type: string
                      format: date-time
                    Inputs:
                      description: Inputs of the test case
                    Outputs:
                      description: Outputs of the test case
                    Result:
                      type: [boolean, 'null']
        Result:
          type: boolean
          description: Only when synchronous, and in `test_step_status`
    JournalFile:
      type: object
      properties:
        file_id:
          type: integer
        file:
          type: string
        status:
          type: [string, 'null']
        status_details:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        states:
          type: array
          description: Steps that processed the file, unless `details=false`
          items:
            type: object
            properties:
              path:
                type: [string, 'null']
              status:
                type: [string, 'null']
              status_details:
                type: [string, 'null']
              progress:
                type: [integer, 'null']
              work_step_id:
                type: [integer, 'null']
              work_order_id:
                type: [integer, 'null']
              step_name:
                type: [string, 'null']
              workflow_id:
                type: [integer, 'null']
              workflow_name:
                type: [string, 'null']
              created_at:
                type: string
                format: date-time
    ManagedResource:
      type: object
      description: Resource of a resource pool (database record)
      properties:
        id:
          type: integer
        resource_id:
          type: string
        resource_name:
          type: string
          description: Pool name, with the suffix `__a`
        status:
          type: [string, 'null']
        max:
          type: [integer, 'null']
          description: Capacity
        reserved:
          type: [integer, 'null']
        properties:
          type: [string, 'null']
        tags:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  responses:
    UnauthorizedError:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            anyOf:
              - title: JWT authentication
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      - Unauthorized
              - $ref: '#/components/schemas/Error'
    Error:
      description: 'Error: status 403 when access is denied, else 404 when the server option `strict_api_validation` is set, else 200 (see Errors in the introduction)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
tags:
  - name: Authentication
    description: Obtain JWT tokens for API access. All other endpoints require authentication.
  - name: Workflows
    description: Import, export, publish and inspect workflow definitions.
  - name: Work Orders
    description: Initiate and track workflow executions. Each work order is one execution of a workflow.
  - name: Work Steps
    description: Status and control of the steps of a work order.
  - name: Queues
    description: Managed queues (plugin Queue stager) and their items.
  - name: Monitors
    description: Monitors of workflows, work orders, folders, remote nodes and scripts.
  - name: Tasks
    description: User inputs (tasks) waiting for an operator.
  - name: Plugins
    description: Versions, import, enabling and reloading of action plugins.
  - name: Portlets
    description: Versions of the portlets of the web interface.
  - name: System
    description: Processes, execution queue, alerts, and shared state for external applications.
  - name: Remote Nodes
    description: Information on this Orchestrator, used by remote Orchestrator nodes.
  - name: Testing
    description: Test cases of workflow steps.
  - name: Statistics
    description: Statistics of work orders and work steps.
  - name: Journals
    description: Journal books and the files recorded in them.
  - name: Resources
    description: Resource pools (plugin Load manager) and their resources.
  - name: Users
    description: User accounts.
