        - bearerAuth: []
      parameters:
        - name: id
          in: query
          schema:
            type: string
          description: Only this portlet (name), also in the path `/api/portlet_version/<name>`
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Portlet versions
