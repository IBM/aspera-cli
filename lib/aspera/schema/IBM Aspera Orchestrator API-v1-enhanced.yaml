        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Monitor ID or portable ID
        - name: portable_id
          in: query
          schema:
            type: string
          description: Portable ID of the monitor, used when the `id` segment is empty
        - $ref: '#/components/parameters/MonitorType'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Monitor deactivated
          content:
            application/json:
