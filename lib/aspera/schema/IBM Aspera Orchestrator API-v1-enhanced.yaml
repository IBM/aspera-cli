        - bearerAuth: []
      parameters:
        - name: action_type
          in: query
          schema:
            type: string
          description: 'Plugin class name, e.g. `Adi3Parser`. Not set: all enabled plugins.'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
