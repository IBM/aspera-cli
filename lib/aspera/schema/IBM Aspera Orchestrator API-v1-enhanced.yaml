        - $ref: '#/components/parameters/AnyId'
        - name: file
          in: query
          required: true
          schema:
            type: string
          description: Path of the plugin archive on the Orchestrator host
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Class name of the imported plugin
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/portlet_version:
    get:
      operationId: portlet_version
      summary: Versions of the portlets
      description: 'JSON: `{"Portlet": [{"name", "version"}]}`.'
      tags:
        - Portlets
