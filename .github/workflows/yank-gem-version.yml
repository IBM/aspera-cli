name: Yank RubyGems version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to yank (e.g. 4.26.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  yank:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: optional:development:special
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          bundler-cache: true

      - name: Yank gem version
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          mkdir -p $HOME/.gem
          GEM_CREDS=$HOME/.gem/credentials
          echo ":rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}" > $GEM_CREDS
          chmod 0600 $GEM_CREDS
          bundle exec rake release:yank[${{ inputs.version }}]
