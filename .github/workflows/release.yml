# Workflow to create a new release
# Triggered manually via GitHub Actions UI
name: New Release on GitHub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., x.y.z). Leave empty to use version.rb without .pre suffix"
        required: false
        type: string
      next_version:
        description: "Next development version (e.g., x.y.z). Leave empty to auto-increment minor version. Will append .pre automatically"
        required: false
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: optional:development:special
      # Tools of the PDF manual
      GFM2PDF_VERSION: "1.0.0"
      PANDOC_VERSION: "3.12.1"
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # PDF manual: gfm2pdf-toolchain, outside the workspace (committed with `git add -A`), and pandoc from its GitHub
      # release (the package of Ubuntu is too old)
      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape texlive-luatex texlive-fonts-extra texlive-latex-extra fonts-ibm-plex fonts-noto-color-emoji librsvg2-bin
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -1
          git clone --depth 1 --branch "v${GFM2PDF_VERSION}" https://github.com/laurent-martin/gfm2pdf-toolchain.git "$RUNNER_TEMP/gfm2pdf-toolchain"
          echo "GFM2PDF_HOME=$RUNNER_TEMP/gfm2pdf-toolchain" >> "$GITHUB_ENV"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SIGNING_KEY: ${{ secrets.PRIVATE_KEY_PEM }}
        run: |
          bundle exec rake release:run'[${{ github.event.inputs.version }},${{ github.event.inputs.next_version }}]'
