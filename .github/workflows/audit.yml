name: Gem Audit

# Checks all gems of the Gemfile and the gemspec, including optional ones and their dependencies, for all platforms,
# against the Ruby advisory database (the GitHub dependency graph does not parse gems with a list in platforms:)
on:
  push:
    paths:
      - "Gemfile"
      - "**/*.gemspec"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "Gemfile"
      - "**/*.gemspec"
      - ".github/workflows/audit.yml"
  # New advisories are published without change in the repository
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: bundler-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0

      # Resolution only, no installation: native gems need not be compiled
      # Platform ruby (source gems): also used by other platforms, and Bundler 4.0 fails to resolve sqlite3 for x86_64-linux and x64-mingw-ucrt without it
      - name: Resolve gems for all platforms
        run: bundle lock --add-platform ruby java x64-mingw-ucrt

      - name: Install bundler-audit
        run: gem install --no-document bundler-audit -v 0.9.3

      - name: Check gems against the Ruby advisory database
        run: bundler-audit check --update
