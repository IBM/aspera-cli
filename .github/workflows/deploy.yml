# Action to push a gem version to RubyGems when a new tag is created
# Authentication: RubyGems API key in secret RUBYGEMS_API_KEY (scope: push rubygem)
name: Push to Rubygems

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build + Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUNDLE_WITHOUT: optional:development:special
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Install rake
        run: gem install rake
      - name: Publish to RubyGems
        if: contains(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEY: ${{ secrets.PRIVATE_KEY_PEM }}
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          gem_conf="$HOME/.gem"
          mkdir -p "$gem_conf"
          install -m 600 /dev/null "$gem_conf/credentials"
          printf ':rubygems_api_key: %s\n' "$RUBYGEMS_API_KEY" > "$gem_conf/credentials"
          rake release_signed
