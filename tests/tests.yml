conf_web_login:
  priority: 1
  description: Login on the workstation for ascli on another host, with the code of type login. The host of the login page is not known yet, it is accepted on the terminal.
  tags:
    - interactive
    - tty
    - no_doc
    - faspex5
  depends_on:
    - f5_mock_idp_https_start
  stdin: "yes\n"
  pre: |
    FileUtils.rm_f(PATH_CLI_HOME / 'persist_store/web_login_hosts.txt')
    select_browser(access_code: :mock_idp_auth)
  post: |
    raise 'Host not persisted' unless (PATH_CLI_HOME / 'persist_store/web_login_hosts.txt').read.split("\n").include?('127.0.0.1')
    raise 'Host not asked' unless t.out_file.sub_ext('.tty').read.include?('trust this host')
    t.stop_process(:f5_mock_idp_https_start)
  args:
    - config
    - web_login
    - "$(web_login_code(login_url: 'https://127.0.0.1:13783/aspera/faspex/auth/authorize?client_id=mock_client_id&redirect_uri=http%3A%2F%2F127.0.0.1%3A12345%2F&state=mock_state', redirect_uri: 'http://127.0.0.1:12345/'))"
