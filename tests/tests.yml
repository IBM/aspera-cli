    raise "unexpected preset: #{config['conf_name']}" unless config['conf_name'].eql?({'p2' => {'sub' => 'v2'}, 'p3' => 'v3', 'p4' => 'v4'})
    raise "unexpected preset: #{config['conf_name_other']}" unless config['conf_name_other'].eql?({'p1' => 'v1'})
