# Refer to README.md for fields and tags
# --------------------------------------
asession:
  command: asession
  pre: |
    server_preset = conf_data('default.server')
    uri = URI.parse(conf_data("#{server_preset}.url"))
    remote_host=uri.host
    remote_port=uri.port
    remote_user=conf_data("#{server_preset}.username")
    remote_pass=conf_data("#{server_preset}.password")
  args:
    - |
      @json:{"loglevel":"info","spec":{"remote_host":"$(remote_host)","remote_user":"$(remote_user)","ssh_port":$(remote_port),"remote_password":"$(remote_pass)","direction":"receive","destination_root":"$(TMP)","resume_policy":"none","paths":[{"source":"/aspera-test-dir-small/10MB.1"}]}}
unit:
  $comment: Run spec
  command: null
  tags:
    - no_doc
  pre: Rake::Task[:spec].invoke

