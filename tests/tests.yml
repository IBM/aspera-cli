# Node ------------------------------------------------------
node_emulator_start:
  description: Start the Node API emulator in background, transfers are executed by transferd.
  tags:
    - background
    - grpc
  pre: generated_secret(:emulator)
  args:
    - node
    - emulator
    - '@json:{"url":"http://localhost:12348","username":"sim","password":"$(secret :emulator)","password_min_bits":0,"docroot":"$(TMP)"}'
  post: |
    # transferd is started before the web server listens
    wait_listening(12348)
node_emulator_bad_auth:
  description: The emulator rejects wrong credentials.
  tags:
    - must_fail
    - no_doc
    - grpc
  expect: Invalid or missing credentials
  depends_on:
    - node_emulator_start
  pre: generated_secret(:dummy)
  args:
    - node
    - --url=http://localhost:12348
    - --username=sim
    - --password=$(secret :dummy)
    - transfer
    - list
node_emulator_info:
  tags:
    - no_doc
    - grpc
  depends_on:
    - node_emulator_start
  args:
    - node
    - --url=http://localhost:12348
    - --username=sim
    - --password=$(secret :emulator)
    - info
node_emulator_browse:
  description: Paths of the emulator are relative to its docroot.
  tags:
    - grpc
  expect: /data_file.bin
  depends_on:
    - node_emulator_start
  args:
    - node
    - --url=http://localhost:12348
    - --username=sim
    - --password=$(secret :emulator)
    - browse
    - /
    - --fields=path
    - --format=csv
    - '--select=@json:{"basename":"$(FILENAME_ASCII)"}'
serv_upload_via_emulator:
  description: Upload to the server a file of the emulator docroot, the transfer is executed by the emulator.
  tags:
    - grpc
  depends_on:
    - node_emulator_start
  args:
    - server
    - upload
    - /$(FILENAME_ASCII)
    - --to-folder=@preset:server1_info.upload_folder
    - --transfer.agent=node
    - --transfer.url=http://localhost:12348
    - --transfer.username=sim
    - --transfer.password=$(secret :emulator)
node_emulator_transfer_list:
  description: The transfer started by the emulator is completed.
  tags:
    - grpc
  expect: completed
  depends_on:
    - serv_upload_via_emulator
  args:
    - node
    - --url=http://localhost:12348
    - --username=sim
    - --password=$(secret :emulator)
    - transfer
    - list
    - --fields=status
  post: t.stop_process :node_emulator_start
# AoC ------------------------------------------------------
faspex_send_via_aoc_gateway:
  description: Create a package through the AoC gateway (Faspex 4 API), then upload a file with the returned transfer spec
  depends_on:
    - aoc_gateway_set_faspex_url
  tags:
    - no_doc
    - fx_gateway
  pre: |
    transfer_spec = faspex4_send_transfer_spec(url: 'https://localhost:12347/aspera/faspex', recipients: ['laurent.martin.aspera@fr.ibm.com'], title: 'gateway aoc')
    (TMP / 'fxgw_ts.json').write(JSON.generate(transfer_spec))
  args:
    - server
    - upload
    - --url=https://eudemo.asperademo.com:443
    - --ts=@json:@file:$(TMP / 'fxgw_ts.json')
    - faux:///test1?1k
  post: t.stop_process :aoc_gateway_set_faspex_url
