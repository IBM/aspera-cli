# MCP -------------------------------------------------------
mcp_bad_transport:
  description: Reject an unknown MCP transport option.
  tags:
    - mcp
    - must_fail
    - no_doc
  expect: "`/transport` is not one of: [\"stdio\", \"http\"]"
  args:
    - mcp
    - server
    - "@:"
    - transport=bad
mcp_http_server:
  description: Start MCP HTTP server, call execute_ascli_command with conf gem version, stop server.
  tags:
    - mcp
    - background
  args:
    - mcp
    - server
    - "@:"
    - transport=http
    - port=13777
  post: mcp_http_server_post(t)
mcp_bad_option:
  description: Reject an unknown MCP option key.
  tags:
    - mcp
    - must_fail
    - no_doc
  expect: "Unknown MCP option(s): unknown_key"
  args:
    - mcp
    - server
    - '@json:{"unknown_key":true}'
mcp_http_tools_list:
  description: Start MCP HTTP server, verify tools/list contains execute_ascli_command, stop server.
  tags:
    - mcp
    - background
    - no_doc
  args:
    - mcp
    - server
    - "@:"
    - transport=http
    - port=13778
  post: mcp_http_tools_list_post(t)
mcp_stdio_call:
  description: MCP stdio transport — initialize then tools/call returns the gem version.
  tags:
    - mcp
  stdin: |
    {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"test","version":"0"}}}
    {"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"execute_ascli_command","arguments":{"args":["config","gem","version"]}}}
  args:
    - mcp
    - server
  post: mcp_stdio_call_post(t)

mcp_auth_required_nonlocal:
  description: Reject HTTP server start when url is non-local and no auth is configured.
  tags:
    - mcp
    - must_fail
    - no_doc
  expect: "auth_token is required when the server listens on an address that is not loopback"
  args:
    - mcp
    - server
    - "@:"
    - transport=http
    - url=http://0.0.0.0:3000
mcp_oauth_token_required_nonlocal:
  description: Reject HTTP server start when url is non-local with OAuth but no auth_token (consent access code).
  tags:
    - mcp
    - must_fail
    - no_doc
  expect: "auth_token (asked on the consent page) is required when public_url is not loopback"
  args:
    - mcp
    - server
    - "@:"
    - transport=http
    - url=http://0.0.0.0:3000
    - public_url=http://your-server:3000
    - oauth=true
mcp_oauth_public_url_required:
  description: Reject HTTP server start with OAuth on a wildcard address without public_url.
  tags:
    - mcp
    - must_fail
    - no_doc
  expect: "public_url is required with oauth when listening on 0.0.0.0"
  pre: generated_secret(:mcp_auth_token)
  args:
    - mcp
    - server
    - "@:"
    - transport=http
    - url=http://0.0.0.0:3000
    - oauth=true
    - auth_token=$(secret :mcp_auth_token)
    - auth_token_min_bits=0
mcp_auth_token_server:
  description: Start MCP HTTP server with static auth_token, verify 401 without token and 200 with token.
  tags:
    - mcp
    - background
    - no_doc
  pre: generated_secret(:mcp_auth_token)
  args:
    - mcp
    - server
    - "@:"
    - transport=http
    - port=13779
    - auth_token=$(secret :mcp_auth_token)
    - auth_token_min_bits=0
  post: mcp_auth_token_server_post(t)
mcp_oauth_flow:
  description: >-
    Start MCP HTTP server with OAuth PKCE, complete the full flow:
    discovery, consent with access code, token exchange, refresh, and authenticated MCP call.
  tags:
    - mcp
    - background
    - no_doc
  pre: generated_secret(:mcp_auth_token)
  args:
    - mcp
    - server
    - "@:"
    - transport=http
    - port=13780
    - oauth=true
    - auth_token=$(secret :mcp_auth_token)
    - auth_token_min_bits=0
  post: mcp_oauth_flow_post(t)
mcp_oauth_deny:
  description: OAuth consent deny — server must redirect with error=access_denied.
  tags:
    - mcp
    - background
    - no_doc
  args:
    - mcp
    - server
    - "@:"
    - transport=http
    - port=13781
    - oauth=true
  post: mcp_oauth_deny_post(t)
mcp_http_secret:
  description: >-
    Start MCP HTTP server with auth_token, execute a command with `@secret:` (protocol 2026-07-28):
    URL mode elicitation, secret entered on the web page with access code, retried call with secret hidden in result.
  tags:
    - mcp
    - background
    - no_doc
  pre: generated_secret(:mcp_auth_token)
  args:
    - mcp
    - server
    - "@:"
    - transport=http
    - port=13782
    - auth_token=$(secret :mcp_auth_token)
    - auth_token_min_bits=0
  post: mcp_http_secret_post(t)
