# Pandoc options : see https://pandoc.org/MANUAL.html
to: pdf
pdf-engine: lualatex
pdf-engine-opts:
  - "-shell-escape"
variables:
  documentclass: report
  mainfont: "IBM Plex Sans"
  monofont: "IBM Plex Mono"
  urlcolor: blue
  geometry: margin=12mm
  # Fonts for characters missing in IBM Plex, e.g. 🔑 (secrets masked in ascli logs): macOS, then Linux
  mainfontfallback:
    - "Apple Color Emoji:mode=harf"
    - "Noto Color Emoji:mode=harf"
  monofontfallback:
    - "Apple Color Emoji:mode=harf"
    - "Noto Color Emoji:mode=harf"
include-in-header:
  - pdf_in_header.tex
include-after-body:
  - pdf_after_body.tex
