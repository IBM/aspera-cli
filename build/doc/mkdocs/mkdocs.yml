site_name: IBM Aspera CLI
site_url: https://ibm.github.io/aspera-cli/
site_description: IBM Aspera CLI (ascli), the automation interface for IBM Aspera, from command line to AI agents. Transfers, packages, files and administration of Aspera on Cloud, Faspex, HSTS, Node, Shares, Console, Orchestrator. MCP server.
repo_url: https://github.com/IBM/aspera-cli
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.expand
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.share
    - toc.follow
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - codehilite
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.snippets
extra_css:
  - stylesheets/permalink.css
