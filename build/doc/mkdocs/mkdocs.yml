site_name: Aspera CLI
site_url: https://ibm.github.io/aspera-cli/
site_description: ascli, the command line interface and MCP server for IBM Aspera (Aspera on Cloud, Faspex, HSTS, Node, Shares, Console, Orchestrator), usable by AI assistants and agents
repo_url: https://github.com/IBM/aspera-cli
theme:
  name: material
  features:
    - navigation.instant
    - navigation.expand
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.share
    - toc.follow
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: "🔗"
  - codehilite
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.snippets
