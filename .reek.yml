---
detectors:
  # --- Disabled: equivalent to rubocop Metrics/ClassLength disabled ---
  TooManyMethods:
    enabled: false
  TooManyInstanceVariables:
    enabled: true
    max_instance_variables: 10
    exclude:
      - Aspera::Agent::Direct # 12: complex ascp process manager
      - Aspera::Cli::Manager::OptionValue # 11: full CLI option descriptor
      - Aspera::Cli::Plugins::Preview # 17: preview generator with many config fields
      - Aspera::Cli::OptionValue
  # --- Disabled: equivalent to rubocop Metrics/MethodLength + Metrics/AbcSize disabled ---
  TooManyStatements:
    enabled: false

  # --- Disabled: equivalent to rubocop Metrics/CyclomaticComplexity + Metrics/BlockLength disabled ---
  RepeatedConditional:
    enabled: false
  NestedIterators:
    enabled: false

  # --- Disabled: equivalent to rubocop Naming/PredicateMethod disabled ---
  UncommunicativeParameterName:
    enabled: true
  UncommunicativeMethodName:
    enabled: false
  UncommunicativeVariableName:
    enabled: false
  UncommunicativeModuleName:
    enabled: false

  # --- Disabled: no active rubocop equivalent ---
  DataClump:
    enabled: false
  InstanceVariableAssumption:
    enabled: false
  MissingSafeMethod:
    enabled: false
  UnusedParameters:
    enabled: false
  LongYieldList:
    enabled: false

  # --- Already disabled ---
  ManualDispatch:
    enabled: false
  DuplicateMethodCall:
    enabled: false
  Attribute:
    enabled: false
  FeatureEnvy:
    enabled: false
  BooleanParameter:
    enabled: false
  NilCheck:
    enabled: false
  TooManyConstants:
    enabled: false
  UtilityFunction:
    enabled: false
  ControlParameter:
    enabled: false
  IrresponsibleModule:
    enabled: false
  LongParameterList:
    enabled: false
